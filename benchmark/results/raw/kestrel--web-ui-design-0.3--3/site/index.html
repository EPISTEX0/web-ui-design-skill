<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Front desk · Kestrel Physio</title>
<style>
:root {
  --bg: oklch(0.972 0.006 235);
  --surface: #fff;
  --surface-2: oklch(0.955 0.008 237);
  --text: oklch(0.24 0.025 245);
  --text-2: oklch(0.42 0.025 245);
  --text-3: oklch(0.5 0.022 245);
  --border: oklch(0.9 0.01 240);
  --border-strong: oklch(0.78 0.015 240);
  --border-faint: oklch(0.94 0.008 240);
  --accent: oklch(0.45 0.09 235);
  --accent-hover: oklch(0.39 0.09 235);
  --accent-tint: oklch(0.95 0.025 235);
  --accent-line: oklch(0.7 0.07 235);
  --wait: oklch(0.5 0.12 58);
  --wait-tint: oklch(0.96 0.045 75);
  --wait-line: oklch(0.78 0.11 70);
  --late: oklch(0.5 0.17 27);
  --late-tint: oklch(0.96 0.03 25);
  --late-line: oklch(0.72 0.12 27);
  --done: oklch(0.45 0.09 155);

  --r-sm: 4px; --r-md: 6px; --r-lg: 8px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-io: cubic-bezier(0.77, 0, 0.175, 1);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 var(--font); font-variant-numeric: tabular-nums;
  overflow-x: clip; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.01em; }
p { text-wrap: pretty; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 32px; padding: 0 12px; border-radius: var(--r-md);
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background-color 120ms var(--ease-out), transform 120ms var(--ease-out), border-color 120ms var(--ease-out);
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.sm { min-height: 28px; padding: 0 10px; font-size: 13px; }
.btn.quiet { border-color: transparent; background: transparent; color: var(--text-2); }
@media (hover: hover) {
  .btn:hover:not(:disabled) { background: var(--surface-2); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
}
@media (pointer: coarse), (max-width: 760px) { .btn, .btn.sm, .list li .nm, .pt { min-height: 44px; } .list li .nm, .pt { display: inline-flex; align-items: center; } }

/* top bar */
.top {
  position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px; padding: 10px 24px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
.brand svg { width: 28px; height: 28px; }
.brand small { font-weight: 400; color: var(--text-3); font-size: 13px; letter-spacing: 0; }
.top .grow { flex: 1; }
.search { position: relative; width: min(320px, 100%); }
.search svg { position: absolute; left: 10px; top: 50%; translate: 0 -50%; color: var(--text-3); width: 15px; height: 15px; }

.field-input, .search input, select, input[type=text], input[type=time] {
  min-height: 32px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface);
}
@media (pointer: coarse), (max-width: 760px) { .field-input, .search input, select, input[type=text], input[type=time] { min-height: 44px; } }
.search input.field-input { padding-left: 32px; width: 100%; }
.clock { text-align: right; line-height: 1.25; }
.clock b { display: block; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.clock span { font-size: 12px; color: var(--text-3); }

main { max-width: 1680px; margin: 0 auto; padding: 20px 24px 48px; }
.head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.head h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
.head p { color: var(--text-3); }
.tag { display: inline-block; padding: 0 6px; border: 1px dashed var(--border-strong); border-radius: var(--r-sm); font-size: 12px; color: var(--text-2); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); margin-bottom: 16px; }
.stat { padding: 12px 16px; border-left: 1px solid var(--border); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat dt { color: var(--text-2); font-size: 13px; }
.stat dd { margin: 0; }
.stat .n { font-size: 28px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.2; }
.stat .n small { font-size: 14px; font-weight: 400; color: var(--text-3); letter-spacing: 0; }
.stat .s { color: var(--text-3); font-size: 13px; }
.stat.hot .n { color: var(--wait); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.col { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); min-width: 0; }
.panel > header { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.panel > header h2 { font-size: 14px; font-weight: 600; }
.panel > header .meta { color: var(--text-3); font-size: 13px; }
.panel > header .grow { flex: 1; }
.count { background: var(--surface-2); border-radius: 10px; padding: 0 7px; font-size: 12px; color: var(--text-2); }

/* status chips */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px 1px 6px; border-radius: 10px; font-size: 12px; font-weight: 500; white-space: nowrap; border: 1px solid transparent; }
.chip.expected { background: var(--surface); border-color: var(--border-strong); color: var(--text-2); }
.chip.late { background: var(--late-tint); color: var(--late); border-color: var(--late-line); }
.chip.waiting { background: var(--wait-tint); color: var(--wait); border-color: var(--wait-line); }
.chip.inroom { background: var(--accent-tint); color: var(--accent); border-color: var(--accent-line); }
.chip.done { background: var(--surface-2); color: var(--done); }
.chip.noshow { background: var(--late-tint); color: var(--late); }
.chip.cancelled { background: var(--surface-2); color: var(--text-3); text-decoration: line-through; }

/* timeline: the perch line */
.tl-scroll { overflow-x: auto; }
.tl { min-width: 820px; position: relative; }
.tl-row { display: grid; grid-template-columns: 184px 1fr; border-top: 1px solid var(--border-faint); }
.tl-row:first-child { border-top: 0; }
.tl-who { padding: 8px 12px 8px 16px; line-height: 1.3; min-width: 0; }
.tl-who b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-who span { display: block; font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-who span.live { color: var(--text-2); }
.tl-who span.alert { color: var(--wait); font-weight: 500; }
.track { position: relative; height: 52px; background-image: linear-gradient(to right, var(--border-faint) 1px, transparent 1px); background-size: 10% 100%; }
.hours { height: 28px; border-bottom: 1px solid var(--border); }
.hours span { position: absolute; top: 6px; font-size: 12px; color: var(--text-3); padding-left: 4px; }
.blk {
  position: absolute; top: 6px; bottom: 6px; padding: 0 5px; border-radius: var(--r-sm);
  border: 1px solid var(--border-strong); background: var(--surface); text-align: left; cursor: pointer;
  overflow: hidden; display: flex; flex-direction: column; justify-content: center; line-height: 1.25; font-size: 12px; min-width: 0;
  transition: border-color 120ms var(--ease-out), transform 120ms var(--ease-out);
}
.blk:active { transform: scale(0.98); }
.blk b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 4px; align-items: center; }
.blk em { display: flex; gap: 3px; align-items: center; font-style: normal; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk.late { background: var(--late-tint); border: 1px dashed var(--late); }
.blk.waiting { background: var(--wait-tint); border-color: var(--wait-line); border-left: 3px solid var(--wait); }
.blk.inroom { background: var(--accent-tint); border-color: var(--accent-line); border-left: 3px solid var(--accent); }
.blk.done { background: var(--surface-2); border-color: var(--border); color: var(--text-2); }
.blk.noshow { background: repeating-linear-gradient(135deg, var(--late-tint) 0 5px, var(--surface) 5px 10px); border-color: var(--late-line); color: var(--late); }
.blk.cancelled { background: transparent; border-style: dashed; color: var(--text-3); text-decoration: line-through; }
@media (hover: hover) { .blk:hover { border-color: var(--accent); } }
.nowline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--late); z-index: 2; pointer-events: none; }
.nowline::before { content: attr(data-t); position: absolute; bottom: 0; left: 4px; background: var(--late); color: #fff; font-size: 11px; font-weight: 600; padding: 0 4px; border-radius: 3px; }
.tl-key { display: flex; gap: 16px; flex-wrap: wrap; padding: 8px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-3); }
.tl-key span { display: inline-flex; gap: 4px; align-items: center; }

/* table */
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.seg { display: flex; border: 1px solid var(--border-strong); border-radius: var(--r-md); overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; border-left: 1px solid var(--border-strong); background: var(--surface); min-height: 30px; padding: 0 12px; cursor: pointer; color: var(--text-2); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed=true] { background: var(--accent-tint); color: var(--accent); font-weight: 600; }
@media (hover: hover) { .seg button:not([aria-pressed=true]):hover { background: var(--surface-2); } }
@media (pointer: coarse), (max-width: 760px) { .seg button { min-height: 44px; } }
.seg button:focus-visible { outline-offset: -2px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--text-3); padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 0 12px; height: 44px; border-bottom: 1px solid var(--border-faint); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
th:first-child, td:first-child { padding-left: 16px; }
th:last-child, td:last-child { padding-right: 16px; text-align: right; }
td.t { white-space: nowrap; color: var(--text-2); }
.pt { background: none; border: 0; padding: 4px 0; cursor: pointer; font-weight: 600; text-align: left; max-width: 24ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
@media (hover: hover) { .pt:hover { color: var(--accent); text-decoration: underline; } }
td .sub { display: block; color: var(--text-3); font-size: 12px; margin-top: -2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 24ch; }
.flag { display: inline-flex; gap: 4px; align-items: center; color: var(--wait); font-size: 12px; }
tr.fade td { color: var(--text-3); }
.empty { padding: 32px 16px; text-align: center; color: var(--text-2); }
.empty b { display: block; color: var(--text); margin-bottom: 2px; }
.empty .btn { margin-top: 12px; }

/* side lists */
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 10px 16px; border-top: 1px solid var(--border-faint); display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; }
.list li:first-child { border-top: 0; }
.list .nm { min-height: 28px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; min-width: 0; }
@media (hover: hover) { .list .nm:hover { color: var(--accent); text-decoration: underline; } }
.list .d { color: var(--text-3); font-size: 13px; grid-column: 1; min-width: 0; }
.list .act { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 8px; align-items: center; }
.wait-t { font-weight: 600; font-size: 16px; min-width: 52px; text-align: right; }
.wait-t.warn { color: var(--wait); }
.wait-t.bad { color: var(--late); }
.list .d.alert { color: var(--late); font-weight: 500; }
.list-empty { padding: 20px 16px; color: var(--text-2); }
.list-empty b { display: block; color: var(--text); }

/* dialogs */
dialog { border: 1px solid var(--border); border-radius: var(--r-lg); padding: 0; background: var(--surface); color: var(--text); max-width: 100vw; }
dialog::backdrop { background: oklch(0.2 0.03 245 / 0.4); }
dialog[open] { animation: pop 240ms var(--ease-out); }
dialog.drawer { margin: 0 0 0 auto; height: 100dvh; max-height: none; width: min(440px, 100vw); border-radius: 0; border-width: 0 0 0 1px; }
dialog.drawer[open] { animation: slide 240ms var(--ease-out); }
@keyframes pop { from { opacity: 0; transform: scale(0.95); } }
@keyframes slide { from { opacity: 0; transform: translateX(24px); } }
.dlg-h { display: flex; align-items: flex-start; gap: 12px; padding: 16px 20px 12px; border-bottom: 1px solid var(--border); }
.dlg-h h2 { font-size: 20px; font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.dlg-b { padding: 16px 20px; display: grid; gap: 16px; }
.dlg-f { padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.dl { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; margin: 0; }
.dl dt { color: var(--text-3); }
.dl dd { margin: 0; overflow-wrap: anywhere; }
.notes { display: grid; gap: 8px; }
.note { display: flex; gap: 8px; padding: 8px 12px; border-radius: var(--r-md); background: var(--wait-tint); color: var(--text); border: 1px solid var(--wait-line); align-items: flex-start; }
.note svg { color: var(--wait); margin-top: 3px; }
form.book { width: min(460px, 100vw); }
.fld { display: grid; gap: 4px; }
.fld label { font-weight: 500; }
.fld input, .fld select { width: 100%; }
.fld .err { color: var(--late); font-size: 13px; min-height: 0; }
.fld [aria-invalid=true] { border-color: var(--late); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px), (pointer: coarse) { .fld input, .fld select, .search input, select, input[type=text], input[type=time] { font-size: 16px; } }

/* toasts */
.toasts { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 20; display: grid; gap: 8px; max-width: calc(100vw - 32px); }
.toast { background: var(--text); color: #fff; padding: 8px 8px 8px 14px; border-radius: var(--r-md); display: flex; align-items: center; gap: 12px; animation: pop 200ms var(--ease-out); box-shadow: 0 0 0 1px oklch(0.2 0.03 245 / 0.3), 0 6px 16px oklch(0.2 0.03 245 / 0.2); }
.toast .btn { background: transparent; border-color: oklch(1 0 0 / 0.4); color: #fff; }
.toast.out { opacity: 0; transform: scale(0.95); transition: opacity 150ms var(--ease-out), transform 150ms var(--ease-out); }

/* responsive */
@media (max-width: 1180px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .aside { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 760px) {
  .aside { grid-template-columns: 1fr; }
  .top { padding: 10px 16px; }
  main { padding: 16px 16px 40px; }
  .stats { grid-template-columns: 1fr 1fr; }
  .stat:nth-child(odd) { border-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--border); }
  .tl-panel { display: none; }
  thead { display: none; }
  table, tbody, tr, td { display: block; }
  tr { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 16px; border-bottom: 1px solid var(--border-faint); }
  tr:last-child { border-bottom: 0; }
  td { height: auto; padding: 0 !important; border: 0; text-align: left !important; }
  td.t { grid-column: 1; grid-row: 1; font-weight: 600; color: var(--text); }
  td.p { grid-column: 1; grid-row: 2; }
  td.tx { grid-column: 1; grid-row: 3; color: var(--text-3); }
  td.pr { display: none; }
  td.st { grid-column: 2; grid-row: 1; justify-self: end; }
  td.ac { grid-column: 2; grid-row: 2 / span 2; align-self: center; }
  .pt, td .sub { max-width: none; }
  .clock { display: none; }
  .search { order: 5; width: 100%; }
  .dl { grid-template-columns: 90px 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  dialog[open], dialog.drawer[open], .toast { animation: fade 150ms linear; }
  .btn:active, .blk:active { transform: none; }
}
@keyframes fade { from { opacity: 0; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.01"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></symbol>
  </defs>
</svg>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="oklch(0.45 0.09 235)"/><path d="M5 20c4-1 7-4 9-9 1 3 3 5 5 6l8-5c-1 6-5 11-12 11-4 0-7-1-10-3z" fill="#fff"/><circle cx="23" cy="12.5" r="1.3" fill="oklch(0.45 0.09 235)"/></svg>
    <span>Kestrel Physio <small>Front desk</small></span>
  </div>
  <div class="search">
    <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
    <label class="sr" for="q">Search today's patients</label>
    <input id="q" type="search" class="field-input" placeholder="Search today's patients" autocomplete="off">
  </div>
  <div class="grow"></div>
  <button class="btn" id="newBtn" type="button"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>New booking</button>
  <div class="clock"><b id="clock">10:42</b><span id="date"></span></div>
</header>

<main>
  <div class="head">
    <h1>Today at the clinic</h1>
    <p id="sub"></p>
    <span class="tag">Sample data</span>
  </div>

  <dl class="stats" id="stats"></dl>

  <div class="layout">
    <div class="col">
      <section class="panel tl-panel" aria-labelledby="tlh">
        <header><h2 id="tlh">Practitioners today</h2><span class="meta" id="tlmeta"></span></header>
        <div class="tl-scroll"><div class="tl" id="tl"></div></div>
        <div class="tl-key" aria-hidden="true">
          <span><svg class="i"><use href="#i-clock"/></svg>Expected</span>
          <span style="color:var(--wait)"><svg class="i"><use href="#i-clock"/></svg>Waiting</span>
          <span style="color:var(--accent)"><svg class="i"><use href="#i-dot"/></svg>In session</span>
          <span style="color:var(--done)"><svg class="i"><use href="#i-check"/></svg>Done</span>
          <span style="color:var(--late)"><svg class="i"><use href="#i-alert"/></svg>Late or no-show</span>
        </div>
      </section>

      <section class="panel" aria-labelledby="ah">
        <header><h2 id="ah">All appointments</h2><span class="count" id="acount"></span></header>
        <div class="filters">
          <div class="seg" role="group" aria-label="Filter by status" id="statusSeg"></div>
          <label class="sr" for="pract">Practitioner</label>
          <select id="pract"></select>
        </div>
        <div id="tableWrap"></div>
      </section>
    </div>

    <div class="col aside">
      <section class="panel" aria-labelledby="wh">
        <header><h2 id="wh">Waiting room</h2><span class="count" id="wcount"></span></header>
        <ul class="list" id="waiting"></ul>
      </section>
      <section class="panel" aria-labelledby="nh">
        <header><h2 id="nh">Arriving in the next hour</h2><span class="count" id="ncount"></span></header>
        <ul class="list" id="arrivals"></ul>
      </section>
      <section class="panel" aria-labelledby="th" style="grid-column: 1 / -1">
        <header><h2 id="th">To sort out</h2><span class="count" id="tcount"></span></header>
        <ul class="list" id="tasks"></ul>
      </section>
    </div>
  </div>
</main>

<dialog id="detail" class="drawer" aria-labelledby="dName"></dialog>

<dialog id="bookDlg" aria-labelledby="bTitle">
  <form class="book" id="bookForm" novalidate method="dialog">
    <div class="dlg-h"><h2 id="bTitle">New booking</h2><button class="btn quiet" type="button" data-close aria-label="Close"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
    <div class="dlg-b">
      <div class="fld"><label for="bName">Patient name</label><input id="bName" type="text" autocomplete="off" required><div class="err" id="bNameE" aria-live="polite"></div></div>
      <div class="fld"><label for="bPract">Practitioner</label><select id="bPract"></select></div>
      <div class="two">
        <div class="fld"><label for="bTime">Start time</label><input id="bTime" type="time" min="08:00" max="17:30" step="900" required><div class="err" id="bTimeE" aria-live="polite"></div></div>
        <div class="fld"><label for="bLen">Length</label><select id="bLen"><option value="30">30 min</option><option value="45" selected>45 min</option><option value="60">60 min</option></select></div>
      </div>
      <div class="fld"><label for="bType">Treatment</label><select id="bType"></select></div>
    </div>
    <div class="dlg-f"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Book appointment</button></div>
  </form>
</dialog>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  /* ---------- sample data ---------- */
  const PRACT = [
    { id: 0, name: 'Amara Okafor',       short: 'Dr Okafor',      role: 'Sports physio',      room: 'Room 1' },
    { id: 1, name: 'Tomasz Wieczorek',   short: 'Tomasz',         role: 'Musculoskeletal',    room: 'Room 2' },
    { id: 2, name: 'Priya Raman',        short: 'Priya',          role: 'Hand therapy',       room: 'Room 3' },
    { id: 3, name: 'Sam Achterberg',     short: 'Sam',            role: 'Neuro rehab',        room: 'Room 4' },
    { id: 4, name: 'Hannah Lindqvist',   short: 'Hannah',         role: 'Rehab gym',          room: 'Gym' },
  ];
  const TYPES = ['Initial assessment', 'Follow-up', 'Knee rehab', 'ACL rehab', 'Lower back', 'Neck and shoulder', 'Shoulder', 'Hip', 'Post-op wrist', 'Hand splint review', 'Carpal tunnel', 'Tendon rehab', 'Balance and gait', 'Stroke rehab', 'Neuro review', 'Rehab gym', 'Pilates rehab'];
  const toM = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  const fmt = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  const DAY0 = 480, DAY1 = 1080; // 08:00 to 18:00

  // [practitioner, start, minutes, name, treatment, status, extras]
  const raw = [
    [0,'08:00',45,'Margaret Doyle','Follow-up','done',{ph:'07700 900101',ins:'Bupa',ses:'5 of 6'}],
    [0,'09:00',45,'Ibrahim Salaam','Knee rehab','done',{ph:'07700 900102',ins:'Self-pay',ses:'3',bal:45}],
    [0,'10:00',45,'Chloe Bannerman','ACL rehab','inroom',{ph:'07700 900103',ins:'AXA Health',ses:'8 of 12'}],
    [0,'11:00',45,'Jamal Whitfield-Osei','Initial assessment','waiting',{ph:'07700 900104',ins:'Vitality',ses:'First visit',ci:'10:31',first:1}],
    [0,'13:30',45,'Oliver Brandt','Follow-up','expected',{ph:'07700 900105',ins:'Self-pay',ses:'2'}],
    [0,'15:00',45,'Nadia Kowalczyk','Shoulder','expected',{ph:'07700 900106',ins:'Bupa',ses:'4 of 6'}],
    [1,'08:30',45,'Ruth Ellison','Lower back','done',{ph:'07700 900107',ins:'NHS referral',ses:'6 of 6',rebook:1}],
    [1,'09:45',45,'Kofi Mensah','Neck and shoulder','done',{ph:'07700 900108',ins:'Self-pay',ses:'2'}],
    [1,'10:30',45,'Sofia Marchetti','Initial assessment','waiting',{ph:'07700 900109',ins:'AXA Health',ses:'First visit',ci:'10:24',first:1,form:'missing'}],
    [1,'11:30',30,'Dennis Park','Follow-up','expected',{ph:'07700 900110',ins:'Self-pay',ses:'7'}],
    [1,'13:00',45,'Eleanor Whitcombe','Hip','cancelled',{ph:'07700 900111',ins:'Bupa',ses:'3 of 6'}],
    [1,'14:15',45,'Tariq Hussain','Lower back','expected',{ph:'07700 900112',ins:'Vitality',ses:'1'}],
    [2,'09:00',30,'Eilidh MacAskill','Hand splint review','done',{ph:'07700 900113',ins:'NHS referral',ses:'2 of 4'}],
    [2,'10:15',45,'Oluwaseun Adeyemi-Clarke','Post-op wrist','inroom',{ph:'07700 900114',ins:'AXA Health',ses:'3 of 8'}],
    [2,'11:30',30,'Grace Tan','Carpal tunnel','expected',{ph:'07700 900115',ins:'Self-pay',ses:'First visit',first:1,form:'missing'}],
    [2,'14:00',45,'Henrik Johansson','Tendon rehab','expected',{ph:'07700 900116',ins:'Bupa',ses:'5 of 6'}],
    [3,'09:00',60,'Terrence Boyle','Balance and gait','noshow',{ph:'07700 900117',ins:'NHS referral',ses:'4 of 10'}],
    [3,'10:15',45,'Linda Fairweather','Stroke rehab','expected',{ph:'07700 900118',ins:'NHS referral',ses:'9 of 12',note:'Uses a wheelchair. Taxi booked for 10:00.'}],
    [3,'11:15',60,'Walter Nakamura-Price','Neuro review','expected',{ph:'07700 900119',ins:'Vitality',ses:'6 of 8'}],
    [3,'14:00',60,'Aoife Gallagher','Balance and gait','expected',{ph:'07700 900120',ins:'Self-pay',ses:'1'}],
    [4,'08:30',30,'Priyanka Deshmukh','Rehab gym','done',{ph:'07700 900121',ins:'Bupa',ses:'10'}],
    [4,'10:00',60,'Víctor Hugo Fernández-Castellanos','Rehab gym','inroom',{ph:'07700 900122',ins:'AXA Health',ses:'3 of 12'}],
    [4,'11:15',30,'Mo Ahmed','Rehab gym','expected',{ph:'07700 900123',ins:'Self-pay',ses:'12'}],
    [4,'13:00',45,'Beatriz Oliveira','Pilates rehab','expected',{ph:'07700 900124',ins:'Vitality',ses:'4'}],
    [4,'16:00',45,'Callum Fraser','Rehab gym','expected',{ph:'07700 900125',ins:'Self-pay',ses:'2'}],
  ];
  let appts = raw.map((r, i) => ({
    id: 'a' + (i + 1), p: r[0], start: toM(r[1]), len: r[2], name: r[3], type: r[4], status: r[5],
    ph: r[6].ph, ins: r[6].ins, ses: r[6].ses, ci: r[6].ci ? toM(r[6].ci) : null,
    bal: r[6].bal || 0, first: !!r[6].first, form: r[6].form || null, rebook: !!r[6].rebook, note: r[6].note || '',
  }));
  let nextId = appts.length + 1;

  /* ---------- helpers ---------- */
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = n => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const SIM_START = 10 * 60 + 42;
  const t0 = Date.now();
  const nowMin = () => SIM_START + (Date.now() - t0) / 60000; // minutes, fractional
  const nowM = () => Math.floor(nowMin());
  const LABEL = { expected: 'Expected', late: 'Running late', waiting: 'Waiting', inroom: 'In session', done: 'Done', noshow: 'No-show', cancelled: 'Cancelled' };
  const GLYPH = { expected: 'clock', late: 'alert', waiting: 'clock', inroom: 'dot', done: 'check', noshow: 'x', cancelled: 'x' };
  const eff = a => (a.status === 'expected' && nowM() > a.start + 5) ? 'late' : a.status;
  const chip = a => { const s = eff(a); return `<span class="chip ${s}">${icon(GLYPH[s])}${LABEL[s]}</span>`; };
  const surname = n => { const w = n.split(' '); return w.length > 1 ? w[w.length - 1] : n; };
  const pr = a => PRACT[a.p];
  const live = a => a.status !== 'cancelled' && a.status !== 'noshow';

  /* ---------- state in the URL ---------- */
  const params = new URLSearchParams(location.search);
  const view = { status: params.get('status') || 'all', pract: params.get('pract') || 'all', q: params.get('q') || '' };
  function syncUrl() {
    const u = new URLSearchParams();
    if (view.status !== 'all') u.set('status', view.status);
    if (view.pract !== 'all') u.set('pract', view.pract);
    if (view.q) u.set('q', view.q);
    const s = u.toString();
    history.replaceState(null, '', s ? '?' + s : location.pathname);
  }

  /* ---------- undo + toasts ---------- */
  function toast(msg, undoSnap) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<span>${esc(msg)}</span>`;
    const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 160); };
    if (undoSnap) {
      const b = document.createElement('button');
      b.className = 'btn sm'; b.type = 'button'; b.textContent = 'Undo';
      b.onclick = () => { appts = JSON.parse(undoSnap); kill(); renderAll(); };
      el.append(b);
    }
    $('#toasts').append(el);
    setTimeout(kill, 7000);
  }
  function change(fn, msg) {
    const snap = JSON.stringify(appts);
    fn();
    renderAll();
    if (msg) toast(msg, snap);
  }

  /* ---------- actions ---------- */
  const find = id => appts.find(a => a.id === id);
  const ACTIONS = {
    checkin: a => change(() => { a.status = 'waiting'; a.ci = nowM(); }, `${a.name} checked in. ${pr(a).short} has been told.`),
    toroom: a => change(() => { a.status = 'inroom'; }, `${a.name} sent to ${pr(a).room}.`),
    finish: a => change(() => { a.status = 'done'; if (a.type !== 'Initial assessment' && !a.bal && a.ins === 'Self-pay') a.bal = 55; }, `Session finished for ${a.name}.`),
    noshow: a => change(() => { a.status = 'noshow'; }, `${a.name} marked as a no-show.`),
    restore: a => change(() => { a.status = 'expected'; a.ci = null; }, `${a.name} is back on today's list.`),
    form: a => change(() => { a.form = 'sent'; }, `Intake form link sent to ${a.name}.`),
  };
  ACTIONS.pay = a => { const v = a.bal; change(() => { a.bal = 0; }, `£${v} collected from ${a.name}.`); };
  function act(name, id) { const a = find(id); if (a) ACTIONS[name](a); }

  /* ---------- render: stats ---------- */
  function renderStats() {
    const booked = appts.filter(a => a.status !== 'cancelled');
    const arrived = appts.filter(a => ['waiting', 'inroom', 'done'].includes(a.status)).length;
    const late = appts.filter(a => eff(a) === 'late').length;
    const ns = appts.filter(a => a.status === 'noshow').length;
    const w = appts.filter(a => a.status === 'waiting');
    const longest = w.reduce((m, a) => Math.max(m, nowM() - a.ci), 0);
    const inr = appts.filter(a => a.status === 'inroom').length;
    const ahead = appts.filter(a => a.status === 'expected' && a.start > nowM() - 5).length;
    const last = booked.reduce((m, a) => Math.max(m, a.start + a.len), 0);
    $('#stats').innerHTML = `
      <div class="stat"><dt>Checked in</dt><dd><span class="n">${arrived} <small>of ${booked.length}</small></span><div class="s">${late} running late, ${ns} no-show${ns === 1 ? '' : 's'}</div></dd></div>
      <div class="stat ${w.length ? 'hot' : ''}"><dt>In the waiting room</dt><dd><span class="n">${w.length}</span><div class="s">${w.length ? `Longest wait ${longest} min` : 'Nobody waiting'}</div></dd></div>
      <div class="stat"><dt>In session</dt><dd><span class="n">${inr} <small>of ${PRACT.length} practitioners</small></span><div class="s">${PRACT.length - inr} free right now</div></dd></div>
      <div class="stat"><dt>Still to come</dt><dd><span class="n">${ahead}</span><div class="s">Last session ends ${fmt(last)}</div></dd></div>`;
    $('#sub').textContent = `${booked.length} booked today, ${appts.length - booked.length} cancelled`;
  }

  /* ---------- render: timeline ---------- */
  function renderTimeline() {
    const pct = m => ((m - DAY0) / (DAY1 - DAY0)) * 100;
    let h = `<div class="tl-row"><div></div><div class="track hours">`;
    for (let m = DAY0; m < DAY1; m += 60) h += `<span style="left:${pct(m)}%">${fmt(m)}</span>`;
    h += `</div></div>`;
    for (const p of PRACT) {
      const mine = appts.filter(a => a.p === p.id).sort((a, b) => a.start - b.start);
      const cur = mine.find(a => a.status === 'inroom');
      const wt = mine.find(a => a.status === 'waiting');
      let line, cls = 'live';
      if (cur) line = `With ${cur.name.split(' ')[0]} until ${fmt(cur.start + cur.len)}`;
      else if (wt) { line = `Free · ${wt.name.split(' ')[0]} is waiting`; cls = 'alert'; }
      else line = 'Free now';
      h += `<div class="tl-row"><div class="tl-who"><b>${esc(p.name)}</b><span>${esc(p.role)} · ${p.room}</span><span class="${cls}">${esc(line)}</span></div><div class="track">`;
      for (const a of mine) {
        const s = eff(a);
        h += `<button type="button" class="blk ${s}" data-open="${a.id}" style="left:${pct(a.start)}%;width:calc(${(a.len / (DAY1 - DAY0)) * 100}% - 2px)" title="${esc(a.name)} · ${fmt(a.start)} · ${esc(a.type)}" aria-label="${esc(a.name)}, ${fmt(a.start)}, ${esc(a.type)}, ${LABEL[s]}"><b>${esc(surname(a.name))}</b><em>${icon(GLYPH[s])}${fmt(a.start)}</em></button>`;
      }
      h += `</div></div>`;
    }
    $('#tl').innerHTML = h;
    positionNow();
    $('#tlmeta').textContent = 'Select an appointment for details';
  }
  function positionNow() {
    let el = $('#tl .nowline');
    const tracks = document.querySelectorAll('#tl .track');
    if (!tracks.length) return;
    const m = nowMin();
    if (m < DAY0 || m > DAY1) { el && el.remove(); return; }
    if (!el) { el = document.createElement('div'); el.className = 'nowline'; $('#tl').append(el); }
    // align to the track column: 184px label column
    el.style.left = `calc(184px + (100% - 184px) * ${(m - DAY0) / (DAY1 - DAY0)})`;
    el.dataset.t = fmt(Math.floor(m));
  }

  /* ---------- render: side lists ---------- */
  function renderSide() {
    const w = appts.filter(a => a.status === 'waiting').sort((a, b) => a.ci - b.ci);
    $('#wcount').textContent = w.length;
    $('#waiting').innerHTML = w.length ? w.map(a => {
      const m = nowM() - a.ci;
      const cls = m >= 15 ? 'bad' : m >= 8 ? 'warn' : '';
      return `<li><button class="nm" data-open="${a.id}" data-fk="nm-w-${a.id}" title="${esc(a.name)}">${esc(a.name)}</button>
        <div class="act"><span class="wait-t ${cls}" aria-label="Waiting ${m} minutes">${m} min</span><button class="btn sm" data-act="toroom" data-id="${a.id}" data-fk="toroom-${a.id}" aria-label="Send ${esc(a.name)} to ${pr(a).room}">Send to room</button></div>
        <div class="d">${esc(pr(a).short)} at ${fmt(a.start)} · in since ${fmt(a.ci)}</div></li>`;
    }).join('') : `<li class="list-empty" style="display:block"><b>Nobody is waiting</b>New arrivals appear here once you check them in.</li>`;

    const arr = appts.filter(a => a.status === 'expected' && a.start <= nowM() + 60).sort((a, b) => a.start - b.start);
    $('#ncount').textContent = arr.length;
    $('#arrivals').innerHTML = arr.length ? arr.map((a, i) => {
      const late = eff(a) === 'late';
      const diff = nowM() - a.start;
      const d = late ? `<div class="d alert">${diff} min late · <a href="tel:${a.ph.replace(/\s/g, '')}">Call ${esc(a.ph)}</a></div>` : `<div class="d">${esc(pr(a).short)} · ${fmt(a.start)} · ${esc(a.type)}</div>`;
      return `<li><button class="nm" data-open="${a.id}" data-fk="nm-n-${a.id}" title="${esc(a.name)}">${esc(a.name)}</button>
        <div class="act"><button class="btn sm ${i === 0 ? 'primary' : ''}" data-act="checkin" data-id="${a.id}" data-fk="checkin-${a.id}" aria-label="Check in ${esc(a.name)}">${icon('check')}Check in</button></div>${d}</li>`;
    }).join('') : `<li class="list-empty" style="display:block"><b>Nobody due in the next hour</b>Later arrivals are in the appointments list.</li>`;

    const tasks = [];
    for (const a of appts) {
      if (a.status === 'done' && a.bal) tasks.push({ a, text: `Collect £${a.bal} balance`, btn: 'Take payment', act: 'pay' });
      if (a.form === 'missing' && live(a) && a.status !== 'done') tasks.push({ a, text: a.status === 'waiting' ? 'Intake form not returned. Already in the waiting room.' : `Intake form not returned (due ${fmt(a.start)})`, btn: 'Send form link', act: 'form' });
      if (a.status === 'done' && a.rebook) tasks.push({ a, text: 'Referral complete. Offer a review appointment.', btn: 'Book review', act: 'rebook' });
    }
    $('#tcount').textContent = tasks.length;
    $('#tasks').innerHTML = tasks.length ? tasks.map(t => `<li><button class="nm" data-open="${t.a.id}" data-fk="nm-t-${t.a.id}-${t.act}" title="${esc(t.a.name)}">${esc(t.a.name)}</button>
      <div class="act"><button class="btn sm" data-act="${t.act}" data-id="${t.a.id}" data-fk="${t.act}-${t.a.id}" aria-label="${t.btn} for ${esc(t.a.name)}">${t.btn}</button></div><div class="d">${esc(t.text)}</div></li>`).join('')
      : `<li class="list-empty" style="display:block"><b>All clear</b>No payments or forms are waiting on you.</li>`;
  }

  /* ---------- render: table ---------- */
  const STATUS_TABS = [['all', 'All'], ['expected', 'Expected'], ['waiting', 'Waiting'], ['inroom', 'In session'], ['done', 'Done']];
  function matches(a) {
    const s = eff(a);
    if (view.status === 'expected' && !(s === 'expected' || s === 'late')) return false;
    if (['waiting', 'inroom', 'done'].includes(view.status) && s !== view.status) return false;
    if (view.pract !== 'all' && String(a.p) !== view.pract) return false;
    if (view.q && !(a.name + ' ' + a.type + ' ' + pr(a).name).toLowerCase().includes(view.q.toLowerCase())) return false;
    return true;
  }
  function rowAction(a) {
    const s = eff(a);
    if (s === 'expected' || s === 'late') return `<button class="btn sm" data-act="checkin" data-id="${a.id}" data-fk="row-checkin-${a.id}" aria-label="Check in ${esc(a.name)}">Check in</button>`;
    if (s === 'waiting') return `<button class="btn sm" data-act="toroom" data-id="${a.id}" data-fk="row-toroom-${a.id}" aria-label="Send ${esc(a.name)} to ${pr(a).room}">Send to room</button>`;
    if (s === 'inroom') return `<button class="btn sm" data-act="finish" data-id="${a.id}" data-fk="row-finish-${a.id}" aria-label="Finish session for ${esc(a.name)}">Finish session</button>`;
    if (s === 'noshow') return `<button class="btn sm" data-act="restore" data-id="${a.id}" data-fk="row-restore-${a.id}" aria-label="Restore ${esc(a.name)}">Restore</button>`;
    if (s === 'done' && a.bal) return `<button class="btn sm" data-act="pay" data-id="${a.id}" data-fk="row-pay-${a.id}" aria-label="Take payment from ${esc(a.name)}">Take £${a.bal}</button>`;
    return '';
  }
  function renderTable() {
    const all = appts.slice().sort((a, b) => a.start - b.start || a.p - b.p);
    const rows = all.filter(matches);
    $('#acount').textContent = rows.length === all.length ? all.length : `${rows.length} of ${all.length}`;
    $('#statusSeg').innerHTML = STATUS_TABS.map(([k, l]) => {
      const n = all.filter(a => { const s = eff(a); return k === 'all' ? true : k === 'expected' ? (s === 'expected' || s === 'late') : s === k; }).length;
      return `<button type="button" data-status="${k}" aria-pressed="${view.status === k}">${l} <span class="count">${n}</span></button>`;
    }).join('');
    if (!rows.length) {
      const anyFilter = view.status !== 'all' || view.pract !== 'all' || view.q;
      $('#tableWrap').innerHTML = anyFilter
        ? `<div class="empty"><b>No appointments match</b>Try a different status or practitioner, or clear the search.<br><button class="btn" id="clearF" type="button">Clear filters</button></div>`
        : `<div class="empty"><b>No appointments today</b>Book the first one to start the day.<br><button class="btn" data-newbook type="button">New booking</button></div>`;
      return;
    }
    $('#tableWrap').innerHTML = `<table><thead><tr><th scope="col">Time</th><th scope="col">Patient</th><th scope="col">Treatment</th><th scope="col">Practitioner</th><th scope="col">Status</th><th scope="col"><span class="sr">Action</span></th></tr></thead><tbody>${rows.map(a => {
      const flags = [];
      if (a.first) flags.push('First visit');
      if (a.form === 'missing') flags.push('Form missing');
      if (a.bal && a.status === 'done') flags.push(`£${a.bal} due`);
      return `<tr class="${a.status === 'done' || a.status === 'cancelled' ? 'fade' : ''}" data-fk="row-${a.id}">
        <td class="t">${fmt(a.start)}<span class="sr"> to ${fmt(a.start + a.len)}</span></td>
        <td class="p"><button class="pt" data-open="${a.id}" data-fk="open-${a.id}" title="${esc(a.name)}">${esc(a.name)}</button>${flags.length ? `<span class="sub flag">${icon('alert')}${flags.join(' · ')}</span>` : `<span class="sub">${esc(a.ins)}</span>`}</td>
        <td class="tx">${esc(a.type)}<span class="sub">${a.len} min</span></td>
        <td class="pr">${esc(pr(a).name)}<span class="sub">${pr(a).room}</span></td>
        <td class="st">${chip(a)}</td>
        <td class="ac">${rowAction(a)}</td></tr>`;
    }).join('')}</tbody></table>`;
  }

  /* ---------- detail drawer ---------- */
  let openId = null;
  function renderDetail() {
    const d = $('#detail');
    const a = find(openId);
    if (!a) return;
    const s = eff(a);
    const notes = [];
    if (a.note) notes.push(a.note);
    if (a.first) notes.push('First visit. Check ID and consent form.');
    if (a.form === 'missing') notes.push('Intake form not returned.');
    if (a.form === 'sent') notes.push('Intake form link sent. Waiting for the patient to complete it.');
    if (a.bal && a.status === 'done') notes.push(`Outstanding balance of £${a.bal}.`);
    if (a.rebook) notes.push('Referral complete. Offer a review appointment.');
    const btns = [];
    if (s === 'expected' || s === 'late') btns.push(`<button class="btn primary" data-act="checkin" data-id="${a.id}">Check in</button>`, `<button class="btn" data-act="noshow" data-id="${a.id}">Mark as no-show</button>`);
    if (s === 'waiting') btns.push(`<button class="btn primary" data-act="toroom" data-id="${a.id}">Send to ${pr(a).room}</button>`);
    if (s === 'inroom') btns.push(`<button class="btn primary" data-act="finish" data-id="${a.id}">Finish session</button>`);
    if (s === 'noshow') btns.push(`<button class="btn" data-act="restore" data-id="${a.id}">Restore to today's list</button>`);
    if (a.status === 'done' && a.bal) btns.push(`<button class="btn primary" data-act="pay" data-id="${a.id}">Take £${a.bal}</button>`);
    if (a.form === 'missing' && a.status !== 'done') btns.push(`<button class="btn" data-act="form" data-id="${a.id}">Send form link</button>`);
    if (a.rebook) btns.push(`<button class="btn" data-act="rebook" data-id="${a.id}">Book review</button>`);
    d.innerHTML = `
      <div class="dlg-h"><div style="min-width:0;flex:1"><h2 id="dName">${esc(a.name)}</h2><div style="margin-top:6px">${chip(a)}</div></div>
        <button class="btn quiet" type="button" data-close aria-label="Close details">${icon('x')}</button></div>
      <div class="dlg-b">
        ${notes.length ? `<div class="notes">${notes.map(n => `<div class="note">${icon('alert')}<span>${esc(n)}</span></div>`).join('')}</div>` : ''}
        <dl class="dl">
          <dt>Appointment</dt><dd>${fmt(a.start)} to ${fmt(a.start + a.len)} (${a.len} min)</dd>
          <dt>Treatment</dt><dd>${esc(a.type)}</dd>
          <dt>Practitioner</dt><dd>${esc(pr(a).name)}, ${esc(pr(a).role)}</dd>
          <dt>Room</dt><dd>${pr(a).room}</dd>
          <dt>Session</dt><dd>${esc(a.ses)}</dd>
          <dt>Cover</dt><dd>${esc(a.ins)}</dd>
          <dt>Phone</dt><dd><a href="tel:${a.ph.replace(/\s/g, '')}">${esc(a.ph)}</a></dd>
          ${a.ci != null ? `<dt>Checked in</dt><dd>${fmt(a.ci)}</dd>` : ''}
        </dl>
      </div>
      <div class="dlg-f">${btns.join('')}</div>`;
  }
  function openDetail(id) {
    openId = id; renderDetail();
    const d = $('#detail');
    if (!d.open) d.showModal();
  }

  /* ---------- new booking ---------- */
  const bf = $('#bookForm');
  $('#bPract').innerHTML = PRACT.map(p => `<option value="${p.id}">${esc(p.name)} (${esc(p.role)})</option>`).join('');
  $('#bType').innerHTML = TYPES.map(t => `<option>${esc(t)}</option>`).join('');
  function openBooking(pre) {
    bf.reset();
    ['#bNameE', '#bTimeE'].forEach(s => $(s).textContent = '');
    ['#bName', '#bTime'].forEach(s => $(s).removeAttribute('aria-invalid'));
    const next = Math.ceil((nowM() + 15) / 15) * 15;
    $('#bTime').value = fmt(Math.min(next, 17 * 60 + 30));
    if (pre) { $('#bName').value = pre.name; $('#bPract').value = pre.p; $('#bType').value = 'Follow-up'; }
    $('#bookDlg').showModal();
    $('#bName').focus();
  }
  function setErr(input, errEl, msg) {
    errEl.textContent = msg;
    if (msg) { input.setAttribute('aria-invalid', 'true'); input.setAttribute('aria-describedby', errEl.id); }
    else { input.removeAttribute('aria-invalid'); input.removeAttribute('aria-describedby'); }
    return !msg;
  }
  const vName = () => setErr($('#bName'), $('#bNameE'), $('#bName').value.trim() ? '' : 'Enter the patient\'s name.');
  function vTime() {
    const v = $('#bTime').value, el = $('#bTime'), e = $('#bTimeE');
    if (!v) return setErr(el, e, 'Enter a start time.');
    const m = toM(v), len = +$('#bLen').value, p = +$('#bPract').value;
    if (m < DAY0 || m + len > DAY1 - 30) return setErr(el, e, 'The clinic is open 08:00 to 17:30 for the last start.');
    const clash = appts.find(a => a.p === p && live(a) && m < a.start + a.len && a.start < m + len);
    if (clash) return setErr(el, e, `${PRACT[p].short} has ${clash.name} from ${fmt(clash.start)} to ${fmt(clash.start + clash.len)}. Pick another time.`);
    return setErr(el, e, '');
  }
  $('#bName').addEventListener('blur', vName);
  $('#bTime').addEventListener('blur', vTime);
  ['#bPract', '#bLen'].forEach(s => $(s).addEventListener('change', () => { if ($('#bTime').value) vTime(); }));
  bf.addEventListener('submit', e => {
    e.preventDefault();
    const okN = vName(), okT = vTime();
    if (!okN) return $('#bName').focus();
    if (!okT) return $('#bTime').focus();
    const name = $('#bName').value.trim(), p = +$('#bPract').value, start = toM($('#bTime').value);
    change(() => {
      appts.forEach(a => { if (a.name.toLowerCase() === name.toLowerCase()) a.rebook = false; });
      appts.push({ id: 'a' + nextId++, p, start, len: +$('#bLen').value, name, type: $('#bType').value, status: 'expected', ph: 'No phone on file', ins: 'To confirm', ses: 'New booking', ci: null, bal: 0, first: false, form: null, rebook: false, note: '' });
    }, `Booked ${name} with ${PRACT[p].short} at ${fmt(start)}.`);
    $('#bookDlg').close();
  });

  /* ---------- events ---------- */
  document.addEventListener('click', e => {
    const t = e.target.closest('button, a');
    if (!t) return;
    if (t.dataset.close !== undefined) { t.closest('dialog').close(); return; }
    if (t.dataset.open) { openDetail(t.dataset.open); return; }
    if (t.dataset.newbook !== undefined) { openBooking(); return; }
    if (t.dataset.status) { view.status = t.dataset.status; syncUrl(); renderTable(); focusKey('[data-status="' + view.status + '"]'); return; }
    if (t.id === 'clearF') { view.status = 'all'; view.pract = 'all'; view.q = ''; $('#q').value = ''; $('#pract').value = 'all'; syncUrl(); renderTable(); return; }
    if (t.dataset.act) {
      const id = t.dataset.id, a = find(id);
      if (t.dataset.act === 'rebook') { $('#detail').close(); openBooking(a); return; }
      const key = t.dataset.fk;
      const inDetail = !!t.closest('#detail');
      act(t.dataset.act, id);
      if (inDetail) { renderDetail(); const f = $('#detail .dlg-f .btn'); (f || $('#detail [data-close]')).focus(); }
      else restoreFocus(key, id);
    }
  });
  function focusKey(sel) { const el = document.querySelector(sel); if (el) el.focus(); }
  function restoreFocus(key, id) {
    const cands = [key, 'row-' + (key || '').replace(/^row-/, ''), 'open-' + id];
    for (const c of cands) { const el = c && document.querySelector(`[data-fk="${c}"]`); if (el) { el.focus(); return; } }
    const row = document.querySelector(`[data-fk="open-${id}"]`) || $('#newBtn');
    row.focus();
  }
  $('#newBtn').addEventListener('click', () => openBooking());
  $('#detail').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
  $('#bookDlg').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
  $('#q').addEventListener('input', e => { view.q = e.target.value.trim(); syncUrl(); renderTable(); });
  $('#pract').innerHTML = '<option value="all">All practitioners</option>' + PRACT.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  $('#pract').addEventListener('change', e => { view.pract = e.target.value; syncUrl(); renderTable(); });
  $('#q').value = view.q; $('#pract').value = view.pract;

  /* ---------- clock + boot ---------- */
  function tick() {
    const m = nowM();
    $('#clock').textContent = fmt(m);
    positionNow();
  }
  function renderAll() {
    renderStats(); renderTimeline(); renderSide(); renderTable();
    if ($('#detail').open) renderDetail();
    tick();
  }
  $('#date').textContent = new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
  renderAll();
  let lastMin = nowM();
  setInterval(() => { const m = nowM(); if (m !== lastMin) { lastMin = m; if (!$('dialog[open]')) renderAll(); else tick(); } else tick(); }, 5000);
})();
</script>
</body>
</html>
