<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Front desk · Kestrel Physio</title>
<style>
:root {
  /* primitives */
  --n-0: oklch(0.995 0.002 250);
  --n-50: oklch(0.97 0.004 250);
  --n-100: oklch(0.94 0.006 250);
  --n-200: oklch(0.88 0.008 250);
  --n-500: oklch(0.5 0.016 250);
  --n-600: oklch(0.42 0.018 250);
  --n-900: oklch(0.22 0.02 250);
  --rufous-600: oklch(0.5 0.15 45);
  --rufous-700: oklch(0.44 0.14 45);
  --rufous-50: oklch(0.96 0.025 55);

  /* semantic */
  --bg: var(--n-50);
  --surface: var(--n-0);
  --surface-sunk: var(--n-100);
  --line: var(--n-200);
  --line-soft: var(--n-100);
  --text: var(--n-900);
  --text-2: var(--n-600);
  --text-3: var(--n-500);
  --accent: var(--rufous-600);
  --accent-press: var(--rufous-700);
  --accent-soft: var(--rufous-50);
  --on-accent: oklch(0.99 0.005 60);

  --wait-bg: oklch(0.95 0.06 85);   --wait-fg: oklch(0.42 0.09 70);   --wait-bar: oklch(0.72 0.14 80);
  --care-bg: oklch(0.94 0.035 195); --care-fg: oklch(0.37 0.07 200);  --care-bar: oklch(0.55 0.09 200);
  --done-bg: var(--n-100);          --done-fg: var(--n-600);          --done-bar: var(--n-200);
  --late-bg: oklch(0.95 0.035 25);  --late-fg: oklch(0.45 0.15 27);   --late-bar: oklch(0.58 0.17 27);

  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px;
  --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --shadow-pop: 0 0 0 1px oklch(0.22 0.02 250 / 0.08), 0 12px 32px oklch(0.22 0.02 250 / 0.18);

  --px-hour: 140px;
  --label-w: 148px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text);
  font: 400 16px/1.5 var(--font); overflow-x: clip;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; text-wrap: pretty; }
button, input, select { font: inherit; color: inherit; }
button { touch-action: manipulation; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: 36px; padding: 0 var(--s3); border-radius: var(--r-md);
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
  font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background-color 150ms, border-color 150ms, transform 120ms var(--ease-out);
}
.btn:active { transform: scale(0.97); }
.btn:disabled { color: var(--text-3); background: var(--surface-sunk); cursor: not-allowed; transform: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:active { background: var(--accent-press); }
.btn-quiet { border-color: transparent; background: transparent; color: var(--text-2); }
.btn-danger { color: var(--late-fg); }
@media (hover: hover) {
  .btn:hover { background: var(--surface-sunk); }
  .btn-primary:hover { background: var(--accent-press); border-color: var(--accent-press); }
  .btn-quiet:hover { background: var(--surface-sunk); color: var(--text); }
}
@media (pointer: coarse) { .btn { min-height: 44px; } }

/* header */
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s4);
  padding: var(--s4) var(--s6); background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: var(--s3); margin-right: auto; }
.brand svg { flex: none; }
.brand b { display: block; font-size: 16px; font-weight: 650; line-height: 1.2; }
.brand span { display: block; font-size: 13px; color: var(--text-3); line-height: 1.2; }
.today { display: flex; align-items: baseline; gap: var(--s3); }
.today .date { font-size: 14px; white-space: nowrap; color: var(--text-2); }
.today .clock { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
.search { position: relative; flex: 1 1 200px; max-width: 320px; }
.search input {
  width: 100%; min-height: 40px; padding: 0 var(--s3) 0 var(--s10); border: 1px solid var(--line);
  border-radius: var(--r-md); background: var(--surface-sunk); font-size: 16px;
}
.search input::placeholder { color: var(--text-3); }
.search svg { position: absolute; left: var(--s3); top: 50%; translate: 0 -50%; color: var(--text-3); pointer-events: none; }
.top .btn-primary { min-height: 40px; }

/* page */
main { padding: var(--s6); display: grid; gap: var(--s6); max-width: 1680px; margin-inline: auto; }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--s3); margin: 0; padding: 0; list-style: none; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s3) var(--s4); }
.stat dt { font-size: 13px; color: var(--text-2); }
.stat dd { margin: 0; font-size: 28px; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; }
.stat dd small { font-size: 13px; font-weight: 400; color: var(--text-3); letter-spacing: 0; margin-left: var(--s1); }
.stat.alert dd { color: var(--late-fg); }

.cols { display: grid; grid-template-columns: minmax(340px, 440px) minmax(0, 1fr); gap: var(--s6); align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; }
.panel > header { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); padding: var(--s4) var(--s4) var(--s3); }
.panel h2 { font-size: 16px; font-weight: 650; }
.panel header p { font-size: 13px; color: var(--text-3); }

/* queue */
.group + .group { margin-top: var(--s2); }
.group h3 {
  display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4) var(--s2);
  font-size: 13px; font-weight: 600; color: var(--text-2);
}
.group h3 .count { margin-left: auto; font-weight: 400; color: var(--text-3); }
.row {
  display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: var(--s3);
  padding: var(--s3) var(--s4); border-top: 1px solid var(--line-soft);
}
.row .time { font-size: 14px; font-weight: 600; color: var(--text-2); }
.row .who { min-width: 0; }
.row .name {
  display: block; width: 100%; text-align: left; padding: 0; border: 0; background: none; cursor: pointer;
  font-size: 16px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.row .meta { font-size: 13px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flags { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); margin-top: var(--s1); }
.chip {
  display: inline-flex; align-items: center; gap: var(--s1); padding: 0 var(--s2); min-height: 20px;
  border-radius: var(--r-sm); font-size: 12px; font-weight: 500; background: var(--surface-sunk); color: var(--text-2);
}
.chip.late { background: var(--late-bg); color: var(--late-fg); }
.chip.wait { background: var(--wait-bg); color: var(--wait-fg); }
.chip.care { background: var(--care-bg); color: var(--care-fg); }
.empty { padding: var(--s4); margin: 0 var(--s4) var(--s2); border: 1px dashed var(--line); border-radius: var(--r-md); font-size: 14px; color: var(--text-2); }
.empty b { color: var(--text); font-weight: 600; }
@media (hover: hover) { .row .name:hover { text-decoration: underline; text-underline-offset: 3px; } }

/* timeline */
.tl { overflow-x: auto; overscroll-behavior-x: contain; border-top: 1px solid var(--line-soft); border-radius: 0 0 var(--r-lg) var(--r-lg); }
.tl-inner { position: relative; width: calc(var(--label-w) + var(--px-hour) * 9.5); }
.tl-head, .tl-row { display: grid; grid-template-columns: var(--label-w) 1fr; }
.tl-head { height: 32px; }
.tl-corner, .tl-label { position: sticky; left: 0; z-index: 3; background: var(--surface); border-right: 1px solid var(--line); }
.hours { position: relative; }
.hours span { position: absolute; top: 8px; font-size: 12px; color: var(--text-3); translate: 6px 0; }
.tl-row { border-top: 1px solid var(--line-soft); }
.tl-label { padding: var(--s3) var(--s3); display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.tl-label b { font-size: 14px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-label span { font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track {
  position: relative; height: 76px;
  background: repeating-linear-gradient(to right, var(--line-soft) 0 1px, transparent 1px var(--px-hour));
}
.blk {
  position: absolute; z-index: 2; top: 8px; bottom: 8px; padding: 0 var(--s2) 0 var(--s3); min-width: 0;
  border: 0; border-radius: var(--r-md); text-align: left; cursor: pointer; overflow: hidden;
  background: var(--surface-sunk); color: var(--text); box-shadow: inset 4px 0 0 var(--bar, var(--line));
  display: flex; flex-direction: column; justify-content: center; gap: 1px;
  transition: filter 150ms, transform 120ms var(--ease-out);
}
.blk:active { transform: scale(0.97); }
.blk .t { font-size: 12px; line-height: 1.3; color: inherit; opacity: 0.85; white-space: nowrap; }
.blk .n { font-size: 14px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk[data-s="booked"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), inset 4px 0 0 var(--n-200); }
.blk[data-s="booked"].is-late { background: var(--late-bg); color: var(--late-fg); box-shadow: inset 4px 0 0 var(--late-bar); }
.blk[data-s="arrived"] { background: var(--wait-bg); color: var(--wait-fg); --bar: var(--wait-bar); }
.blk[data-s="treating"] { background: var(--care-bg); color: var(--care-fg); --bar: var(--care-bar); }
.blk[data-s="done"] { background: var(--done-bg); color: var(--done-fg); --bar: var(--done-bar); }
.blk[data-s="noshow"] { background: var(--late-bg); color: var(--late-fg); --bar: var(--late-bar); }
.blk[data-s="noshow"] .n { text-decoration: line-through; }
.blk.is-hit { outline: 2px solid var(--accent); outline-offset: 1px; }
.blk.is-dim { opacity: 0.3; }
@media (hover: hover) { .blk:hover { filter: brightness(0.97); } }
.nowline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 1; pointer-events: none; }
.nowline::before {
  content: attr(data-t); position: absolute; top: 4px; left: 4px; padding: 0 var(--s1); border-radius: var(--r-sm);
  background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 600; line-height: 20px;
}
.legend { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); padding: var(--s3) var(--s4); border-top: 1px solid var(--line-soft); font-size: 12px; color: var(--text-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: var(--s2); vertical-align: -1px; }

.foot { padding: 0 var(--s6) var(--s6); font-size: 13px; color: var(--text-3); max-width: 1680px; margin-inline: auto; }

/* dialog */
dialog {
  width: min(480px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 0; border-radius: var(--r-lg);
  background: var(--surface); color: var(--text); box-shadow: var(--shadow-pop);
}
dialog::backdrop { background: oklch(0.22 0.02 250 / 0.4); }
dialog[open] { animation: pop 200ms var(--ease-out); }
dialog[open]::backdrop { animation: fade 200ms var(--ease-out); }
@keyframes pop { from { opacity: 0; transform: scale(0.95); } }
@keyframes fade { from { opacity: 0; } }
.dlg-head { display: flex; align-items: flex-start; gap: var(--s3); padding: var(--s5) var(--s5) var(--s3); }
.dlg-head h2 { font-size: 20px; font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; }
.dlg-head p { font-size: 14px; color: var(--text-2); }
.dlg-head .btn { margin: calc(var(--s2) * -1) calc(var(--s2) * -1) 0 auto; min-width: 36px; padding: 0; }
.dlg-body { padding: 0 var(--s5) var(--s4); display: grid; gap: var(--s4); }
.dl { display: grid; grid-template-columns: 112px 1fr; gap: var(--s2) var(--s3); margin: 0; font-size: 14px; }
.dl dt { color: var(--text-2); }
.dl dd { margin: 0; overflow-wrap: anywhere; }
.note { padding: var(--s3); border-radius: var(--r-md); background: var(--surface-sunk); font-size: 14px; }
.dlg-foot { display: flex; flex-wrap: wrap; gap: var(--s2); justify-content: flex-end; padding: var(--s3) var(--s5) var(--s5); border-top: 1px solid var(--line-soft); }
.field { display: grid; gap: var(--s1); }
.field label { font-size: 14px; font-weight: 500; }
.field input, .field select { min-height: 44px; padding: 0 var(--s3); border: 1px solid var(--n-500); border-radius: var(--r-md); background: var(--surface); font-size: 16px; width: 100%; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.err { color: var(--late-fg); font-size: 14px; font-weight: 500; }
.err:empty { display: none; }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--s6) + env(safe-area-inset-bottom)); translate: -50% 0; z-index: 20;
  display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s2) var(--s2) var(--s4);
  max-width: calc(100vw - 32px); border-radius: var(--r-md); background: var(--n-900); color: var(--n-0); font-size: 14px;
  box-shadow: var(--shadow-pop); animation: rise 200ms var(--ease-out);
}
.toast[hidden] { display: none; }
.toast .btn { color: oklch(0.88 0.08 60); min-height: 36px; }
@media (hover: hover) { .toast .btn:hover { background: oklch(1 0 0 / 0.1); color: oklch(0.92 0.08 60); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

@media (max-width: 1100px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 640px) {
  .top { padding: var(--s3) var(--s4); gap: var(--s3); }
  .today { order: 2; width: 100%; justify-content: space-between; }
  .search { order: 3; max-width: none; flex-basis: 100%; }
  main { padding: var(--s4); gap: var(--s4); }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .row { grid-template-columns: 1fr auto; }
  .row .time { grid-column: 1 / -1; margin-bottom: calc(var(--s2) * -1); }
  .field-row { grid-template-columns: 1fr; }
  .dl { grid-template-columns: 1fr; gap: 0; }
  .dl dd { margin-bottom: var(--s2); }
  .foot { padding: 0 var(--s4) var(--s6); }
}
@media (prefers-reduced-motion: reduce) {
  dialog[open], dialog[open]::backdrop, .toast { animation-name: fade; }
  .btn:active, .blk:active { transform: none; }
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="oklch(0.5 0.15 45)"/><path d="M6 21c5 0 7-3 9-6l3-5c1 3 3 5 8 6-4 1-6 3-8 7l-2 3-1-5c-3 1-6 1-9 0Z" fill="oklch(0.99 0.005 60)"/></svg>
    <div><b>Kestrel Physio</b><span>Front desk</span></div>
  </div>
  <div class="today">
    <span class="date" id="date"></span>
    <span class="clock num" id="clock" aria-label="Current time"></span>
  </div>
  <div class="search">
    <label class="sr" for="q">Find a patient</label>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
    <input id="q" type="search" placeholder="Find a patient" autocomplete="off">
  </div>
  <button class="btn btn-primary" id="new" type="button">New booking</button>
</header>

<main>
  <dl class="stats" id="stats"></dl>

  <div class="cols">
    <section class="panel" aria-labelledby="qh">
      <header><h2 id="qh">Needs the front desk</h2><p id="qsub"></p></header>
      <div id="queue"></div>
    </section>

    <section class="panel" aria-labelledby="th">
      <header><h2 id="th">Today’s schedule</h2><p>Select a block for details</p></header>
      <div class="tl" id="tl" tabindex="0" role="region" aria-label="Schedule by practitioner, scrolls sideways"></div>
      <div class="legend" aria-hidden="true">
        <span><i style="background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)"></i>Booked</span>
        <span><i style="background:var(--wait-bar)"></i>Waiting</span>
        <span><i style="background:var(--care-bar)"></i>In treatment</span>
        <span><i style="background:var(--done-bar)"></i>Completed</span>
        <span><i style="background:var(--late-bar)"></i>Late or no-show</span>
      </div>
    </section>
  </div>
</main>
<p class="foot">Sample data. The clock starts at 10:42 and then runs in real time.</p>

<dialog id="detail" aria-labelledby="d-title"></dialog>

<dialog id="booking" aria-labelledby="b-title">
  <form id="bform" novalidate>
    <div class="dlg-head">
      <div><h2 id="b-title">New booking</h2><p>Today, <span id="b-date"></span></p></div>
      <button class="btn btn-quiet" type="button" data-close aria-label="Close">✕</button>
    </div>
    <div class="dlg-body">
      <div class="field"><label for="b-name">Patient name</label><input id="b-name" name="name" autocomplete="off" required></div>
      <div class="field"><label for="b-prac">Practitioner</label><select id="b-prac" name="prac"></select></div>
      <div class="field"><label for="b-svc">Appointment type</label><select id="b-svc" name="svc"></select></div>
      <div class="field-row">
        <div class="field"><label for="b-time">Start time</label><input id="b-time" name="time" type="time" min="08:00" max="17:00" step="300" required></div>
        <div class="field"><label for="b-dur">Length</label>
          <select id="b-dur" name="dur"><option value="30">30 minutes</option><option value="45" selected>45 minutes</option><option value="60">60 minutes</option></select></div>
      </div>
      <p class="err" id="b-err" role="alert"></p>
    </div>
    <div class="dlg-foot">
      <button class="btn" type="button" data-close>Cancel</button>
      <button class="btn btn-primary" type="submit">Add to schedule</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden><span id="toast-msg"></span><button class="btn btn-quiet" id="toast-undo" type="button">Undo</button></div>

<script>
const START = 8 * 60, END = 17.5 * 60, PX = 140;
const NOW0 = 10 * 60 + 42;

const PRACS = [
  { id: 'ok', name: 'Hana Okafor', role: 'Sports injury', room: 'Room 1' },
  { id: 'li', name: 'Marcus Lindqvist', role: 'Musculoskeletal', room: 'Room 2' },
  { id: 'si', name: 'Amara Singh', role: 'Musculoskeletal', room: 'Room 3' },
  { id: 're', name: 'Tomás Reyes', role: 'Hand therapy', room: 'Room 4' },
];
const SERVICES = ['Follow-up treatment', 'Initial assessment', 'Sports rehab', 'Post-surgery rehab', 'Hand therapy review'];
const STATUS = {
  booked: 'Booked', arrived: 'Waiting', treating: 'In treatment', done: 'Completed', noshow: 'No-show',
};
const t = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };

let nextId = 1;
const A = (prac, start, dur, name, svc, status, extra = {}) =>
  ({ id: nextId++, prac, start: t(start), dur, name, svc, status, forms: true, due: false, note: '', ...extra });

let appts = [
  A('ok', '08:00', 45, 'Daniel Whitcombe', 'Follow-up treatment', 'done'),
  A('ok', '09:00', 45, 'Yuki Tanaka', 'Sports rehab', 'done'),
  A('ok', '10:00', 45, 'Grace Adeyemi', 'Sports rehab', 'treating', { note: 'Left hamstring, week 3. Progress to eccentric loading if pain stays under 3/10.' }),
  A('ok', '11:00', 60, 'Oliver Brandt', 'Initial assessment', 'booked', { first: true, forms: false, note: 'Referred by GP for recurring right knee pain.' }),
  A('ok', '13:00', 45, 'Ruth Callahan', 'Follow-up treatment', 'booked'),
  A('ok', '14:30', 30, 'Ibrahim Yusuf', 'Follow-up treatment', 'booked'),
  A('ok', '16:00', 45, 'Mei-Ling Chow', 'Sports rehab', 'booked'),

  A('li', '08:30', 30, 'Sam Eze', 'Follow-up treatment', 'done'),
  A('li', '09:30', 60, 'Margaret O’Neill', 'Post-surgery rehab', 'done'),
  A('li', '10:30', 45, 'Priya Raman', 'Follow-up treatment', 'arrived', { arrivedAt: t('10:36'), due: true, note: 'Lower back, 4th session. Asked about exercise sheet last time.' }),
  A('li', '11:30', 45, 'Joseph Nakamura', 'Follow-up treatment', 'booked'),
  A('li', '13:30', 60, 'Elena Petrova', 'Post-surgery rehab', 'booked', { due: true }),
  A('li', '15:00', 45, 'Tom Hargreaves', 'Follow-up treatment', 'booked'),

  A('si', '08:00', 30, 'Callum Reid', 'Follow-up treatment', 'done'),
  A('si', '09:00', 45, 'Fatima Al-Sayed', 'Follow-up treatment', 'noshow'),
  A('si', '10:15', 45, 'Noah Bergström', 'Follow-up treatment', 'treating'),
  A('si', '11:00', 30, 'Wei Zhang', 'Follow-up treatment', 'arrived', { arrivedAt: t('10:41') }),
  A('si', '12:00', 60, 'Chiara Romano', 'Initial assessment', 'booked', { first: true, forms: false }),
  A('si', '14:00', 45, 'Kofi Mensah', 'Follow-up treatment', 'booked'),

  A('re', '09:30', 45, 'Isabel Marchetti', 'Hand therapy review', 'done'),
  A('re', '10:15', 30, 'Lucas Ferreira', 'Hand therapy review', 'booked', { note: 'Splint fitting check. Phone: 0400 555 0147.' }),
  A('re', '11:15', 45, 'Anna-Marie Kowalczyk-Brandstätter', 'Hand therapy review', 'booked'),
  A('re', '14:00', 45, 'Dev Patel', 'Hand therapy review', 'booked', { due: true }),
  A('re', '16:30', 30, 'Sophie Lam', 'Hand therapy review', 'booked'),
];

let simStart = Date.now();
const now = () => NOW0 + Math.floor((Date.now() - simStart) / 60000);
const fmt = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const prac = id => PRACS.find(p => p.id === id);
const isLate = a => a.status === 'booked' && a.start + 10 <= now();
const first = n => n.split(' ')[0];

const $ = id => document.getElementById(id);
let query = '';
let undo = null;

function chips(a) {
  const c = [];
  if (a.status === 'booked' && isLate(a)) c.push(`<span class="chip late">▲ ${now() - a.start} min late</span>`);
  if (a.status === 'arrived') c.push(`<span class="chip wait">● Here ${Math.max(0, now() - a.arrivedAt)} min</span>`);
  if (a.status === 'treating') c.push(`<span class="chip care">▸ ${prac(a.prac).room}, ends ${fmt(a.start + a.dur)}</span>`);
  if (a.first) c.push('<span class="chip">First visit</span>');
  if (!a.forms && a.status !== 'done') c.push('<span class="chip late">Intake form missing</span>');
  if (a.due && a.status !== 'done') c.push('<span class="chip">Payment due</span>');
  return c.length ? `<div class="flags">${c.join('')}</div>` : '';
}

function actionBtn(a) {
  if (a.status === 'booked') return `<button class="btn" data-act="checkin" data-id="${a.id}" aria-label="Check in ${esc(a.name)}">Check in</button>`;
  if (a.status === 'arrived') return `<button class="btn" data-act="start" data-id="${a.id}" aria-label="Send ${esc(a.name)} to ${prac(a.prac).room}">Send to ${prac(a.prac).room.toLowerCase()}</button>`;
  if (a.status === 'treating') return `<button class="btn" data-act="finish" data-id="${a.id}" aria-label="Finish ${esc(a.name)}">Finish</button>`;
  return '';
}

function row(a) {
  return `<div class="row">
    <span class="time num">${fmt(a.start)}</span>
    <div class="who">
      <button class="name" data-open="${a.id}" title="${esc(a.name)}">${esc(a.name)}</button>
      <div class="meta">${esc(a.svc)} · ${esc(prac(a.prac).name)}</div>
      ${chips(a)}
    </div>
    ${actionBtn(a)}
  </div>`;
}

function group(title, list, emptyHtml) {
  return `<div class="group"><h3>${title}<span class="count num">${list.length}</span></h3>${list.length ? list.map(row).join('') : emptyHtml}</div>`;
}

function renderQueue() {
  const n = now();
  const waiting = appts.filter(a => a.status === 'arrived').sort((a, b) => a.arrivedAt - b.arrivedAt);
  const late = appts.filter(isLate).sort((a, b) => a.start - b.start);
  const soon = appts.filter(a => a.status === 'booked' && !isLate(a) && a.start <= n + 60).sort((a, b) => a.start - b.start);
  const care = appts.filter(a => a.status === 'treating').sort((a, b) => a.start - b.start);
  const upcoming = appts.filter(a => a.status === 'booked' && a.start > n).sort((a, b) => a.start - b.start)[0];

  const nextTxt = upcoming ? `Next booking is <b>${esc(upcoming.name)}</b> at ${fmt(upcoming.start)}.` : 'No more bookings today.';
  $('qsub').textContent = `${waiting.length + late.length + soon.length} to greet`;
  $('queue').innerHTML =
    group('Waiting room', waiting, `<p class="empty">Nobody is waiting. ${nextTxt}</p>`) +
    (late.length ? group('Late, not yet arrived', late, '') : '') +
    group('Due in the next hour', soon, `<p class="empty">No arrivals in the next hour.</p>`) +
    group('In treatment', care, `<p class="empty">Every room is free.</p>`);
}

function renderStats() {
  const total = appts.filter(a => a.status !== 'noshow').length;
  const done = appts.filter(a => a.status === 'done').length;
  const waiting = appts.filter(a => a.status === 'arrived').length;
  const late = appts.filter(isLate).length;
  const ns = appts.filter(a => a.status === 'noshow').length;
  const left = appts.filter(a => a.status === 'booked').length;
  const s = (label, v, sub, cls = '') => `<div class="stat ${cls}"><dt>${label}</dt><dd class="num">${v}${sub ? `<small>${sub}</small>` : ''}</dd></div>`;
  $('stats').innerHTML =
    s('Appointments today', total) + s('Completed', done, `of ${total}`) + s('Waiting now', waiting) +
    s('Late', late, '', late ? 'alert' : '') + s('Still to come', left, ns ? `${ns} no-show` : '');
}

function renderTimeline() {
  const hours = [];
  for (let m = START; m <= END; m += 60) hours.push(`<span style="left:${((m - START) / 60) * PX}px" class="num">${fmt(m)}</span>`);
  const q = query.trim().toLowerCase();
  const rows = PRACS.map(p => {
    const blocks = appts.filter(a => a.prac === p.id).map(a => {
      const hit = q && a.name.toLowerCase().includes(q);
      const cls = [isLate(a) ? 'is-late' : '', hit ? 'is-hit' : '', q && !hit ? 'is-dim' : ''].join(' ');
      const w = (a.dur / 60) * PX - 3;
      const label = `${a.name}, ${fmt(a.start)}, ${STATUS[a.status]}${isLate(a) ? ', late' : ''}`;
      return `<button class="blk ${cls}" data-s="${a.status}" data-open="${a.id}" style="left:${((a.start - START) / 60) * PX}px;width:${w}px" aria-label="${esc(label)}" title="${esc(label)}">
        <span class="t num">${fmt(a.start)}</span><span class="n">${esc(a.name)}</span></button>`;
    }).join('');
    return `<div class="tl-row"><div class="tl-label"><b>${esc(p.name)}</b><span>${p.room} · ${p.role}</span></div><div class="track">${blocks}</div></div>`;
  }).join('');
  const scroller = $('tl');
  const keep = scroller.scrollLeft;
  scroller.innerHTML = `<div class="tl-inner" id="tli">
    <div class="tl-head"><div class="tl-corner"></div><div class="hours">${hours.join('')}</div></div>
    ${rows}
    <div class="nowline" id="nowline" data-t="${fmt(now())}" style="left:calc(var(--label-w) + ${((now() - START) / 60) * PX}px)"></div>
  </div>`;
  scroller.scrollLeft = keep;
}

function renderAll() { renderStats(); renderQueue(); renderTimeline(); tick(); }

function tick() {
  const d = new Date();
  $('date').textContent = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  $('clock').textContent = fmt(now());
}

/* state changes */
function setStatus(id, status, msg) {
  const a = appts.find(x => x.id === id);
  const prev = { status: a.status, arrivedAt: a.arrivedAt };
  a.status = status;
  if (status === 'arrived') a.arrivedAt = now();
  renderAll();
  toast(msg(a), () => { a.status = prev.status; a.arrivedAt = prev.arrivedAt; renderAll(); });
}
const ACTIONS = {
  checkin: a => setStatus(a.id, 'arrived', x => `${x.name} checked in`),
  start: a => setStatus(a.id, 'treating', x => `${x.name} sent to ${prac(x.prac).room}`),
  finish: a => setStatus(a.id, 'done', x => `${x.name} completed. Offer a rebooking.`),
  noshow: a => setStatus(a.id, 'noshow', x => `${x.name} marked as a no-show`),
};

let toastTimer;
function toast(msg, onUndo) {
  $('toast-msg').textContent = msg; undo = onUndo; $('toast').hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('toast').hidden = true; undo = null; }, 6000);
}
$('toast-undo').addEventListener('click', () => { if (undo) undo(); undo = null; $('toast').hidden = true; });

/* detail dialog */
function openDetail(id) {
  const a = appts.find(x => x.id === id), p = prac(a.prac);
  const btns = [];
  if (a.status === 'booked') btns.push(`<button class="btn btn-danger" data-act="noshow" data-id="${id}" data-close>Mark no-show</button>`);
  if (a.status === 'booked') btns.push(`<button class="btn" data-act="checkin" data-id="${id}" data-close>Check in</button>`);
  if (a.status === 'arrived') btns.push(`<button class="btn" data-act="start" data-id="${id}" data-close>Send to ${p.room.toLowerCase()}</button>`);
  if (a.status === 'treating') btns.push(`<button class="btn" data-act="finish" data-id="${id}" data-close>Finish treatment</button>`);
  btns.push('<button class="btn" type="button" data-close>Close</button>');
  const dlg = $('detail');
  dlg.innerHTML = `
    <div class="dlg-head">
      <div><h2 id="d-title">${esc(a.name)}</h2><p>${fmt(a.start)}–${fmt(a.start + a.dur)} · ${a.dur} minutes</p></div>
      <button class="btn btn-quiet" type="button" data-close aria-label="Close">✕</button>
    </div>
    <div class="dlg-body">
      <div>${chips(a) || ''}<div class="flags"><span class="chip ${a.status === 'arrived' ? 'wait' : a.status === 'treating' ? 'care' : a.status === 'noshow' ? 'late' : ''}">${STATUS[a.status]}</span></div></div>
      <dl class="dl">
        <dt>Appointment</dt><dd>${esc(a.svc)}</dd>
        <dt>Practitioner</dt><dd>${esc(p.name)}, ${p.room}</dd>
        <dt>Intake form</dt><dd>${a.forms ? 'Received' : 'Not received. Ask for it at check-in.'}</dd>
        <dt>Payment</dt><dd>${a.due ? 'Due at the desk' : 'Nothing due'}</dd>
      </dl>
      ${a.note ? `<p class="note">${esc(a.note)}</p>` : ''}
    </div>
    <div class="dlg-foot">${btns.join('')}</div>`;
  dlg.showModal();
}

/* booking dialog */
function openBooking() {
  $('b-prac').innerHTML = PRACS.map(p => `<option value="${p.id}">${p.name} (${p.room})</option>`).join('');
  $('b-svc').innerHTML = SERVICES.map(s => `<option>${s}</option>`).join('');
  const nxt = Math.ceil((now() + 1) / 5) * 5;
  $('b-time').value = fmt(Math.min(nxt, 17 * 60));
  $('b-name').value = ''; $('b-err').textContent = '';
  $('b-date').textContent = $('date').textContent;
  $('booking').showModal(); $('b-name').focus();
}
$('bform').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('b-name').value.trim(), pid = $('b-prac').value, dur = +$('b-dur').value;
  const tv = $('b-time').value, err = $('b-err');
  if (!name) { err.textContent = 'Enter the patient’s name.'; $('b-name').focus(); return; }
  if (!tv) { err.textContent = 'Choose a start time.'; $('b-time').focus(); return; }
  const start = t(tv);
  if (start < START || start + dur > END) { err.textContent = 'The clinic is open 08:00 to 17:30. Pick a time that ends by 17:30.'; $('b-time').focus(); return; }
  const clash = appts.find(a => a.prac === pid && a.status !== 'noshow' && start < a.start + a.dur && a.start < start + dur);
  if (clash) {
    err.textContent = `${prac(pid).name} is booked with ${clash.name} from ${fmt(clash.start)} to ${fmt(clash.start + clash.dur)}. Choose another time or practitioner.`;
    $('b-time').focus(); return;
  }
  appts.push({ id: nextId++, prac: pid, start, dur, name, svc: $('b-svc').value, status: 'booked', forms: false, due: false, note: '', first: $('b-svc').value === 'Initial assessment' });
  $('booking').close(); renderAll();
  toast(`${name} booked for ${fmt(start)} with ${first(prac(pid).name)}`, () => { appts.pop(); renderAll(); });
});

/* events */
document.addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  if (act) ACTIONS[act.dataset.act](appts.find(a => a.id === +act.dataset.id));
  const open = e.target.closest('[data-open]');
  if (open) openDetail(+open.dataset.open);
  const close = e.target.closest('[data-close]');
  if (close) close.closest('dialog').close();
  if (e.target.tagName === 'DIALOG') e.target.close();
});
$('new').addEventListener('click', openBooking);
$('q').addEventListener('input', e => { query = e.target.value; renderTimeline(); });

renderAll();
{
  const sc = $('tl'), x = ((now() - START) / 60) * PX;
  sc.scrollLeft = Math.max(0, x - sc.clientWidth / 2 + 148 / 2);
}
setInterval(() => { renderAll(); }, 30000);
</script>
</body>
</html>
