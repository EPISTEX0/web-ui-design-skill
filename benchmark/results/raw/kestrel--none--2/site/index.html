<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel Physio – Front Desk</title>
<style>
  :root {
    --bg: #f4f6f5; --card: #fff; --ink: #1c2b2a; --muted: #66787a; --line: #e1e7e6;
    --brand: #0f6b63; --brand-ink: #fff; --brand-soft: #e3f2f0;
    --booked: #5b6b7a; --waiting: #b7791f; --session: #1d6fb8; --done: #2f855a; --noshow: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121a19; --card:#1a2524; --ink:#e7efee; --muted:#93a6a4; --line:#2a3a38; --brand:#3fb3a6; --brand-ink:#08201d; --brand-soft:#1d3532;
      --booked:#9aabba; --waiting:#e2a93b; --session:#5aa5e6; --done:#5cc08a; --noshow:#ef7b6e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:16px; padding:14px 24px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .logo { font-weight:700; font-size:20px; letter-spacing:.2px; }
  .logo span { color:var(--brand); }
  .spacer { flex:1; }
  .clock { text-align:right; }
  .clock b { font-size:22px; font-variant-numeric:tabular-nums; display:block; line-height:1.1; }
  .clock small { color:var(--muted); }
  main { padding:20px 24px; max-width:1400px; margin:0 auto; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 16px; }
  .stat b { font-size:28px; display:block; line-height:1.1; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--muted); font-size:13px; }
  .layout { display:grid; grid-template-columns:1fr 340px; gap:20px; align-items:start; }
  @media (max-width:980px){ .layout{grid-template-columns:1fr;} }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .panel h2 { margin:0; font-size:15px; padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
  .toolbar { display:flex; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  input, select, button { font:inherit; color:inherit; }
  input[type=search], input[type=text], input[type=time], select { padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); }
  input[type=search] { flex:1; min-width:160px; }
  button { cursor:pointer; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:7px 12px; }
  button:hover { border-color:var(--brand); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--brand); outline-offset:1px; }
  button.primary { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); font-weight:600; }
  button.quiet { border-color:transparent; color:var(--muted); padding:7px 8px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border-radius:999px; padding:5px 12px; font-size:13px; }
  .chip[aria-pressed=true] { background:var(--brand-soft); border-color:var(--brand); color:var(--brand); font-weight:600; }
  ul { list-style:none; margin:0; padding:0; }
  .appt { display:grid; grid-template-columns:64px 1fr auto auto; gap:14px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  .appt:last-child { border-bottom:0; }
  .appt.now { background:var(--brand-soft); }
  .appt.past .who { opacity:.7; }
  .time { font-variant-numeric:tabular-nums; font-weight:600; }
  .time small { display:block; color:var(--muted); font-weight:400; font-size:12px; }
  .who b { display:block; }
  .who span { color:var(--muted); font-size:13px; }
  .tag { display:inline-block; font-size:11px; font-weight:600; padding:1px 6px; border-radius:4px; background:var(--line); margin-left:6px; vertical-align:1px; }
  .status { font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; border:1px solid currentColor; white-space:nowrap; }
  .s-booked{color:var(--booked)} .s-waiting{color:var(--waiting)} .s-session{color:var(--session)} .s-done{color:var(--done)} .s-noshow{color:var(--noshow)}
  .actions { display:flex; gap:6px; justify-content:flex-end; }
  .empty { padding:28px; text-align:center; color:var(--muted); }
  .wait-item { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .wait-item:last-child{border-bottom:0}
  .mins { font-variant-numeric:tabular-nums; font-weight:700; color:var(--waiting); }
  .mins.long { color:var(--noshow); }
  .room { display:flex; justify-content:space-between; padding:9px 16px; border-bottom:1px solid var(--line); font-size:14px; }
  .room:last-child{border-bottom:0}
  .room span:last-child { color:var(--muted); }
  .side { display:flex; flex-direction:column; gap:20px; }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); padding:0; width:min(420px,92vw); }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  dialog form { padding:20px; display:grid; gap:12px; }
  dialog h3 { margin:0; }
  label { display:grid; gap:4px; font-size:13px; color:var(--muted); }
  label input, label select { color:var(--ink); }
  .row { display:flex; gap:8px; justify-content:flex-end; margin-top:4px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:8px; opacity:0; pointer-events:none; transition:opacity .2s; }
  .toast.show { opacity:1; }
  @media (max-width:640px){ .appt{grid-template-columns:56px 1fr; } .appt .status{justify-self:start} .actions{grid-column:1/-1;justify-content:flex-start} }
</style>
</head>
<body>
<header>
  <div class="logo">Kestrel <span>Physio</span> <small style="font-weight:400;color:var(--muted);font-size:14px">· Front desk</small></div>
  <div class="spacer"></div>
  <button class="primary" id="addBtn">+ Walk-in / new booking</button>
  <div class="clock"><b id="clock"></b><small id="date"></small></div>
</header>

<main>
  <section class="stats" id="stats" aria-label="Today at a glance"></section>

  <div class="layout">
    <section class="panel" aria-label="Today's schedule">
      <h2>Today's schedule <span id="count" style="font-weight:400;color:var(--muted)"></span></h2>
      <div class="toolbar">
        <input type="search" id="q" placeholder="Search patient or therapist…" aria-label="Search">
        <select id="pro" aria-label="Filter by therapist"></select>
      </div>
      <div class="toolbar" style="padding-top:0">
        <div class="chips" id="chips"></div>
      </div>
      <ul id="list"></ul>
    </section>

    <div class="side">
      <section class="panel" aria-label="Waiting room">
        <h2>Waiting room <span id="waitCount" style="font-weight:400;color:var(--muted)"></span></h2>
        <ul id="waiting"></ul>
      </section>
      <section class="panel" aria-label="Therapists">
        <h2>Therapists</h2>
        <ul id="rooms"></ul>
      </section>
    </div>
  </div>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3>Add appointment</h3>
    <label>Patient name <input type="text" name="name" required></label>
    <label>Therapist <select name="pro"></select></label>
    <label>Type
      <select name="type">
        <option>Follow-up</option><option>Initial assessment</option><option>Sports massage</option><option>Dry needling</option><option>Rehab session</option>
      </select>
    </label>
    <label>Time <input type="time" name="time" required step="300"></label>
    <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" name="walkin"> Walk-in (check in immediately)</label>
    <div class="row"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Add</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const THERAPISTS = [
  { id:'ap', name:'Anna Pretorius', room:'Room 1' },
  { id:'dm', name:'Daniel Moyo',    room:'Room 2' },
  { id:'sk', name:'Sofia Kaplan',   room:'Room 3' },
  { id:'ro', name:'Ravi Oduya',     room:'Gym'    },
];
const STATUS = { booked:'Booked', waiting:'Checked in', session:'In session', done:'Completed', noshow:'No-show' };

// Sample day. Times are minutes since midnight; "arrived" is minutes since midnight.
const t = (h,m=0)=>h*60+m;
let appts = [
  { id:1,  time:t(8),     dur:45, name:'Margaret Hollis',  pro:'ap', type:'Follow-up',          note:'Lower back – week 4',        status:'done' },
  { id:2,  time:t(8),     dur:30, name:'Tomás Beltrán',    pro:'dm', type:'Sports massage',     note:'',                           status:'done' },
  { id:3,  time:t(8,45),  dur:60, name:'Priya Nair',       pro:'sk', type:'Initial assessment', note:'Referral: Dr. Whitlock',     status:'done', newPt:true },
  { id:4,  time:t(9,30),  dur:45, name:'James O\'Connell', pro:'ap', type:'Rehab session',      note:'ACL reconstruction, wk 12',  status:'done' },
  { id:5,  time:t(9,30),  dur:30, name:'Hannah Weiss',     pro:'dm', type:'Dry needling',       note:'Neck / trapezius',           status:'noshow' },
  { id:6,  time:t(10),    dur:45, name:'Leon Fischer',     pro:'ro', type:'Rehab session',      note:'Shoulder – rotator cuff',    status:'done' },
  { id:7,  time:t(10,30), dur:45, name:'Aisha Rahman',     pro:'ap', type:'Follow-up',          note:'Plantar fasciitis',          status:'session' },
  { id:8,  time:t(10,30), dur:60, name:'Edward Lindqvist', pro:'sk', type:'Initial assessment', note:'Self-pay · knee pain',       status:'session', newPt:true },
  { id:9,  time:t(11),    dur:30, name:'Chloe Bennett',    pro:'dm', type:'Follow-up',          note:'Insurer pre-auth: 4 of 6',   status:'waiting', arrived:null },
  { id:10, time:t(11),    dur:45, name:'Marcus Adeyemi',   pro:'ro', type:'Rehab session',      note:'Hamstring strain',           status:'waiting', arrived:null },
  { id:11, time:t(11,30), dur:45, name:'Grace Tan',        pro:'ap', type:'Follow-up',          note:'Balance & gait',             status:'booked' },
  { id:12, time:t(11,45), dur:30, name:'Oliver Brandt',    pro:'dm', type:'Sports massage',     note:'',                           status:'booked' },
  { id:13, time:t(12),    dur:60, name:'Sandra Kowalski',  pro:'sk', type:'Follow-up',          note:'Post-op hip, balance due $40', status:'booked' },
  { id:14, time:t(13),    dur:45, name:'Yusuf Demir',      pro:'ro', type:'Rehab session',      note:'',                           status:'booked' },
  { id:15, time:t(13,30), dur:45, name:'Isabel Moreau',    pro:'ap', type:'Initial assessment', note:'Referral: Dr. Patel',        status:'booked', newPt:true },
  { id:16, time:t(14),    dur:30, name:'Nolan Pierce',     pro:'dm', type:'Dry needling',       note:'',                           status:'booked' },
  { id:17, time:t(14,30), dur:45, name:'Fatima Zahra',     pro:'sk', type:'Follow-up',          note:'Pregnancy-related pelvic pain', status:'booked' },
  { id:18, time:t(15,15), dur:45, name:'Henry Castellano', pro:'ap', type:'Follow-up',          note:'',                           status:'booked' },
  { id:19, time:t(16),    dur:60, name:'Mei Lin Zhou',     pro:'ro', type:'Rehab session',      note:'Return-to-run programme',    status:'booked' },
  { id:20, time:t(16,45), dur:30, name:'Patrick Doyle',    pro:'dm', type:'Follow-up',          note:'',                           status:'booked' },
];

const state = { q:'', pro:'all', status:'all' };
const $ = id => document.getElementById(id);
const pro = id => THERAPISTS.find(p=>p.id===id);
const nowMin = () => { const d=new Date(); return d.getHours()*60+d.getMinutes(); };
const fmt = m => { const h=Math.floor(m/60), mm=String(m%60).padStart(2,'0'); return `${((h+11)%12)+1}:${mm}`; };
const ampm = m => m<720 ? 'am' : 'pm';
const esc = s => s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Anchor the sample day to the current clock so "waiting" times look sensible whenever it's opened.
const base = nowMin();
appts.filter(a=>a.status==='waiting').forEach((a,i)=>{ a.arrived = base - [14,6][i%2]; });

function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2200); }

function setStatus(id, status){
  const a = appts.find(x=>x.id===id);
  a.status = status;
  if (status==='waiting') a.arrived = nowMin();
  toast(`${a.name} – ${STATUS[status].toLowerCase()}`);
  render();
}

function actionsFor(a){
  const b = (label, st, cls='') => `<button class="${cls}" data-id="${a.id}" data-st="${st}">${label}</button>`;
  switch (a.status) {
    case 'booked':  return b('Check in','waiting','primary') + b('No-show','noshow','quiet');
    case 'waiting': return b('Start session','session','primary') + b('Undo','booked','quiet');
    case 'session': return b('Complete','done','primary');
    case 'done':
    case 'noshow':  return b('Reopen','booked','quiet');
  }
}

function renderStats(){
  const c = s => appts.filter(a=>a.status===s).length;
  const remaining = appts.filter(a=>a.status==='booked').length;
  const waits = appts.filter(a=>a.status==='waiting').map(a=>nowMin()-a.arrived);
  const avg = waits.length ? Math.round(waits.reduce((x,y)=>x+y,0)/waits.length) : 0;
  const items = [
    [appts.length,'Appointments today'], [c('waiting'),'In waiting room'], [c('session'),'In session'],
    [c('done'),'Completed'], [remaining,'Still to arrive'], [c('noshow'),'No-shows'], [avg+' min','Avg. wait now'],
  ];
  $('stats').innerHTML = items.map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
}

function renderChips(){
  const opts = [['all','All'],...Object.entries(STATUS)];
  $('chips').innerHTML = opts.map(([k,l])=>{
    const n = k==='all' ? appts.length : appts.filter(a=>a.status===k).length;
    return `<button class="chip" data-chip="${k}" aria-pressed="${state.status===k}">${l} · ${n}</button>`;
  }).join('');
}

function renderList(){
  const q = state.q.toLowerCase(), n = nowMin();
  const rows = appts.filter(a =>
    (state.pro==='all'||a.pro===state.pro) &&
    (state.status==='all'||a.status===state.status) &&
    (!q || a.name.toLowerCase().includes(q) || pro(a.pro).name.toLowerCase().includes(q))
  ).sort((x,y)=>x.time-y.time || x.id-y.id);
  $('count').textContent = `${rows.length} shown`;
  $('list').innerHTML = rows.length ? rows.map(a=>{
    const cls = ['appt', a.time<=n && n<a.time+a.dur && (a.status==='booked'||a.status==='waiting'||a.status==='session') ? 'now':'', a.status==='done'||a.status==='noshow' ? 'past':''].join(' ');
    return `<li class="${cls}">
      <div class="time">${fmt(a.time)}<small>${ampm(a.time)} · ${a.dur}m</small></div>
      <div class="who"><b>${esc(a.name)}${a.newPt?'<span class="tag">NEW</span>':''}</b>
        <span>${a.type} · ${pro(a.pro).name}${a.note?' · '+esc(a.note):''}</span></div>
      <span class="status s-${a.status}">${STATUS[a.status]}</span>
      <div class="actions">${actionsFor(a)}</div>
    </li>`;
  }).join('') : '<li class="empty">No appointments match.</li>';
}

function renderWaiting(){
  const w = appts.filter(a=>a.status==='waiting').sort((x,y)=>x.arrived-y.arrived);
  $('waitCount').textContent = w.length;
  $('waiting').innerHTML = w.length ? w.map(a=>{
    const m = Math.max(0, nowMin()-a.arrived);
    return `<li class="wait-item"><div><b>${esc(a.name)}</b><br><small style="color:var(--muted)">for ${pro(a.pro).name} · booked ${fmt(a.time)}${ampm(a.time)}</small></div>
      <span class="mins ${m>=15?'long':''}">${m} min</span></li>`;
  }).join('') : '<li class="empty">Nobody waiting.</li>';
}

function renderRooms(){
  $('rooms').innerHTML = THERAPISTS.map(p=>{
    const cur = appts.find(a=>a.pro===p.id && a.status==='session');
    const next = appts.filter(a=>a.pro===p.id && (a.status==='booked'||a.status==='waiting')).sort((x,y)=>x.time-y.time)[0];
    const txt = cur ? `With ${esc(cur.name.split(' ')[0])}` : next ? `Next ${fmt(next.time)}${ampm(next.time)}` : 'Done for today';
    return `<li class="room"><span><b>${p.name}</b> · ${p.room}</span><span>${txt}</span></li>`;
  }).join('');
}

function render(){ renderStats(); renderChips(); renderList(); renderWaiting(); renderRooms(); }

function tick(){
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  $('date').textContent = d.toLocaleDateString([], {weekday:'long', day:'numeric', month:'long'});
}

// events
$('pro').innerHTML = '<option value="all">All therapists</option>' + THERAPISTS.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
document.querySelector('#form [name=pro]').innerHTML = THERAPISTS.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
$('q').addEventListener('input', e=>{ state.q=e.target.value; renderList(); });
$('pro').addEventListener('change', e=>{ state.pro=e.target.value; renderList(); });
$('chips').addEventListener('click', e=>{ const c=e.target.closest('[data-chip]'); if(c){ state.status=c.dataset.chip; render(); } });
$('list').addEventListener('click', e=>{ const b=e.target.closest('button[data-st]'); if(b) setStatus(+b.dataset.id, b.dataset.st); });

$('addBtn').onclick = () => {
  const n = nowMin(), r = Math.ceil(n/5)*5;
  $('form').time.value = `${String(Math.floor(r/60)%24).padStart(2,'0')}:${String(r%60).padStart(2,'0')}`;
  $('dlg').showModal();
};
$('cancel').onclick = () => $('dlg').close();
$('form').addEventListener('submit', e=>{
  const f = e.target, [h,m] = f.time.value.split(':').map(Number);
  const walkin = f.walkin.checked;
  appts.push({ id:Math.max(...appts.map(a=>a.id))+1, time:h*60+m, dur:f.type.value==='Initial assessment'?60:45,
    name:f.name.value.trim(), pro:f.pro.value, type:f.type.value, note:walkin?'Walk-in':'',
    status:walkin?'waiting':'booked', arrived:walkin?nowMin():null });
  f.reset(); toast('Appointment added'); render();
});

tick(); render();
setInterval(()=>{ tick(); renderStats(); renderList(); renderWaiting(); }, 30000);
</script>
</body>
</html>
