<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#12304a">
<title>MV Gannet loading · Skerra Ferry Company</title>
<style>
:root {
  /* brand */
  --navy: #12304a;
  --yellow: #f2b705;

  /* neutral ramp, one hue (the navy's) */
  --ground: oklch(96.5% 0.008 240);
  --surface: #ffffff;
  --sunk: oklch(92% 0.012 240);
  --line: oklch(62% 0.03 245);

  /* text levels */
  --text-1: var(--navy);
  --text-2: oklch(38% 0.045 245);
  --text-3: oklch(46% 0.04 245);

  /* status, always paired with words or a mark */
  --warn-bg: oklch(94% 0.07 85);
  --warn-line: oklch(45% 0.1 70);
  --warn-text: oklch(32% 0.07 60);
  --info-bg: oklch(94% 0.03 240);

  --focus: var(--navy);

  /* 4px spacing scale */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px;
  --s-6: 24px; --s-8: 32px; --s-10: 40px;

  --r-1: 4px; --r-2: 8px;

  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --press: 120ms;
  --deck-h: 300px;
}

*, *::before, *::after { box-sizing: border-box; }
html { overflow-x: clip; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--text-1);
  font: 400 18px/1.45 var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  padding-bottom: calc(120px + env(safe-area-inset-bottom));
}
h1, h2, p { margin: 0; }
h1, h2 { text-wrap: balance; }
p { text-wrap: pretty; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
.top :focus-visible, .toast :focus-visible { outline-color: var(--yellow); }
.wrap {
  max-width: 880px; margin: 0 auto;
  padding-inline: max(var(--s-4), env(safe-area-inset-left)) max(var(--s-4), env(safe-area-inset-right));
}
.label { font-size: 16px; font-weight: 700; color: var(--text-2); }
.btn-press { transition: transform var(--press) var(--ease-out); }
.btn-press:active:not(:disabled) { transform: scale(0.97); }

/* ---------- header ---------- */
.top { background: var(--navy); color: #fff; padding-block: var(--s-3); padding-top: calc(var(--s-3) + env(safe-area-inset-top)); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); flex-wrap: wrap; }
.wordmark { font-size: 16px; font-weight: 600; letter-spacing: 0.01em; }
.wordmark b { color: var(--yellow); font-weight: 800; }
h1 { font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; }
.day { display: flex; align-items: center; gap: var(--s-2); }
.day button {
  width: 56px; height: 56px; display: grid; place-items: center;
  background: transparent; border: 2px solid #fff; border-radius: var(--r-2); color: #fff;
}
.day svg { width: 28px; height: 28px; }
.daylabel { min-width: 116px; text-align: center; line-height: 1.2; }
.daylabel strong { display: block; font-size: 20px; }
.daylabel span { font-size: 16px; color: var(--yellow); font-weight: 600; }

/* ---------- sailings ---------- */
.sailings { margin-top: var(--s-4); }
.sailgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: var(--s-2); margin-top: var(--s-2); }
.sail {
  min-height: 68px; padding: var(--s-2); text-align: center; line-height: 1.2;
  background: var(--surface); border: 2px solid var(--navy); border-radius: var(--r-2);
}
.sail strong { display: block; font-size: 22px; letter-spacing: -0.01em; }
.sail span { font-size: 14px; font-weight: 600; color: var(--text-2); }
.sail[aria-pressed="true"] { background: var(--navy); color: #fff; }
.sail[aria-pressed="true"] span { color: #fff; }
.sail.gone:not([aria-pressed="true"]) { background: var(--sunk); border-style: dashed; }

/* ---------- deck plan ---------- */
.deckwrap { position: sticky; top: 0; z-index: 5; background: var(--ground); padding-block: var(--s-3); margin-top: var(--s-1); }
.deck { background: var(--surface); border: 2px solid var(--navy); border-radius: var(--r-2); padding: var(--s-3); }
.deckhead { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--s-3); margin-bottom: var(--s-3); }
.deckhead .when { font-size: 18px; font-weight: 700; line-height: 1.25; }
.deckhead .when small { display: block; font-size: 16px; font-weight: 500; color: var(--text-2); }
.free { text-align: right; line-height: 1; white-space: nowrap; }
.free strong { font-size: 52px; font-weight: 800; letter-spacing: -0.03em; }
.free span { display: block; margin-top: var(--s-1); font-size: 16px; font-weight: 600; color: var(--text-2); }
.lane { display: grid; grid-template-columns: 76px 1fr 64px; align-items: center; gap: var(--s-2); }
.lane + .lane { margin-top: var(--s-2); }
.lane .name { line-height: 1.15; font-weight: 800; font-size: 18px; }
.lane .name small { display: block; font-size: 14px; font-weight: 600; color: var(--text-3); }
.lane .left { text-align: right; font-size: 16px; font-weight: 700; color: var(--text-2); }
.cells { display: grid; gap: var(--s-1); }
.veh, .slot { height: 44px; border-radius: var(--r-1); }
.veh {
  display: grid; place-items: center; background: var(--navy); color: #fff;
  font-weight: 800; font-size: 15px; letter-spacing: 0.04em; overflow: hidden;
}
.veh.sel { background: var(--yellow); color: var(--navy); outline: 3px solid var(--navy); outline-offset: -3px; }
.slot { border: 2px dashed var(--line); }
.deckfoot { margin-top: var(--s-3); display: grid; gap: var(--s-2); font-size: 16px; }
.deckfoot .waiting { color: var(--text-2); font-weight: 600; }
.warn {
  display: flex; gap: var(--s-2); align-items: flex-start; padding: var(--s-2) var(--s-3);
  background: var(--warn-bg); border: 2px solid var(--warn-line); border-radius: var(--r-2);
  color: var(--warn-text); font-weight: 600; line-height: 1.35;
}
.warn i {
  flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--warn-line); color: #fff;
  display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 16px; line-height: 1;
}
.notice { margin-top: var(--s-1); }
.notice .warn { background: var(--info-bg); border-color: var(--navy); color: var(--text-1); }
.notice .warn i { background: var(--navy); }

/* ---------- find ---------- */
.find { margin-top: var(--s-4); }
.findrow { display: grid; grid-template-columns: 1fr auto; gap: var(--s-2); margin-top: var(--s-2); }
#plate {
  width: 100%; min-width: 0; height: 84px; padding: 0 var(--s-4);
  font-size: 48px; font-weight: 800; letter-spacing: 0.25em; text-transform: uppercase;
  background: var(--surface); border: 3px solid var(--navy); border-radius: var(--r-2);
}
#plate::placeholder { color: var(--text-3); opacity: 1; letter-spacing: 0.25em; }
#plate:focus-visible { outline-offset: 3px; }
.clear { min-width: 92px; padding: 0 var(--s-4); font-weight: 700; background: var(--surface); border: 3px solid var(--navy); border-radius: var(--r-2); }
.hint { min-height: 28px; margin-top: var(--s-2); font-size: 16px; font-weight: 600; color: var(--text-2); }

.card { margin-top: var(--s-3); padding: var(--s-4); background: var(--surface); border: 2px solid var(--navy); border-radius: var(--r-2); scroll-margin-top: calc(var(--deck-h) + var(--s-4)); }
.card.plain { border-color: var(--line); }
.cardhead { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-3); }
.plate {
  display: inline-block; padding: 0 var(--s-3); border: 3px solid var(--navy); border-radius: 6px; background: #fff;
  font-size: 30px; line-height: 1.3; font-weight: 800; letter-spacing: 0.04em; white-space: nowrap;
}
.plate mark { background: var(--yellow); color: var(--navy); padding: 0 var(--s-1); border-radius: var(--r-1); }
.pill { display: inline-block; padding: 2px var(--s-3); border: 2px solid var(--navy); border-radius: 999px; font-size: 16px; font-weight: 700; white-space: nowrap; }
.pill.in { background: var(--navy); color: #fff; }
.pill.wait { border-style: dashed; }
.desc { margin-top: var(--s-2); font-weight: 700; overflow-wrap: anywhere; }
.meta { color: var(--text-2); font-size: 16px; overflow-wrap: anywhere; }
.choose { margin-top: var(--s-4); }
.lanes { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-3); margin-top: var(--s-2); }
.lanebtn {
  min-height: 100px; padding: var(--s-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: var(--surface); border: 3px solid var(--navy); border-radius: var(--r-2); text-align: center; line-height: 1.2;
}
.lanebtn b { font-size: 26px; font-weight: 800; }
.lanebtn span { font-size: 16px; font-weight: 700; color: var(--text-2); }
.lanebtn.best { background: var(--yellow); }
.lanebtn.best span { color: var(--navy); }
.lanebtn:disabled { background: var(--sunk); border-style: dashed; border-color: var(--text-3); cursor: not-allowed; }
.lanebtn:disabled b, .lanebtn:disabled span { color: var(--text-2); }
.lanebtn.here:disabled { border-style: solid; border-color: var(--navy); }
.lanebtn.here:disabled b, .lanebtn.here:disabled span { color: var(--navy); }
.secondary { min-height: 56px; margin-top: var(--s-3); padding: 0 var(--s-5); font-weight: 700; background: var(--surface); border: 3px solid var(--navy); border-radius: var(--r-2); }
.elsewhere { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s-3); }
.elsewhere .secondary { margin-top: 0; }

/* ---------- queue ---------- */
.queue { margin-top: var(--s-8); }
.queuehead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s-3); }
.queuehead h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.tabs { display: flex; }
.tab { min-height: 56px; padding: 0 var(--s-4); font-weight: 700; background: var(--surface); border: 2px solid var(--navy); }
.tab:first-child { border-radius: var(--r-2) 0 0 var(--r-2); }
.tab:last-child { border-radius: 0 var(--r-2) var(--r-2) 0; margin-left: -2px; }
.tab[aria-pressed="true"] { background: var(--navy); color: #fff; }
.list { list-style: none; margin: var(--s-3) 0 0; padding: 0; display: grid; gap: var(--s-2); }
.row {
  width: 100%; min-height: 76px; padding: var(--s-3) var(--s-4); text-align: left;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--s-1) var(--s-4);
  background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-2);
}
.row .plate { font-size: 24px; }
.row .info { min-width: 0; }
.row .info b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .info span { font-size: 16px; color: var(--text-2); }
.empty { padding: var(--s-6) var(--s-4); background: var(--surface); border: 2px dashed var(--line); border-radius: var(--r-2); text-align: center; font-weight: 600; color: var(--text-2); }
.foot { margin-top: var(--s-8); font-size: 16px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: var(--s-3) var(--s-6); align-items: center; justify-content: space-between; }
.foot .secondary { margin-top: 0; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 0; right: 0; bottom: calc(var(--s-4) + env(safe-area-inset-bottom)); z-index: 20;
  margin-inline: auto; width: min(calc(100% - 2 * var(--s-4)), 600px);
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-4);
  padding: var(--s-3) var(--s-3) var(--s-3) var(--s-4); background: var(--navy); color: #fff; border-radius: var(--r-2);
  border: 2px solid #fff; box-shadow: 0 0 0 2px var(--navy), 0 8px 24px rgb(0 0 0 / 0.25);
  font-weight: 700; line-height: 1.3;
  opacity: 0; visibility: hidden; transform: translateY(12px) scale(0.98); pointer-events: none;
  transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out), visibility 0s linear 200ms;
}
.toast.show { opacity: 1; visibility: visible; transform: none; pointer-events: auto; transition-delay: 0s; }
.toast button { flex: none; min-height: 56px; padding: 0 var(--s-5); font-weight: 800; background: var(--yellow); color: var(--navy); border: 0; border-radius: var(--r-2); }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.nojs { margin: var(--s-4); }

@media (hover: hover) {
  .sail:hover:not([aria-pressed="true"]), .tab:hover:not([aria-pressed="true"]), .clear:hover, .secondary:hover, .row:hover { background: var(--info-bg); }
  .lanebtn:hover:not(:disabled):not(.best) { background: var(--info-bg); }
  .lanebtn.best:hover { filter: brightness(1.06); }
  .day button:hover { background: rgb(255 255 255 / 0.14); }
}
@media (max-width: 600px) {
  h1 { font-size: 24px; }
  .lanes { grid-template-columns: repeat(2, 1fr); }
  .free strong { font-size: 44px; }
  #plate { font-size: 40px; height: 76px; }
  .row { grid-template-columns: auto 1fr; }
  .row .status { grid-column: 1 / -1; }
  .lane { grid-template-columns: 64px 1fr 52px; }
  .lane .name small { display: none; }
  .veh { font-size: 13px; letter-spacing: 0; }
  .row .info b { white-space: normal; }
}
@media (max-height: 760px) {
  .deckwrap { position: static; }
}
@media (prefers-reduced-motion: reduce) {
  .toast { transform: none; transition: opacity 150ms linear; }
  .btn-press:active:not(:disabled) { transform: none; }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div>
      <p class="wordmark"><b>Skerra</b> Ferry Company</p>
      <h1>MV Gannet loading</h1>
    </div>
    <div class="day">
      <button type="button" id="prevDay" class="btn-press" aria-label="Previous day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="daylabel" aria-live="polite"><strong id="dayText"></strong><span id="dayTag"></span></div>
      <button type="button" id="nextDay" class="btn-press" aria-label="Next day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>
</header>

<main class="wrap">
  <noscript><p class="nojs">The loading screen needs JavaScript. Turn it on in the browser settings and reload.</p></noscript>

  <section class="sailings" aria-labelledby="sailLabel">
    <h2 class="label" id="sailLabel">Sailing from Port Ailig</h2>
    <div class="sailgrid" id="sailings"></div>
  </section>

  <div class="deckwrap"><section class="deck" id="deck" aria-label="Deck space"></section></div>

  <div class="notice" id="notice"></div>

  <section class="find" aria-label="Find a booking">
    <label class="label" for="plate">Last 3 characters of the plate</label>
    <div class="findrow">
      <input id="plate" type="text" inputmode="text" maxlength="3" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="search" placeholder="ABC">
      <button type="button" class="clear btn-press" id="clear">Clear</button>
    </div>
    <p class="hint" id="hint" aria-live="polite"></p>
    <div id="results"></div>
  </section>

  <section class="queue" aria-labelledby="queueTitle">
    <div class="queuehead">
      <h2 id="queueTitle"></h2>
      <div class="tabs" role="group" aria-label="Show vehicles">
        <button type="button" class="tab" id="tabWaiting" data-tab="waiting"></button>
        <button type="button" class="tab" id="tabLoaded" data-tab="loaded"></button>
      </div>
    </div>
    <ul class="list" id="list"></ul>
  </section>

  <div class="foot">
    <p>Sample bookings. Loading is saved on this tablet.</p>
    <button type="button" class="secondary btn-press" id="reset"></button>
  </div>
</main>

<div class="toast" id="toast" role="status"><span id="toastText"></span><button type="button" id="undo" class="btn-press">Undo</button></div>

      ['SF69 KLE', 'trailer', 'Nissan Navara with quad trailer', 1.95, 'Urquhart'],
      ['SD70 HYB', 'car', 'Citroën C3, orange', 1.52, 'Lamont'],
      ['SM21 TGU', 'car', 'Mercedes A-Class, grey', 1.44, 'Sinclair'],
    ],
    '18:05': [
      ['SH22 NBW', 'car', 'BMW 3 Series, black', 1.43, 'Mackay'],
      ['SV19 CZP', 'van', 'Fiat Ducato, white', 2.55, 'Island Parcels'],
      ['SK23 FRM', 'car', 'Land Rover Discovery Sport, green', 1.72, 'Gunn'],
      ['SN68 DOH', 'car', 'Peugeot 2008, grey', 1.55, 'Forbes'],
      ['SJ21 BKL', 'car', 'Honda CR-V, silver', 1.69, 'Hay'],
    ],
  };
  const TANKER = ['SU12 ZTN', 'lorry', 'Fuel tanker, 18,000 litres', 3.55, 'Ailig Fuels'];

  /* ---------- state ---------- */
  const KEY = 'gannet-loading-v1';
  let store = null;
  try { store = JSON.parse(localStorage.getItem(KEY)); } catch (e) { store = null; }
  if (!store || !store.days) store = { days: {}, seeded: false };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* private mode */ } };

  const now = new Date();
  const state = { offset: 0, time: null, q: '', tab: 'waiting' };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const mins = (t) => +t.slice(0, 2) * 60 + +t.slice(3);
  const clock = (m) => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  const dateObj = () => new Date(now.getFullYear(), now.getMonth(), now.getDate() + state.offset);
  const keyOf = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const isToday = () => state.offset === 0;
  const departed = (t) => isToday() && mins(t) <= now.getHours() * 60 + now.getMinutes();
  const tankerOnly = (t, d = dateObj()) => d.getDay() === 4 && t === '10:15';
  const suffix = (b) => b.plate.replace(/\s/g, '').slice(-3);

  function bookingsFor(t) {
    const rows = tankerOnly(t) ? [TANKER] : RAW[t];
    return rows.map((r, i) => ({ id: t + '-' + (tankerOnly(t) ? 'T' : i), time: t, plate: r[0], type: r[1], desc: r[2], h: r[3], name: r[4] }));
  }
  function entriesFor(t) {
    const day = store.days[keyOf(dateObj())] || (store.days[keyOf(dateObj())] = {});
    return day[t] || (day[t] = []);
  }
  function setEntries(t, list) {
    const k = keyOf(dateObj());
    (store.days[k] || (store.days[k] = {}))[t] = list;
  }
  function ctx(t = state.time) {
    const bookings = bookingsFor(t);
    const byId = Object.fromEntries(bookings.map((b) => [b.id, b]));
    const list = entriesFor(t).filter((e) => byId[e.id]);
    return { t, bookings, byId, list };
  }
  const units = (c, e) => TYPES[c.byId[e.id].type].units;
  const used = (c, lane, skipId) => c.list.filter((e) => e.lane === lane.n && e.id !== skipId).reduce((s, e) => s + units(c, e), 0);
  const laneFree = (c, lane, skipId) => lane.cap - used(c, lane, skipId);
  const loadedOf = (c, id) => c.list.find((e) => e.id === id);

  function laneCheck(c, b, lane) {
    const ty = TYPES[b.type];
    if (ty.heavy && !lane.heavyOk) return 'Lanes 2 and 3 only';
    if (lane.maxH && b.h > lane.maxH) return 'Too tall: ' + b.h.toFixed(2) + ' m';
    const free = laneFree(c, lane, b.id);
    if (free < ty.units) return 'Needs ' + ty.units + ', ' + free + ' free';
    return null;
  }
  function suggest(c, b) {
    let best = null;
    LANES.forEach((lane) => {
      if (laneCheck(c, b, lane)) return;
      const left = laneFree(c, lane, b.id) - TYPES[b.type].units;
      const score = left * 10 + (lane.heavyOk && !TYPES[b.type].heavy ? 5 : 0) + lane.n / 10;
      if (!best || score < best.score) best = { n: lane.n, score };
    });
    return best && best.n;
  }

  /* ---------- actions ---------- */
  let undoSnap = null, toastTimer = 0;
  function toast(text, snap) {
    undoSnap = snap;
    $('toastText').textContent = text;
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), 8000);
  }
  function commit(list, message) {
    const snap = { t: state.time, offset: state.offset, list: entriesFor(state.time).map((e) => ({ ...e })) };
    setEntries(state.time, list);
    save();
    toast(message, snap);
  }
  function assign(id, laneN) {
    const c = ctx();
    const b = c.byId[id];
    if (!b || laneCheck(c, b, LANES[laneN - 1])) return;
    const list = entriesFor(c.t).filter((e) => e.id !== id).map((e) => ({ ...e }));
    list.push({ id, lane: laneN });
    const verb = loadedOf(c, id) ? 'Moved' : 'Loaded';
    commit(list, verb + ' ' + b.plate + ' to lane ' + laneN);
    state.q = '';
    $('plate').value = '';
    renderAll();
    $('plate').focus({ preventScroll: true });
  }
  function unload(id) {
    const c = ctx();
    commit(entriesFor(c.t).filter((e) => e.id !== id), 'Unloaded ' + c.byId[id].plate);
    renderAll();
  }
  function seed() {
    if (store.seeded) return;
    store.seeded = true;
    const c = ctx();
    c.bookings.slice(0, Math.ceil(c.bookings.length / 3)).forEach((b) => {
      const cur = ctx();
      const n = suggest(cur, b);
      if (n) entriesFor(c.t).push({ id: b.id, lane: n });
    });
    save();
  }

  /* ---------- render ---------- */
  function defaultTime() {
    if (!isToday()) return TIMES[0];
    const nowM = now.getHours() * 60 + now.getMinutes();
    return TIMES.find((t) => mins(t) >= nowM) || TIMES[TIMES.length - 1];
  }
  function renderDay() {
    const d = dateObj();
    $('dayText').textContent = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    $('dayTag').textContent = state.offset === 0 ? 'Today' : state.offset === 1 ? 'Tomorrow' : state.offset === -1 ? 'Yesterday' : ' ';
  }
  function renderSailings() {
    $('sailings').innerHTML = TIMES.map((t) => {
      const c = ctx(t);
      const gone = departed(t);
      const sub = gone ? 'Departed' : tankerOnly(t) ? 'Tanker only' : c.list.length + ' of ' + c.bookings.length;
      return '<button type="button" class="sail btn-press' + (gone ? ' gone' : '') + '" aria-label="' + t + ' sailing, ' + (gone ? 'departed' : tankerOnly(t) ? 'tanker only' : c.list.length + ' of ' + c.bookings.length + ' loaded') + '" data-sailing="' + t + '" aria-pressed="' + (t === state.time) + '"><strong>' + t + '</strong><span>' + sub + '</span></button>';
    }).join('');
  }
  function renderDeck() {
    const c = ctx();
    const sel = new Set(matches(c).map((b) => b.id));
    const usedTotal = c.list.reduce((s, e) => s + units(c, e), 0);
    const free = TOTAL - usedTotal;
    const arrive = clock(mins(c.t) + CROSSING);
    const waiting = c.bookings.filter((b) => !loadedOf(c, b.id));
    const waitUnits = waiting.reduce((s, b) => s + TYPES[b.type].units, 0);

    const lanes = LANES.map((lane) => {
      const blocks = c.list.filter((e) => e.lane === lane.n).map((e) => {
        const b = c.byId[e.id];
        const u = TYPES[b.type].units;
        return '<span class="veh' + (sel.has(b.id) ? ' sel' : '') + '" style="grid-column: span ' + u + '" title="' + esc(b.plate) + '">' + esc(suffix(b)) + '</span>';
      }).join('');
      const f = laneFree(c, lane);
      return '<div class="lane"><div class="name">Lane ' + lane.n + '<small>' + lane.note + '</small></div>' +
        '<div class="cells" style="grid-template-columns: repeat(' + lane.cap + ', 1fr)">' + blocks + '<span class="slot" style="grid-column: span ' + f + (f ? '' : '; display:none') + '"></span></div>' +
        '<div class="left">' + f + ' free</div></div>';
    }).join('');

    const warns = [];
    const heavyWaiting = waiting.filter((b) => TYPES[b.type].heavy);
    const bestHeavy = Math.max(...LANES.filter((l) => l.heavyOk).map((l) => laneFree(c, l)));
    if (heavyWaiting.length && bestHeavy < 4) {
      warns.push('A lorry or island bus is still waiting and needs 4 free units in lane 2 or 3. The most free there is ' + bestHeavy + '.');
    }
    if (waitUnits > free) {
      warns.push('Waiting vehicles need ' + waitUnits + ' units and only ' + free + ' are free. ' + (waitUnits - free) + ' will not fit.');
    }
    $('deck').innerHTML =
      '<div class="deckhead"><div class="when">' + c.t + ' sailing<small>Arrives ' + arrive + ' · ' + CROSSING + ' min crossing</small></div>' +
      '<div class="free"><strong>' + free + '</strong><span>' + (free === 0 ? 'Deck full · of ' + TOTAL : 'units free of ' + TOTAL) + '</span></div></div>' +
      lanes +
      '<div class="deckfoot">' + warns.map((w) => '<p class="warn"><i aria-hidden="true">!</i><span>' + w + '</span></p>').join('') +
      '<p class="waiting">' + (waiting.length ? 'Still to load: ' + waiting.length + (waiting.length === 1 ? ' vehicle' : ' vehicles') + ', ' + waitUnits + ' units' : (c.bookings.length ? 'Everything booked is loaded' : 'No vehicles booked')) + '</p></div>';
    document.documentElement.style.setProperty('--deck-h', $('deck').offsetHeight + 'px');
  }
  function renderNotice() {
    $('notice').innerHTML = tankerOnly(state.time)
      ? '<p class="warn"><i aria-hidden="true">i</i><span>Thursday 10:15 carries only the fuel tanker and foot passengers. No other vehicles load on this sailing.</span></p>'
      : '';
  }
  function matches(c) {
    return state.q.length === 3 ? c.bookings.filter((b) => suffix(b) === state.q) : [];
  }
  function cardFor(c, b) {
    const ty = TYPES[b.type];
    const e = loadedOf(c, b.id);
    const best = suggest(c, b);
    const plate = esc(b.plate.slice(0, -3)) + '<mark>' + esc(suffix(b)) + '</mark>';
    const btns = LANES.map((lane) => {
      const here = e && e.lane === lane.n;
      const why = here ? null : laneCheck(c, b, lane);
      const free = laneFree(c, lane, b.id);
      const cls = 'lanebtn btn-press' + (best === lane.n && !e ? ' best' : '') + (here ? ' here' : '');
      const sub = here ? 'Here now' : why ? why : (best === lane.n ? 'Suggested · ' : '') + free + ' free';
      return '<button type="button" class="' + cls + '" data-assign="' + b.id + '" data-lane="' + lane.n + '"' + (why || here ? ' disabled' : '') + '><b>Lane ' + lane.n + '</b><span>' + esc(sub) + '</span></button>';
    }).join('');
    const nofit = !e && LANES.every((l) => laneCheck(c, b, l));
    return '<article class="card" data-card="' + b.id + '">' +
      '<div class="cardhead"><span class="plate">' + plate + '</span>' +
      (e ? '<span class="pill in">Loaded · lane ' + e.lane + '</span>' : '<span class="pill wait">Waiting</span>') + '</div>' +
      '<p class="desc">' + esc(b.desc) + '</p>' +
      '<p class="meta">' + ty.label + ' · ' + ty.units + (ty.units === 1 ? ' unit' : ' units') + ' · ' + b.h.toFixed(2) + ' m high · ' + esc(b.name) + '</p>' +
      (nofit ? '<p class="warn" style="margin-top:var(--s-3)"><i aria-hidden="true">!</i><span>No lane can take this vehicle now. Check the reasons below, then speak to the officer in charge.</span></p>' : '') +
      '<p class="label choose">' + (e ? 'Move to another lane' : 'Choose a lane') + '</p>' +
      '<div class="lanes">' + btns + '</div>' +
      (e ? '<button type="button" class="secondary btn-press" data-unload="' + b.id + '">Take off the deck</button>' : '') +
      '</article>';
  }
  function renderResults() {
    const c = ctx();
    const q = state.q;
    let hint = '', html = '';
    if (!q) hint = 'Type the last 3 characters of the plate.';
    else if (q.length < 3) hint = (3 - q.length) + ' more character' + (3 - q.length === 1 ? '' : 's') + '.';
    else {
      const hit = matches(c);
      const other = TIMES.filter((t) => t !== c.t).flatMap((t) => bookingsFor(t)).filter((b) => suffix(b) === q);
      hint = hit.length ? hit.length + (hit.length === 1 ? ' booking' : ' bookings') + ' end in ' + q + '.' : '';
      html = hit.map((b) => cardFor(c, b)).join('');
      if (!hit.length) {
        html += '<div class="card plain"><p class="desc">No booking ends in ' + esc(q) + ' on the ' + c.t + ' sailing.</p>' +
          '<p class="meta">' + (tankerOnly(c.t) ? 'This Thursday sailing carries only the fuel tanker. ' : '') + 'Check the characters on the plate' + (other.length ? '.' : ', or look on another day.') + '</p></div>';
      }
      html += other.map((b) =>
        '<div class="card plain elsewhere"><div><p class="desc">' + esc(b.plate) + ' is booked on the ' + b.time + ' sailing</p><p class="meta">' + esc(b.desc) + '</p></div>' +
        '<button type="button" class="secondary btn-press" data-go="' + b.time + '">Open ' + b.time + '</button></div>').join('');
    }
    $('hint').textContent = hint;
    $('results').innerHTML = html;
  }
  function renderQueue() {
    const c = ctx();
    const waiting = c.bookings.filter((b) => !loadedOf(c, b.id));
    const loaded = c.bookings.filter((b) => loadedOf(c, b.id));
    $('queueTitle').textContent = 'Booked on the ' + c.t;
    $('tabWaiting').textContent = 'Waiting (' + waiting.length + ')';
    $('tabLoaded').textContent = 'Loaded (' + loaded.length + ')';
    $('tabWaiting').setAttribute('aria-pressed', state.tab === 'waiting');
    $('tabLoaded').setAttribute('aria-pressed', state.tab === 'loaded');
    const rows = state.tab === 'waiting' ? waiting : loaded;
    if (!rows.length) {
      $('list').innerHTML = '<li class="empty">' + (state.tab === 'waiting'
        ? (c.bookings.length ? 'Everything booked on the ' + c.t + ' is loaded. Pick the next sailing above.' : 'No vehicles booked on the ' + c.t + '.')
        : 'Nothing loaded yet. Search a plate above to load the first vehicle.') + '</li>';
    } else {
      $('list').innerHTML = rows.map((b) => {
        const e = loadedOf(c, b.id);
        const ty = TYPES[b.type];
        return '<li><button type="button" class="row btn-press" data-pick="' + suffix(b) + '"><span class="plate">' + esc(b.plate.slice(0, -3)) + '<mark>' + esc(suffix(b)) + '</mark></span>' +
          '<span class="info"><b>' + esc(b.desc) + '</b><span>' + ty.label + ' · ' + ty.units + (ty.units === 1 ? ' unit' : ' units') + '</span></span>' +
          '<span class="status">' + (e ? '<span class="pill in">Lane ' + e.lane + '</span>' : '<span class="pill wait">Waiting</span>') + '</span></button></li>';
      }).join('');
    }
    $('reset').textContent = 'Clear all loading on the ' + c.t;
    $('reset').disabled = !c.list.length;
  }
  function renderAll() {
    renderDay(); renderSailings(); renderNotice(); renderResults(); renderDeck(); renderQueue();
  }

  /* ---------- events ---------- */
  function setSailing(t) {
    state.time = t; state.q = ''; state.tab = 'waiting';
    $('plate').value = '';
    renderAll();
  }
  function setDay(delta) {
    state.offset += delta;
    state.time = defaultTime();
    state.q = ''; $('plate').value = '';
    renderAll();
  }
  $('plate').addEventListener('input', (ev) => {
    state.q = ev.target.value.replace(/[^a-z0-9]/gi, '').toUpperCase().slice(0, 3);
    ev.target.value = state.q;
    renderResults(); renderDeck();
    if (state.q.length === 3) {
      const card = $('results').querySelector('.card');
      if (card) card.scrollIntoView({ block: 'start', behavior: 'auto' });
    }
  });
  $('clear').addEventListener('click', () => { state.q = ''; $('plate').value = ''; renderResults(); renderDeck(); $('plate').focus(); });
  $('prevDay').addEventListener('click', () => setDay(-1));
  $('nextDay').addEventListener('click', () => setDay(1));
  $('reset').addEventListener('click', () => {
    const c = ctx();
    commit([], 'Cleared loading on the ' + c.t + ' sailing');
    renderAll();
  });
  $('undo').addEventListener('click', () => {
    if (!undoSnap) return;
    const s = undoSnap; undoSnap = null;
    state.offset = s.offset; state.time = s.t;
    setEntries(s.t, s.list); save();
    $('toast').classList.remove('show');
    renderAll();
  });
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-sailing],[data-assign],[data-unload],[data-go],[data-pick],[data-tab]');
    if (!el) return;
    if (el.dataset.sailing) setSailing(el.dataset.sailing);
    else if (el.dataset.assign) assign(el.dataset.assign, +el.dataset.lane);
    else if (el.dataset.unload) unload(el.dataset.unload);
    else if (el.dataset.go) { const q = state.q; setSailing(el.dataset.go); state.q = q; $('plate').value = q; renderAll(); }
    else if (el.dataset.tab) { state.tab = el.dataset.tab; renderQueue(); }
    else if (el.dataset.pick) {
      state.q = el.dataset.pick; $('plate').value = state.q;
      renderResults(); renderDeck();
      const card = $('results').querySelector('.card');
      if (card) card.scrollIntoView({ block: 'start', behavior: 'auto' });
    }
  });
  window.addEventListener('resize', () => document.documentElement.style.setProperty('--deck-h', $('deck').offsetHeight + 'px'));
  setInterval(renderSailings, 60000);

  state.time = defaultTime();
  seed();
  renderAll();
})();
</script>
</body>
</html>
