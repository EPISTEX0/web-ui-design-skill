<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salt and Iron · Visitor guide · Harwick Maritime Museum</title>
<meta name="description" content="The visitor guide to Salt and Iron at the Harwick Maritime Museum, 14 March to 2 November 2027. Twelve stops, each with text and audio.">
<meta name="theme-color" content="#9c3d1f">
<style>
:root {
  /* colour: rust from the museum's gallery labels, off-black ink, warm white paper */
  --color-bg: #fbf8f2;
  --color-surface: #f1ebdf;
  --color-text: #1a1714;
  --color-text-secondary: #4a423a;
  --color-border: #cfc5b3;
  --color-accent: #9c3d1f;
  --color-accent-ink: #fbf8f2;
  --color-focus: #1a1714;

  --font-serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --text-scale: 1;
  --step-body: calc(1.25rem * var(--text-scale));
  --step-lead: calc(1.5rem * var(--text-scale));

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
  --radius: 2px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --bar-h: 76px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-serif);
  font-size: var(--step-body);
  line-height: 1.55;
  overflow-x: clip;
  -webkit-tap-highlight-color: transparent;
}
a, button { touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 3px; }
.skip {
  position: absolute; left: var(--s4); top: -100px;
  background: var(--color-text); color: var(--color-bg);
  padding: var(--s3) var(--s4); font-family: var(--font-ui); z-index: 10;
}
.skip:focus { top: var(--s4); }

.wrap { max-width: 40rem; margin: 0 auto; padding: 0 var(--s5); }

/* top bar */
.top {
  border-bottom: 1px solid var(--color-border);
  background: var(--color-bg);
}
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: 56px; }
.top a.home {
  font-family: var(--font-ui); font-size: 1rem; font-weight: 600;
  color: var(--color-text); text-decoration: none;
  display: inline-flex; align-items: center; min-height: 44px;
}
.top a.home:hover { text-decoration: underline; }
.size { display: flex; gap: var(--s2); }
.size button {
  font-family: var(--font-ui); font-weight: 700; color: var(--color-text);
  background: transparent; border: 1px solid var(--color-text); border-radius: var(--radius);
  min-width: 44px; min-height: 44px; cursor: pointer;
}
.size button[aria-pressed="true"] { background: var(--color-text); color: var(--color-bg); }
.size .s1 { font-size: 0.875rem; } .size .s2 { font-size: 1.125rem; } .size .s3 { font-size: 1.375rem; }

h1, h2 { font-weight: 400; line-height: 1.1; letter-spacing: -0.02em; text-wrap: balance; margin: 0; }
p { text-wrap: pretty; margin: 0 0 var(--s5); }

/* home */
.cover { padding: var(--s7) 0 var(--s6); }
.cover .where { font-family: var(--font-ui); font-size: 1rem; color: var(--color-text-secondary); margin: 0 0 var(--s4); }
.cover h1 { font-size: clamp(3.5rem, 17vw, 6rem); color: var(--color-accent); }
.cover .dates { font-size: var(--step-lead); margin: var(--s5) 0 var(--s5); line-height: 1.3; }
.cover .how { color: var(--color-text-secondary); max-width: 32rem; }
.start {
  display: inline-flex; align-items: center; min-height: 56px; padding: 0 var(--s6);
  background: var(--color-accent); color: var(--color-accent-ink);
  font-family: var(--font-ui); font-size: 1.125rem; font-weight: 700;
  text-decoration: none; border-radius: var(--radius);
  transition: transform 140ms var(--ease-out);
}
.start:active { transform: scale(0.97); }
.stops { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--color-text); }
.stops a {
  display: grid; grid-template-columns: 3.25rem 1fr; align-items: baseline;
  min-height: 64px; padding: var(--s3) 0; border-bottom: 1px solid var(--color-border);
  color: var(--color-text); text-decoration: none;
}
.stops .n { font-size: 1.75rem; color: var(--color-accent); font-variant-numeric: tabular-nums; line-height: 1; }
.stops .t { font-size: var(--step-lead); line-height: 1.25; }
.stops .out { display: block; font-family: var(--font-ui); font-size: 1rem; color: var(--color-text-secondary); }
@media (hover: hover) { .stops a:hover .t { text-decoration: underline; text-underline-offset: 4px; } }
.list-head { font-size: 1.75rem; margin: var(--s7) 0 var(--s4); }
.practical { margin: var(--s7) 0 var(--s8); padding: var(--s5); background: var(--color-surface); border-radius: var(--radius); }
.practical h2 { font-size: 1.5rem; margin-bottom: var(--s3); }
.practical p { margin: 0; font-size: 1.125rem; color: var(--color-text-secondary); }

/* stop */
.stop { padding: var(--s6) 0 calc(var(--bar-h) + var(--s7) + env(safe-area-inset-bottom)); }
.label-rule { display: flex; align-items: flex-end; gap: var(--s4); border-bottom: 2px solid var(--color-text); padding-bottom: var(--s4); margin-bottom: var(--s5); }
.num { font-size: clamp(5rem, 24vw, 8rem); line-height: 0.8; color: var(--color-accent); font-variant-numeric: tabular-nums; letter-spacing: -0.04em; }
.of { font-family: var(--font-ui); font-size: 1rem; color: var(--color-text-secondary); padding-bottom: var(--s1); }
.stop h1 { font-size: clamp(2.25rem, 10vw, 3.25rem); margin-bottom: var(--s4); }
.badge {
  display: inline-block; font-family: var(--font-ui); font-size: 1rem; font-weight: 600;
  border: 1.5px solid var(--color-text); padding: var(--s1) var(--s3); margin: 0 0 var(--s4); border-radius: var(--radius);
}
.sample {
  font-family: var(--font-ui); font-size: 1rem; color: var(--color-text-secondary);
  border-left: 4px solid var(--color-accent); padding: var(--s1) 0 var(--s1) var(--s3); margin: 0 0 var(--s5);
}
.body p { font-size: var(--step-body); }
.audio { margin: var(--s6) 0 0; padding: var(--s4); background: var(--color-surface); border-radius: var(--radius); }
.audio h2 { font-family: var(--font-ui); font-size: 1.125rem; font-weight: 700; letter-spacing: 0; margin-bottom: var(--s3); }
.audio audio { width: 100%; height: 56px; }
.audio .none { font-family: var(--font-ui); font-size: 1rem; color: var(--color-text-secondary); margin: 0; }
.audio .tx { display: inline-flex; align-items: center; min-height: 44px; color: var(--color-text); font-family: var(--font-ui); }

/* prev / next bar */
.pager {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--color-bg); border-top: 2px solid var(--color-text);
  padding: var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
}
.pager .row { max-width: calc(40rem - 2 * var(--s5)); padding: 0 var(--s1); margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.pager a {
  display: flex; flex-direction: column; justify-content: center; min-height: 56px; padding: var(--s2) var(--s4);
  font-family: var(--font-ui); text-decoration: none; border-radius: var(--radius);
  border: 2px solid var(--color-text); color: var(--color-text); background: var(--color-bg);
  transition: transform 140ms var(--ease-out);
}
.pager a:active { transform: scale(0.97); }
.pager a.next { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); text-align: right; }
.pager a.prev { text-align: left; }
.pager .dir { font-size: 1.125rem; font-weight: 700; line-height: 1.2; }
.pager .nm { font-size: 0.875rem; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pager a.ghost { visibility: hidden; }
.pager a.done { grid-column: 1 / -1; }

.end { text-align: center; padding: var(--s5) 0 0; }
.end a { color: var(--color-accent); font-weight: 700; font-family: var(--font-ui); }

@media (prefers-reduced-motion: no-preference) {
  .view { animation: in 260ms var(--ease-out); }
  @keyframes in { from { opacity: 0; } to { opacity: 1; } }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (min-width: 720px) { :root { --step-body: calc(1.375rem * var(--text-scale)); } }
noscript p { padding: var(--s5); font-family: var(--font-ui); }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="top">
  <div class="wrap">
    <a class="home" href="#/">Salt and Iron</a>
    <div class="size" role="group" aria-label="Text size">
      <button class="s1" type="button" data-size="1" aria-label="Normal text">A</button>
      <button class="s2" type="button" data-size="1.15" aria-label="Larger text">A</button>
      <button class="s3" type="button" data-size="1.3" aria-label="Largest text">A</button>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <noscript><p>This guide needs JavaScript to show the stops. Please turn it on, or ask a member of staff for a printed guide.</p></noscript>
  <div id="view" class="view"></div>
</main>

<script>
/* ---------- Content ----------
   The 12 stops. Replace `text` (about 120 words, one string per paragraph) and
   set `audio` to a file path such as "audio/05-harwick-lady.mp3" for each stop.
   Set `outdoor: true` on quay stops. `sample: true` shows the placeholder note. */
var PLACEHOLDER = [
  "Sample text. The 120-word gallery text for this stop goes here, in the same words as the printed label on the wall.",
  "Keep paragraphs short. Each one appears as its own block of large, high-contrast text, so it reads well on a phone, in daylight or in a dim gallery."
];
var STOPS = [
  { title: "The salt road" },
  { title: "Boiling houses" },
  { title: "The harbour in 1840" },
  { title: "Iron arrives" },
  { title: "The Harwick Lady" },
  { title: "Rivets and riveters" },
  { title: "A ship's salt store" },
  { title: "Smugglers and the excise" },
  { title: "The great storm of 1872" },
  { title: "Women of the quay" },
  { title: "Last of the salt boats" },
  { title: "What remains" }
].map(function (s) {
  return { title: s.title, outdoor: false, audio: null, text: PLACEHOLDER, sample: true };
});

/* ---------- Helpers ---------- */
var view = document.getElementById("view");
var main = document.getElementById("main");
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

function homeView() {
  var items = STOPS.map(function (s, i) {
    return '<li><a href="#/' + (i + 1) + '"><span class="n">' + (i + 1) + '</span><span class="t">' + esc(s.title) +
      (s.outdoor ? '<span class="out">Outdoors, on the quay</span>' : '') + '</span></a></li>';
  }).join("");
  return '<div class="wrap">' +
    '<section class="cover">' +
      '<p class="where">Harwick Maritime Museum · Visitor guide</p>' +
      '<h1>Salt and Iron</h1>' +
      '<p class="dates">14 March to 2 November 2027</p>' +
      '<p class="how">Twelve stops. Scan the code at each stop, or pick one below. Every stop has a short text and an audio clip. Once this page has loaded, you can move between stops without a signal.</p>' +
      '<a class="start" href="#/1">Start at stop 1</a>' +
    '</section>' +
    '<h2 class="list-head">All twelve stops</h2>' +
    '<ol class="stops">' + items + '</ol>' +
    '<section class="practical"><h2>Opening hours and tickets</h2>' +
      '<p>Placeholder: opening hours, ticket prices, access information and contact details will appear here.</p></section>' +
  '</div>';
}

function stopView(n) {
  var s = STOPS[n - 1], prev = STOPS[n - 2], next = STOPS[n];
  var paras = s.text.map(function (t) { return "<p>" + esc(t) + "</p>"; }).join("");
  var audio = s.audio
    ? '<audio controls preload="none" src="' + esc(s.audio) + '">Your browser cannot play this audio.</audio>'
    : '<p class="none">Placeholder: the audio clip for this stop (1 to 3 minutes) will appear here.</p>';
  var pager = '<div class="row">' +
    (prev ? '<a class="prev" href="#/' + (n - 1) + '" rel="prev"><span class="dir">Previous</span><span class="nm">' + (n - 1) + '. ' + esc(prev.title) + '</span></a>'
          : '<a class="prev" href="#/"><span class="dir">All stops</span><span class="nm">Back to the list</span></a>') +
    (next ? '<a class="next" href="#/' + (n + 1) + '" rel="next"><span class="dir">Next</span><span class="nm">' + (n + 1) + '. ' + esc(next.title) + '</span></a>'
          : '<a class="next" href="#/"><span class="dir">Finish</span><span class="nm">Back to all stops</span></a>') +
    '</div>';
  return '<div class="wrap"><article class="stop">' +
    '<div class="label-rule"><span class="num" aria-hidden="true">' + n + '</span><span class="of">Stop ' + n + ' of ' + STOPS.length + '</span></div>' +
    '<h1>' + esc(s.title) + '</h1>' +
    (s.outdoor ? '<p class="badge">Outdoors, on the quay</p>' : '') +
    (s.sample ? '<p class="sample">Sample content. The final text and audio will replace this.</p>' : '') +
    '<div class="body">' + paras + '</div>' +
    '<section class="audio" aria-labelledby="ah"><h2 id="ah">Listen to this stop</h2>' + audio + '</section>' +
    (!next ? '<p class="end"><a href="#/">Thank you for visiting. See all stops</a></p>' : '') +
  '</article></div><nav class="pager" aria-label="Move between stops">' + pager + '</nav>';
}

function route(first) {
  var m = /^#\/(\d+)$/.exec(location.hash), n = m ? parseInt(m[1], 10) : 0;
  var ok = n >= 1 && n <= STOPS.length;
  view.innerHTML = ok ? stopView(n) : homeView();
  document.title = (ok ? STOPS[n - 1].title + " · " : "") + "Salt and Iron · Harwick Maritime Museum";
  window.scrollTo(0, 0);
  if (!first) main.focus({ preventScroll: true });
  // restart the fade
  view.classList.remove("view"); void view.offsetWidth; view.classList.add("view");
}
window.addEventListener("hashchange", function () { route(false); });
document.addEventListener("keydown", function (e) {
  if (e.target.closest && e.target.closest("audio, input, textarea")) return;
  var m = /^#\/(\d+)$/.exec(location.hash); if (!m) return;
  var n = parseInt(m[1], 10);
  if (e.key === "ArrowRight" && n < STOPS.length) location.hash = "#/" + (n + 1);
  if (e.key === "ArrowLeft" && n > 1) location.hash = "#/" + (n - 1);
});

/* ---------- Text size (remembered on this phone) ---------- */
var sizeBtns = document.querySelectorAll(".size button");
function setSize(v, save) {
  document.documentElement.style.setProperty("--text-scale", v);
  sizeBtns.forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.size === String(v)); });
  if (save) { try { localStorage.setItem("si-size", v); } catch (e) {} }
}
sizeBtns.forEach(function (b) { b.addEventListener("click", function () { setSize(b.dataset.size, true); }); });
var saved = "1"; try { saved = localStorage.getItem("si-size") || "1"; } catch (e) {}
setSize(["1", "1.15", "1.3"].indexOf(saved) > -1 ? saved : "1", false);

route(true);
</script>
</body>
</html>
