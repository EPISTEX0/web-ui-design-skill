<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Front desk · Kestrel Physio</title>
<style>
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;

  --neutral-0: #fff;
  --neutral-50: oklch(0.965 0.005 250);
  --neutral-100: oklch(0.94 0.006 250);
  --neutral-200: oklch(0.9 0.006 250);
  --neutral-300: oklch(0.8 0.01 250);
  --neutral-500: oklch(0.52 0.02 250);
  --neutral-600: oklch(0.42 0.02 250);
  --neutral-900: oklch(0.24 0.02 250);
  --accent-700: oklch(0.38 0.09 235);
  --accent-600: oklch(0.46 0.09 235);
  --accent-100: oklch(0.94 0.03 235);
  --amber-bg: oklch(0.96 0.06 85);   --amber-bd: oklch(0.8 0.12 80);   --amber-tx: oklch(0.4 0.09 65);
  --green-bg: oklch(0.95 0.04 160);  --green-bd: oklch(0.75 0.1 160);  --green-tx: oklch(0.37 0.08 160);
  --red-bg: oklch(0.96 0.03 25);     --red-bd: oklch(0.72 0.14 25);    --red-tx: oklch(0.45 0.15 25);

  --color-bg: var(--neutral-50);
  --color-surface: var(--neutral-0);
  --color-sunken: var(--neutral-100);
  --color-border: var(--neutral-200);
  --color-border-strong: var(--neutral-300);
  --color-text: var(--neutral-900);
  --color-text-secondary: var(--neutral-600);
  --color-text-tertiary: var(--neutral-500);
  --color-accent: var(--accent-600);
  --color-accent-hover: var(--accent-700);
  --color-accent-tint: var(--accent-100);
  --color-now: var(--red-tx);

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px;
  --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --t-press: 120ms; --t-menu: 180ms; --t-overlay: 240ms;

  --px-min: 2.4;          /* timeline pixels per minute */
  --label-w: 148px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--color-bg); color: var(--color-text);
  font: 14px/1.5 var(--font); text-wrap: pretty; overflow-x: clip;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
button, input, select { font: inherit; color: inherit; touch-action: manipulation; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

/* buttons */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: 36px; padding: 0 var(--s3); border-radius: var(--r-md); cursor: pointer; white-space: nowrap;
  border: 1px solid var(--color-border-strong); background: var(--color-surface); font-weight: 500;
  transition: background-color var(--t-menu) var(--ease-out), transform var(--t-press) var(--ease-out);
}
.btn::after { content: ""; position: absolute; inset: -4px; }
.btn:active { transform: scale(0.97); }
.btn:disabled { color: var(--color-text-tertiary); background: var(--color-sunken); cursor: not-allowed; transform: none; }
.btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
.btn.small { min-height: 32px; padding: 0 var(--s3); }
@media (hover: hover) {
  .btn:hover:not(:disabled) { background: var(--color-sunken); }
  .btn.primary:hover:not(:disabled) { background: var(--color-accent-hover); }
}

/* shell */
.app { max-width: 1680px; margin: 0 auto; padding: var(--s4); display: grid; gap: var(--s4); }
@media (min-width: 900px) { .app { padding: var(--s6); gap: var(--s5); } }

.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s6); }
.brand { display: flex; align-items: center; gap: var(--s3); margin-right: auto; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-size: 20px; line-height: 1.2; }
.brand p { margin: 0; color: var(--color-text-secondary); font-size: 13px; }
.clock { text-align: right; line-height: 1.2; }
.clock strong { display: block; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
.clock span { font-size: 13px; color: var(--color-text-secondary); }
.tools { display: flex; gap: var(--s2); flex: 1 1 320px; max-width: 520px; min-width: 0; }
.search { position: relative; flex: 1; min-width: 0; }
.search input {
  width: 100%; height: 40px; padding: 0 36px 0 var(--s3); font-size: 16px;
  border: 1px solid var(--color-border-strong); border-radius: var(--r-md); background: var(--color-surface);
}
.search kbd {
  position: absolute; right: var(--s2); top: 50%; translate: 0 -50%; font: 12px var(--font);
  color: var(--color-text-tertiary); border: 1px solid var(--color-border); border-radius: var(--r-sm); padding: 0 6px;
}
.tools .btn { min-height: 40px; }
@media (max-width: 899px) { .tools { flex-basis: 100%; max-width: none; } .search kbd { display: none; } }

/* day summary */
.summary { display: flex; flex-wrap: wrap; margin: 0; padding: 0; list-style: none;
  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--r-lg); }
.summary li { flex: 1 1 120px; padding: var(--s3) var(--s4); border-left: 1px solid var(--color-border); }
.summary li:first-child { border-left: 0; }
.summary b { display: block; font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; }
.summary span { font-size: 13px; color: var(--color-text-secondary); }
@media (max-width: 899px) {
  .summary li { flex-basis: 33.33%; border-top: 1px solid var(--color-border); }
  .summary li:nth-child(-n+3) { border-top: 0; }
  .summary li:nth-child(4) { border-left: 0; }
}

/* main layout */
.main { display: grid; gap: var(--s5); align-items: start; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .main { grid-template-columns: minmax(0, 1fr) 380px; } }
.left { display: grid; gap: var(--s5); min-width: 0; }
.rail { display: grid; gap: var(--s5); }
.panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--r-lg); min-width: 0; }
.panel > header { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); padding: var(--s4) var(--s4) var(--s2); }
.panel h2 { font-size: 16px; }
.panel header small { color: var(--color-text-secondary); font-size: 13px; }

/* queue */
.group { margin: 0; padding: 0; list-style: none; }
.group + .sub { margin-top: var(--s2); }
.sub { margin: 0; padding: var(--s3) var(--s4) var(--s1); font-size: 13px; font-weight: 600; color: var(--color-text-secondary);
  display: flex; justify-content: space-between; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s1) var(--s3); align-items: center;
  padding: var(--s3) var(--s4); border-top: 1px solid var(--color-border); transition: opacity var(--t-menu); }
.row.dim, .blk.dim { opacity: 0.25; }
.who { min-width: 0; }
.who button { all: unset; cursor: pointer; display: block; max-width: 100%; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; border-radius: var(--r-sm); }
@media (hover: hover) { .who button:hover { text-decoration: underline; } }
.meta { color: var(--color-text-secondary); font-size: 13px; }
.chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--s1); }
.chip { font-size: 12px; line-height: 20px; padding: 0 var(--s2); border-radius: var(--r-sm); background: var(--color-sunken); color: var(--color-text-secondary); }
.chip.warn { background: var(--amber-bg); color: var(--amber-tx); }
.chip.bad { background: var(--red-bg); color: var(--red-tx); }
.waited { font-size: 13px; font-weight: 600; color: var(--amber-tx); }
.waited.long { color: var(--red-tx); }
.empty { padding: var(--s4); color: var(--color-text-secondary); border-top: 1px solid var(--color-border); }
.empty b { display: block; color: var(--color-text); }

/* rooms */
.rooms { margin: 0; padding: 0 0 var(--s2); list-style: none; }
.rooms li { display: flex; justify-content: space-between; gap: var(--s3); padding: var(--s2) var(--s4); border-top: 1px solid var(--color-border); }
.rooms li > span:first-child { flex: none; }
.rooms li > span:last-child { color: var(--color-text-secondary); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.rooms .free > span:last-child { color: var(--green-tx); }

/* timeline */
.tl-scroll { overflow-x: auto; overscroll-behavior-x: contain; border-top: 1px solid var(--color-border); border-radius: 0 0 var(--r-lg) var(--r-lg); }
.tl { position: relative; width: calc(var(--label-w) + 540px * var(--px-min)); }
.tl-head, .tl-row { display: grid; grid-template-columns: var(--label-w) 1fr; }
.tl-head { height: 32px; }
.tl-corner, .tl-label { position: sticky; left: 0; z-index: 3; background: var(--color-surface); border-right: 1px solid var(--color-border); }
.tl-hours { position: relative; }
.tl-hours span { position: absolute; top: 8px; font-size: 12px; color: var(--color-text-tertiary); translate: -50% 0; }
.tl-hours span:first-child { translate: 4px 0; }
.tl-row { height: 76px; border-top: 1px solid var(--color-border); }
.tl-label { padding: var(--s3) var(--s3); display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.tl-label b { line-height: 1.25; overflow-wrap: anywhere; }
.tl-label span { font-size: 12px; color: var(--color-text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-track { position: relative;
  background-image: linear-gradient(to right, var(--color-border) 1px, transparent 1px);
  background-size: calc(60px * var(--px-min)) 100%; }
.tl-track::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(to right, var(--color-sunken) 1px, transparent 1px);
  background-size: calc(30px * var(--px-min)) 100%; }
.now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--color-now); z-index: 2; pointer-events: none; }
.now::before { content: attr(data-t); position: absolute; top: 4px; left: 4px; font-size: 12px; font-weight: 600; background: var(--color-now); color: #fff; padding: 0 var(--s1); border-radius: var(--r-sm); translate: -50% 0; left: 1px; }

.blk {
  position: absolute; top: 6px; bottom: 6px; z-index: 1; min-width: 0; text-align: left; cursor: pointer;
  padding: var(--s1) var(--s2); border-radius: var(--r-sm); border: 1px solid var(--color-border-strong); background: var(--color-surface);
  display: flex; flex-direction: column; gap: 0; overflow: hidden; line-height: 1.3; font-size: 13px;
  transition: opacity var(--t-menu), background-color var(--t-menu);
}
.blk:active { transform: scale(0.97); }
.blk .t { font-size: 12px; color: var(--color-text-secondary); white-space: nowrap; }
.blk .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blk .s { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk.waiting { background: var(--amber-bg); border-color: var(--amber-bd); } .blk.waiting .s { color: var(--amber-tx); }
.blk.session { background: var(--green-bg); border-color: var(--green-bd); } .blk.session .s { color: var(--green-tx); }
.blk.late    { background: var(--red-bg);   border-color: var(--red-bd); }   .blk.late .s { color: var(--red-tx); }
.blk.noshow  { background: var(--red-bg);   border-color: var(--red-bd); border-style: dashed; } .blk.noshow .s { color: var(--red-tx); } .blk.noshow .n { text-decoration: line-through; }
.blk.done { background: var(--color-sunken); border-color: var(--color-border); } .blk.done .n { color: var(--color-text-secondary); font-weight: 500; } .blk.done .s { color: var(--color-text-secondary); }
.blk.booked .s { color: var(--color-text-secondary); }
@media (hover: hover) { .blk:hover { border-color: var(--color-accent); } }

.legend { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); padding: var(--s3) var(--s4); border-top: 1px solid var(--color-border); font-size: 13px; color: var(--color-text-secondary); }
.legend i { font-style: normal; font-weight: 700; margin-right: var(--s1); }

/* mobile ordering: queue first, then timeline */
@media (max-width: 1099px) { .rail { order: -1; } :root { --label-w: 104px; } }

/* dialog */
dialog { border: 1px solid var(--color-border); border-radius: var(--r-lg); padding: 0; width: min(440px, calc(100vw - 32px));
  color: var(--color-text); background: var(--color-surface); box-shadow: 0 0 0 1px oklch(0.24 0.02 250 / 0.06), 0 12px 32px oklch(0.24 0.02 250 / 0.18);
  opacity: 0; scale: 0.95; transition: opacity var(--t-overlay) var(--ease-out), scale var(--t-overlay) var(--ease-out), overlay var(--t-overlay) allow-discrete, display var(--t-overlay) allow-discrete; }
dialog[open] { opacity: 1; scale: 1; }
@starting-style { dialog[open] { opacity: 0; scale: 0.95; } }
dialog::backdrop { background: oklch(0.24 0.02 250 / 0.35); }
.dlg-h { padding: var(--s5) var(--s5) var(--s2); }
.dlg-h h2 { font-size: 20px; overflow-wrap: anywhere; }
.dlg-h p { margin: var(--s1) 0 0; color: var(--color-text-secondary); }
.dlg-b { padding: var(--s2) var(--s5) var(--s4); display: grid; gap: var(--s3); }
.dlg-f { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--s2); padding: var(--s3) var(--s5) var(--s5); }
dl.facts { margin: 0; display: grid; grid-template-columns: 96px 1fr; gap: var(--s2) var(--s3); }
dl.facts dt { color: var(--color-text-secondary); } dl.facts dd { margin: 0; overflow-wrap: anywhere; }
.field { display: grid; gap: var(--s1); }
.field label { font-weight: 500; }
.field input, .field select { height: 40px; padding: 0 var(--s3); font-size: 16px; border: 1px solid var(--color-border-strong); border-radius: var(--r-md); background: var(--color-surface); width: 100%; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.err { margin: 0; padding: var(--s2) var(--s3); border-radius: var(--r-md); background: var(--red-bg); color: var(--red-tx); border: 1px solid var(--red-bd); }
.err[hidden] { display: none; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(var(--s6) + env(safe-area-inset-bottom)); translate: -50% 0; z-index: 20;
  display: flex; align-items: center; gap: var(--s4); padding: var(--s2) var(--s2) var(--s2) var(--s4); border-radius: var(--r-md);
  background: var(--color-text); color: #fff; max-width: calc(100vw - 32px);
  transition: opacity var(--t-overlay) var(--ease-out), transform var(--t-overlay) var(--ease-out); }
.toast[hidden] { display: none; }
.toast.out { opacity: 0; transform: translateY(8px); }
.toast .btn { background: transparent; color: #fff; border-color: oklch(1 0 0 / 0.4); min-height: 32px; }
@media (hover: hover) { .toast .btn:hover:not(:disabled) { background: oklch(1 0 0 / 0.14); } }

@media (pointer: coarse) {
  .btn, .btn.small, .tools .btn, .search input, .field input, .field select { min-height: 44px; }
  .who button { padding: 6px 0; }
}
@media (prefers-reduced-motion: reduce) {
  dialog { transition: opacity var(--t-overlay); scale: 1; }
  .btn:active, .blk:active { transform: none; }
  .toast { transition: opacity var(--t-overlay); } .toast.out { transform: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="8" fill="oklch(0.46 0.09 235)"/><path d="M7 22c5-1 8-4 10-9 1 3 3 5 6 6l6-3c-1 5-5 9-11 9-4 0-7-1-11-3z" fill="#fff"/></svg>
      <div><h1>Kestrel Physio</h1><p>Front desk · Riverside clinic</p></div>
    </div>
    <div class="clock" aria-live="off"><strong class="num" id="clock">10:20</strong><span id="dateLabel">Tuesday 20 October</span></div>
    <div class="tools">
      <div class="search">
        <label class="sr" for="q">Search today's patients</label>
        <input id="q" type="search" placeholder="Search patients" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </div>
      <button class="btn primary" id="newBtn" type="button">New booking</button>
    </div>
  </header>

  <ul class="summary num" id="summary" aria-label="Today at a glance"></ul>

  <div class="main">
    <div class="left">
    <section class="panel" aria-labelledby="tlh">
      <header><h2 id="tlh">Today's schedule</h2><small>Sample data</small></header>
      <div class="tl-scroll" id="tlScroll" tabindex="0" role="region" aria-label="Schedule by therapist, scrolls sideways"><div class="tl" id="tl"></div></div>
      <div class="legend" aria-hidden="true">
        <span><i>·</i>Booked</span><span><i>●</i>Waiting</span><span><i>▶</i>In session</span><span><i>✓</i>Done</span><span><i>!</i>Late</span><span><i>✕</i>No-show</span>
      </div>
    </section>
    <section class="panel" aria-labelledby="rh">
      <header><h2 id="rh">Treatment rooms</h2><small id="roomCount"></small></header>
      <ul class="rooms" id="rooms"></ul>
    </section>
    </div>

    <div class="rail">
      <section class="panel" aria-labelledby="qh">
        <header><h2 id="qh">Arrivals</h2><small id="qCount"></small></header>
        <div id="queue"></div>
      </section>
    </div>
  </div>
</div>

<dialog id="detail" aria-labelledby="dTitle"></dialog>

<dialog id="booking" aria-labelledby="bTitle">
  <form method="dialog" id="bookForm" novalidate>
    <div class="dlg-h"><h2 id="bTitle">New booking</h2><p>Today, Tuesday 20 October</p></div>
    <div class="dlg-b">
      <p class="err" id="bErr" role="alert" hidden></p>
      <div class="field"><label for="bName">Patient name</label><input id="bName" name="name" autocomplete="off" required></div>
      <div class="field"><label for="bTh">Therapist</label><select id="bTh" name="th"></select></div>
      <div class="two">
        <div class="field"><label for="bType">Appointment type</label><select id="bType" name="type"></select></div>
        <div class="field"><label for="bTime">Start time</label><input id="bTime" name="time" type="time" min="08:00" max="17:00" step="300" value="12:00" required></div>
      </div>
    </div>
    <div class="dlg-f"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Book appointment</button></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button class="btn" type="button" id="undo">Undo</button></div>

<script>
(() => {
  const DAY_START = 8 * 60, DAY_END = 17 * 60;

  const A = (id, th, name, start, type, status, extra = {}) =>

  let appts = [

    A('a2', 't1', 'Aiko Tanaka', '09:00', 'follow', 'done', { phone: '0431 555 224' }),
    A('a3', 't1', 'Gabriela Soares-Nakamura', '09:45', 'assess', 'session', { room: 'Room 2', phone: '0407 555 380', flags: ['First visit'] }),
    A('a4', 't1', "Liam O'Connell", '11:00', 'follow', 'booked', { phone: '0422 555 671' }),
    A('a5', 't1', 'Fatima Al-Sayed', '13:00', 'rehab', 'booked', { phone: '0415 555 842', flags: ['Copay $30 due'] }),
    A('a6', 't1', 'Jonas Eriksen', '14:30', 'assess', 'booked', { phone: '0438 555 107', flags: ['First visit', 'Intake form missing'] }),

    A('b1', 't2', 'Priscilla Ng', '08:30', 'follow', 'done', { phone: '0411 555 903' }),
    A('b2', 't2', 'Walter Abernathy-Featherstonehaugh Ramírez de la Cruz', '09:30', 'rehab', 'session', { room: 'Room 1', phone: '0429 555 466' }),
    A('b3', 't2', 'Omar Haddad', '10:15', 'follow', 'waiting', { arrivedAt: T('10:08'), phone: '0403 555 718' }),
    A('b4', 't2', 'Beth Callahan', '11:00', 'rehab', 'booked', { phone: '0417 555 290' }),
    A('b5', 't2', 'Yusuf Demir', '15:00', 'follow', 'booked', { phone: '0436 555 054' }),

    A('c1', 't3', 'Margaret Doyle', '08:00', 'assess', 'done', { phone: '0408 555 337' }),
    A('c2', 't3', 'Hiroshi Mori', '09:15', 'rehab', 'session', { room: 'Room 3', phone: '0425 555 612' }),
    A('c3', 't3', 'Elena Petrova', '10:00', 'rehab', 'booked', { phone: '0419 555 745', flags: ['Called ahead: running late'] }),
    A('c4', 't3', 'Samuel Boateng', '11:30', 'assess', 'booked', { phone: '0432 555 189', flags: ['First visit', 'Intake form missing'] }),
    A('c5', 't3', 'Ruth Kowalczyk', '14:00', 'rehab', 'booked', { phone: '0406 555 531' }),

    A('d1', 't4', 'Kevin Park', '08:30', 'follow', 'noshow', { phone: '0413 555 276' }),
    A('d2', 't4', 'Chloe Bernard', '09:00', 'follow', 'done', { phone: '0427 555 948' }),
    A('d3', 't4', 'Noah Fitzgerald', '10:30', 'follow', 'booked', { phone: '0434 555 360' }),
    A('d4', 't4', 'Sofia Marquez', '11:00', 'rehab', 'booked', { phone: '0402 555 825', flags: ['Copay $30 due'] }),
    A('d5', 't4', 'Ibrahim Yusuf', '12:30', 'rehab', 'booked', { phone: '0416 555 493' }),
    A('d6', 't4', 'Mei-Ling Chen', '16:00', 'follow', 'booked', { phone: '0421 555 117' }),
  ];

  // Simulated clock: sample data is anchored to 10:20 and the clock then runs in real time.
  const t0 = performance.now(), base = T('10:20') * 60000;
  const nowMs = () => base + (performance.now() - t0);
  const now = () => Math.floor(nowMs() / 60000);
  const fmt = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const typeOf = a => TYPES.find(t => t.id === a.type);
  const thOf = a => THERAPISTS.find(t => t.id === a.th);
  const dur = a => typeOf(a).dur;
  const isLate = a => a.status === 'booked' && now() > a.start + 5 && now() < a.start + dur(a);
  const state = a => isLate(a) ? 'late' : a.status;
  const LABEL = { booked: 'Booked', waiting: 'Waiting', session: 'In session', done: 'Done', late: 'Late', noshow: 'No-show' };
  const ICON = { booked: '·', waiting: '●', session: '▶', done: '✓', late: '!', noshow: '✕' };
  let query = '';
  const matches = a => !query || (a.name + ' ' + thOf(a).name).toLowerCase().includes(query);

  /* ---------- render ---------- */
  function renderSummary() {
    const c = s => appts.filter(a => a.status === s).length;
    const items = [
      [appts.length, 'Booked today'], [c('waiting'), 'In waiting room'], [c('session'), 'In session'],
      [c('done'), 'Completed'], [appts.filter(isLate).length, 'Running late'], [c('noshow'), 'No-shows'],
    ];
    $('summary').innerHTML = items.map(([n, l]) => `<li><b>${n.toLocaleString()}</b><span>${l}</span></li>`).join('');
  }

  function renderTimeline() {
    const px = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--px-min'));
    let hours = '';
    for (let h = 8; h <= 17; h++) hours += `<span style="left:${(h * 60 - DAY_START) * px}px">${h > 12 ? h - 12 : h}${h >= 12 ? 'pm' : 'am'}</span>`;
    let rows = '';
    for (const th of THERAPISTS) {
      const blocks = appts.filter(a => a.th === th.id).map(a => {
        const s = state(a), w = dur(a) * px - 2;
        return `<button type="button" class="blk ${s} ${matches(a) ? '' : 'dim'}" data-id="${a.id}"
          style="left:${(a.start - DAY_START) * px}px;width:${w}px"
          title="${esc(a.name)} · ${fmt(a.start)} · ${esc(typeOf(a).label)} · ${LABEL[s]}"
          aria-label="${esc(a.name)}, ${fmt(a.start)}, ${esc(typeOf(a).label)}, ${LABEL[s]}">
          <span class="t num">${fmt(a.start)}</span><span class="n">${esc(a.name)}</span><span class="s">${ICON[s]} ${LABEL[s]}</span></button>`;
      }).join('');
      rows += `<div class="tl-row"><div class="tl-label"><b>${esc(th.name)}</b><span>${esc(th.role)}</span></div><div class="tl-track">${blocks}</div></div>`;
    }
    const keep = $('tlScroll').scrollLeft;
    $('tl').innerHTML = `<div class="tl-head"><div class="tl-corner"></div><div class="tl-hours">${hours}</div></div>${rows}<div class="now" id="nowLine"></div>`;
    $('tlScroll').scrollLeft = keep;
    placeNow();
  }
  function placeNow() {
    const px = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--px-min'));
    const labelW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--label-w'));
    const el = $('nowLine'); if (!el) return;
    el.style.left = (labelW + (nowMs() / 60000 - DAY_START) * px) + 'px';
    el.dataset.t = fmt(now());
  }

  const flagChips = a => a.flags.map(f => `<span class="chip ${/missing|late/i.test(f) ? 'warn' : /due/i.test(f) ? 'warn' : ''}">${esc(f)}</span>`).join('');
  function row(a, action, right) {
    return `<li class="row ${matches(a) ? '' : 'dim'}">
      <div class="who"><button type="button" data-id="${a.id}" title="${esc(a.name)}">${esc(a.name)}</button>
        <div class="meta">${right}</div></div>
      ${action}${a.flags.length ? `<div class="chips">${flagChips(a)}</div>` : ''}</li>`;
  }
  function renderQueue() {
    const n = now();
    const waiting = appts.filter(a => a.status === 'waiting').sort((x, y) => x.arrivedAt - y.arrivedAt);
    const soon = appts.filter(a => a.status === 'booked' && a.start <= n + 45 && a.start + dur(a) > n).sort((x, y) => x.start - y.start);
    const free = ROOMS.filter(r => !appts.some(a => a.status === 'session' && a.room === r));
    $('queue').innerHTML =
      `<h3 class="sub"><span>Waiting room</span><span class="num">${waiting.length}</span></h3>` +
      (waiting.length ? `<ul class="group">${waiting.map(a => {
        const w = n - a.arrivedAt;
        return row(a, `<button class="btn small" data-act="start" data-id="${a.id}" ${free.length ? '' : 'disabled title="No free room"'}>Start session</button>`,
          `${esc(thOf(a).name)} · ${fmt(a.start)} <span class="waited num ${w >= 15 ? 'long' : ''}">· waiting ${w} min</span>`);
      }).join('')}</ul>` : `<div class="empty"><b>Nobody waiting</b>Patients appear here once you check them in.</div>`) +
      `<h3 class="sub"><span>Due in the next 45 minutes</span><span class="num">${soon.length}</span></h3>` +
      (soon.length ? `<ul class="group">${soon.map(a => {
        const late = isLate(a);
        return row(a, `<button class="btn small" data-act="checkin" data-id="${a.id}">Check in</button>`,
          `${esc(thOf(a).name)} · ${fmt(a.start)}${late ? ` <span class="waited long num">· ${n - a.start} min late</span>` : ''}`);
      }).join('')}</ul>` : `<div class="empty"><b>No one due soon</b>Use New booking to fit in a walk-in.</div>`);
    $('qCount').textContent = `${waiting.length} waiting · ${soon.length} due`;
  }
  function renderRooms() {
    $('rooms').innerHTML = ROOMS.map(r => {
      const a = appts.find(x => x.status === 'session' && x.room === r);
      return `<li class="${a ? '' : 'free'}"><span>${r}</span><span title="${a ? esc(a.name) : ''}">${a ? `${esc(a.name)} · until ${fmt(a.start + dur(a))}` : 'Free'}</span></li>`;
    }).join('');
    const used = appts.filter(a => a.status === 'session').length;
    $('roomCount').textContent = `${ROOMS.length - used} of ${ROOMS.length} free`;
  }
  function renderAll() { renderSummary(); renderTimeline(); renderQueue(); renderRooms(); }

  /* ---------- actions ---------- */
  let snapshot = null, toastTimer;
  function toast(msg) {
    $('toastMsg').textContent = msg;
    const t = $('toast'); t.hidden = false; t.classList.remove('out');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.classList.add('out'); setTimeout(() => { t.hidden = true; }, 240); }, 6000);
  }
  function apply(id, act) {
    const a = appts.find(x => x.id === id); if (!a) return;
    snapshot = JSON.stringify(appts);
    if (act === 'checkin') { a.status = 'waiting'; a.arrivedAt = now(); toast(`${a.name} checked in`); }
    if (act === 'start') {
      const room = ROOMS.find(r => !appts.some(x => x.status === 'session' && x.room === r));
      if (!room) { toast('No free room. Complete a session first.'); return; }
      a.status = 'session'; a.room = room; toast(`${a.name} sent to ${room}`);
    }
    if (act === 'complete') { a.status = 'done'; delete a.room; toast(`Session completed for ${a.name}`); }
    if (act === 'noshow') { a.status = 'noshow'; toast(`${a.name} marked as no-show`); }
    renderAll();
  }
  $('undo').addEventListener('click', () => {
    if (!snapshot) return;
    appts = JSON.parse(snapshot); snapshot = null; $('toast').hidden = true; renderAll();
  });

  document.addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (act) { const d = $('detail'); if (d.open) d.close(); apply(act.dataset.id, act.dataset.act); return; }
    const open = e.target.closest('.blk, .who button');
    if (open) openDetail(open.dataset.id);
    if (e.target.closest('[data-close]')) e.target.closest('dialog').close();
  });

  function openDetail(id) {
    const a = appts.find(x => x.id === id); if (!a) return;
    const s = state(a), th = thOf(a);
    const actions = {
      booked: `<button class="btn" data-act="noshow" data-id="${a.id}">Mark no-show</button><button class="btn primary" data-act="checkin" data-id="${a.id}">Check in</button>`,
      late: `<button class="btn" data-act="noshow" data-id="${a.id}">Mark no-show</button><button class="btn primary" data-act="checkin" data-id="${a.id}">Check in</button>`,
      waiting: `<button class="btn primary" data-act="start" data-id="${a.id}">Start session</button>`,
      session: `<button class="btn primary" data-act="complete" data-id="${a.id}">Complete session</button>`,
      done: '', noshow: '',
    }[s];
    $('detail').innerHTML = `
      <div class="dlg-h"><h2 id="dTitle">${esc(a.name)}</h2><p>${LABEL[s]} · ${fmt(a.start)}–${fmt(a.start + dur(a))}</p></div>
      <div class="dlg-b"><dl class="facts">
        <dt>Therapist</dt><dd>${esc(th.name)}, ${esc(th.role.toLowerCase())}</dd>
        <dt>Visit</dt><dd>${esc(typeOf(a).label)}, ${dur(a)} min</dd>
        ${a.room ? `<dt>Room</dt><dd>${esc(a.room)}</dd>` : ''}
        <dt>Phone</dt><dd class="num">${esc(a.phone)}</dd>
        <dt>Notes</dt><dd>${a.flags.length ? `<span class="chips">${flagChips(a)}</span>` : 'Nothing outstanding'}</dd>
      </dl></div>
      <div class="dlg-f"><button class="btn" type="button" data-close>Close</button>${actions}</div>`;
    $('detail').showModal();
  }

  /* ---------- booking ---------- */
  $('bTh').innerHTML = THERAPISTS.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
  $('bType').innerHTML = TYPES.map(t => `<option value="${t.id}">${t.label} (${t.dur} min)</option>`).join('');
  $('newBtn').addEventListener('click', () => {
    $('bErr').hidden = true; $('bName').value = '';
    const next = Math.ceil((now() + 5) / 5) * 5; $('bTime').value = fmt(Math.min(next, DAY_END));
    $('booking').showModal(); $('bName').focus();
  });
  $('bookForm').addEventListener('submit', e => {
    const fail = msg => { e.preventDefault(); const b = $('bErr'); b.textContent = msg; b.hidden = false; };
    const name = $('bName').value.trim(), th = $('bTh').value, type = $('bType').value;
    if (!name) return fail('Enter the patient\'s name to book.');
    if (!$('bTime').value) return fail('Choose a start time between 08:00 and 17:00.');
    const start = T($('bTime').value), end = start + TYPES.find(t => t.id === type).dur;
    if (start < DAY_START || start > DAY_END) return fail('Choose a start time between 08:00 and 17:00.');
    const clash = appts.find(a => a.th === th && a.status !== 'noshow' && start < a.start + dur(a) && end > a.start);
    if (clash) return fail(`${thOf(clash).name} is with ${clash.name} from ${fmt(clash.start)} to ${fmt(clash.start + dur(clash))}. Pick another time or therapist.`);
    snapshot = JSON.stringify(appts);
    appts.push({ id: 'n' + Date.now(), th, name, start, type, status: 'booked', flags: ['New booking'], phone: 'Not recorded' });
    renderAll(); toast(`${name} booked at ${fmt(start)}`);
  });

  /* ---------- search, clock ---------- */
  $('q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); renderTimeline(); renderQueue(); });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && !document.querySelector('dialog[open]')) { e.preventDefault(); $('q').focus(); }
  });
  $('dateLabel').textContent = new Date(2026, 9, 20).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  let lastMin = -1;
  function tick() {
    const n = now(); $('clock').textContent = fmt(n); placeNow();
    if (n !== lastMin) { lastMin = n; renderSummary(); renderQueue(); renderTimeline(); }
  }
  renderAll(); tick(); setInterval(tick, 5000);
  const px = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--px-min'));
  $('tlScroll').scrollLeft = Math.max(0, (now() - DAY_START - 75) * px);
})();
</script>
</body>
</html>
