<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Front desk · Kestrel Physio</title>
<style>
:root {
  /* Neutral ramp: slate, the grey-blue of a kestrel's head */
  --slate-50: oklch(0.975 0.006 250);
  --slate-100: oklch(0.95 0.008 250);
  --slate-200: oklch(0.9 0.01 250);
  --slate-300: oklch(0.82 0.014 250);
  --slate-500: oklch(0.55 0.025 255);
  --slate-600: oklch(0.45 0.025 255);
  --slate-900: oklch(0.24 0.025 255);
  /* Accent: deep slate-blue for actions */
  --blue-50: oklch(0.95 0.025 250);
  --blue-200: oklch(0.82 0.06 250);
  --blue-600: oklch(0.46 0.11 250);
  --blue-700: oklch(0.39 0.1 250);
  /* Status: chestnut (the kestrel's back) for late, moss for done */
  --chestnut-50: oklch(0.95 0.035 60);
  --chestnut-600: oklch(0.47 0.12 50);
  --moss-50: oklch(0.95 0.035 155);
  --moss-600: oklch(0.42 0.09 155);

  --color-bg: var(--slate-50);
  --color-surface: #fff;
  --color-text: var(--slate-900);
  --color-text-secondary: var(--slate-600);
  --color-text-tertiary: var(--slate-500);
  --color-border: var(--slate-200);
  --color-border-strong: var(--slate-300);
  --color-accent: var(--blue-600);
  --color-accent-hover: var(--blue-700);
  --color-accent-tint: var(--blue-50);
  --color-late: var(--chestnut-600);
  --color-late-tint: var(--chestnut-50);
  --color-done: var(--moss-600);
  --color-done-tint: var(--moss-50);

  --font: ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px;
  --r-sm: 4px; --r-md: 6px; --r-lg: 10px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --hour: 64px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--color-bg); color: var(--color-text);
  font: 400 17px/1.5 var(--font); overflow-x: clip;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; touch-action: manipulation; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.01em; }
p { text-wrap: pretty; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 2px; border-radius: var(--r-sm); }

/* Buttons */
.btn {
  min-height: 44px; padding: 0 var(--s4); border-radius: var(--r-md);
  border: 1px solid var(--color-border-strong); background: var(--color-surface);
  font-weight: 600; font-size: 16px; cursor: pointer; white-space: nowrap;
  transition: transform 140ms var(--ease-out), background-color 150ms;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
.btn-danger { color: var(--color-late); border-color: var(--color-late); }
@media (hover: hover) {
  .btn:hover { background: var(--slate-100); }
  .btn-primary:hover { background: var(--color-accent-hover); }
}

/* Header */
.top {
  position: sticky; top: 0; z-index: 5; background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  padding: var(--s3) var(--s6); padding-left: max(var(--s6), env(safe-area-inset-left)); padding-right: max(var(--s6), env(safe-area-inset-right));
  display: flex; align-items: center; gap: var(--s6); flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: var(--s3); }
.brand svg { width: 32px; height: 32px; flex: none; }
.brand b { display: block; font-size: 18px; line-height: 1.2; letter-spacing: -0.01em; }
.brand span { font-size: 14px; color: var(--color-text-secondary); }
.clock { margin-left: auto; text-align: right; }
.clock .t { font-size: 28px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; }
.clock .d { font-size: 14px; color: var(--color-text-secondary); }
.open { display: inline-flex; align-items: center; gap: 6px; }
.open::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--color-done); }

/* Layout */
main { padding: var(--s6); padding-left: max(var(--s6), env(safe-area-inset-left)); padding-right: max(var(--s6), env(safe-area-inset-right)); max-width: 1500px; margin: 0 auto; display: grid; gap: var(--s6); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s4); }
.stat { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--r-lg); padding: var(--s4); }
.stat .k { font-size: 14px; color: var(--color-text-secondary); }
.stat .v { font-size: 32px; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; }
.stat .n { font-size: 14px; color: var(--color-text-secondary); }
.stat.warn .v { color: var(--color-late); }
.cols > * { min-width: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--s6); align-items: start; }
.panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--r-lg); }
.panel > header { padding: var(--s4) var(--s4) var(--s3); display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.panel h2 { font-size: 20px; line-height: 1.3; }
.sub { font-size: 14px; color: var(--color-text-secondary); }

/* Next up */
.next { margin: 0 var(--s4) var(--s4); padding: var(--s4); border-radius: var(--r-md); background: var(--color-accent-tint); border: 1px solid var(--blue-200); display: grid; gap: var(--s3); }
.next .lab { font-size: 14px; font-weight: 600; color: var(--color-accent-hover); }
.next .who { font-size: 22px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.next .meta { font-size: 15px; color: var(--color-text-secondary); }
.next .row { display: flex; gap: var(--s2); flex-wrap: wrap; }

/* Toolbar */
.tools { padding: 0 var(--s4) var(--s3); display: grid; gap: var(--s3); }
.search { position: relative; }
.search input { width: 100%; min-height: 44px; padding: 0 var(--s3); border: 1px solid var(--color-border-strong); border-radius: var(--r-md); background: var(--color-surface); }
.search input::placeholder { color: var(--color-text-tertiary); }
.seg { display: flex; gap: var(--s1); overflow-x: auto; padding: 2px; scrollbar-width: none; }
.seg button { min-height: 44px; padding: 0 var(--s3); border: 1px solid transparent; border-radius: var(--r-md); background: none; cursor: pointer; font-size: 16px; color: var(--color-text-secondary); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--slate-900); color: #fff; }
.seg .c { margin-left: 6px; font-size: 14px; opacity: 0.85; }
@media (hover: hover) { .seg button[aria-pressed="false"]:hover { background: var(--slate-100); } }

/* Queue */
.queue { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--color-border); }
.queue li { border-bottom: 1px solid var(--color-border); }
.queue li:last-child { border-bottom: 0; }
.item { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: var(--s3); align-items: center; padding: var(--s3) var(--s4); }
.item .time { font-weight: 600; font-size: 16px; }
.item .time small { display: block; font-weight: 400; font-size: 13px; color: var(--color-text-secondary); }
.open-btn { all: unset; display: block; cursor: pointer; min-width: 0; padding: 2px; border-radius: var(--r-sm); }
.open-btn:focus-visible { outline: 3px solid var(--color-accent); }
.item .name { font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
.item .what { font-size: 15px; color: var(--color-text-secondary); overflow-wrap: anywhere; line-height: 1.35; }
.item .acts { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.item.is-done .name, .item.is-done .time { color: var(--color-text-secondary); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--slate-100); color: var(--color-text-secondary); white-space: nowrap; }
.chip svg { width: 12px; height: 12px; }
.chip.waiting { background: var(--color-accent-tint); color: var(--color-accent-hover); }
.chip.late, .chip.noshow { background: var(--color-late-tint); color: var(--color-late); }
.chip.done { background: var(--color-done-tint); color: var(--color-done); }
.bal { display: inline-block; margin-top: 2px; font-size: 14px; font-weight: 600; color: var(--color-late); }
.empty { padding: var(--s8) var(--s4); text-align: center; color: var(--color-text-secondary); }
.empty b { display: block; color: var(--color-text); font-size: 18px; margin-bottom: 4px; }
.empty .btn { margin-top: var(--s3); }

/* Timeline: one lane per practitioner */
.tl-scroll { overflow-x: auto; padding: 0 var(--s4) var(--s4); }
.tl { display: grid; grid-template-columns: 44px repeat(4, minmax(130px, 1fr)); min-width: 640px; }
.tl .head { position: sticky; top: 0; font-size: 14px; font-weight: 600; padding: 0 var(--s2) var(--s2); line-height: 1.25; background: var(--color-surface); }
.tl .head span { display: block; font-weight: 400; color: var(--color-text-secondary); }
.hours { position: relative; height: calc(var(--hour) * 10); }
.hours i { position: absolute; left: 0; font-style: normal; font-size: 13px; color: var(--color-text-secondary); transform: translateY(-9px); }
.lane { position: relative; height: calc(var(--hour) * 10); border-left: 1px solid var(--color-border);
  background-image: linear-gradient(var(--color-border) 1px, transparent 1px); background-size: 100% var(--hour); }
.slot { position: absolute; left: 3px; right: 3px; padding: 2px 6px; overflow: hidden; text-align: left; border-radius: var(--r-sm);
  border: 1px solid var(--color-border-strong); border-left: 4px solid var(--slate-500); background: var(--color-surface); cursor: pointer; font-size: 13px; line-height: 1.25; }
.slot b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot span { display: block; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot.waiting { border-left-color: var(--color-accent); background: var(--color-accent-tint); }
.slot.inroom { border-left-color: var(--color-accent); background: var(--blue-200); }
.slot.inroom span { color: var(--color-text); }
.slot.done { border-left-color: var(--color-done); background: var(--slate-100); }
.slot.late, .slot.noshow { border-left-color: var(--color-late); background: var(--color-late-tint); }
.slot.noshow b { text-decoration: line-through; }
.slot.sel { outline: 3px solid var(--color-accent); outline-offset: 1px; }
.nowline { position: absolute; left: 0; right: 0; height: 2px; background: var(--color-late); z-index: 2; pointer-events: none; }
.nowline::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--color-late); }
.legend { display: flex; gap: var(--s4); flex-wrap: wrap; font-size: 14px; color: var(--color-text-secondary); padding: 0 var(--s4) var(--s3); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; border: 1px solid var(--color-border-strong); }

/* Detail sheet */
dialog.sheet { border: 0; padding: 0; margin: 0 0 0 auto; height: 100dvh; max-height: none; width: min(440px, 100%); background: var(--color-surface); color: var(--color-text);
  box-shadow: 0 0 0 1px oklch(0.24 0.025 255 / 0.1), -12px 0 40px oklch(0.24 0.025 255 / 0.15); overflow-y: auto; }
dialog.sheet[open] { animation: slide 250ms var(--ease-out); }
dialog.sheet::backdrop { background: oklch(0.24 0.025 255 / 0.35); }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
.sheet-in { padding: var(--s6); padding-bottom: max(var(--s6), env(safe-area-inset-bottom)); display: grid; gap: var(--s5); }
.sheet-top { display: flex; justify-content: space-between; align-items: start; gap: var(--s3); }
.sheet h2 { font-size: 24px; line-height: 1.25; overflow-wrap: anywhere; }
.x { min-width: 44px; min-height: 44px; border: 0; background: none; cursor: pointer; font-size: 24px; border-radius: var(--r-md); }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: var(--s2) var(--s4); }
dt { color: var(--color-text-secondary); font-size: 15px; }
dd { margin: 0; overflow-wrap: anywhere; }
.flags { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.flags li { padding: var(--s2) var(--s3); border-radius: var(--r-md); background: var(--color-late-tint); color: var(--color-late); font-weight: 600; font-size: 15px; }
.flags li.info { background: var(--slate-100); color: var(--color-text-secondary); font-weight: 400; }
.actions { display: grid; gap: var(--s2); }
.actions .btn { width: 100%; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: max(var(--s6), env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20; background: var(--slate-900); color: #fff; border-radius: var(--r-md); padding: var(--s2) var(--s2) var(--s2) var(--s4); display: flex; gap: var(--s3); align-items: center; max-width: calc(100vw - 32px); }
.toast[hidden] { display: none; }
.toast button { min-height: 44px; padding: 0 var(--s3); border: 0; border-radius: var(--r-sm); background: oklch(1 0 0 / 0.14); color: #fff; font-weight: 600; cursor: pointer; }

@media (max-width: 1180px) { .cols { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) {
  .cols > section:last-child { display: none; }
  main { padding: var(--s4); gap: var(--s4); }
  .top { padding: var(--s3) var(--s4); gap: var(--s3); }
  .item { grid-template-columns: 1fr auto; }
  .item .time { grid-column: 1 / -1; display: flex; gap: var(--s2); align-items: baseline; }
  .item .time small { display: inline; }
  .stat .v { font-size: 28px; }
  .sheet-in { padding: var(--s4); }
}
@media (prefers-reduced-motion: reduce) {
  dialog.sheet[open] { animation: none; }
  .btn { transition: none; }
}
</style>
</head>

<header class="top">
  <div class="brand">

<main>

      <div class="tl-scroll"><div class="tl" id="tl"></div></div>

</main>

<dialog class="sheet" id="sheet" aria-labelledby="sh"></dialog>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button type="button" id="undo">Undo</button></div>

  { id: 23, p: 'to', start: T(16, 30), dur: 60, name: '李小龍 (Lee Xiaolong)', type: 'Follow-up · elbow', status: 'booked', bal: 0, room: 'Room 3', phone: '07700 900379' }
];
const byId = id => appts.find(a => a.id === id);
const prac = id => PRACS.find(p => p.id === id);

/* Demo clock: starts at 10:42 and runs in real time. */
const clockStart = Date.now(), clockOffset = T(10, 42) * 60000;
const nowMin = () => Math.floor((Date.now() - clockStart + clockOffset) / 60000);
const fmt = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const money = v => '£' + v.toFixed(2);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const first = n => n.split(' ')[0];

const state = { filter: 'all', q: '', selected: null };
const FILTERS = [['all', 'All'], ['todo', 'To check in'], ['waiting', 'Waiting'], ['inroom', 'In session'], ['done', 'Done']];
const hashRead = () => { const h = new URLSearchParams(location.hash.slice(1)); state.filter = FILTERS.some(f => f[0] === h.get('f')) ? h.get('f') : 'all'; state.q = h.get('q') || ''; };
const hashWrite = () => { const h = new URLSearchParams(); if (state.filter !== 'all') h.set('f', state.filter); if (state.q) h.set('q', state.q); history.replaceState(null, '', '#' + h); };

const isLate = a => a.status === 'booked' && a.start + 5 <= nowMin();
const kind = a => isLate(a) ? 'late' : a.status;
const LABEL = { booked: 'Booked', late: 'Late', waiting: 'Checked in', inroom: 'In session', done: 'Done', noshow: 'No-show' };
const ICON = {
  booked: '<circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="2"/>',
  late: '<path d="M6 1l5.5 10h-11z" fill="currentColor"/>',
  waiting: '<circle cx="6" cy="6" r="5" fill="currentColor"/>',
  inroom: '<path d="M2 2h8v8H2z" fill="currentColor"/>',
  done: '<path d="M2 6.5l2.7 2.7L10 3.5" fill="none" stroke="currentColor" stroke-width="2"/>',
  noshow: '<path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="2"/>'
};
const chip = a => { const k = kind(a); return `<span class="chip ${k}"><svg viewBox="0 0 12 12" aria-hidden="true">${ICON[k]}</svg>${LABEL[k]}</span>`; };
const isTodo = a => a.status === 'booked';
const matches = a => {
  const q = state.q.trim().toLowerCase();
  if (q && !(a.name + ' ' + prac(a.p).name).toLowerCase().includes(q)) return false;
  const f = state.filter;
  return f === 'all' || (f === 'todo' && isTodo(a)) || (f === 'waiting' && a.status === 'waiting') || (f === 'inroom' && a.status === 'inroom') || (f === 'done' && (a.status === 'done' || a.status === 'noshow'));
};

/* Actions */
let lastUndo = null, toastTimer;
function toast(msg, snapshot) {
  lastUndo = snapshot; document.getElementById('toastMsg').textContent = msg;
  const t = document.getElementById('toast'); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; lastUndo = null; }, 8000);
}
function act(id, what) {
  const a = byId(id), before = { ...a }, nm = a.name.length > 28 ? first(a.name) : a.name;
  if (what === 'checkin') { a.status = 'waiting'; a.since = nowMin(); toast(`${nm} checked in. ${prac(a.p).name.split(' ')[0]} has been told.`, before); }
  if (what === 'start') { a.status = 'inroom'; toast(`${nm} is in session.`, before); }
  if (what === 'finish') { a.status = 'done'; toast(`${nm} marked done.`, before); }
  if (what === 'noshow') { a.status = 'noshow'; toast(`${nm} marked as a no-show.`, before); }
  if (what === 'pay') { const v = a.bal; a.bal = 0; toast(`${money(v)} received from ${nm}.`, before); }
  render();
}
document.getElementById('undo').onclick = () => {
  if (!lastUndo) return; Object.assign(byId(lastUndo.id), lastUndo); lastUndo = null;
  document.getElementById('toast').hidden = true; render();
};

/* Render */
function renderStats() {
  const n = nowMin();
  const waiting = appts.filter(a => a.status === 'waiting');
  const longest = waiting.length ? Math.max(...waiting.map(a => n - a.since)) : 0;
  const hour = appts.filter(a => a.status === 'booked' && a.start > n - 5 && a.start <= n + 60).length;
  const late = appts.filter(isLate).length;
  const owed = appts.reduce((s, a) => s + a.bal, 0), owing = appts.filter(a => a.bal).length;
  const left = appts.filter(a => a.status === 'booked').length;
  const cards = [
    ['Waiting now', waiting.length, waiting.length ? `Longest wait ${longest} min` : 'Nobody waiting', ''],
    ['Due in the next hour', hour, `${left} still to arrive today`, ''],
    ['Running late', late, late ? 'Not arrived yet' : 'Everyone is on time', late ? 'warn' : ''],
    ['To collect', money(owed), `${owing} ${owing === 1 ? 'patient' : 'patients'} with a balance`, owed ? 'warn' : '']
  ];
  document.getElementById('stats').innerHTML = cards.map(c => `<div class="stat ${c[3]}"><div class="k">${c[0]}</div><div class="v num">${c[1]}</div><div class="n">${c[2]}</div></div>`).join('');
}
function renderNext() {
  const n = nowMin();
  const a = appts.filter(isTodo).sort((x, y) => x.start - y.start)[0];
  const el = document.getElementById('next');
  if (!a) { el.innerHTML = ''; return; }
  const diff = a.start - n;
  const when = diff > 0 ? `Due in ${diff} min` : diff === 0 ? 'Due now' : `${-diff} min late`;
  el.innerHTML = `<div class="next"><div><div class="lab">Next to arrive · ${when}</div>
    <div class="who">${esc(a.name)}</div>
    <div class="meta num">${fmt(a.start)} · ${esc(a.type)} · ${esc(prac(a.p).name)}, ${a.room}</div></div>
    <div class="row"><button class="btn btn-primary" data-act="checkin" data-id="${a.id}">Check in ${esc(a.name.length > 20 ? first(a.name) : a.name)}</button>
    <button class="btn" data-open="${a.id}">Details</button></div></div>`;
}
function renderSeg() {
  document.getElementById('seg').innerHTML = FILTERS.map(([k, l]) => {
    const c = appts.filter(a => { const s = state.filter; state.filter = k; const r = matches(a); state.filter = s; return r; }).length;
    return `<button type="button" data-f="${k}" aria-pressed="${state.filter === k}">${l}<span class="c num">${c}</span></button>`;
  }).join('');
}
function actionFor(a) {
  if (a.status === 'booked') return `<button class="btn" data-act="checkin" data-id="${a.id}">Check in</button>`;
  if (a.status === 'waiting') return `<button class="btn" data-act="start" data-id="${a.id}">Send through</button>`;
  if (a.status === 'inroom') return `<button class="btn" data-act="finish" data-id="${a.id}">Finish</button>`;
  if (a.bal) return `<button class="btn" data-act="pay" data-id="${a.id}">Take ${money(a.bal)}</button>`;
  return '';
}
function renderQueue() {
  const n = nowMin();
  let list = appts.filter(matches);
  const rank = { waiting: 0, inroom: 1, booked: 2, done: 3, noshow: 3 };
  list.sort((x, y) => (state.filter === 'all' ? rank[x.status] - rank[y.status] : 0) || x.start - y.start);
  const ul = document.getElementById('queue');
  if (!list.length) {
    const filtered = state.q || state.filter !== 'all';
    ul.innerHTML = `<li class="empty"><b>${state.q ? 'No match for “' + esc(state.q) + '”' : 'Nothing here'}</b>${filtered ? 'Clear the search or filter to see all 23 appointments.' : ''}<br>${filtered ? '<button class="btn" data-clear>Show all appointments</button>' : ''}</li>`;
    return;
  }
  ul.innerHTML = list.map(a => {
    const sub = a.status === 'waiting' ? `Waiting ${n - a.since} min` : '';
    return `<li><div class="item ${a.status === 'done' || a.status === 'noshow' ? 'is-done' : ''}">
      <div class="time num">${fmt(a.start)}<small>${sub || a.dur + ' min'}</small></div>
      <button class="open-btn" data-open="${a.id}" aria-label="Open details for ${esc(a.name)}">
        <div class="name">${esc(a.name)}</div>
        <div class="what">${esc(a.type)} · ${esc(prac(a.p).name)}</div>
        ${a.bal && a.status !== 'booked' ? `<span class="bal num">Owes ${money(a.bal)}</span>` : ''}
      </button>
      <div class="acts">${chip(a)}${actionFor(a)}</div></div></li>`;
  }).join('');
}
function renderTimeline() {
  const n = nowMin(), tl = document.getElementById('tl'), H = DAY_END - DAY_START;
  let html = '<div class="head"></div>' + PRACS.map(p => `<div class="head">${p.name}<span>${p.role}</span></div>`).join('');
  html += '<div class="hours">' + Array.from({ length: H }, (_, i) => `<i class="num" style="top:${i * 64}px">${String(DAY_START + i).padStart(2, '0')}:00</i>`).join('') + '</div>';
  const y = m => (m - DAY_START * 60) / 60 * 64;
  html += PRACS.map(p => '<div class="lane">' + appts.filter(a => a.p === p.id).map(a => {
    const h = a.dur / 60 * 64 - 2, k = kind(a);
    return `<button class="slot ${k} ${state.selected === a.id ? 'sel' : ''}" style="top:${y(a.start) + 1}px;height:${h}px" data-open="${a.id}" aria-label="${fmt(a.start)} ${esc(a.name)}, ${LABEL[k]}"><b>${fmt(a.start)} ${esc(a.name)}</b>${h > 40 ? `<span>${esc(a.type)}</span>` : ''}</button>`;
  }).join('') + (n >= DAY_START * 60 && n <= DAY_END * 60 ? `<div class="nowline" style="top:${y(n)}px"></div>` : '') + '</div>').join('');
  tl.innerHTML = html;
}
function render() {
  const q = document.getElementById('q'); if (q.value !== state.q) q.value = state.q;
  renderStats(); renderNext(); renderSeg(); renderQueue(); renderTimeline(); hashWrite();
  if (document.getElementById('sheet').open) fillSheet();
}
function tick() {
  const n = nowMin();
  document.getElementById('clock').textContent = fmt(n);
}

/* Detail sheet */
const sheet = document.getElementById('sheet');
function fillSheet() {
  const a = byId(state.selected); if (!a) return;
  const flags = [...(a.flags || [])].filter(f => !(f.startsWith('Late by') && a.status !== 'booked'));
  if (a.bal && !flags.some(f => f.includes('Balance'))) flags.push(`Balance of ${money(a.bal)}`);
  const btns = [];
  if (a.status === 'booked') btns.push(`<button class="btn btn-primary" data-act="checkin" data-id="${a.id}">Check in</button><button class="btn btn-danger" data-act="noshow" data-id="${a.id}">Mark as no-show</button>`);
  if (a.status === 'waiting') btns.push(`<button class="btn btn-primary" data-act="start" data-id="${a.id}">Send through to ${a.room}</button>`);
  if (a.status === 'inroom') btns.push(`<button class="btn btn-primary" data-act="finish" data-id="${a.id}">Finish session</button>`);
  if (a.bal && a.status !== 'booked') btns.push(`<button class="btn ${a.status === 'done' ? 'btn-primary' : ''}" data-act="pay" data-id="${a.id}">Take ${money(a.bal)} payment</button>`);
  btns.push(`<a class="btn" style="display:grid;place-items:center;text-decoration:none" href="tel:${a.phone.replace(/\s/g, '')}">Call ${a.phone}</a>`);
  sheet.innerHTML = `<div class="sheet-in">
    <div class="sheet-top"><div><div style="margin-bottom:8px">${chip(a)}</div><h2 id="sh">${esc(a.name)}</h2></div>
    <button class="x" data-close aria-label="Close details">×</button></div>
    ${flags.length ? '<ul class="flags">' + flags.map(f => `<li>${esc(f)}</li>`).join('') + '</ul>' : '<ul class="flags"><li class="info">Nothing needs doing for this patient.</li></ul>'}
    <dl><dt>Time</dt><dd class="num">${fmt(a.start)}–${fmt(a.start + a.dur)} (${a.dur} min)</dd>
    <dt>Visit</dt><dd>${esc(a.type)}</dd>
    <dt>With</dt><dd>${esc(prac(a.p).name)}, ${a.room}</dd>
    ${a.status === 'waiting' ? `<dt>Waiting</dt><dd class="num">${nowMin() - a.since} min since ${fmt(a.since)}</dd>` : ''}
    <dt>Phone</dt><dd class="num">${a.phone}</dd></dl>
    <div class="actions">${btns.join('')}</div></div>`;
}
function openSheet(id) { state.selected = id; fillSheet(); if (!sheet.open) sheet.showModal(); renderTimeline(); }
sheet.addEventListener('close', () => { state.selected = null; renderTimeline(); });
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });

/* Events */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-open],[data-f],[data-clear],[data-close]'); if (!t) return;
  if (t.dataset.act) { act(+t.dataset.id, t.dataset.act); return; }
  if (t.dataset.open) { openSheet(+t.dataset.open); return; }
  if (t.dataset.f) { state.filter = t.dataset.f; render(); return; }
  if (t.hasAttribute('data-clear')) { state.filter = 'all'; state.q = ''; render(); return; }
  if (t.hasAttribute('data-close')) sheet.close();
});
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });
window.addEventListener('hashchange', () => { hashRead(); render(); });

document.getElementById('date').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
hashRead(); tick(); render();
setInterval(() => { tick(); render(); }, 30000);
</script>
</body>
</html>
