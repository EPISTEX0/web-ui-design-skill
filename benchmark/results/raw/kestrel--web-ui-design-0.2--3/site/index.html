<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Front desk · Kestrel Physio</title>
<style>
:root {
  --slate-50: oklch(0.965 0.005 250);
  --slate-0: oklch(0.995 0.002 250);
  --slate-100: oklch(0.94 0.006 250);
  --slate-200: oklch(0.90 0.006 250);
  --slate-300: oklch(0.80 0.01 250);
  --slate-500: oklch(0.50 0.02 255);
  --slate-600: oklch(0.40 0.02 255);
  --slate-900: oklch(0.22 0.02 255);
  --chestnut-500: oklch(0.50 0.13 45);
  --chestnut-600: oklch(0.43 0.12 45);
  --chestnut-100: oklch(0.94 0.03 55);
  --green-700: oklch(0.42 0.10 155);
  --green-100: oklch(0.95 0.04 155);
  --green-500: oklch(0.62 0.14 155);
  --teal-700: oklch(0.42 0.10 230);
  --teal-100: oklch(0.94 0.035 230);
  --teal-500: oklch(0.58 0.12 230);
  --red-700: oklch(0.46 0.16 22);
  --red-100: oklch(0.95 0.03 22);
  --red-500: oklch(0.60 0.18 22);

  --color-bg: var(--slate-50);
  --color-surface: var(--slate-0);
  --color-surface-sunk: var(--slate-100);
  --color-border: var(--slate-200);
  --color-border-strong: var(--slate-300);
  --color-text: var(--slate-900);
  --color-text-secondary: var(--slate-600);
  --color-text-tertiary: var(--slate-500);
  --color-accent: var(--chestnut-500);
  --color-accent-hover: var(--chestnut-600);
  --color-accent-soft: var(--chestnut-100);
  --color-focus: oklch(0.55 0.17 255);

  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--color-bg); color: var(--color-text);
  font: 400 16px/1.5 var(--font); overflow-x: clip;
  -webkit-tap-highlight-color: transparent;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
h1, h2, h3, p { margin: 0; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Buttons */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 36px; padding: 4px 16px; border-radius: var(--r-md);
  border: 1px solid var(--color-border-strong); background: var(--color-surface);
  font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background-color 150ms, border-color 150ms, transform 120ms var(--ease-out);
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn.sm { min-height: 32px; padding: 2px 12px; font-size: 13px; }
.btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
.btn.danger { color: var(--red-700); }
.btn.ghost { border-color: transparent; background: transparent; }
@media (hover: hover) {
  .btn:hover:not(:disabled) { background: var(--color-surface-sunk); }
  .btn.primary:hover:not(:disabled) { background: var(--color-accent-hover); border-color: var(--color-accent-hover); }
}
@media (pointer: coarse) {
  .btn, .btn.sm { min-height: 44px; }
  input, select { min-height: 44px; }
}

/* Top bar */
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
  padding: 16px 24px; background: var(--color-surface); border-bottom: 1px solid var(--color-border);
}
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.brand svg { flex: none; }
.brand h1 { font-size: 20px; line-height: 1.2; font-weight: 650; letter-spacing: -0.01em; }
.brand p { font-size: 13px; color: var(--color-text-secondary); }
.clock { text-align: right; }
.clock .time { font-size: 24px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; }
.clock .date { font-size: 13px; color: var(--color-text-secondary); }
.search { position: relative; flex: 0 1 280px; min-width: 200px; }
.search input {
  width: 100%; min-height: 36px; padding: 4px 12px 4px 36px; font-size: 16px;
  border: 1px solid var(--color-border-strong); border-radius: var(--r-md); background: var(--color-surface);
}
.search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; pointer-events: none; color: var(--color-text-tertiary); }
.search input::placeholder { color: var(--color-text-tertiary); }

/* Summary strip */
.summary {
  display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 16px 24px 0;
  max-width: 1600px; margin: 0 auto;
}
.summary div { display: flex; align-items: baseline; gap: 8px; }
.summary strong { font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; }
.summary span { font-size: 14px; color: var(--color-text-secondary); }

/* Layout */
.layout {
  display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px;
  padding: 16px 24px 32px; max-width: 1600px; margin: 0 auto; align-items: start;
}
.panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--r-lg); }
.panel > header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--color-border);
}
.panel h2 { font-size: 16px; font-weight: 600; letter-spacing: -0.005em; }
.panel .count { font-size: 13px; color: var(--color-text-secondary); }
.side { display: grid; gap: 16px; }

/* Timeline (signature) */
.tl-scroll { overflow-x: auto; }
.tl { --px: 1px; display: grid; grid-template-columns: 52px repeat(4, minmax(176px, 1fr)); min-width: 780px; }
.tl-head { display: contents; }
.tl-head > div {
  padding: 12px 8px; border-bottom: 1px solid var(--color-border); min-width: 0;
}
.tl-head .who { font-size: 14px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-head .role { font-size: 12px; color: var(--color-text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-head .corner, .tl-time { position: sticky; left: 0; background: var(--color-surface); z-index: 3; }
.tl-time { height: 600px; position: sticky; border-right: 1px solid var(--color-border); }
.tl-time span { position: absolute; right: 8px; font-size: 12px; color: var(--color-text-tertiary); translate: 0 -50%; }
.tl-time span:first-child { translate: 0 0; }
.tl-col { position: relative; height: 600px; border-left: 1px solid var(--color-border); min-width: 0;
  background: repeating-linear-gradient(to bottom, transparent 0, transparent 59px, var(--color-border) 59px, var(--color-border) 60px); }
.tl-col.past::before { content: ""; position: absolute; inset: 0 0 auto 0; height: var(--past, 0px); background: color-mix(in oklch, var(--color-surface-sunk) 55%, transparent); pointer-events: none; }
.now-line { position: absolute; left: 52px; right: 0; height: 0; border-top: 2px solid var(--red-500); z-index: 1; pointer-events: none; }
.now-line span {
  position: absolute; left: 0; top: -10px; translate: -100% 0; z-index: 4; background: var(--red-700); color: #fff;
  font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 6px; border-radius: var(--r-sm);
}
.tl-wrap { position: relative; isolation: isolate; min-width: 780px; }

.appt {
  position: absolute; left: 4px; right: 4px; overflow: hidden; text-align: left;
  padding: 4px 8px 4px 12px; border-radius: var(--r-md); border: 1px solid var(--bd, var(--color-border));
  background: var(--bg, var(--color-surface)); color: var(--color-text); cursor: pointer;
  display: flex; flex-direction: column; gap: 0; line-height: 1.25; min-width: 0; z-index: 2;
  transition: opacity 150ms, border-color 150ms, transform 120ms var(--ease-out);
}
.appt::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--bar, var(--slate-300)); }
.appt:active { transform: scale(0.98); }
.appt .nm { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.appt .meta { font-size: 12px; color: var(--color-text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.appt .st { font-size: 12px; font-weight: 600; color: var(--fg, var(--color-text-secondary)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.appt .ln { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.appt .gl { flex: none; font-size: 12px; font-weight: 700; color: var(--fg, var(--color-text-secondary)); }
.appt.roomy .gl { display: none; }
.appt:not(.roomy) .st, .appt.tight .meta { display: none; }
.appt.tight { justify-content: center; padding-block: 0; }
.appt.dim { opacity: 0.25; }
.appt.hit { outline: 2px solid var(--color-focus); outline-offset: 1px; z-index: 1; }
@media (hover: hover) { .appt:hover { border-color: var(--color-text-tertiary); } }

/* status tokens */
[data-s="booked"]    { --bar: var(--slate-300); --fg: var(--color-text-secondary); }
[data-s="late"]      { --bar: var(--red-500); --bg: var(--red-100); --bd: oklch(0.85 0.06 22); --fg: var(--red-700); }
[data-s="arrived"]   { --bar: var(--green-500); --bg: var(--green-100); --bd: oklch(0.84 0.07 155); --fg: var(--green-700); }
[data-s="session"]   { --bar: var(--teal-500); --bg: var(--teal-100); --bd: oklch(0.84 0.06 230); --fg: var(--teal-700); }
[data-s="done"]      { --bar: var(--slate-300); --bg: var(--color-surface-sunk); --fg: var(--color-text-secondary); }
[data-s="noshow"]    { --bar: var(--red-500); --bg: var(--color-surface); --bd: oklch(0.85 0.06 22); --fg: var(--red-700); }
[data-s="noshow"] .nm { text-decoration: line-through; text-decoration-thickness: 1px; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--fg, var(--color-text-secondary)); }

/* Queue lists */
.list { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--color-border); }
.row:first-child { border-top: 0; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  background: var(--color-surface-sunk); color: var(--color-text-secondary); font-size: 13px; font-weight: 600;
  box-shadow: inset 0 0 0 1px oklch(0 0 0 / 0.1);
}
.row .nm { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { font-size: 13px; color: var(--color-text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .info { min-width: 0; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.row .acts { display: grid; justify-items: end; gap: 4px; }
.wait { font-size: 12px; font-weight: 600; color: var(--green-700); }
.wait.long { color: var(--red-700); }
.flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.flag { font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: 10px; background: var(--color-accent-soft); color: var(--chestnut-600); font-weight: 500; white-space: nowrap; }
.empty { padding: 24px 16px; text-align: center; color: var(--color-text-secondary); font-size: 14px; }
.empty strong { display: block; color: var(--color-text); font-size: 14px; margin-bottom: 4px; }

/* Dialog */
dialog { border: 1px solid var(--color-border); border-radius: var(--r-lg); padding: 0; width: min(440px, calc(100vw - 32px)); color: var(--color-text); background: var(--color-surface); box-shadow: 0 0 0 1px oklch(0 0 0 / 0.04), 0 16px 48px oklch(0.2 0.02 255 / 0.2); }
dialog::backdrop { background: oklch(0.2 0.02 255 / 0.4); }
dialog[open] { animation: pop 220ms var(--ease-out); }
@keyframes pop { from { opacity: 0; transform: scale(0.95); } }
.dlg-body { padding: 20px; display: grid; gap: 16px; }
.dlg-body h2 { font-size: 20px; letter-spacing: -0.01em; line-height: 1.25; overflow-wrap: anywhere; }
.dlg-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--color-border); background: var(--color-bg); border-radius: 0 0 var(--r-lg) var(--r-lg); }
dl { display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; margin: 0; font-size: 14px; }
dt { color: var(--color-text-secondary); }
dd { margin: 0; overflow-wrap: anywhere; }
label { display: grid; gap: 4px; font-size: 14px; font-weight: 500; }
label input, label select { padding: 4px 12px; min-height: 36px; font-size: 16px; font-weight: 400; border: 1px solid var(--color-border-strong); border-radius: var(--r-md); background: var(--color-surface); width: 100%; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.err { color: var(--red-700); font-size: 14px; }
.err[hidden] { display: none; }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); translate: -50% 0; z-index: 10;
  display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: var(--r-md);
  background: var(--color-text); color: #fff; font-size: 14px; max-width: calc(100vw - 32px);
  opacity: 0; transform: translateY(8px); pointer-events: none;
  transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out);
}
.toast.on { opacity: 1; transform: none; pointer-events: auto; }
.toast button { background: none; border: 0; color: oklch(0.85 0.1 55); font-weight: 600; cursor: pointer; padding: 6px 12px; min-height: 32px; border-radius: var(--r-sm); }

@media (max-width: 1100px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { order: -1; }
}
@media (max-width: 600px) {
  .top { padding: 12px 16px; }
  .clock { text-align: left; order: 2; }
  .search { flex-basis: 100%; order: 3; }
  .top > .btn { order: 4; flex: 1; }
  .summary, .layout { padding-inline: 16px; }
  .summary { gap: 4px 20px; }
  .grid2 { grid-template-columns: 1fr; }
  dl { grid-template-columns: 80px 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  dialog[open] { animation: none; }
  .btn, .appt, .toast { transition-property: opacity, background-color, border-color; }
  .toast { transform: none; }
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="8" fill="oklch(0.22 0.02 255)"/><path d="M6 21c5-1 8-4 11-9 1 3 3 5 6 6 2-3 4-4 7-4-1 3-2 5-4 7 3 0 5 1 6 3-5-1-9 0-13 3 0-3-1-5-3-6-3 1-6 1-10 0z" fill="oklch(0.72 0.13 55)" transform="translate(-1 -2) scale(1)"/></svg>
    <div>
      <h1>Kestrel Physio</h1>
      <p>Front desk · Sample data</p>
    </div>
  </div>
  <div class="search">
    <label class="sr" for="q">Find a patient</label>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
    <input id="q" type="search" placeholder="Find a patient" autocomplete="off">
  </div>
  <div class="clock" aria-label="Current time">
    <div class="time num" id="clock">10:42</div>
    <div class="date" id="date">Tuesday 20 October 2026</div>
  </div>
  <button class="btn primary" id="newBtn" type="button">New booking</button>
</header>

<section class="summary" aria-label="Today at a glance" id="summary"></section>

<main class="layout">
  <section class="panel" aria-labelledby="tlh">
    <header>
      <h2 id="tlh">Today’s schedule</h2>
      <span class="count" id="tlCount"></span>
    </header>
    <div class="tl-scroll"><div class="tl-wrap" id="tl"></div></div>
  </section>

  <div class="side">
    <section class="panel" aria-labelledby="wh">
      <header><h2 id="wh">Waiting room</h2><span class="count" id="wCount"></span></header>
      <ul class="list" id="waiting"></ul>
    </section>
    <section class="panel" aria-labelledby="ah">
      <header><h2 id="ah">Due to arrive</h2><span class="count" id="aCount"></span></header>
      <ul class="list" id="arriving"></ul>
    </section>
  </div>
</main>

<dialog id="detail" aria-labelledby="dName"><div id="detailBody"></div></dialog>

<dialog id="book" aria-labelledby="bTitle">
  <form method="dialog" id="bookForm" novalidate>
    <div class="dlg-body">
      <h2 id="bTitle">New booking</h2>
      <label>Patient name <input name="name" required maxlength="80" autocomplete="off"></label>
      <label>Practitioner <select name="prac" id="bPrac"></select></label>
      <div class="grid2">
        <label>Start time <select name="start" id="bStart"></select></label>
        <label>Length <select name="dur"><option value="30">30 min</option><option value="45" selected>45 min</option><option value="60">60 min</option></select></label>
      </div>
      <label>Appointment type <select name="type"><option>Follow-up</option><option>Initial assessment</option><option>Review</option><option>Rehab session</option></select></label>
      <p class="err" id="bErr" role="alert" hidden></p>
    </div>
    <div class="dlg-foot">
      <button class="btn" type="button" id="bCancel">Cancel</button>
      <button class="btn primary" type="submit">Book appointment</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="toastUndo">Undo</button></div>

<script>
(() => {
  const OPEN = 8 * 60, CLOSE = 18 * 60;
  const PRACS = [
    { id: 'hw', name: 'Hana Whitcombe', short: 'Hana', role: 'Physiotherapist · Room 1' },
    { id: 'to', name: 'Tom Okafor', short: 'Tom', role: 'Sports physio · Room 2' },
    { id: 'pr', name: 'Priya Raman', short: 'Priya', role: 'Rehab specialist · Room 3' },
    { id: 'lf', name: 'Lucas Ferreira', short: 'Lucas', role: 'Hand therapy · Room 4' },
  ];
  const t = (h, m = 0) => h * 60 + m;
  // Sample data. arr = minute the patient arrived at the desk.
  let appts = [
    a(1, 'Margaret Oyelaran', 'hw', t(8), 45, 'Follow-up', 'done'),
    a(2, 'Daniel Kowalczyk', 'hw', t(9), 30, 'Review', 'done'),
    a(3, 'Ayesha Siddiqui', 'hw', t(9, 45), 60, 'Initial assessment', 'done'),
    a(4, 'Rob Henderson-Clarke', 'hw', t(10, 45), 45, 'Follow-up', 'arrived', t(10, 33), ['Balance $45']),
    a(5, 'Sofia Marchetti', 'hw', t(11, 45), 60, 'Initial assessment', 'booked', 0, ['Intake form missing']),
    a(6, 'Greg Tan', 'hw', t(13, 30), 45, 'Follow-up'),
    a(7, 'Imani Brooks', 'hw', t(14, 30), 30, 'Review'),
    a(8, 'Colm Gallagher', 'hw', t(16), 45, 'Follow-up'),

    a(9, 'Jamal Brooks', 'to', t(8, 30), 45, 'Follow-up', 'done'),
    a(10, 'Elena Petrova', 'to', t(9, 30), 45, 'Follow-up', 'done'),
    a(11, 'Noah Whitfield-Alderton-Smythe-Pemberton', 'to', t(10, 15), 45, 'Follow-up', 'session', t(10, 8)),
    a(12, '中村 海', 'to', t(11, 15), 45, 'Initial assessment', 'booked', 0, ['Referral letter needed']),
    a(13, 'Lily Chen', 'to', t(12, 30), 30, 'Review'),
    a(14, 'Marcus Adeyemi', 'to', t(15), 60, 'Initial assessment'),

    a(15, 'Tomás Álvarez', 'pr', t(9), 60, 'Rehab session', 'done'),
    a(16, 'Beth O’Connor', 'pr', t(10), 60, 'Rehab session', 'session', t(9, 54)),
    a(17, 'Walter Mbeki', 'pr', t(11, 30), 60, 'Rehab session', 'arrived', t(10, 38)),
    a(18, 'Yuki Tanaka', 'pr', t(13), 60, 'Rehab session'),
    a(19, 'Helen Fitzgerald-Moore', 'pr', t(14, 30), 45, 'Review', 'booked', 0, ['Balance $90']),

    a(20, 'Fiona Gallagher', 'lf', t(8), 60, 'Initial assessment', 'done'),
    a(21, 'Peter Dlamini', 'lf', t(9, 15), 30, 'Follow-up', 'noshow'),
    a(22, 'Omar Haddad', 'lf', t(10, 30), 45, 'Follow-up'),
    a(23, 'A. Wu', 'lf', t(11, 30), 45, 'Review'),
    a(24, 'Rosa Jimenez', 'lf', t(13, 15), 45, 'Follow-up'),
    a(25, 'Samuel Okonkwo', 'lf', t(15, 30), 45, 'Follow-up', 'booked', 0, ['Intake form missing']),
  ];
  function a(id, name, prac, start, dur, type, status = 'booked', arr = 0, flags = []) {
    return { id, name, prac, start, dur, type, status, arr, flags };
  }

  // Demo clock: starts at 10:42 and runs in real time so the sample day always looks mid-morning.
  const t0 = Date.now(), base = t(10, 42);
  const now = () => base + (Date.now() - t0) / 60000;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hm = (m) => { m = Math.floor(m); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
  const prac = (id) => PRACS.find((p) => p.id === id);
  const initials = (n) => {
    const w = n.replace(/[^\p{L}\s.-]/gu, '').split(/[\s-]+/).filter(Boolean);
    if (!w.length) return '?';
    const f = [...w[0].replace('.', '')][0] || '?';
    const l = w.length > 1 ? [...w[w.length - 1]][0] : '';
    return (f + l).toUpperCase();
  };
  const STATUS = {
    booked: ['○', 'Booked'], late: ['!', 'Late'], arrived: ['●', 'Waiting'],
    session: ['▶', 'In session'], done: ['✓', 'Completed'], noshow: ['✕', 'No-show'],
  };
  // Booked appointments past their start with no check-in read as late.
  const eff = (x) => (x.status === 'booked' && x.start + 5 <= now() ? 'late' : x.status);

  let query = '';
  let undoFn = null, toastTimer;

  function render() {
    const n = now();
    const h = Math.floor(n / 60), m = Math.floor(n % 60);
    $('#clock').textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    $('#date').textContent = 'Tuesday 20 October 2026';
    const focusKey = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;

    // Summary
    const c = (s) => appts.filter((x) => eff(x) === s).length;
    const sum = [
      [appts.length, 'booked today'], [c('arrived'), 'waiting'], [c('session'), 'in session'],
      [c('done'), 'completed'], [c('late') + c('noshow'), 'late or no-show'],
    ];
    $('#summary').innerHTML = sum.map(([v, l]) => `<div><strong class="num">${v}</strong><span>${l}</span></div>`).join('');

    // Timeline
    const q = query.trim().toLowerCase();
    const matches = (x) => !q || x.name.toLowerCase().includes(q);
    const hours = [];
    for (let k = OPEN / 60; k < CLOSE / 60; k++) hours.push(k);
    const inDay = n >= OPEN && n <= CLOSE;
    let html = '<div class="tl"><div class="tl-head"><div class="corner"></div>' +
      PRACS.map((p) => `<div><div class="who" title="${esc(p.name)}">${esc(p.name)}</div><div class="role">${esc(p.role)}</div></div>`).join('') + '</div>';
    html += `<div class="tl-time" aria-hidden="true">${hours.map((k) => `<span style="top:${(k * 60 - OPEN)}px">${String(k).padStart(2, '0')}:00</span>`).join('')}</div>`;
    PRACS.forEach((p) => {
      html += `<div class="tl-col ${inDay ? 'past' : ''}" style="--past:${Math.max(0, Math.min(n, CLOSE) - OPEN)}px">` +
        appts.filter((x) => x.prac === p.id).map((x) => {
          const s = eff(x), [g, w] = STATUS[s], tight = x.dur < 45;
          const cls = 'appt' + (tight ? ' tight' : x.dur >= 60 ? ' roomy' : '') + (q ? (matches(x) ? ' hit' : ' dim') : '');
          return `<button type="button" class="${cls}" data-s="${s}" data-id="${x.id}" data-key="a${x.id}" style="top:${x.start - OPEN}px;height:${x.dur - 2}px"
            aria-label="${esc(x.name)}, ${hm(x.start)}, ${esc(x.type)}, ${w}">
            <span class="ln"><span class="nm" title="${esc(x.name)} · ${w}">${esc(x.name)}</span><span class="gl" aria-hidden="true">${g}</span></span>
            <span class="meta num">${hm(x.start)}–${hm(x.start + x.dur)} · ${esc(x.type)}</span>
            <span class="st"><span aria-hidden="true">${g}</span> ${w}${s === 'late' ? ` · ${Math.floor(n - x.start)} min` : ''}</span>
          </button>`;
        }).join('') + '</div>';
    });
    html += '</div>';
    if (inDay) html += `<div class="now-line"></div>`;
    $('#tl').innerHTML = html;
    const nl = $('.now-line'), col0 = $('.tl-col');
    if (nl && col0) nl.style.top = (col0.offsetTop + n - OPEN) + 'px';
    const hitCount = appts.filter(matches).length;
    $('#tlCount').textContent = q ? (hitCount ? `${hitCount} match${hitCount === 1 ? '' : 'es'}` : 'No patients match') : `${appts.length} appointments`;

    // Waiting room: longest wait first
    const waiting = appts.filter((x) => x.status === 'arrived' && matches(x)).sort((x, y) => x.arr - y.arr);
    $('#wCount').textContent = `${waiting.length} here`;
    $('#waiting').innerHTML = waiting.length ? waiting.map((x) => {
      const mins = Math.max(0, Math.floor(n - x.arr)), p = prac(x.prac);
      return `<li class="row"><div class="avatar" aria-hidden="true">${esc(initials(x.name))}</div>
        <button class="info" type="button" data-id="${x.id}" data-key="w${x.id}"><div class="nm" title="${esc(x.name)}">${esc(x.name)}</div>
          <div class="sub num">${hm(x.start)} with ${esc(p.short)} · ${esc(x.type)}</div>${flagsHtml(x)}</button>
        <div class="acts"><span class="wait num ${mins >= 15 ? 'long' : ''}">${mins} min</span>
          <button class="btn sm" type="button" data-act="session" data-id="${x.id}" data-key="ws${x.id}">Start session</button></div></li>`;
    }).join('') : `<li class="empty"><strong>${q ? 'Nobody waiting matches' : 'Waiting room is empty'}</strong>${q ? 'Clear the search to see everyone.' : 'Patients appear here as soon as you check them in.'}</li>`;

    // Due to arrive: booked, not here, starting within 60 min (or already late)
    const due = appts.filter((x) => x.status === 'booked' && x.start - n <= 60 && matches(x)).sort((x, y) => x.start - y.start);
    $('#aCount').textContent = `${due.length} expected`;
    $('#arriving').innerHTML = due.length ? due.map((x) => {
      const p = prac(x.prac), late = n - x.start;
      const when = late >= 5 ? `<span class="wait long num">${Math.floor(late)} min late</span>` : `<span class="sub num">in ${Math.max(0, Math.ceil(x.start - n))} min</span>`;
      return `<li class="row"><div class="avatar" aria-hidden="true">${esc(initials(x.name))}</div>
        <button class="info" type="button" data-id="${x.id}" data-key="d${x.id}"><div class="nm" title="${esc(x.name)}">${esc(x.name)}</div>
          <div class="sub num">${hm(x.start)} with ${esc(p.short)} · ${esc(x.type)}</div>${flagsHtml(x)}</button>
        <div class="acts">${when}<button class="btn sm" type="button" data-act="arrived" data-id="${x.id}" data-key="ds${x.id}">Check in</button></div></li>`;
    }).join('') : `<li class="empty"><strong>No one else due in the next hour</strong>Use New booking to fit someone in.</li>`;

    if (focusKey) { const el = document.querySelector(`[data-key="${focusKey}"]`); if (el && el !== document.activeElement) el.focus({ preventScroll: true }); }
  }
  const flagsHtml = (x) => x.flags.length ? `<div class="flags">${x.flags.map((f) => `<span class="flag">${esc(f)}</span>`).join('')}</div>` : '';

  // Status changes (all undoable)
  function setStatus(id, status) {
    const x = appts.find((y) => y.id === id); if (!x) return;
    const prev = { status: x.status, arr: x.arr };
    x.status = status;
    if (status === 'arrived') x.arr = Math.floor(now());
    if (status === 'booked') x.arr = 0;
    const msg = { arrived: `${x.name} checked in`, session: `${x.name} started with ${prac(x.prac).short}`, done: `${x.name} completed`, noshow: `${x.name} marked as no-show`, booked: `${x.name} reset to booked` }[status];
    toast(msg, () => { x.status = prev.status; x.arr = prev.arr; render(); });
    render();
  }
  function toast(msg, undo) {
    $('#toastMsg').textContent = msg; undoFn = undo; $('#toastUndo').hidden = !undo;
    $('#toast').classList.add('on'); clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('#toast').classList.remove('on'), 6000);
  }
  $('#toastUndo').onclick = () => { if (undoFn) undoFn(); undoFn = null; $('#toast').classList.remove('on'); };

  // Detail dialog
  function openDetail(id) {
    const x = appts.find((y) => y.id === id); if (!x) return;
    const s = eff(x), [g, w] = STATUS[s], p = prac(x.prac);
    const acts = [];
    if (s === 'booked' || s === 'late') acts.push(['arrived', 'Check in', 'btn'], ['noshow', 'Mark no-show', 'btn danger']);
    if (s === 'arrived') acts.push(['session', 'Start session', 'btn']);
    if (s === 'session') acts.push(['done', 'Complete session', 'btn']);
    if (s === 'done' || s === 'noshow' || s === 'arrived' || s === 'session') acts.push(['booked', 'Reset to booked', 'btn ghost']);
    $('#detailBody').innerHTML = `<div class="dlg-body" data-s="${s}">
      <div><span class="chip"><span aria-hidden="true">${g}</span> ${w}</span><h2 id="dName">${esc(x.name)}</h2></div>
      <dl><dt>Time</dt><dd class="num">${hm(x.start)}–${hm(x.start + x.dur)} (${x.dur} min)</dd>
        <dt>Practitioner</dt><dd>${esc(p.name)}</dd><dt>Type</dt><dd>${esc(x.type)}</dd>
        ${x.arr ? `<dt>Arrived</dt><dd class="num">${hm(x.arr)}</dd>` : ''}
        <dt>Notes</dt><dd>${x.flags.length ? x.flags.map(esc).join(', ') : 'Nothing outstanding'}</dd></dl></div>
      <div class="dlg-foot">${acts.map(([k, l, c]) => `<button class="${c}" type="button" data-do="${k}">${l}</button>`).join('')}<button class="btn" type="button" data-close>Close</button></div>`;
    $('#detailBody').dataset.id = id;
    $('#detail').showModal();
  }
  $('#detail').addEventListener('click', (e) => {
    const d = e.target.closest('[data-do]');
    if (d) { const id = +$('#detailBody').dataset.id; $('#detail').close(); setStatus(id, d.dataset.do); }
    else if (e.target.closest('[data-close]') || e.target === $('#detail')) $('#detail').close();
  });

  // Delegated clicks
  document.addEventListener('click', (e) => {
    const act = e.target.closest('[data-act]');
    if (act) return setStatus(+act.dataset.id, act.dataset.act);
    const open = e.target.closest('.appt, .info');
    if (open) openDetail(+open.dataset.id);
  });

  // Booking
  const fill = () => {
    $('#bPrac').innerHTML = PRACS.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
    let o = ''; for (let k = Math.ceil(now() / 15) * 15; k <= CLOSE - 30; k += 15) o += `<option value="${k}">${hm(k)}</option>`;
    $('#bStart').innerHTML = o;
  };
  $('#newBtn').onclick = () => { fill(); $('#bErr').hidden = true; $('#bookForm').reset(); $('#book').showModal(); };
  $('#bCancel').onclick = () => $('#book').close();
  $('#bookForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const f = new FormData(e.target), name = (f.get('name') || '').trim();
    const start = +f.get('start'), dur = +f.get('dur'), pr = f.get('prac');
    const err = (m) => { $('#bErr').textContent = m; $('#bErr').hidden = false; };
    if (!name) return err('Enter the patient’s name to book them in.');
    if (!start) return err('No start times are left today. Pick another day in your diary system.');
    if (start + dur > CLOSE) return err(`That runs past closing at ${hm(CLOSE)}. Choose an earlier start or a shorter length.`);
    const clash = appts.find((x) => x.prac === pr && x.status !== 'noshow' && start < x.start + x.dur && x.start < start + dur);
    if (clash) return err(`${prac(pr).short} is booked ${hm(clash.start)}–${hm(clash.start + clash.dur)} with ${clash.name}. Pick another time or practitioner.`);
    const id = Math.max(...appts.map((x) => x.id)) + 1;
    appts.push(a(id, name, pr, start, dur, f.get('type')));
    $('#book').close(); toast(`${name} booked with ${prac(pr).short} at ${hm(start)}`); render();
  });

  $('#q').addEventListener('input', (e) => { query = e.target.value; render(); });
  render();
  setInterval(() => { if (!document.querySelector('dialog[open]')) render(); }, 15000);
})();
</script>
</body>
</html>
