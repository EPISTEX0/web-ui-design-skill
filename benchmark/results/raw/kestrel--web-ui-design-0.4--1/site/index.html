<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Front desk · Kestrel Physio</title>
<meta name="color-scheme" content="light">
<style>
:root {
  /* primitives */
  --teal-700: #1f625e;
  --teal-600: #2a7f7a; /* brand */
  --teal-100: #d9eceb;
  --teal-50: #edf6f5;
  --ink-900: #14302e;
  --ink-700: #3f5957;
  --ink-600: #566e6c;
  --ink-200: #cfdcda;
  --ink-100: #e2ebe9;
  --ground: #f2f6f5;
  --amber-800: #7a4a00;
  --amber-100: #fcefcf;
  --rust-800: #8f2f22;
  --rust-100: #fae1dc;

  /* semantic */
  --color-bg: var(--ground);
  --color-surface: #fff;
  --color-text: var(--ink-900);
  --color-text-2: var(--ink-700);
  --color-text-3: var(--ink-600);
  --color-border: var(--ink-200);
  --color-hairline: var(--ink-100);
  --color-accent: var(--teal-600);
  --color-accent-strong: var(--teal-700);
  --color-accent-tint: var(--teal-50);
  --color-focus: #0b4d9c;

  --font: "Avenir Next", "Segoe UI", "Helvetica Neue", system-ui, -apple-system, Roboto, sans-serif;

  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;

  --ring: 0 0 0 1px rgb(20 48 46 / .08), 0 1px 2px rgb(20 48 46 / .05), 0 4px 14px rgb(20 48 46 / .05);

  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --t-press: 120ms;
  --t-menu: 200ms;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font: 400 18px/1.5 var(--font);
  color: var(--color-text);
  background: var(--color-bg);
  height: 100dvh;
  overflow: hidden;
  font-variant-numeric: tabular-nums;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -.01em; }
p { text-wrap: pretty; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--color-accent-strong); }

:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- shell ---------- */
.app {
  height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr;
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

.topbar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 12px 24px;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-hairline);
}
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; flex: none; }
.topbar .search { margin-left: auto; }
.topbar .search + .btn { margin-left: 0; }
.brand-mark { flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--color-accent); display: grid; place-items: center; }
.brand-name { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.brand-sub { font-size: 16px; color: var(--color-text-3); line-height: 1.2; }
.clock { text-align: right; line-height: 1.15; }
.clock-time { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.clock-date { font-size: 16px; color: var(--color-text-3); }

.btn {
  min-height: 56px;
  padding: 0 24px;
  border-radius: var(--r-md);
  border: 1.5px solid transparent;
  font-weight: 650;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  transition: transform var(--t-press) var(--ease-out), background-color var(--t-menu), border-color var(--t-menu);
  white-space: nowrap;
}
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: #fff; }
.btn-outline { background: var(--color-surface); border-color: var(--color-accent); color: var(--color-accent-strong); }
.btn-tonal { background: var(--teal-100); color: var(--teal-700); }
.btn-quiet { background: transparent; border-color: var(--color-border); color: var(--color-text-2); }
@media (hover: hover) {
  .btn-primary:hover:not(:disabled) { background: var(--color-accent-strong); }
  .btn-outline:hover:not(:disabled), .btn-quiet:hover:not(:disabled) { background: var(--color-accent-tint); }
  .btn-tonal:hover:not(:disabled) { background: #c7e2e0; }
}
.btn-lg { min-height: 68px; font-size: 21px; width: 100%; }

.workspace {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 400px;
  gap: 20px;
  padding: 20px 24px calc(20px + env(safe-area-inset-bottom));
}
.main { min-height: 0; display: flex; flex-direction: column; gap: 16px; }

/* ---------- therapists ---------- */
.team { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; flex: none; }
.tcard {
  background: var(--color-surface);
  border-radius: var(--r-md);
  box-shadow: var(--ring);
  padding: 12px 14px;
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr);
  gap: 4px 12px;
  align-items: center;
}
.avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--teal-100); color: var(--teal-700);
  display: grid; place-items: center;
  font-weight: 700; font-size: 16px; grid-row: span 2;
}
.tname { font-weight: 650; font-size: 17px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tname .short { display: none; }
.tstate { font-size: 15px; color: var(--color-text-2); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tstate.is-free { color: var(--teal-700); font-weight: 600; }
.tbar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--color-hairline); overflow: hidden; margin-top: 4px; }
.tbar > i { display: block; height: 100%; background: var(--color-accent); border-radius: 3px; transform-origin: left; }

/* ---------- queue panel ---------- */
.queue {
  flex: 1; min-height: 0;
  background: var(--color-surface);
  border-radius: var(--r-lg);
  box-shadow: var(--ring);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.qhead { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--color-hairline); }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-right: auto; }
.tab {
  min-height: 52px; padding: 0 16px;
  border-radius: 999px; border: 1.5px solid var(--color-border); background: var(--color-surface);
  font-weight: 600; color: var(--color-text-2);
  display: inline-flex; align-items: center; gap: 8px;
  transition: transform var(--t-press) var(--ease-out), background-color var(--t-menu);
}
.tab:active { transform: scale(.97); }
.tab .n { font-weight: 700; min-width: 1.4em; padding: 0 6px; border-radius: 999px; background: var(--color-hairline); text-align: center; font-size: 16px; }
.tab[aria-pressed="true"] { background: var(--color-text); border-color: var(--color-text); color: #fff; }
.tab[aria-pressed="true"] .n { background: rgb(255 255 255 / .2); color: #fff; }
.tab.alert .n { background: var(--amber-100); color: var(--amber-800); }
.tab.alert[aria-pressed="true"] .n { background: var(--amber-100); color: var(--amber-800); }
@media (hover: hover) { .tab[aria-pressed="false"]:hover { background: var(--color-accent-tint); } }

.search { position: relative; flex: 0 1 300px; min-width: 140px; }
.search input {
  width: 100%; min-height: 52px; padding: 0 16px 0 46px;
  border: 1.5px solid var(--color-border); border-radius: var(--r-md); background: var(--color-surface);
}
.search input::placeholder { color: var(--color-text-3); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; }

.list { list-style: none; margin: 0; padding: 4px 8px 12px; overflow-y: auto; flex: 1; min-height: 0; overscroll-behavior: contain; scroll-padding-top: 8px; }

.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 4px; border-radius: var(--r-md);
  border-bottom: 1px solid var(--color-hairline);
  transition: background-color var(--t-menu);
}
.row:last-child { border-bottom: 0; }
.row.is-selected { background: var(--color-accent-tint); box-shadow: inset 4px 0 0 var(--color-accent); border-bottom-color: transparent; }
.pick {
  display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: 14px; align-items: center;
  text-align: left; background: none; border: 0; padding: 10px 8px; border-radius: var(--r-sm); min-height: 72px;
}
.ptime { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.ptime small { display: block; white-space: nowrap; font-size: 14px; font-weight: 500; color: var(--color-text-3); letter-spacing: 0; line-height: 1.1; }
.pname { font-weight: 650; font-size: 20px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.pmeta { font-size: 16px; color: var(--color-text-2); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.pinfo { min-width: 0; }
.row .btn { min-width: 150px; }
.row.is-done .pname { color: var(--color-text-2); font-weight: 550; }
.row.is-done .ptime { color: var(--color-text-3); }

.chip {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px;
  border-radius: 999px; font-size: 16px; font-weight: 600; line-height: 1.2; white-space: nowrap;
}
.chip svg { flex: none; }
.chip.booked { background: var(--color-hairline); color: var(--ink-700); }
.chip.late { background: var(--rust-100); color: var(--rust-800); }
.chip.arrived { background: var(--amber-100); color: var(--amber-800); }
.chip.arrived.long { background: var(--amber-800); color: #fff; }
.chip.session { background: var(--teal-100); color: var(--teal-700); }
.chip.done { background: transparent; color: var(--color-text-3); padding-inline: 0; }
.chip.noshow { background: var(--rust-100); color: var(--rust-800); }

.nowline { list-style: none; display: flex; align-items: center; gap: 12px; padding: 6px 12px; color: var(--rust-800); font-weight: 700; font-size: 15px; }
.nowline::before, .nowline::after { content: ""; height: 2px; background: currentColor; opacity: .45; border-radius: 1px; }
.nowline::before { width: 20px; }
.nowline::after { flex: 1; }

.empty { padding: 48px 24px; text-align: center; color: var(--color-text-2); }
.empty h3 { font-size: 22px; color: var(--color-text); margin-bottom: 6px; }
.empty .btn { margin-top: 16px; }

/* ---------- detail ---------- */
.detail {
  min-height: 0; overflow-y: auto;
  background: var(--color-surface); border-radius: var(--r-lg); box-shadow: var(--ring);
  display: flex; flex-direction: column;
}
.dhead { padding: 22px 22px 16px; border-bottom: 1px solid var(--color-hairline); }
.dclose { display: none; }
.dname { font-size: 28px; line-height: 1.15; font-weight: 700; margin: 10px 0 4px; overflow-wrap: anywhere; }
.dsub { color: var(--color-text-2); }
.dbody { padding: 18px 22px; display: grid; gap: 16px; flex: 1; align-content: start; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: 17px; }
.facts dt { color: var(--color-text-3); }
.facts dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

.flags { display: grid; gap: 10px; }
.flag {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 12px 14px; border-radius: var(--r-md); background: var(--amber-100); color: var(--amber-800);
}
.flag strong { display: block; font-size: 17px; line-height: 1.3; }
.flag span { font-size: 15px; line-height: 1.3; display: block; }
.flag .btn { min-height: 48px; padding: 0 16px; font-size: 16px; background: #fff; color: var(--amber-800); border-color: var(--amber-800); }
.flag.ok { background: var(--teal-50); color: var(--teal-700); grid-template-columns: 1fr; font-weight: 600; font-size: 16px; }
.note { padding: 12px 14px; border-radius: var(--r-md); background: var(--color-bg); font-size: 16px; color: var(--color-text-2); }
.note b { color: var(--color-text); }

.dactions { padding: 16px 22px calc(22px + env(safe-area-inset-bottom)); display: grid; gap: 10px; border-top: 1px solid var(--color-hairline); position: sticky; bottom: 0; background: var(--color-surface); }
.dactions .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dactions .btn { width: 100%; }

.slots { display: grid; gap: 8px; }
.slots h3 { font-size: 17px; }
.slotrow { display: flex; flex-wrap: wrap; gap: 8px; }
.slot { min-height: 52px; padding: 0 14px; border-radius: var(--r-md); border: 1.5px solid var(--color-accent); background: #fff; color: var(--teal-700); font-weight: 600; font-size: 16px; }
.slot:active { transform: scale(.97); }
.booked-ok { padding: 12px 14px; border-radius: var(--r-md); background: var(--teal-50); color: var(--teal-700); font-weight: 600; }

/* ---------- toast & dialog ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
  background: var(--color-text); color: #fff; padding: 8px 8px 8px 22px; border-radius: 16px;
  display: flex; align-items: center; gap: 16px; opacity: 0; pointer-events: none;
  transition: opacity var(--t-menu), transform var(--t-menu) var(--ease-out);
  max-width: calc(100vw - 32px); z-index: 20;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { min-height: 48px; padding: 0 20px; border-radius: 12px; border: 0; background: rgb(255 255 255 / .16); color: #fff; font-weight: 700; }
.toast p { min-width: 0; overflow-wrap: anywhere; }

dialog { border: 0; border-radius: var(--r-lg); padding: 0; width: min(520px, calc(100vw - 32px)); box-shadow: 0 24px 64px rgb(20 48 46 / .3); color: var(--color-text); }
dialog::backdrop { background: rgb(20 48 46 / .4); }
dialog[open] { animation: pop var(--t-menu) var(--ease-out); }
@keyframes pop { from { opacity: 0; transform: scale(.96); } }
.dlg { padding: 24px; display: grid; gap: 16px; }
.dlg h2 { font-size: 26px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; }
.field input, .field select { min-height: 56px; padding: 0 14px; border: 1.5px solid var(--color-border); border-radius: var(--r-md); background: #fff; width: 100%; }
.field input[aria-invalid="true"] { border-color: var(--rust-800); }
.err { color: var(--rust-800); font-size: 16px; min-height: 0; }
.dlg-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---------- narrow screens: detail becomes a sheet ---------- */
@media (max-width: 1100px) {
  .tname .full { display: none; }
  .tname .short { display: inline; }
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .detail {
    position: fixed; inset: auto 0 0 0; max-height: 88dvh; border-radius: var(--r-lg) var(--r-lg) 0 0;
    transform: translateY(105%); visibility: hidden; z-index: 10;
    transition: transform 280ms var(--ease-out), visibility 0s linear 280ms;
  }
  body.sheet-open .detail { transform: none; visibility: visible; transition: transform 280ms var(--ease-out); }
  .scrim { position: fixed; inset: 0; background: rgb(20 48 46 / .35); z-index: 9; opacity: 0; pointer-events: none; transition: opacity var(--t-menu); }
  body.sheet-open .scrim { opacity: 1; pointer-events: auto; }
  .dclose { display: inline-flex; position: absolute; right: 12px; top: 12px; min-height: 48px; min-width: 48px; border-radius: 50%; border: 0; background: var(--color-bg); align-items: center; justify-content: center; }
  .dhead { position: relative; padding-right: 72px; }
}
@media (max-width: 760px) {
  body { font-size: 17px; overflow: auto; height: auto; }
  .app { height: auto; min-height: 100dvh; }
  .topbar { padding: 12px 16px; gap: 12px; flex-wrap: wrap; }
  .brand-sub { display: none; }
  .clock-time { font-size: 24px; }
  .workspace { padding: 12px 12px 24px; gap: 12px; }
  .team { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .queue { overflow: visible; }
  .list { overflow: visible; }
  .row { grid-template-columns: 1fr; }
  .row .btn { width: 100%; margin: 0 4px 8px; width: calc(100% - 8px); }
  .pick { grid-template-columns: 56px minmax(0, 1fr); }
  .pick .chip { grid-column: 2; justify-self: start; }
  .topbar .search { flex: 1 1 100%; order: 5; margin-left: 0; }
  #walkin span { display: none; }
  #walkin { padding: 0 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <!-- swept kestrel wings -->
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M2 17c4-8 10-11 14-9 3 1.5 6 5 10 5-3 1-6 .5-8-.5-2.500 3.500-5 6.500-9 6.500-3 0-5-.5-7-2z" fill="#fff"/><circle cx="19" cy="10.500" r="1.200" fill="#2a7f7a"/></svg>
      </div>
      <div style="min-width:0">
        <div class="brand-name">Kestrel Physio</div>
        <div class="brand-sub">Front desk</div>
      </div>
    </div>
    <div class="search">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="6.500" stroke="#566e6c" stroke-width="2"/><path d="m15 15 4 4" stroke="#566e6c" stroke-width="2" stroke-linecap="round"/></svg>
      <label class="sr-only" for="q">Search patients</label>
      <input id="q" type="search" placeholder="Search patient" autocomplete="off" enterkeyhint="search">
    </div>
    <button class="btn btn-outline" id="walkin" type="button">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><path d="M11 4v14M4 11h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>Add walk-in</span>
    </button>
    <div class="clock" aria-live="off">
      <div class="clock-time" id="clock">10:42</div>
      <div class="clock-date" id="date">Tuesday 20 October</div>
    </div>
  </header>

  <div class="workspace">
    <main class="main" aria-label="Today's appointments">
      <section class="team" id="team" aria-label="Therapists"></section>
      <section class="queue">
        <div class="qhead">
          <div class="tabs" id="tabs" role="group" aria-label="Filter appointments"></div>
        </div>
        <ul class="list" id="list"></ul>
      </section>
    </main>

    <aside class="detail" id="detail" aria-label="Appointment details"></aside>
  </div>
</div>
<div class="scrim" id="scrim"></div>

<div class="toast" id="toast" role="status" aria-live="polite"><p id="toastMsg"></p><button type="button" id="toastUndo">Undo</button></div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form class="dlg" id="walkForm" method="dialog" novalidate>
    <h2 id="dlgTitle">Add a walk-in</h2>
    <div class="field">
      <label for="wName">Patient name</label>
      <input id="wName" name="name" autocomplete="off" required aria-describedby="wNameErr">
      <p class="err" id="wNameErr" role="alert"></p>
    </div>
    <div class="field">
      <label for="wTher">Therapist</label>
      <select id="wTher" name="ther"></select>
    </div>
    <div class="field">
      <label for="wType">Visit type</label>
      <select id="wType" name="type">
        <option>Follow-up</option><option>Initial assessment</option><option>Sports rehab</option><option>Dry needling</option>
      </select>
    </div>
    <div class="dlg-actions">
      <button class="btn btn-quiet" type="button" id="wCancel">Cancel</button>
      <button class="btn btn-primary" type="submit">Check in walk-in</button>
    </div>
  </form>
</dialog>

<script>
/* ---------- sample data (all invented) ---------- */
const DAY_LABEL = 'Tuesday 20 October';
const DEMO_START = 10 * 60 + 42;           // desk clock opens at 10:42
const t0 = Date.now();
const nowMin = () => DEMO_START + Math.floor((Date.now() - t0) / 60000);

const THERAPISTS = [
  { id: 'ho', name: 'Hana Okafor',     short: 'Hana O.',   ini: 'HO', room: 'Room 1' },
  { id: 'ml', name: 'Marcus Lindqvist', short: 'Marcus L.', ini: 'ML', room: 'Room 2' },
  { id: 'pr', name: 'Priya Raman',     short: 'Priya R.',  ini: 'PR', room: 'Room 3' },
  { id: 'tf', name: 'Tomás Ferreira',  short: 'Tomás F.',  ini: 'TF', room: 'Gym' },
];
const T = Object.fromEntries(THERAPISTS.map(t => [t.id, t]));
const hm = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const fmt = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

// status: booked | arrived | session | done | noshow
const A = (id, time, dur, patient, th, type, status, extra = {}) =>
  ({ id, time: hm(time), dur, patient, th, type, status, phone: '', visit: '', form: true, balance: 0, note: '', ...extra });

const initial = () => [
  A(1, '08:00', 30, 'Ruth Adeyemi', 'ml', 'Follow-up', 'done', { phone: '020 7946 0113', visit: 'Visit 5 of 6', started: hm('08:01') }),
  A(2, '08:30', 45, 'Daniel Kowalczyk', 'ho', 'Post-op knee', 'done', { phone: '020 7946 0187', visit: 'Visit 3 of 10', started: hm('08:32') }),

  A(4, '09:00', 30, 'Gareth Pugh', 'ml', 'Back pain programme', 'done', { phone: '020 7946 0166', visit: 'Visit 4 of 8', started: hm('09:03') }),
  A(5, '09:15', 45, 'Sofia Marchetti', 'tf', 'Sports rehab', 'done', { phone: '020 7946 0129', visit: 'Visit 6 of 12', started: hm('09:15') }),

  A(14, '11:00', 30, 'Joon-ho Park', 'pr', 'Follow-up', 'arrived', { arrivedAt: hm('10:27'), phone: '020 7946 0136', visit: 'Visit 4 of 6', balance: 30, note: 'Arrived early. Left knee brace is in the car.' }),
  A(15, '11:15', 45, 'Harriet Doyle', 'ho', 'Follow-up', 'booked', { phone: '020 7946 0181', visit: 'Visit 6 of 8' }),
  A(16, '11:15', 30, 'Bo', 'tf', 'Dry needling', 'booked', { phone: '020 7946 0117', visit: 'Visit 2 of 4' }),
  A(17, '11:30', 45, 'Patrick Okonkwo', 'ml', 'Back pain programme', 'booked', { phone: '020 7946 0158', visit: 'Visit 5 of 8', balance: 60 }),
  A(18, '11:45', 30, '田中 由紀', 'pr', 'Follow-up', 'booked', { phone: '020 7946 0163', visit: 'Visit 3 of 4' }),
  A(19, '12:00', 45, 'Samuel Ortiz', 'ho', 'Sports rehab', 'booked', { phone: '020 7946 0195', visit: 'Visit 8 of 12' }),
  A(20, '13:00', 45, 'Fatima Al-Sayed', 'tf', 'Post-op knee', 'booked', { phone: '020 7946 0126', visit: 'Visit 9 of 10', form: false }),
  A(21, '13:30', 30, 'Rosa Delgado', 'ml', 'Follow-up', 'booked', { phone: '020 7946 0173', visit: 'Visit 2 of 6' }),
  A(22, '14:00', 60, 'Dmitri Volkov', 'pr', 'Initial assessment', 'booked', { phone: '020 7946 0144', visit: 'First visit', form: false, note: 'Insurer pre-authorisation was requested on Monday; no reply yet.' }),
  A(23, '14:30', 45, 'Grace Mbeki', 'ho', 'Follow-up', 'booked', { phone: '020 7946 0109', visit: 'Visit 3 of 6' }),
  A(24, '15:00', 45, 'Oliver Grant', 'tf', 'Sports rehab', 'booked', { phone: '020 7946 0182', visit: 'Visit 4 of 12' }),
  A(25, '15:30', 30, 'Nia Thomas', 'ml', 'Follow-up', 'booked', { phone: '020 7946 0151', visit: 'Visit 6 of 6' }),
  A(26, '16:00', 45, 'Ben Whitaker', 'pr', 'Dry needling', 'booked', { phone: '020 7946 0119', visit: 'Visit 3 of 4' }),
];

let appts = initial();
let nextId = 100;
let filter = (location.hash.match(/filter=(\w+)/) || [])[1] || 'all';
let query = '';
let selected = null;
let undoSnap = null, toastTimer = null;

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shortName = n => { const p = n.trim().split(/\s+/); return p.length > 1 && /^[\p{Script=Latin}]/u.test(n) ? p[0] + ' ' + p[p.length - 1][0] + '.' : n; };
const money = n => '$' + n;
const LATE_AFTER = 5, LONG_WAIT = 10;
const isLate = a => a.status === 'booked' && nowMin() - a.time > LATE_AFTER;
const waited = a => nowMin() - a.arrivedAt;
const endOf = a => a.started + a.dur;

const ICON = {
  booked:  '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  late:    '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.500 13 12H1z" fill="currentColor"/></svg>',
  arrived: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1a6 6 0 1 0 0 12A6 6 0 0 0 7 1zm.9 3v3.200l2.200 1.300-.7 1.200L6.200 7.800V4z" fill="currentColor"/></svg>',
  session: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="1.500" y="1.500" width="11" height="11" rx="3" fill="currentColor"/></svg>',
  done:    '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m2 7.500 3 3L12 3.500" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  noshow:  '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m3 3 8 8M11 3l-8 8" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"/></svg>',
};

function chip(a) {
  const n = nowMin();
  if (a.status === 'arrived') {
    const w = waited(a);
    return `<span class="chip arrived ${w >= LONG_WAIT ? 'long' : ''}">${ICON.arrived}Waiting ${w} min</span>`;
  }
  if (a.status === 'session') return `<span class="chip session">${ICON.session}In session · ends ${fmt(endOf(a))}</span>`;
  if (a.status === 'done') return `<span class="chip done">${ICON.done}Done</span>`;
  if (a.status === 'noshow') return `<span class="chip noshow">${ICON.noshow}No-show</span>`;
  if (isLate(a)) return `<span class="chip late">${ICON.late}Late ${n - a.time} min</span>`;
  return `<span class="chip booked">${ICON.booked}Booked</span>`;
}

const ACTION = {
  booked:  { label: 'Check in', next: 'arrived' },
  arrived: { label: 'Send to room', next: 'session' },
  session: { label: 'Check out', next: 'done' },
};

/* ---------- render ---------- */
function counts() {
  const c = { all: appts.length, waiting: 0, session: 0, upcoming: 0, done: 0 };
  for (const a of appts) {
    if (a.status === 'arrived') c.waiting++;
    else if (a.status === 'session') c.session++;
    else if (a.status === 'booked') c.upcoming++;
    else c.done++;
  }
  return c;
}

const TABS = [['all', 'All'], ['waiting', 'Waiting'], ['session', 'In session'], ['upcoming', 'Upcoming'], ['done', 'Done']];
function matches(a) {
  if (query && !a.patient.toLowerCase().includes(query)) return false;
  switch (filter) {
    case 'waiting': return a.status === 'arrived';
    case 'session': return a.status === 'session';
    case 'upcoming': return a.status === 'booked';
    case 'done': return a.status === 'done' || a.status === 'noshow';
    default: return true;
  }
}

function renderTabs() {
  const c = counts();
  $('tabs').innerHTML = TABS.map(([k, l]) =>
    `<button type="button" class="tab ${k === 'waiting' && c.waiting ? 'alert' : ''}" data-filter="${k}" aria-pressed="${filter === k}">${l}<span class="n">${c[k]}</span></button>`).join('');
}

function renderTeam() {
  const n = nowMin();
  $('team').innerHTML = THERAPISTS.map(t => {
    const cur = appts.find(a => a.th === t.id && a.status === 'session');
    const waiting = appts.filter(a => a.th === t.id && a.status === 'arrived').sort((x, y) => x.arrivedAt - y.arrivedAt)[0];
    let state, cls = '', bar = '';
    if (cur) {
      const pct = Math.max(0, Math.min(100, ((n - cur.started) / cur.dur) * 100));
      state = `${esc(shortName(cur.patient))} until ${fmt(endOf(cur))}`;
      bar = `<div class="tbar" role="img" aria-label="Session ${Math.round(pct)}% complete"><i style="width:${pct}%"></i></div>`;
    } else if (waiting) {
      state = `Free · ${esc(shortName(waiting.patient))} waiting`;
      cls = 'is-free';
    } else {
      const nx = appts.filter(a => a.th === t.id && a.status === 'booked').sort((x, y) => x.time - y.time)[0];
      state = nx ? `Free · next ${fmt(nx.time)}` : 'Free';
      cls = 'is-free';
    }
    return `<div class="tcard"><div class="avatar" aria-hidden="true">${t.ini}</div><div class="tname" title="${esc(t.name)}"><span class="full">${esc(t.name)}</span><span class="short">${esc(t.short)}</span></div><div class="tstate ${cls}" title="${state}">${state}</div>${bar}</div>`;
  }).join('');
}

function rowHTML(a) {
  const act = ACTION[a.status];
  const th = T[a.th];
  const sub = a.status === 'arrived' ? `Arrived ${fmt(a.arrivedAt)}`
    : a.status === 'session' ? `Started ${fmt(a.started)}` : `${a.dur} min`;
  const flags = [];
  if (!a.form && a.status !== 'done') flags.push('Form due');
  if (a.balance && a.status !== 'done') flags.push(money(a.balance) + ' due');
  const meta = [a.type, th.short, ...flags].join(' · ');
  return `<li class="row ${a.status === 'done' || a.status === 'noshow' ? 'is-done' : ''} ${selected === a.id ? 'is-selected' : ''}" data-row="${a.id}">
    <button type="button" class="pick" data-pick="${a.id}" ${selected === a.id ? 'aria-current="true"' : ''}>
      <span class="ptime">${fmt(a.time)}<small>${sub}</small></span>
      <span class="pinfo"><span class="pname" title="${esc(a.patient)}">${esc(a.patient)}</span><span class="pmeta">${esc(meta)}</span></span>
      ${chip(a)}
    </button>
    ${act ? `<button type="button" class="btn ${a.status === 'booked' ? 'btn-tonal' : 'btn-tonal'}" data-act="${a.id}" aria-label="${act.label}: ${esc(a.patient)}">${act.label}</button>` : '<span></span>'}
  </li>`;
}

function renderList() {
  const rows = appts.filter(matches).sort((x, y) => x.time - y.time || x.id - y.id);
  const list = $('list');
  if (!rows.length) {
    const msg = query
      ? ['No patient matches “' + esc(query) + '”', 'Check the spelling, or add them as a walk-in.', true]
      : filter === 'waiting' ? ['Nobody is waiting', 'The waiting room is clear. Checked-in patients will show here.', false]
      : filter === 'session' ? ['No sessions running', 'Send a waiting patient to their room to start a session.', false]
      : filter === 'done' ? ['No one has finished yet', 'Completed visits will appear here.', false]
      : ['No appointments left today', 'Add a walk-in if someone arrives without a booking.', true];
    list.innerHTML = `<li class="empty"><h3>${msg[0]}</h3><p>${msg[1]}</p>${msg[2] ? '<button type="button" class="btn btn-outline" data-walkin>Add walk-in</button>' : ''}</li>`;
    return;
  }
  const n = nowMin();
  let out = '', marked = false;
  const showNow = filter === 'all' && !query;
  for (const a of rows) {
    if (showNow && !marked && a.time > n) { out += `<li class="nowline" aria-label="Current time ${fmt(n)}">Now ${fmt(n)}</li>`; marked = true; }
    out += rowHTML(a);
  }
  list.innerHTML = out;
}

function renderDetail() {
  const el = $('detail');
  const a = appts.find(x => x.id === selected);
  if (!a) {
    el.innerHTML = `<div class="empty" style="margin:auto"><h3>Pick an appointment</h3><p>Tap anyone in the list to see their forms, balance and next step.</p></div>`;
    return;
  }
  const th = T[a.th];
  const act = ACTION[a.status];
  const flags = [];
  if (a.status !== 'done' && a.status !== 'noshow') {
    flags.push(a.form
      ? `<div class="flag ok">${ICON.done.replace('width="14" height="14"', 'width="18" height="18"')} Intake form received</div>`
      : `<div class="flag"><div><strong>Intake form missing</strong><span>Needed before treatment</span></div><button type="button" class="btn" data-form="${a.id}">Mark received</button></div>`);
    if (a.balance) flags.push(`<div class="flag"><div><strong>${money(a.balance)} to collect</strong><span>Outstanding from earlier visits</span></div><button type="button" class="btn" data-pay="${a.id}">Take payment</button></div>`);
  }
  let status = a.status === 'arrived' ? `Waiting ${waited(a)} min · arrived ${fmt(a.arrivedAt)}` : '';
  let extra = '';
  if (a.status === 'done') {
    extra = a.next
      ? `<div class="booked-ok">Next visit booked: ${esc(a.next)}</div>`
      : `<div class="slots"><h3>Book the next visit</h3><div class="slotrow">${['Tue 27 Oct, 10:00', 'Thu 29 Oct, 14:30', 'Tue 3 Nov, 09:15'].map(s => `<button type="button" class="slot" data-slot="${s}">${s}</button>`).join('')}</div></div>`;
  }
  const primary = act ? `<button type="button" class="btn btn-primary btn-lg" data-act="${a.id}">${act.label}</button>` : '';
  const secondary = [];
  if (a.phone) secondary.push(`<a class="btn btn-quiet" href="tel:${a.phone.replace(/\s/g, '')}">Call patient</a>`);
  if (a.status === 'booked') secondary.push(`<button type="button" class="btn btn-quiet" data-noshow="${a.id}">Mark no-show</button>`);
  el.innerHTML = `
    <div class="dhead">
      <button type="button" class="dclose" id="dclose" aria-label="Close details"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="m5 5 12 12M17 5 5 17" stroke="currentColor" stroke-width="2.400" stroke-linecap="round"/></svg></button>
      ${chip(a)}
      <h2 class="dname">${esc(a.patient)}</h2>
      <p class="dsub">${esc(a.type)} · ${esc(a.visit)}</p>
    </div>
    <div class="dbody">
      <dl class="facts">
        <dt>Time</dt><dd>${fmt(a.time)}–${fmt(a.time + a.dur)} (${a.dur} min)</dd>
        <dt>Therapist</dt><dd>${esc(th.name)}</dd>
        <dt>Room</dt><dd>${th.room}</dd>
        <dt>Phone</dt><dd>${esc(a.phone || 'Not on file')}</dd>
      </dl>
      ${status ? '' : ''}
      ${flags.length ? `<div class="flags">${flags.join('')}</div>` : ''}
      ${a.note ? `<p class="note"><b>Note:</b> ${esc(a.note)}</p>` : ''}
      ${extra}
    </div>
    ${(primary || secondary.length) ? `<div class="dactions">${primary}${secondary.length ? `<div class="pair">${secondary.join('')}</div>` : ''}</div>` : ''}`;
}

function render() {
  const focusKey = document.activeElement && document.activeElement.closest('#list, #detail, #tabs')
    ? ['data-pick', 'data-act', 'data-filter', 'data-form', 'data-pay', 'data-noshow', 'data-slot']
        .map(k => document.activeElement.hasAttribute(k) ? `[${k}="${document.activeElement.getAttribute(k)}"]` : '').find(Boolean)
    : null;
  const top = $('list').scrollTop;
  renderTabs(); renderTeam(); renderList(); renderDetail();
  $('list').scrollTop = top;
  if (focusKey) { const f = document.querySelector(focusKey); if (f) f.focus({ preventScroll: true }); }
}

function renderClock() {
  $('clock').textContent = fmt(nowMin());
  $('date').textContent = DAY_LABEL;
}

/* ---------- actions ---------- */
function snapshot() { undoSnap = JSON.stringify(appts); }
function toast(msg, withUndo = true) {
  $('toastMsg').textContent = msg;
  $('toastUndo').hidden = !withUndo;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 7000);
}

function advance(id) {
  const a = appts.find(x => x.id === id);
  const act = a && ACTION[a.status];
  if (!act) return;
  snapshot();
  const n = nowMin();
  const first = a.patient.split(' ')[0];
  if (act.next === 'arrived') a.arrivedAt = n;
  if (act.next === 'session') a.started = n;
  a.status = act.next;
  const msg = { arrived: `${first} is checked in`, session: `${first} sent to ${T[a.th].room}`, done: `${first} checked out` }[act.next];
  selected = a.id;
  render();
  toast(msg);
}

function openSheet() { document.body.classList.add('sheet-open'); }
function closeSheet() { document.body.classList.remove('sheet-open'); }

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-walkin]');
  if (!t) return;
  if (t.dataset.pick) { selected = +t.dataset.pick; render(); openSheet(); return; }
  if (t.dataset.act) { advance(+t.dataset.act); return; }
  if (t.dataset.filter) { filter = t.dataset.filter; history.replaceState(null, '', '#filter=' + filter); render(); return; }
  if (t.dataset.form) { snapshot(); appts.find(a => a.id === +t.dataset.form).form = true; render(); toast('Intake form marked as received'); return; }
  if (t.dataset.pay) { snapshot(); const a = appts.find(x => x.id === +t.dataset.pay); const amt = a.balance; a.balance = 0; render(); toast(`${money(amt)} payment recorded`); return; }
  if (t.dataset.noshow) { snapshot(); const a = appts.find(x => x.id === +t.dataset.noshow); a.status = 'noshow'; render(); toast(`${a.patient.split(' ')[0]} marked as no-show`); return; }
  if (t.dataset.slot) { snapshot(); const a = appts.find(x => x.id === selected); a.next = t.dataset.slot; render(); toast('Next visit booked'); return; }
  if (t.id === 'dclose') { closeSheet(); return; }
  if (t.hasAttribute('data-walkin')) openWalkin();
});
$('scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

$('toastUndo').addEventListener('click', () => {
  if (!undoSnap) return;
  appts = JSON.parse(undoSnap); undoSnap = null;
  render(); toast('Change undone', false);
});

$('q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); renderList(); });

/* walk-in dialog */
const dlg = $('dlg'), wName = $('wName');
function openWalkin() {
  $('wTher').innerHTML = THERAPISTS.map(t => {
    const busy = appts.some(a => a.th === t.id && a.status === 'session');
    return `<option value="${t.id}">${esc(t.name)}${busy ? ' (in session)' : ' (free)'}</option>`;
  }).join('');
  const free = THERAPISTS.find(t => !appts.some(a => a.th === t.id && a.status === 'session'));
  if (free) $('wTher').value = free.id;
  wName.value = ''; wName.removeAttribute('aria-invalid'); $('wNameErr').textContent = '';
  dlg.showModal(); wName.focus();
}
$('walkin').addEventListener('click', openWalkin);
$('wCancel').addEventListener('click', () => dlg.close());
function validName() {
  const bad = !wName.value.trim();
  wName.setAttribute('aria-invalid', bad);
  $('wNameErr').textContent = bad ? 'Enter the patient’s name so the therapist knows who is waiting.' : '';
  return !bad;
}
wName.addEventListener('blur', () => { if (wName.value || wName.getAttribute('aria-invalid')) validName(); });
$('walkForm').addEventListener('submit', e => {
  e.preventDefault();
  if (!validName()) { wName.focus(); return; }
  snapshot();
  const n = nowMin();
  const a = A(nextId++, '00:00', 30, wName.value.trim(), $('wTher').value, $('wType').value, 'arrived',
    { time: n, arrivedAt: n, visit: 'Walk-in', phone: '', note: 'Walk-in. Confirm contact details and send the intake form.', form: false });
  appts.push(a);
  selected = a.id;
  dlg.close();
  render(); openSheet();
  toast(`${a.patient.split(' ')[0]} added and checked in`);
});

/* ---------- boot ---------- */
(function boot() {
  const wait = appts.filter(a => a.status === 'arrived').sort((x, y) => x.arrivedAt - y.arrivedAt)[0];
  selected = wait ? wait.id : null;
  renderClock(); render();
  // bring the first not-yet-finished row to the top once layout has settled
  const toOpen = () => {
    const firstOpen = appts.find(a => a.status !== 'done');
    const row = firstOpen && document.querySelector(`[data-row="${firstOpen.id}"]`);
    const list = $('list');
    if (row && list.scrollHeight > list.clientHeight) list.scrollTop += row.getBoundingClientRect().top - list.getBoundingClientRect().top - 8;
  };
  requestAnimationFrame(toOpen);
  window.addEventListener('load', toOpen, { once: true });

  let lastMin = nowMin();
  setInterval(() => {
    const m = nowMin();
    if (m === lastMin) return;
    lastMin = m; renderClock();
    if (!dlg.open) render();
  }, 5000);
})();
</script>
