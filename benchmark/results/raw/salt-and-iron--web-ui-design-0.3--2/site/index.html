<!doctype html>
<html lang="en" data-size="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fbf7ef">
<title>Salt and Iron: visitor guide | Harwick Maritime Museum</title>
<meta name="description" content="The visitor guide to Salt and Iron at the Harwick Maritime Museum, 14 March to 2 November 2027. Twelve stops, each with a short text and an audio clip.">
<style>
:root {
  /* colour */
  --paper: #fbf7ef;
  --paper-2: #f1eadc;
  --ink: #1c1917;
  --ink-2: #4a433c;
  --line: #8a8176;
  --rust: #9c3d1f;
  --rust-press: #7d2f16;
  --error: #8f1d12;

  /* type */
  --serif: ui-serif, Georgia, "Iowan Old Style", Cambria, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  /* spacing, 4px base */
  --s1: .2rem; --s2: .4rem; --s3: .6rem; --s4: .8rem;
  --s5: 1.2rem; --s6: 1.6rem; --s7: 2.4rem; --s8: 3.2rem;

  --radius: 2px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}

html { font-size: 100%; -webkit-text-size-adjust: 100%; }
html[data-size="2"] { font-size: 112.5%; }
html[data-size="3"] { font-size: 125%; }

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1.25rem;
  line-height: 1.5;
  overflow-x: clip;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: env(safe-area-inset-bottom);
}
body.has-nav { padding-bottom: calc(8.5rem + env(safe-area-inset-bottom)); }

h1, h2, h3 { font-family: var(--serif); font-weight: 700; text-wrap: balance; overflow-wrap: anywhere; margin: 0; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; }
button { font: inherit; color: inherit; touch-action: manipulation; }
[hidden] { display: none !important; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
h1:focus { outline: none; }

.wrap { max-width: 36rem; margin-inline: auto; padding-inline: max(1.1rem, env(safe-area-inset-left)) max(1.1rem, env(safe-area-inset-right)); }

/* ---------- header ---------- */
.top { border-bottom: 3px solid var(--ink); }
.museum { font-family: var(--serif); font-size: 1rem; font-weight: 700; padding-block: var(--s4) 0; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); min-height: 3.4rem; flex-wrap: wrap; padding-block: var(--s2); }
.bar-link { display: inline-flex; align-items: center; min-height: 2.8rem; font-weight: 700; font-size: 1rem; text-underline-offset: .25em; text-decoration-thickness: 2px; }
.sizes { display: flex; align-items: center; gap: var(--s2); margin: 0; padding: 0; border: 0; }
.sizes legend { float: left; padding: 0; margin-right: var(--s3); font-size: 1rem; font-weight: 700; line-height: 2.8rem; }
.sizes button {
  width: 2.8rem; height: 2.8rem; padding: 0; background: var(--paper); border: 2px solid var(--ink);
  border-radius: var(--radius); font-family: var(--serif); font-weight: 700; line-height: 1; cursor: pointer;
  transition: transform 120ms var(--ease-out);
}
.sizes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.sizes button:active { transform: scale(.97); }

/* progress: twelve links, one per stop */
.progress { display: flex; margin: 0; padding: 0 0 var(--s3); list-style: none; }
.progress li { flex: 1; }
.progress a { display: flex; align-items: center; height: 2.8rem; padding-inline: 2px; }
.progress a::before { content: ""; display: block; width: 100%; height: .4rem; background: var(--line); border-radius: 1px; }
.progress a[aria-current="step"]::before { height: .8rem; background: var(--rust); }

/* ---------- home ---------- */
.home-head { padding-block: var(--s7) var(--s6); }
.home-head h1 { font-size: clamp(3rem, 14vw, 4.5rem); line-height: 1; letter-spacing: -.02em; }
.where { margin-top: var(--s5); font-size: 1.15rem; font-weight: 700; }
.when { margin-top: var(--s1); font-family: var(--serif); font-size: 1.6rem; font-weight: 700; }
.lede { margin-top: var(--s5); }

.btn {
  display: flex; flex-direction: column; justify-content: center; text-align: center; text-decoration: none;
  min-height: 4.4rem; padding: var(--s3) var(--s4); border: 3px solid var(--ink); border-radius: var(--radius);
  background: var(--paper); color: var(--ink); font-weight: 700; font-size: 1.1rem; line-height: 1.25; cursor: pointer;
  transition: transform 120ms var(--ease-out), background-color 120ms;
}
.btn small { display: block; font-size: .9rem; font-weight: 700; }
.btn .t { font-family: var(--serif); font-size: 1.1rem; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--rust); border-color: var(--rust); color: #fff; }
.btn-primary:active { background: var(--rust-press); border-color: var(--rust-press); }
.btn-ink { background: var(--ink); color: var(--paper); }
@media (hover: hover) {
  .btn:hover { background: var(--paper-2); }
  .btn-primary:hover { background: var(--rust-press); border-color: var(--rust-press); }
  .btn-ink:hover { background: #3a342f; }
}
.start { margin-top: var(--s6); font-size: 1.35rem; min-height: 5rem; }

.block { padding-block: var(--s7) 0; }
.block h2 { font-size: 1.7rem; line-height: 1.15; padding-bottom: var(--s3); border-bottom: 3px solid var(--ink); }
.block > p { margin-top: var(--s4); }

.stops { list-style: none; margin: 0; padding: 0; }
.stops li { border-bottom: 1px solid var(--line); }
.stops a { display: flex; align-items: center; gap: var(--s4); min-height: 4.4rem; padding-block: var(--s3); text-decoration: none; }
.stops .n { flex: none; width: 2.6rem; font-family: var(--serif); font-size: 2rem; font-weight: 700; color: var(--rust); text-align: right; font-variant-numeric: tabular-nums; }
.stops .name { font-family: var(--serif); font-size: 1.35rem; font-weight: 700; line-height: 1.2; text-wrap: balance; overflow-wrap: anywhere; }
.stops a[aria-current="true"] .name { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: .2em; }
@media (hover: hover) { .stops a:hover .name { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: .2em; } }

.offline .btn { margin-top: var(--s5); }
.meter { margin-top: var(--s4); font-weight: 700; }
.meter.bad { color: var(--error); }

.foot { margin-top: var(--s8); padding-block: var(--s5) var(--s7); border-top: 3px solid var(--ink); font-size: 1rem; color: var(--ink-2); }

/* ---------- stop ---------- */
.stop-head { display: flex; gap: var(--s5); align-items: flex-start; padding-block: var(--s6) var(--s5); }
.plate {
  flex: none; position: relative; width: 5.4rem; height: 5.4rem; display: grid; place-content: center; text-align: center;
  background: var(--rust); color: #fff; border-radius: var(--radius);
  background-image:
    radial-gradient(circle at 9px 9px, rgba(255,255,255,.7) 0 3px, transparent 3.5px),
    radial-gradient(circle at calc(100% - 9px) 9px, rgba(255,255,255,.7) 0 3px, transparent 3.5px),
    radial-gradient(circle at 9px calc(100% - 9px), rgba(255,255,255,.7) 0 3px, transparent 3.5px),
    radial-gradient(circle at calc(100% - 9px) calc(100% - 9px), rgba(255,255,255,.7) 0 3px, transparent 3.5px);
}
.plate span { display: block; font-size: .8rem; font-weight: 700; line-height: 1; }
.plate b { display: block; font-family: var(--serif); font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stop-head h1 { font-size: clamp(2.1rem, 8.4vw, 3rem); line-height: 1.08; letter-spacing: -.015em; padding-top: .1rem; }
.of { margin-top: var(--s2); font-size: 1rem; color: var(--ink-2); font-weight: 700; }

.audio { border-top: 3px solid var(--ink); border-bottom: 1px solid var(--line); padding-block: var(--s5); }
.audio-row { display: flex; align-items: center; gap: var(--s4); }
.play {
  flex: none; width: 4.6rem; height: 4.6rem; display: grid; place-items: center; padding: 0;
  background: var(--ink); color: var(--paper); border: 0; border-radius: 50%; cursor: pointer;
  transition: transform 120ms var(--ease-out);
}
.play:active { transform: scale(.97); }
.play svg { width: 2rem; height: 2rem; fill: currentColor; }
.audio-info { flex: 1; min-width: 0; }
#astate { font-weight: 700; line-height: 1.25; }
#atime { color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.back15 { flex: none; width: auto; min-width: 3.6rem; min-height: 3.4rem; padding-inline: var(--s3); font-size: 1rem; }
.seek { display: block; width: 100%; height: 2.8rem; margin: var(--s3) 0 0; accent-color: var(--rust); }
.seek:disabled { opacity: .45; }
.aerr { margin-top: var(--s4); padding: var(--s4); border: 3px solid var(--error); border-radius: var(--radius); color: var(--ink); }
.aerr p { font-weight: 700; }
.aerr .btn { margin-top: var(--s3); min-height: 3.6rem; }

.label-text { padding-block: var(--s5) var(--s6); }
.sample { display: inline-block; margin-bottom: var(--s4); padding: var(--s1) var(--s3); border: 2px dashed var(--ink); font-size: .95rem; font-weight: 700; }
.label-text p { font-family: var(--serif); font-size: 1.15rem; line-height: 1.6; }
.label-text p + p { margin-top: var(--s4); }

/* previous / next */
.nav {
  position: fixed; inset: auto 0 0 0; background: var(--paper); border-top: 3px solid var(--ink);
  padding: var(--s4) max(1.1rem, env(safe-area-inset-right)) calc(var(--s4) + env(safe-area-inset-bottom)) max(1.1rem, env(safe-area-inset-left));
}
.nav-in { max-width: 36rem; margin-inline: auto; display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); }
.nav .btn { min-height: 4.6rem; }

@media (prefers-reduced-motion: reduce) {
  .btn, .play, .sizes button { transition: none; }
  .btn:active, .play:active, .sizes button:active { transform: none; }
}
@media (min-width: 700px) {
  .home-head { padding-top: var(--s8); }
}
</style>
</head>
<body>
<noscript>
  <div class="wrap" style="padding-block:2rem">
    <h1 style="font-size:2.5rem">Salt and Iron</h1>
    <p style="margin-top:1rem">This guide needs JavaScript to show the twelve stops. Please turn it on, or ask a member of staff for a printed guide.</p>
  </div>
</noscript>

<header class="top">
  <div class="wrap">
    <div class="museum">Harwick Maritime Museum</div>
    <div class="bar">
      <a class="bar-link" id="allstops" href="#" hidden>All stops</a>
      <fieldset class="sizes" id="sizes">
        <legend>Text size</legend>
        <button type="button" data-size="1" aria-label="Standard text" aria-pressed="true" style="font-size:16px">A</button>
        <button type="button" data-size="2" aria-label="Larger text" aria-pressed="false" style="font-size:21px">A</button>
        <button type="button" data-size="3" aria-label="Largest text" aria-pressed="false" style="font-size:27px">A</button>
      </fieldset>
    </div>
    <nav aria-label="Stops"><ol class="progress" id="progress"></ol></nav>
  </div>
</header>

<main id="view" class="wrap"></main>

<div class="nav" id="nav" hidden>
  <div class="nav-in" id="navin"></div>
</div>

<script id="stops" type="application/json">
[
  { "title": "The salt road",           "audio": "audio/01-the-salt-road.mp3" },
  { "title": "Boiling houses",          "audio": "audio/02-boiling-houses.mp3" },
  { "title": "The harbour in 1840",     "audio": "audio/03-the-harbour-in-1840.mp3" },
  { "title": "Iron arrives",            "audio": "audio/04-iron-arrives.mp3" },
  { "title": "The Harwick Lady",        "audio": "audio/05-the-harwick-lady.mp3" },
  { "title": "Rivets and riveters",     "audio": "audio/06-rivets-and-riveters.mp3" },
  { "title": "A ship's salt store",     "audio": "audio/07-a-ships-salt-store.mp3" },
  { "title": "Smugglers and the excise","audio": "audio/08-smugglers-and-the-excise.mp3" },
  { "title": "The great storm of 1872", "audio": "audio/09-the-great-storm-of-1872.mp3" },
  { "title": "Women of the quay",       "audio": "audio/10-women-of-the-quay.mp3" },
  { "title": "Last of the salt boats",  "audio": "audio/11-last-of-the-salt-boats.mp3" },
  { "title": "What remains",            "audio": "audio/12-what-remains.mp3" }
]
</script>

<script>
/*
  To add the real label for a stop, add  "text": ["First paragraph.", "Second paragraph."]
  to its entry above. Stops without "text" show the labelled sample text.
*/
const STOPS = JSON.parse(document.getElementById('stops').textContent);
const TOTAL = STOPS.length;
const CACHE = 'salt-iron-v1';
const $ = (id) => document.getElementById(id);
const view = $('view');
const audio = new Audio();
audio.preload = 'none';

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } }
};

function sampleText(title) {
  return [
    `This is sample text for the stop “${title}”. The real label, about 120 words long, will replace it before the exhibition opens. It is here so you can check how a stop reads on a phone, in the gallery or outdoors in bright light.`,
    `Each stop in Salt and Iron has a short text like this one and an audio clip of one to three minutes. Use the buttons at the bottom of the screen to move to the next or previous stop, or go back to the list to jump to any stop. If your signal drops, the text stays on the screen and the audio can be saved beforehand.`
  ];
}

/* ---------- text size ---------- */
function setSize(n) {
  document.documentElement.dataset.size = n;
  document.querySelectorAll('#sizes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.size === String(n))));
  store.set('size', n);
}
$('sizes').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setSize(b.dataset.size); });
setSize(['1', '2', '3'].includes(store.get('size')) ? store.get('size') : '1');

/* ---------- progress strip ---------- */
function renderProgress(current) {
  $('progress').innerHTML = STOPS.map((s, i) =>
    `<li><a href="#${i + 1}" aria-label="Stop ${i + 1}: ${esc(s.title)}"${i + 1 === current ? ' aria-current="step"' : ''}></a></li>`).join('');
}

/* ---------- home ---------- */
function renderHome() {
  const last = parseInt(store.get('last'), 10);
  const resume = last >= 1 && last <= TOTAL ? last : 0;
  document.title = 'Salt and Iron: visitor guide | Harwick Maritime Museum';
  $('allstops').hidden = true;
  $('nav').hidden = true;
  document.body.classList.remove('has-nav');
  renderProgress(0);
  view.innerHTML = `
    <section class="home-head">
      <h1>Salt and Iron</h1>
      <p class="where">Harwick Maritime Museum</p>
      <p class="when">14 March to 2 November 2027</p>
      <p class="lede">Scan the code at each stop, or pick a stop from the list. Every stop has a short text and an audio clip of 1 to 3 minutes.</p>
      <a class="btn btn-primary start" href="#${resume || 1}">${resume ? `Continue at stop ${resume}` : 'Start at stop 1'}</a>
    </section>
    <section class="block" aria-labelledby="all-h">
      <h2 id="all-h">All 12 stops</h2>
      <ol class="stops">
        ${STOPS.map((s, i) => `<li><a href="#${i + 1}"${i + 1 === resume ? ' aria-current="true"' : ''}><span class="n">${i + 1}</span><span class="name">${esc(s.title)}</span></a></li>`).join('')}
      </ol>
    </section>
    <section class="block offline" id="offline" aria-labelledby="off-h" hidden>
      <h2 id="off-h">Weak signal in the galleries?</h2>
      <p>Save the audio to this phone while you are on Wi-Fi. The texts already work without a signal once this page has loaded.</p>
      <button class="btn btn-ink" id="saveall" type="button">Save all audio for offline</button>
      <p class="meter" id="meter" role="status"></p>
    </section>
    <footer class="foot">The stop texts in this guide are sample text until the final gallery labels are added.</footer>`;
  setupOffline();
}

/* ---------- offline saving ---------- */
async function cachedCount() {
  const c = await caches.open(CACHE);
  let n = 0;
  for (const s of STOPS) if (await c.match(s.audio)) n++;
  return n;
}
async function setupOffline() {
  if (!('caches' in window)) return;
  const sec = $('offline'), btn = $('saveall'), meter = $('meter');
  sec.hidden = false;
  const show = async () => {
    const n = await cachedCount();
    meter.className = 'meter';
    meter.textContent = n === TOTAL ? 'All 12 clips are saved on this phone.' : `${n} of ${TOTAL} clips saved on this phone.`;
    btn.textContent = n === TOTAL ? 'Check saved audio again' : 'Save all audio for offline';
  };
  show();
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.textContent = 'Saving…';
    const c = await caches.open(CACHE);
    let failed = 0, done = 0;
    for (const s of STOPS) {
      try {
        if (!(await c.match(s.audio))) {
          const r = await fetch(s.audio);
          if (!r.ok) throw new Error(r.status);
          await c.put(s.audio, r);
        }
      } catch { failed++; }
      done++;
      meter.className = 'meter';
      meter.textContent = `Saving… ${done} of ${TOTAL}`;
    }
    btn.disabled = false;
    await show();
    if (failed) {
      meter.className = 'meter bad';
      meter.textContent += ` ${failed} could not be saved. Check your signal and try again.`;
    }
  });
}

/* ---------- stop ---------- */
const fmt = (t) => (isFinite(t) ? `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}` : '--:--');
const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';

function renderStop(n) {
  const s = STOPS[n - 1];
  store.set('last', n);
  document.title = `Stop ${n}: ${s.title} | Salt and Iron`;
  $('allstops').hidden = false;
  renderProgress(n);
  const paras = s.text || sampleText(s.title);
  view.innerHTML = `
    <article>
      <div class="stop-head">
        <div class="plate" aria-hidden="true"><span>Stop</span><b>${n}</b></div>
        <div>
          <h1 tabindex="-1" id="title">${esc(s.title)}</h1>
          <p class="of">Stop ${n} of ${TOTAL}</p>
        </div>
      </div>
      <section class="audio" aria-label="Audio clip">
        <div class="audio-row">
          <button class="play" id="play" type="button" aria-label="Play audio">${ICON_PLAY}</button>
          <div class="audio-info">
            <div id="astate" role="status">Audio clip, 1 to 3 minutes</div>
            <div id="atime">0:00 / --:--</div>
          </div>
          <button class="btn back15" id="back15" type="button" aria-label="Back 15 seconds">Back 15 s</button>
        </div>
        <input class="seek" id="seek" type="range" min="0" max="1000" value="0" step="1" disabled aria-label="Position in audio">
        <div class="aerr" id="aerr" role="alert" hidden>
          <p>The audio could not load. Check your signal and try again. The text below says the same thing.</p>
          <button class="btn" id="retry" type="button">Try the audio again</button>
        </div>
      </section>
      <section class="label-text" aria-label="Stop text">
        ${s.text ? '' : '<span class="sample">Sample text</span>'}
        ${paras.map((p) => `<p>${esc(p)}</p>`).join('')}
      </section>
    </article>`;
  setupAudio(s);

  const prev = n > 1 ? STOPS[n - 2] : null;
  const next = n < TOTAL ? STOPS[n] : null;
  $('navin').innerHTML =
    (prev ? `<a class="btn" href="#${n - 1}"><small>Previous stop</small><span class="t">${esc(prev.title)}</span></a>`
          : `<a class="btn" href="#"><small>Back to</small><span class="t">All stops</span></a>`) +
    (next ? `<a class="btn btn-primary" href="#${n + 1}"><small>Next stop</small><span class="t">${esc(next.title)}</span></a>`
          : `<a class="btn btn-primary" href="#"><small>That is the last stop</small><span class="t">Back to all stops</span></a>`);
  $('nav').hidden = false;
  document.body.classList.add('has-nav');
}

function setupAudio(s) {
  const play = $('play'), state = $('astate'), time = $('atime'), seek = $('seek'), err = $('aerr');
  let loading = false;
  audio.src = s.audio;

  const times = () => {
    time.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
    if (isFinite(audio.duration) && audio.duration > 0) {
      seek.disabled = false;
      seek.value = Math.round((audio.currentTime / audio.duration) * 1000);
    }
  };
  const ui = (playing, text) => {
    play.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    play.setAttribute('aria-label', playing ? 'Pause audio' : (audio.ended ? 'Play audio again' : 'Play audio'));
    state.textContent = text;
  };
  const fail = () => {
    loading = false;
    ui(false, 'Audio not available');
    err.hidden = false;
    seek.disabled = true;
  };

  audio.onerror = fail;
  audio.onloadedmetadata = audio.ondurationchange = times;
  audio.ontimeupdate = times;
  audio.onwaiting = () => { loading = true; state.textContent = 'Loading audio…'; };
  audio.onplaying = () => { loading = false; err.hidden = true; ui(true, 'Playing'); };
  audio.onpause = () => { if (!audio.ended) ui(false, 'Paused'); };
  audio.onended = () => { ui(false, 'Finished'); play.setAttribute('aria-label', 'Play audio again'); };

  const start = () => {
    err.hidden = true;
    state.textContent = 'Loading audio…';
    loading = true;
    audio.play().catch((e) => { if (e && e.name !== 'AbortError') fail(); });
  };
  play.onclick = () => { (audio.paused || audio.ended) ? start() : audio.pause(); };
  $('back15').onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 15); times(); };
  seek.oninput = () => { if (isFinite(audio.duration)) { audio.currentTime = (seek.value / 1000) * audio.duration; times(); } };
  $('retry').onclick = () => { audio.load(); start(); };
}

/* ---------- routing ---------- */
let first = true;
function route() {
  audio.pause();
  audio.removeAttribute('src');
  const n = parseInt(location.hash.replace('#', '').replace(/^\/?(stop[-/])?/, ''), 10);
  if (n >= 1 && n <= TOTAL) renderStop(n); else renderHome();
  window.scrollTo(0, 0);
  if (!first) { const h = view.querySelector('h1'); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } }
  first = false;
}
window.addEventListener('hashchange', route);
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea') || e.altKey || e.ctrlKey || e.metaKey) return;
  const n = parseInt(location.hash.slice(1), 10);
  if (!(n >= 1)) return;
  if (e.key === 'ArrowRight' && n < TOTAL) location.hash = n + 1;
  if (e.key === 'ArrowLeft' && n > 1) location.hash = n - 1;
});
route();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* guide still works online */ });
}
</script>
