<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Front desk · Kestrel Physio</title>
<style>
:root {
  /* primitives: teal ramp built around the brand #2a7f7a */
  --teal-50: #eef6f5;
  --teal-100: #dcedeb;
  --teal-600: #2a7f7a;
  --teal-700: #226a66;
  --teal-800: #1b5450;
  --ink-900: #17302e;
  --ink-700: #3f5957;
  --ink-600: #566e6c;
  --ink-500: #62787a;
  --line: #d3e2e0;
  --paper: #f5f9f8;

  /* semantic tokens */
  --color-bg: var(--paper);
  --color-surface: #fff;
  --color-text: var(--ink-900);
  --color-text-secondary: var(--ink-700);
  --color-text-tertiary: var(--ink-600);
  --color-border: var(--line);
  --color-accent: var(--teal-600);
  --color-accent-hover: var(--teal-700);
  --color-accent-press: var(--teal-800);
  --color-accent-tint: var(--teal-50);
  --color-accent-text: var(--teal-800);
  --color-warn-bg: #fdf1dc;
  --color-warn-text: #7d4300;
  --color-danger-bg: #fbe9e7;
  --color-danger-text: #9a2d26;
  --color-focus: #0b57d0;

  --font: "Avenir Next", "Nunito Sans", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --fs-sm: 15px;
  --fs-body: 18px;
  --fs-lg: 22px;
  --fs-xl: 28px;
  --fs-num: 40px;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px;
  --r-sm: 10px; --r-md: 16px; --r-lg: 20px; --r-pill: 999px;
  --ring: 0 0 0 1px rgb(23 48 46 / .08);
  --shadow: 0 1px 2px rgb(23 48 46 / .05), 0 6px 18px rgb(23 48 46 / .06);

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --t-press: 120ms;
  --t-menu: 200ms;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font: 400 var(--fs-body)/1.5 var(--font);
  overflow-x: clip;
  padding-bottom: env(safe-area-inset-bottom);
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.01em; }
p { text-wrap: pretty; }
button, input, select { font: inherit; color: inherit; }
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; border-radius: 6px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: 52px; padding: 0 var(--s6);
  border-radius: var(--r-md); border: 2px solid transparent;
  font-weight: 700; font-size: var(--fs-body); line-height: 1.2; text-decoration: none; text-align: center;
  transition: background-color var(--t-menu) var(--ease-out), transform var(--t-press) var(--ease-out), border-color var(--t-menu) var(--ease-out);
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--color-accent); color: #fff; }
.btn-secondary { background: var(--color-surface); color: var(--color-accent-text); border-color: var(--color-accent); }
.btn-quiet { background: transparent; color: var(--color-text-secondary); border-color: var(--color-border); }
@media (hover: hover) {
  .btn-primary:hover { background: var(--color-accent-hover); }
  .btn-secondary:hover { background: var(--color-accent-tint); }
  .btn-quiet:hover { background: var(--color-accent-tint); }
}
.btn-primary:active { background: var(--color-accent-press); }
.btn-sm { min-height: 48px; padding: 0 var(--s5); }

/* header */
.top {
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
}
.top-in {
  max-width: 1360px; margin: 0 auto; padding: var(--s4) var(--s6);
  display: flex; align-items: center; gap: var(--s6); flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: var(--s3); margin-right: auto; }
.brand svg { flex: none; }
.brand b { display: block; font-size: var(--fs-lg); line-height: 1.1; }
.brand span { font-size: var(--fs-sm); color: var(--color-text-tertiary); }
.today { text-align: right; }
.today b { display: block; font-size: var(--fs-lg); line-height: 1.2; }
.today span { font-size: var(--fs-sm); color: var(--color-text-tertiary); }

main { max-width: 1360px; margin: 0 auto; padding: var(--s6); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s4); }
.stat {
  background: var(--color-surface); border-radius: var(--r-lg); padding: var(--s5) var(--s6);
  box-shadow: var(--ring), var(--shadow);
}
.stat dt { font-size: var(--fs-sm); color: var(--color-text-tertiary); font-weight: 600; }
.stat dd { margin: 0; font-size: var(--fs-num); font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
.stat small { font-size: var(--fs-sm); color: var(--color-text-tertiary); font-weight: 500; letter-spacing: 0; }
.stat.alert dd { color: var(--color-warn-text); }

/* day strip: the signature element */
.day { margin-top: var(--s4); background: var(--color-surface); border-radius: var(--r-lg); padding: var(--s4) var(--s6) var(--s5); box-shadow: var(--ring), var(--shadow); }
.day-head { display: flex; justify-content: space-between; gap: var(--s4); flex-wrap: wrap; font-size: var(--fs-sm); color: var(--color-text-tertiary); font-weight: 600; }
.day-track { position: relative; height: 36px; margin-top: var(--s3); background: var(--color-accent-tint); border-radius: var(--r-pill); }
.day-seg { position: absolute; top: 6px; bottom: 6px; border-radius: var(--r-pill); min-width: 6px; background: #b8d2cf; transition: background-color var(--t-menu) var(--ease-out); }
.day-seg.done { background: var(--teal-600); opacity: .35; }
.day-seg.session { background: var(--teal-600); }
.day-seg.arrived { background: #d98a1d; }
.day-seg.noshow { background: transparent; box-shadow: inset 0 0 0 2px #c9a3a0; }
.day-now { position: absolute; top: -6px; bottom: -6px; width: 3px; background: var(--color-text); border-radius: 2px; }
.day-now::after { content: attr(data-t); position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 700; white-space: nowrap; background: var(--color-text); color: #fff; padding: 0 6px; border-radius: 6px; line-height: 20px; }
.day-ticks { position: relative; height: 22px; margin-top: var(--s2); font-size: 13px; color: var(--color-text-tertiary); }
.day-ticks span { position: absolute; transform: translateX(-50%); }
.day-ticks span:first-child { transform: none; }
.day-ticks span:last-child { transform: translateX(-100%); }

/* layout */
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: var(--s6); margin-top: var(--s6); align-items: start; }
.cols > aside { position: sticky; top: var(--s4); order: 2; }
.panel-title { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s3); }
.panel-title h2 { font-size: var(--fs-xl); line-height: 1.2; }
.panel-title span { font-size: var(--fs-sm); color: var(--color-text-tertiary); font-weight: 600; }

/* waiting room */
.wait-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s3); }
.wcard { background: var(--color-surface); border-radius: var(--r-lg); padding: var(--s5); box-shadow: var(--ring), var(--shadow); }
.wcard-top { display: flex; justify-content: space-between; gap: var(--s3); align-items: flex-start; }
.wcard h3 { font-size: var(--fs-lg); line-height: 1.25; overflow-wrap: anywhere; }
.wcard p { color: var(--color-text-secondary); font-size: var(--fs-sm); margin-top: var(--s1); overflow-wrap: anywhere; }
.wait-time { text-align: right; flex: none; font-weight: 800; font-size: var(--fs-lg); line-height: 1.1; }
.wait-time small { display: block; font-size: 13px; font-weight: 600; color: var(--color-text-tertiary); }
.wait-time.long { color: var(--color-warn-text); }
.wcard .btn { width: 100%; margin-top: var(--s4); }
.empty { background: var(--color-surface); border-radius: var(--r-lg); padding: var(--s6); box-shadow: var(--ring); color: var(--color-text-secondary); }
.empty b { display: block; color: var(--color-text); font-size: var(--fs-lg); margin-bottom: var(--s1); }
.empty .btn { margin-top: var(--s4); }

.rooms { margin-top: var(--s6); }
.room-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.room { background: var(--color-surface); border-radius: var(--r-md); padding: var(--s3) var(--s4); box-shadow: var(--ring); font-size: var(--fs-sm); min-width: 0; }
.room b { display: block; font-size: var(--fs-body); }
.room span { color: var(--color-text-secondary); display: block; overflow-wrap: anywhere; }
.room.busy { background: var(--color-accent-tint); }

/* toolbar */
.toolbar { display: flex; gap: var(--s3); flex-wrap: wrap; align-items: center; margin-bottom: var(--s4); }
.search { position: relative; flex: 1 1 260px; }
.search input {
  width: 100%; min-height: 52px; padding: 0 var(--s4) 0 var(--s12);
  border: 2px solid var(--color-border); border-radius: var(--r-md); background: var(--color-surface); font-size: 18px;
}
.search input:focus-visible { outline-offset: 0; border-color: var(--color-focus); }
.search svg { position: absolute; left: var(--s4); top: 50%; transform: translateY(-50%); pointer-events: none; }
.chips { display: flex; gap: var(--s2); flex-wrap: wrap; width: 100%; }
.chip {
  min-height: 48px; padding: 0 var(--s4); border-radius: var(--r-pill); background: var(--color-surface);
  border: 2px solid var(--color-border); font-weight: 600; font-size: var(--fs-sm);
  transition: background-color var(--t-menu) var(--ease-out), transform var(--t-press) var(--ease-out);
}
.chip:active { transform: scale(0.97); }
.chip[aria-pressed="true"] { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
@media (hover: hover) { .chip[aria-pressed="false"]:hover { background: var(--color-accent-tint); } }

/* schedule */
.sched { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s3); }
.appt { background: var(--color-surface); border-radius: var(--r-lg); box-shadow: var(--ring), var(--shadow); overflow: clip; }
.appt.is-done { background: #fbfdfc; }
.appt.is-done .appt-name, .appt.is-noshow .appt-name { color: var(--color-text-secondary); }
.appt-row { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: var(--s4); align-items: center; padding: var(--s4) var(--s5); }
.appt-time { font-weight: 800; font-size: var(--fs-lg); line-height: 1.1; }
.appt-time small { display: block; font-size: 13px; font-weight: 600; color: var(--color-text-tertiary); }
.appt-main { background: none; border: 0; padding: 0; text-align: left; min-width: 0; min-height: 52px; display: block; border-radius: 8px; }
.appt-name { display: block; font-weight: 700; font-size: var(--fs-lg); line-height: 1.25; overflow-wrap: anywhere; }
.appt-sub { display: block; font-size: var(--fs-sm); color: var(--color-text-secondary); overflow-wrap: anywhere; }
.appt-side { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; justify-content: flex-end; }

.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 12px; min-height: 30px; border-radius: var(--r-pill); font-size: var(--fs-sm); font-weight: 700; white-space: nowrap; }
.badge svg { flex: none; }
.b-scheduled { background: #eaf0ef; color: var(--ink-700); }
.b-late { background: var(--color-warn-bg); color: var(--color-warn-text); }
.b-arrived { background: var(--color-warn-bg); color: var(--color-warn-text); }
.b-session { background: var(--color-accent-tint); color: var(--color-accent-text); }
.b-done { background: #eaf0ef; color: var(--ink-700); }
.b-noshow { background: var(--color-danger-bg); color: var(--color-danger-text); }
.b-due { background: var(--color-warn-bg); color: var(--color-warn-text); }

.detail { border-top: 1px solid var(--color-border); padding: var(--s5); background: var(--color-accent-tint); display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--s4) var(--s6); }
.detail[hidden] { display: none; }
.detail h4 { margin: 0 0 var(--s1); font-size: 13px; font-weight: 700; color: var(--color-text-tertiary); }
.detail p { font-size: var(--fs-body); overflow-wrap: anywhere; }
.detail a { color: var(--color-accent-text); font-weight: 700; display: inline-block; padding: var(--s2) 0; min-height: 44px; }
.detail .acts { grid-column: 1 / -1; display: flex; gap: var(--s3); flex-wrap: wrap; }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--s6) + env(safe-area-inset-bottom)); transform: translateX(-50%) scale(.95);
  background: var(--color-text); color: #fff; border-radius: var(--r-md); padding: var(--s2) var(--s2) var(--s2) var(--s5);
  display: flex; align-items: center; gap: var(--s4); max-width: calc(100vw - 32px); opacity: 0; pointer-events: none; visibility: hidden;
  transition: opacity var(--t-menu) var(--ease-out), transform var(--t-menu) var(--ease-out); z-index: 20; box-shadow: 0 10px 30px rgb(23 48 46 / .3);
}
.toast.show { visibility: visible; opacity: 1; transform: translateX(-50%) scale(1); pointer-events: auto; }
.toast button { background: #fff; color: var(--color-text); border: 0; border-radius: var(--r-sm); min-height: 48px; padding: 0 var(--s5); font-weight: 700; }

/* dialog */
dialog { border: 0; border-radius: var(--r-lg); padding: 0; width: min(560px, calc(100vw - 24px)); box-shadow: 0 20px 60px rgb(23 48 46 / .35); color: var(--color-text); }
dialog::backdrop { background: rgb(23 48 46 / .45); }
dialog[open] { animation: pop var(--t-menu) var(--ease-out); }
@keyframes pop { from { opacity: 0; transform: scale(.95); } }
.dlg { padding: var(--s6); display: grid; gap: var(--s4); }
.dlg h2 { font-size: var(--fs-xl); }
.field { display: grid; gap: var(--s1); }
.field label { font-weight: 700; font-size: var(--fs-sm); }
.field input, .field select { min-height: 52px; padding: 0 var(--s4); border: 2px solid var(--color-border); border-radius: var(--r-md); background: #fff; font-size: 18px; width: 100%; }
.field input:focus-visible, .field select:focus-visible { outline-offset: 0; border-color: var(--color-focus); }
.field [aria-invalid="true"] { border-color: var(--color-danger-text); }
.err { color: var(--color-danger-text); font-size: var(--fs-sm); font-weight: 600; min-height: 0; }
.err:empty { display: none; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); }
.dlg-acts { display: flex; gap: var(--s3); justify-content: flex-end; flex-wrap: wrap; }

@media (max-width: 1100px) {
  .cols { grid-template-columns: 1fr; }
  .cols > aside { position: static; order: 0; }
  .wait-list { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
}
@media (max-width: 760px) {
  main { padding: var(--s4); }
  .top-in { padding: var(--s3) var(--s4); gap: var(--s3); }
  .stats { grid-template-columns: 1fr 1fr; gap: var(--s3); }
  .stat { padding: var(--s4); }
  :root { --fs-num: 34px; }
  .appt-row { grid-template-columns: 1fr; gap: var(--s2); padding: var(--s4); }
  .appt-time { display: flex; gap: var(--s2); align-items: baseline; }
  .appt-side { justify-content: flex-start; }
  .appt-side .btn { flex: 1 1 140px; }
  .row2 { grid-template-columns: 1fr; }
  .today { text-align: left; }
  .toolbar .btn { width: 100%; }
  .day { padding: var(--s4); }
}
@media (prefers-reduced-motion: reduce) {
  .btn, .chip, .toast, dialog[open] { transition-property: opacity, background-color; animation: none; }
  .btn:active, .chip:active { transform: none; }
  .toast { transform: translateX(-50%); }
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><rect width="44" height="44" rx="12" fill="#2a7f7a"/><path d="M8 27c6-1 10-5 13-11 1 4 3 6 6 7 3 1 6 0 9-3-1 7-7 12-14 12-5 0-9-2-14-5z" fill="#fff"/><circle cx="31" cy="18" r="1.6" fill="#2a7f7a"/></svg>
      <div><b>Kestrel Physio</b><span>Front desk</span></div>
    </div>
    <button class="btn btn-secondary" id="newBtn" type="button">New booking</button>
    <div class="today"><b id="dateLine">Tuesday 20 October</b><span class="num" id="clockLine">Sample clock</span></div>
  </div>
</header>

<main>
  <h1 class="sr">Today at the front desk</h1>

  <dl class="stats" id="stats"></dl>

  <section class="day" aria-labelledby="dayT">
    <div class="day-head"><span id="dayT">Today's day, 8:00 to 17:00</span><span id="dayKey">Amber: waiting · Teal: in session · Faded: finished</span></div>
    <div class="day-track" id="track" aria-hidden="true"></div>
    <div class="day-ticks num" id="ticks" aria-hidden="true"></div>
  </section>

  <div class="cols">
    <aside aria-labelledby="waitT">
      <div class="panel-title"><h2 id="waitT">Waiting room</h2><span id="waitCount"></span></div>
      <ul class="wait-list" id="waitList"></ul>

      <div class="rooms">
        <div class="panel-title"><h2 style="font-size:var(--fs-lg)">Rooms</h2></div>
        <div class="room-grid" id="rooms"></div>
      </div>
    </aside>

    <section aria-labelledby="schedT">
      <div class="panel-title"><h2 id="schedT">Today's schedule</h2><span id="schedCount"></span></div>
      <div class="toolbar">
        <div class="search">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#566e6c" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <label class="sr" for="q">Search patients</label>
          <input id="q" type="search" placeholder="Search patient or clinician" autocomplete="off" enterkeyhint="search">
        </div>
        <div class="chips" id="chips" role="group" aria-label="Filter by clinician"></div>
      </div>
      <ol class="sched" id="sched"></ol>
    </section>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="toastUndo">Undo</button></div>

<dialog id="dlg" aria-labelledby="dlgT">
  <form class="dlg" id="bookForm" method="dialog" novalidate>
    <h2 id="dlgT">New booking</h2>
    <div class="field"><label for="fName">Patient name</label><input id="fName" name="name" autocomplete="off" required><p class="err" id="eName"></p></div>
    <div class="field"><label for="fPhone">Mobile number</label><input id="fPhone" name="phone" type="tel" inputmode="tel" autocomplete="off" required><p class="err" id="ePhone"></p></div>
    <div class="row2">
      <div class="field"><label for="fClin">Clinician</label><select id="fClin" name="clin"></select></div>
      <div class="field"><label for="fType">Visit type</label><select id="fType" name="type"><option>Follow-up · 30 min</option><option>Initial assessment · 60 min</option><option>Review · 30 min</option></select></div>
    </div>
    <div class="field"><label for="fTime">Time today</label><input id="fTime" name="time" type="time" min="08:00" max="17:00" step="900" value="14:00" required><p class="err" id="eTime"></p></div>
    <div class="dlg-acts">
      <button class="btn btn-quiet" type="button" id="cancelBook">Cancel</button>
      <button class="btn btn-primary" type="submit">Book appointment</button>
    </div>
  </form>
</dialog>

<script>
/* ---------- sample data (replace with real feed) ---------- */
const CLINICIANS = [

  { id: 'pr', name: 'Priya Raman', short: 'Priya', room: 'Room 3' },
  { id: 'le', name: 'Lars Eriksen', short: 'Lars', room: 'Gym' }

const T = (s) => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
let appts = [
  { id: 1,  t: '08:00', dur: 30, name: 'Harold Whitfield',      c: 'mo', type: 'Follow-up', status: 'done',    phone: '555 0142', note: 'Lower back, week 4. Progressing well.', cover: 'Self-pay', due: 0, forms: true, out: '08:34' },
  { id: 2,  t: '08:30', dur: 60, name: 'Amara Nwosu',           c: 'tb', type: 'Initial assessment', status: 'done', phone: '555 0177', note: 'Right shoulder impingement after climbing.', cover: 'Bupa', due: 0, forms: true, out: '09:36' },

/* ---------- demo clock: starts at 10:40 and runs in real time ---------- */
const CLOCK_START = 10 * 60 + 40, loadedAt = Date.now();
const nowMin = () => CLOCK_START + Math.floor((Date.now() - loadedAt) / 60000);
const fmt = (m) => { const h = Math.floor(m / 60), mm = String(m % 60).padStart(2, '0'); return `${h > 12 ? h - 12 : h}:${mm}${h >= 12 ? ' pm' : ' am'}`; };
const fmtT = (s) => fmt(T(s));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clin = (id) => CLINICIANS.find((c) => c.id === id);
const $ = (id) => document.getElementById(id);

const ICON = {
  clock: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  alert: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17.5v.01"/></svg>',
  seat: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>',
  play: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>',
  check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5 5L20 6.5"/></svg>',
  x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>',
  dollar: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3v18M16.5 7.5C15.5 6.4 14 6 12 6c-2.5 0-4 1.100-4 2.800 0 4 8.500 1.800 8.500 6 0 1.800-1.700 3.200-4.500 3.200-2 0-3.700-.6-4.800-1.800"/></svg>'
};

/* ---------- state in URL: ?c=clinician&q=search ---------- */
const view = { c: 'all', q: '', open: new Set() };
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  view.c = p.get('c') || 'all';
  view.q = p.get('q') || '';
  $('q').value = view.q;
}
function writeHash() {
  const p = new URLSearchParams();
  if (view.c !== 'all') p.set('c', view.c);
  if (view.q) p.set('q', view.q);
  const s = p.toString();
  history.replaceState(null, '', s ? '#' + s : location.pathname + location.search);
}

/* ---------- derived ---------- */
const startOf = (a) => T(a.t);
const isLate = (a) => a.status === 'scheduled' && startOf(a) + 5 <= nowMin();
function statusBadge(a) {
  if (a.status === 'scheduled') {
    if (isLate(a)) return `<span class="badge b-late">${ICON.alert}Late ${nowMin() - startOf(a)} min</span>`;
    const d = startOf(a) - nowMin();
    return `<span class="badge b-scheduled">${ICON.clock}${d <= 0 ? 'Due now' : d < 60 ? 'In ' + d + ' min' : 'Booked'}</span>`;
  }
  if (a.status === 'arrived') return `<span class="badge b-arrived">${ICON.seat}Waiting ${nowMin() - T(a.arrived)} min</span>`;
  if (a.status === 'session') return `<span class="badge b-session">${ICON.play}With ${esc(clin(a.c).short)}</span>`;
  if (a.status === 'done') return `<span class="badge b-done">${ICON.check}Checked out ${fmtT(a.out)}</span>`;
  return `<span class="badge b-noshow">${ICON.x}No-show</span>`;
}
function actions(a, big) {
  const cls = big ? 'btn btn-primary' : 'btn btn-primary btn-sm';
  const q = big ? 'btn btn-quiet' : 'btn btn-quiet btn-sm';
  if (a.status === 'scheduled') {
    const soon = startOf(a) - nowMin() <= 30;
    return `<button class="${soon ? cls : (big ? 'btn btn-secondary' : 'btn btn-secondary btn-sm')}" data-act="checkin" data-id="${a.id}" type="button">Check in<span class="sr"> ${esc(a.name)}</span></button>` +
      (isLate(a) ? `<button class="${q}" data-act="noshow" data-id="${a.id}" type="button">No-show<span class="sr"> ${esc(a.name)}</span></button>` : '');
  }
  if (a.status === 'arrived') return `<button class="${cls}" data-act="start" data-id="${a.id}" type="button">Send to ${esc(clin(a.c).room)}<span class="sr"> ${esc(a.name)}</span></button>`;
  if (a.status === 'session') return `<button class="${a.due ? cls : (big ? 'btn btn-secondary' : 'btn btn-secondary btn-sm')}" data-act="checkout" data-id="${a.id}" type="button">${a.due ? `Take $${a.due} and check out` : 'Check out'}<span class="sr"> ${esc(a.name)}</span></button>`;
  return '';
}

/* ---------- render ---------- */
function visible() {
  const q = view.q.trim().toLowerCase();
  return appts.filter((a) => (view.c === 'all' || a.c === view.c) &&
    (!q || (a.name + ' ' + clin(a.c).name).toLowerCase().includes(q)))
    .sort((x, y) => startOf(x) - startOf(y) || x.id - y.id);
}
function renderStats() {
  const live = appts.filter((a) => a.status !== 'noshow');
  const arrivedN = appts.filter((a) => ['arrived', 'session', 'done'].includes(a.status)).length;
  const waiting = appts.filter((a) => a.status === 'arrived');
  const longest = waiting.reduce((m, a) => Math.max(m, nowMin() - T(a.arrived)), 0);
  const late = appts.filter(isLate).length;
  const remaining = appts.filter((a) => a.status === 'scheduled').length;
  $('stats').innerHTML = `
    <div class="stat"><dt>Patients today</dt><dd class="num">${live.length}</dd></div>
    <div class="stat"><dt>Checked in</dt><dd class="num">${arrivedN} <small>of ${live.length}</small></dd></div>
    <div class="stat ${longest >= 10 ? 'alert' : ''}"><dt>Waiting now</dt><dd class="num">${waiting.length} <small>${waiting.length ? 'longest ' + longest + ' min' : 'nobody'}</small></dd></div>
    <div class="stat ${late ? 'alert' : ''}"><dt>Still to arrive</dt><dd class="num">${remaining} <small>${late ? late + ' late' : 'none late'}</small></dd></div>`;
}
function renderDay() {
  const S = 8 * 60, E = 17 * 60, pct = (m) => ((m - S) / (E - S)) * 100;
  const cls = { done: 'done', session: 'session', arrived: 'arrived', noshow: 'noshow', scheduled: '' };
  $('track').innerHTML = appts.map((a) => `<i class="day-seg ${cls[a.status]}" style="left:${pct(startOf(a))}%;width:${(a.dur / (E - S)) * 100}%"></i>`).join('') +
    `<i class="day-now" style="left:${pct(Math.min(E, Math.max(S, nowMin())))}%" data-t="${fmt(nowMin())}"></i>`;
  $('ticks').innerHTML = [8, 11, 14, 17].map((h) => `<span style="left:${pct(h * 60)}%">${h > 12 ? h - 12 : h}${h >= 12 ? 'pm' : 'am'}</span>`).join('');
}
function renderWait() {
  const w = appts.filter((a) => a.status === 'arrived').sort((x, y) => T(x.arrived) - T(y.arrived));
  $('waitCount').textContent = w.length ? `${w.length} waiting` : '';
  if (!w.length) {
    $('waitList').innerHTML = `<li class="empty"><b>Waiting room is empty</b>Next to arrive: ${(() => { const n = appts.filter((a) => a.status === 'scheduled').sort((x, y) => startOf(x) - startOf(y))[0]; return n ? esc(n.name) + ' at ' + fmtT(n.t) : 'no one else today'; })()}.</li>`;
    return;
  }
  $('waitList').innerHTML = w.map((a) => {
    const m = nowMin() - T(a.arrived);
    return `<li class="wcard"><div class="wcard-top"><div><h3>${esc(a.name)}</h3><p>${fmtT(a.t)} with ${esc(clin(a.c).name)}<br>${esc(a.type)}${a.due ? ` · $${a.due} due` : ''}</p></div>
      <div class="wait-time num ${m >= 10 ? 'long' : ''}">${m} min<small>waiting</small></div></div>${actions(a, true)}</li>`;
  }).join('');
}
function renderRooms() {
  $('rooms').innerHTML = CLINICIANS.map((c) => {
    const s = appts.find((a) => a.c === c.id && a.status === 'session');
    return `<div class="room ${s ? 'busy' : ''}"><b>${esc(c.room)}</b><span>${s ? esc(s.name) : 'Free'}</span><span>${esc(c.name)}</span></div>`;
  }).join('');
}
function renderChips() {
  const all = [{ id: 'all', short: 'Everyone' }, ...CLINICIANS];
  $('chips').innerHTML = all.map((c) => `<button class="chip" type="button" data-c="${c.id}" aria-pressed="${view.c === c.id}">${esc(c.short)}</button>`).join('');
}
function renderSched() {
  const list = visible();
  $('schedCount').textContent = `${list.length} shown`;
  if (!list.length) {
    $('sched').innerHTML = `<li class="empty"><b>${view.q ? 'No one matches “' + esc(view.q) + '”' : 'Nothing booked for this clinician today'}</b>${view.q ? 'Check the spelling, or search by clinician name.' : 'Pick another clinician, or add a booking.'}<br><button class="btn btn-secondary" type="button" data-act="reset">Show everyone</button></li>`;
    return;
  }
  $('sched').innerHTML = list.map((a) => {
    const open = view.open.has(a.id);
    return `<li class="appt is-${a.status}" id="a${a.id}">
      <div class="appt-row">
        <div class="appt-time num">${fmtT(a.t).replace(' am', '').replace(' pm', '')}<small>${a.dur} min</small></div>
        <button class="appt-main" type="button" data-act="toggle" data-id="${a.id}" aria-expanded="${open}" aria-controls="d${a.id}">
          <span class="appt-name">${esc(a.name)}</span>
          <span class="appt-sub">${esc(a.type)} · ${esc(clin(a.c).name)}</span>
        </button>
        <div class="appt-side">${a.due && a.status !== 'done' && a.status !== 'noshow' ? `<span class="badge b-due">${ICON.dollar}$${a.due} due</span>` : ''}${a.forms ? '' : `<span class="badge b-late">${ICON.alert}Forms missing</span>`}${statusBadge(a)}${actions(a, false)}</div>
      </div>
      <div class="detail" id="d${a.id}" ${open ? '' : 'hidden'}>
        <div><h4>Phone</h4><p><a href="tel:${esc(a.phone.replace(/\s/g, ''))}">${esc(a.phone)}</a></p></div>
        <div><h4>Cover</h4><p>${esc(a.cover)}</p></div>
        <div><h4>Intake forms</h4><p>${a.forms ? 'Completed' : 'Not completed. Ask the patient to fill in at the desk.'}</p></div>
        <div><h4>Notes for the desk</h4><p>${esc(a.note)}</p></div>
      </div>
    </li>`;
  }).join('');
}
function render() {
  renderStats(); renderDay(); renderWait(); renderRooms(); renderChips(); renderSched();
  const n = nowMin();
  $('clockLine').textContent = `${fmt(n)} · sample clock`;
}

/* ---------- actions with undo ---------- */
let undoFn = null, toastTimer;
function toast(msg, undo) {
  $('toastMsg').textContent = msg;
  undoFn = undo;
  $('toastUndo').hidden = !undo;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 7000);
}
function change(id, patch, msg) {
  const a = appts.find((x) => x.id === id);
  const before = { ...a };
  Object.assign(a, patch);
  render();
  toast(msg, () => { Object.assign(a, before); Object.keys(patch).forEach((k) => { if (!(k in before)) delete a[k]; }); render(); toast('Undone'); });
}
const hhmm = () => { const n = nowMin(); return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0'); };
document.addEventListener('click', (e) => {
  const chip = e.target.closest('[data-c]');
  if (chip) { view.c = chip.dataset.c; writeHash(); renderChips(); renderSched(); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const id = Number(b.dataset.id), a = appts.find((x) => x.id === id);
  switch (b.dataset.act) {
    case 'toggle': view.open.has(id) ? view.open.delete(id) : view.open.add(id); renderSched(); document.querySelector(`#a${id} .appt-main`)?.focus(); break;
    case 'checkin': change(id, { status: 'arrived', arrived: hhmm() }, `${a.name} checked in`); break;
    case 'noshow': change(id, { status: 'noshow' }, `${a.name} marked as a no-show`); break;
    case 'start': change(id, { status: 'session', start: hhmm() }, `${a.name} sent to ${clin(a.c).room}`); break;
    case 'checkout': change(id, { status: 'done', out: hhmm(), due: 0 }, a.due ? `$${a.due} taken. ${a.name} checked out` : `${a.name} checked out`); break;
    case 'reset': view.c = 'all'; view.q = ''; $('q').value = ''; writeHash(); renderChips(); renderSched(); break;
  }
});
$('toastUndo').addEventListener('click', () => { const f = undoFn; if (f) f(); });
$('q').addEventListener('input', (e) => { view.q = e.target.value; writeHash(); renderSched(); });
window.addEventListener('hashchange', () => { readHash(); renderChips(); renderSched(); });

/* ---------- new booking ---------- */
const dlg = $('dlg'), form = $('bookForm');
$('fClin').innerHTML = CLINICIANS.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
const rules = {
  fName: [() => $('fName').value.trim().length >= 2, 'Enter the patient’s full name.', 'eName'],
  fPhone: [() => /^[\d\s()+-]{7,}$/.test($('fPhone').value.trim()), 'Enter a phone number with at least 7 digits.', 'ePhone'],
  fTime: [() => { const v = $('fTime').value; return !!v && T(v) >= 480 && T(v) <= 1020; }, 'Pick a time between 8:00 am and 5:00 pm.', 'eTime']
};
function validate(id) {
  const [ok, msg, eid] = rules[id], good = ok();
  $(id).setAttribute('aria-invalid', String(!good));
  $(id).setAttribute('aria-describedby', eid);
  $(eid).textContent = good ? '' : msg;
  return good;
}
Object.keys(rules).forEach((id) => $(id).addEventListener('blur', () => validate(id)));
$('newBtn').addEventListener('click', () => { form.reset(); Object.keys(rules).forEach((id) => { $(id).removeAttribute('aria-invalid'); $(rules[id][2]).textContent = ''; }); dlg.showModal(); $('fName').focus(); });
$('cancelBook').addEventListener('click', () => dlg.close());
form.addEventListener('submit', (e) => {
  e.preventDefault();
  const bad = Object.keys(rules).filter((id) => !validate(id));
  if (bad.length) { $(bad[0]).focus(); return; }
  const [type, dur] = $('fType').value.split(' · ');
  const a = { id: Math.max(...appts.map((x) => x.id)) + 1, t: $('fTime').value, dur: parseInt(dur, 10), name: $('fName').value.trim(), c: $('fClin').value, type, status: 'scheduled', phone: $('fPhone').value.trim(), note: 'Booked at the front desk today.', cover: 'Self-pay', due: 0, forms: false };
  appts.push(a);
  dlg.close();
  view.c = 'all'; view.q = ''; $('q').value = ''; writeHash();
  render();
  document.getElementById('a' + a.id)?.scrollIntoView({ block: 'center' });
  toast(`${a.name} booked for ${fmtT(a.t)} with ${clin(a.c).name}`, () => { appts = appts.filter((x) => x.id !== a.id); render(); toast('Booking removed'); });
});

/* ---------- boot ---------- */
$('dateLine').textContent = 'Tuesday 20 October';
readHash();
render();
setInterval(render, 30000);
</script>
