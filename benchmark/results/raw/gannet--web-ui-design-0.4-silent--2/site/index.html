<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MV Gannet loading · Skerra Ferry Company</title>
<style>
:root {
  /* Night (default): sea-navy ramp, gannet-head yellow accent */
  --bg: oklch(0.19 0.035 250);
  --surface: oklch(0.24 0.04 250);
  --surface-2: oklch(0.30 0.045 250);
  --lane: oklch(0.155 0.03 250);
  --border: oklch(0.40 0.05 250);
  --text: oklch(0.97 0.01 240);
  --text-2: oklch(0.84 0.03 245);
  --text-3: oklch(0.72 0.035 245);
  --accent: oklch(0.86 0.16 92);
  --on-accent: oklch(0.2 0.04 250);
  --select: oklch(0.86 0.16 92);
  --ok: oklch(0.80 0.13 165);
  --warn: oklch(0.82 0.15 65);
  --bad: oklch(0.76 0.17 25);
  --veh: oklch(0.36 0.07 205);
  --veh-line: oklch(0.68 0.09 205);
  --tick: oklch(1 0 0 / 0.07);
  --scrim: oklch(0 0 0 / 0.55);

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --m: clamp(12px, calc((100dvh - 400px) / 42), 17px); /* px per metre of deck */
}
:root[data-theme="day"] {
  --bg: oklch(0.96 0.01 240);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.93 0.015 240);
  --lane: oklch(0.91 0.015 240);
  --border: oklch(0.72 0.03 245);
  --text: oklch(0.2 0.04 250);
  --text-2: oklch(0.34 0.04 250);
  --text-3: oklch(0.44 0.04 250);
  --accent: oklch(0.86 0.16 92);
  --select: oklch(0.32 0.12 255);
  --ok: oklch(0.42 0.11 165);
  --warn: oklch(0.48 0.14 55);
  --bad: oklch(0.48 0.19 25);
  --veh: oklch(0.88 0.05 205);
  --veh-line: oklch(0.45 0.09 205);
  --tick: oklch(0 0 0 / 0.09);
  --scrim: oklch(0.2 0.04 250 / 0.5);
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
html[data-theme="day"] { color-scheme: light; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.45 var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-tap-highlight-color: transparent;
  height: 100dvh; display: grid; grid-template-rows: auto 1fr;
  overflow-x: clip;
}
button, input { font: inherit; color: inherit; touch-action: manipulation; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }
p { text-wrap: pretty; }
:focus-visible { outline: 3px solid var(--select); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Buttons */
.btn {
  min-height: 48px; padding: 0 var(--s5); border-radius: var(--r-md);
  border: 2px solid var(--border); background: var(--surface-2);
  font-weight: 650; display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  transition: transform 120ms var(--ease-out), background-color 150ms;
}
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.block { width: 100%; }
@media (hover: hover) { .btn:not(:disabled):hover { background: color-mix(in oklch, var(--surface-2), var(--text) 10%); } .btn.primary:not(:disabled):hover { background: color-mix(in oklch, var(--accent), white 18%); } }

/* Header */
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s6);
  padding: var(--s3) var(--s4); padding-top: max(var(--s3), env(safe-area-inset-top));
  padding-left: max(var(--s4), env(safe-area-inset-left)); padding-right: max(var(--s4), env(safe-area-inset-right));
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { display: grid; line-height: 1.15; }
.brand b { font-size: 24px; letter-spacing: -0.02em; }
.brand span { color: var(--text-3); font-size: 14px; }
.sailing { display: grid; line-height: 1.2; }
.sailing b { font-size: 20px; }
.sailing span { color: var(--text-2); font-size: 15px; }
.clock { display: grid; text-align: right; line-height: 1.15; margin-left: auto; }
.clock b { font-size: 24px; }
.clock span { color: var(--text-2); font-size: 14px; }
.top-actions { display: flex; gap: var(--s2); }
.statebar { grid-column: 1 / -1; }
.banner {
  background: var(--accent); color: var(--on-accent); font-weight: 650;
  padding: var(--s3) var(--s4); display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; justify-content: space-between;
}
.banner .btn { min-height: 40px; background: transparent; border-color: var(--on-accent); color: var(--on-accent); }

/* Layout */
.layout { display: grid; grid-template-columns: minmax(280px, 330px) minmax(0, 1fr) minmax(260px, 310px); min-height: 0; }
.pane { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.pane + .pane { border-left: 1px solid var(--border); }
.pane-queue { display: flex; flex-direction: column; background: var(--surface); }
.pane-side { background: var(--surface); padding: var(--s4); display: grid; gap: var(--s5); align-content: start; }
.pane-deck { padding: var(--s4); background: var(--bg); }
.mobnav { display: none; }

/* Queue */
.q-head { padding: var(--s3) var(--s3) 0; display: grid; gap: var(--s3); position: sticky; top: 0; background: var(--surface); z-index: 2; padding-bottom: var(--s3); border-bottom: 1px solid var(--border); }
.field label { display: block; font-size: 14px; color: var(--text-2); margin-bottom: var(--s1); }
.field input { width: 100%; min-height: 48px; padding: 0 var(--s3); border-radius: var(--r-md); border: 2px solid var(--border); background: var(--bg); font-size: 18px; }
.field input:focus-visible { outline-offset: 0; border-color: var(--select); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s1); background: var(--bg); padding: var(--s1); border-radius: var(--r-md); }
.tab { min-height: 52px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--text-2); display: grid; place-items: center; line-height: 1.15; padding: var(--s1); }
.tab b { font-size: 20px; color: var(--text); }
.tab span { font-size: 14px; }
.tab[aria-pressed="true"] { background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--border); color: var(--text); }
.tab[aria-pressed="true"] span { font-weight: 650; }
.list { list-style: none; margin: 0; padding: var(--s2) var(--s3) var(--s6); display: grid; gap: var(--s2); }
.row {
  width: 100%; text-align: left; min-height: 68px; display: grid; grid-template-columns: 1fr auto; gap: var(--s1) var(--s3); align-items: center;
  padding: var(--s2) var(--s3); border-radius: var(--r-md); border: 2px solid var(--border); background: var(--bg);
}
.row[aria-pressed="true"] { border-color: var(--select); background: var(--surface-2); box-shadow: 0 0 0 1px var(--select); }
.row .reg { font-weight: 750; font-size: 20px; letter-spacing: 0.02em; }
.row .sub { color: var(--text-2); font-size: 14px; grid-column: 1; overflow-wrap: anywhere; }
.row .meta { grid-column: 2; grid-row: 1 / span 2; text-align: right; display: grid; gap: var(--s1); justify-items: end; font-size: 14px; color: var(--text-2); }
.row.noshow .reg { text-decoration: line-through; color: var(--text-3); }
.flags { display: flex; flex-wrap: wrap; gap: var(--s1); }
.flag { font-size: 12px; font-weight: 750; letter-spacing: 0.03em; padding: 1px 6px; border-radius: 4px; border: 1.5px solid currentColor; line-height: 1.4; white-space: nowrap; }
.flag.dg { color: var(--bad); }
.flag.reefer { color: oklch(0.78 0.1 225); }
.flag.access { color: var(--warn); }
.flag.livestock { color: var(--ok); }
:root[data-theme="day"] .flag.reefer { color: oklch(0.42 0.11 235); }
.empty { padding: var(--s6) var(--s4); text-align: center; color: var(--text-2); display: grid; gap: var(--s3); justify-items: center; }
.empty b { color: var(--text); font-size: 18px; }

/* Deck */
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); min-height: 64px; padding: var(--s3) var(--s4); background: var(--surface); border: 2px solid var(--border); border-radius: var(--r-md); margin-bottom: var(--s4); }
.strip.live { border-color: var(--select); }
.strip .reg { font-size: 22px; font-weight: 750; letter-spacing: 0.02em; }
.strip p { flex: 1 1 200px; color: var(--text-2); }
.strip .btn { min-height: 44px; }
.decktabs { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s1); margin-bottom: var(--s4); background: var(--surface); padding: var(--s1); border-radius: var(--r-md); }
.dtab { min-height: 52px; border: 0; border-radius: var(--r-sm); background: transparent; font-weight: 650; color: var(--text-2); line-height: 1.2; }
.dtab small { display: block; font-weight: 400; font-size: 13px; }
.dtab[aria-pressed="true"] { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 2px var(--border); }
.deck { display: grid; grid-template-columns: 32px 1fr; gap: var(--s2); max-width: 760px; margin: 0 auto; }
.ruler { position: relative; margin-top: 80px; font-size: 12px; color: var(--text-3); }
.ruler i { position: absolute; right: 0; font-style: normal; transform: translateY(-50%); }
.hull { min-width: 0; }
.cap { text-align: center; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: var(--text-3); text-transform: uppercase; padding: var(--s1) 0; }
.lanes { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: var(--s2); align-items: start; }
.lane-h { height: 72px; padding: var(--s1) var(--s2); background: var(--surface); border-radius: var(--r-md) var(--r-md) 0 0; border: 1px solid var(--border); border-bottom: 0; display: grid; align-content: center; line-height: 1.2; font-size: 13px; color: var(--text-2); }
.lane-h b { font-size: 22px; color: var(--text); }
.lane-h .why { font-weight: 700; color: var(--bad); }
.lane-h .sug { font-weight: 700; color: var(--on-accent); background: var(--accent); border-radius: 4px; padding: 0 6px; justify-self: start; }
.lane-h.ok { border-color: var(--select); }
.lane {
  position: relative; height: calc(var(--m) * var(--len)); background: var(--lane);
  border: 1px solid var(--border); border-radius: 0 0 var(--r-sm) var(--r-sm);
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--m) * 10 - 1px), var(--tick) calc(var(--m) * 10 - 1px), var(--tick) calc(var(--m) * 10));
}
.lane.ok { border-color: var(--select); }
.lane.dim { opacity: 0.55; }
.veh {
  position: absolute; left: 3px; right: 3px; top: calc(var(--m) * var(--off)); height: calc(var(--m) * var(--vl));
  border-radius: var(--r-sm); border: 2px solid var(--veh-line); background: var(--veh);
  padding: 0 var(--s1); display: grid; align-content: center; justify-items: center; text-align: center; line-height: 1.15; overflow: hidden;
  transition: box-shadow 120ms;
}
.veh .reg { font-weight: 750; font-size: 14px; letter-spacing: 0.02em; overflow-wrap: anywhere; }
.veh .sm { font-size: 12px; color: var(--text-2); }
.veh.dgb { background-image: repeating-linear-gradient(135deg, transparent 0 8px, oklch(0.76 0.17 25 / 0.35) 8px 16px); border-color: var(--bad); }
.veh[aria-pressed="true"] { border-color: var(--select); box-shadow: 0 0 0 3px var(--select); z-index: 1; }
.ghost {
  position: absolute; left: 3px; right: 3px; top: calc(var(--m) * var(--off)); height: calc(var(--m) * var(--vl));
  border: 3px dashed var(--select); border-radius: var(--r-sm); background: color-mix(in oklch, var(--select), transparent 86%);
  font-weight: 700; font-size: 14px; display: grid; place-items: center; text-align: center; line-height: 1.1; padding: 0;
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse { 50% { background: color-mix(in oklch, var(--select), transparent 70%); } }
.ghost:active { transform: scale(0.97); }

/* Side */
.card { display: grid; gap: var(--s3); }
.card h2 { font-size: 14px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.06em; }
.sel { background: var(--bg); border: 2px solid var(--border); border-radius: var(--r-lg); padding: var(--s4); display: grid; gap: var(--s3); }
.sel.live { border-color: var(--select); }
.sel .reg { font-size: 30px; font-weight: 800; letter-spacing: 0.02em; line-height: 1.1; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: var(--s1) var(--s4); margin: 0; }
.kv dt { color: var(--text-2); }
.kv dd { margin: 0; text-align: right; font-weight: 650; }
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s2); font-size: 15px; color: var(--text-2); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); text-align: center; }
.stats div { background: var(--bg); border-radius: var(--r-md); padding: var(--s2) var(--s1); display: grid; line-height: 1.15; }
.stats b { font-size: 28px; }
.stats span { font-size: 13px; color: var(--text-2); }
.bar { height: 10px; border-radius: 5px; background: var(--bg); overflow: hidden; border: 1px solid var(--border); }
.bar i { display: block; height: 100%; background: var(--ok); transition: width 250ms var(--ease-out); }
.small { font-size: 14px; color: var(--text-2); }
.trim { position: relative; height: 14px; border-radius: 7px; background: var(--bg); border: 1px solid var(--border); }
.trim::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--text-3); }
.trim i { position: absolute; top: -4px; width: 8px; height: 20px; margin-left: -4px; border-radius: 3px; background: var(--ok); transition: left 250ms var(--ease-out); }
.trim.warn i { background: var(--warn); } .trim.bad i { background: var(--bad); }
.split { display: flex; justify-content: space-between; font-size: 14px; color: var(--text-2); }
.alerts { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--s2); }
.alerts li { padding: var(--s2) var(--s3); border-left: 5px solid var(--ok); background: var(--bg); border-radius: 0 var(--r-sm) var(--r-sm) 0; font-size: 15px; }
.alerts li b { margin-right: var(--s1); }
.alerts li.warn { border-color: var(--warn); } .alerts li.warn b { color: var(--warn); }
.alerts li.bad { border-color: var(--bad); } .alerts li.bad b { color: var(--bad); }
.alerts li.ok b { color: var(--ok); }
.linkbtn { background: none; border: 0; color: var(--text-2); text-decoration: underline; min-height: 44px; justify-self: start; padding: 0; }

/* Toast + dialog */
.toast { position: fixed; left: 50%; bottom: max(var(--s4), env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: var(--s4); background: var(--text); color: var(--bg); padding: var(--s2) var(--s2) var(--s2) var(--s5); border-radius: var(--r-lg); max-width: calc(100vw - 32px); box-shadow: 0 8px 30px var(--scrim); animation: in 200ms var(--ease-out); }
.toast[hidden] { display: none; }
.toast .btn { min-height: 44px; background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
@keyframes in { from { opacity: 0; transform: translateX(-50%) scale(0.95); } }
dialog { border: 2px solid var(--border); border-radius: var(--r-lg); background: var(--surface); color: var(--text); padding: var(--s6); width: min(480px, calc(100vw - 32px)); }
dialog::backdrop { background: var(--scrim); }
dialog h2 { font-size: 22px; margin-bottom: var(--s3); }
dialog .kv { margin: var(--s4) 0; }
dialog .actions { display: flex; gap: var(--s3); justify-content: flex-end; flex-wrap: wrap; margin-top: var(--s5); }

/* Phones and small tablets: one pane at a time */
@media (max-width: 959px) {
  body { height: auto; min-height: 100dvh; display: block; padding-bottom: 72px; }
  .layout { display: block; }
  .pane { overflow: visible; }
  .pane + .pane { border-left: 0; }
  .layout[data-pane="queue"] .pane-deck, .layout[data-pane="queue"] .pane-side,
  .layout[data-pane="deck"] .pane-queue, .layout[data-pane="deck"] .pane-side,
  .layout[data-pane="side"] .pane-queue, .layout[data-pane="side"] .pane-deck { display: none; }
  .top { position: sticky; top: 0; z-index: 5; }
  .clock { margin-left: 0; text-align: left; }
  .top-actions { margin-left: auto; }
  .q-head { top: 0; position: static; }
  .mobnav { display: grid; grid-template-columns: repeat(3, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
  .mobnav button { min-height: 64px; border: 0; background: transparent; color: var(--text-2); font-weight: 650; font-size: 16px; }
  .mobnav button[aria-pressed="true"] { color: var(--text); box-shadow: inset 0 4px 0 var(--accent); background: var(--surface-2); }
  .toast { bottom: calc(80px + env(safe-area-inset-bottom)); }
  .deck { grid-template-columns: 24px 1fr; }
  .pane-deck { padding: var(--s3); }
}
@media (max-width: 480px) {
  .top { gap: var(--s2) var(--s4); }
  .top-actions .btn { padding: 0 var(--s3); }
  .veh .reg { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { .ghost { animation: none; } .toast { animation: none; } .btn, .bar i, .trim i { transition: none; } }
</style>
</head>
<body>

<header class="top">
  <div class="brand"><b>MV Gannet</b><span>Skerra Ferry Company</span></div>
  <div class="sailing"><b id="sailTitle">14:30 Skerra to Port Calloway</b><span id="sailSub"></span></div>
  <div class="clock"><b id="clock">13:42</b><span id="countdown"></span></div>
  <div class="top-actions">
    <button class="btn" id="themeBtn" data-act="theme" aria-pressed="false">Daylight view</button>
    <button class="btn primary" data-act="askClose" id="closeBtn">Close loading</button>
  </div>
</header>

<main class="layout" id="layout" data-pane="queue">
  <section class="pane pane-queue" aria-label="Vehicles">
    <div class="q-head">
      <div class="field">
        <label for="q">Find registration or booking</label>
        <input id="q" type="search" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. KT69 or SK-4850">
      </div>
      <div class="tabs" id="tabs"></div>
    </div>
    <ul class="list" id="list"></ul>
  </section>

  <section class="pane pane-deck" id="deckPane" aria-label="Deck plan"></section>

  <aside class="pane pane-side" id="side" aria-label="Vehicle and sailing"></aside>
</main>

<nav class="mobnav" aria-label="Screen">
  <button data-act="pane" data-v="queue" id="nQueue">Vehicles</button>
  <button data-act="pane" data-v="deck">Deck plan</button>
  <button data-act="pane" data-v="side">Details</button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog id="closeDlg" aria-labelledby="cdT"></dialog>
<dialog id="resetDlg" aria-labelledby="rdT">
  <h2 id="rdT">Reset sample data?</h2>
  <p>This puts every vehicle back to its starting position for the demo and clears all loading you have done on this device.</p>
  <div class="actions">
    <button class="btn" data-act="closeDlg" data-v="resetDlg">Keep loading</button>
    <button class="btn danger" data-act="doReset">Reset sample data</button>
  </div>
</dialog>

<script>
"use strict";
/* ---------- Sample data: replace with the live booking feed ---------- */
const SAILING = { time: "14:30", from: "Skerra", to: "Port Calloway", crossing: "1 h 25 min", date: "Tue 20 Oct", cutoff: 14 * 60, depart: 14 * 60 + 30, start: 13 * 60 + 42, trimLimit: 12 };
const GAP = 0.5; // metres kept between vehicles
const LANES = [
  { id: "A", deck: "main", len: 42, side: "P" }, { id: "B", deck: "main", len: 42, side: "P" },
  { id: "C", deck: "main", len: 42, side: "S" }, { id: "D", deck: "main", len: 42, side: "S", note: "Dangerous goods" },
  { id: "E", deck: "upper", len: 26, side: "P" }, { id: "F", deck: "upper", len: 26, side: "S" }
];
const DECKS = { main: { name: "Main deck", sub: "4 lanes · 42 m" }, upper: { name: "Upper deck", sub: "Max 2.0 m high, 2 t" } };
const FLAGS = { dg: ["DG", "Dangerous goods: lane D only"], reefer: ["REEFER", "Refrigerated: needs shore power plug"], access: ["ACCESS", "Disabled access: leave a wide side gap"], livestock: ["LIVESTOCK", "Livestock: keep clear of upper deck, check ventilation"] };
// id, ref, reg, make, type, length m, height m, weight kg, flags, state, arrived (min), lane
const RAW = [
  [1, "SK-4821", "YH21 WFN", "Ford Kuga", "Car", 4.6, 1.7, 1700, "", "here", 798],

  doReset() { const th = D.theme; D = seed(); D.theme = th; Object.assign(ui, { sel: null, tab: "here", deck: "main", q: "" }); $("#q").value = ""; save(); $("#resetDlg").close(); toast("Sample data reset"); render(); }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (b && A[b.dataset.act] && !b.disabled) A[b.dataset.act](b.dataset.v);
});
$("#q").addEventListener("input", e => { ui.q = e.target.value; renderQueue(); });

render(); save();
let pastCutoff = nowMin() >= SAILING.cutoff;
setInterval(() => { tick(); const p = nowMin() >= SAILING.cutoff; if (p !== pastCutoff) { pastCutoff = p; renderSide(); } }, 15000);
</script>
</body>
