<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel Physio – Front Desk</title>
<style>
  :root {
    --bg: #f3f5f4; --panel: #fff; --ink: #1c2a28; --muted: #66767400; --muted2: #667674;
    --line: #dde4e2; --brand: #0f6b5c; --brand-d: #0a4f44; --brand-l: #e2f1ee;
    --amber: #b36b00; --amber-l: #fdf0d9; --red: #b3261e; --red-l: #fbe5e3;
    --blue: #1d5fa8; --blue-l: #e3eefa; --grey-l: #eceff0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  button, input, select { font: inherit; color: inherit; }
  header { background: var(--brand-d); color: #fff; display: flex; align-items: center; gap: 24px; padding: 12px 24px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: .2px; }
  .logo svg { width: 30px; height: 30px; }
  .logo small { display: block; font-weight: 400; font-size: 12px; opacity: .75; letter-spacing: 0; }
  .clock { margin-left: auto; text-align: right; }
  .clock b { font-size: 26px; font-variant-numeric: tabular-nums; display: block; line-height: 1.1; }
  .clock span { font-size: 13px; opacity: .8; }
  main { padding: 20px 24px 32px; max-width: 1500px; margin: 0 auto; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
  .stat b { font-size: 28px; display: block; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted2); font-size: 13px; }
  .stat.alert b { color: var(--red); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
  @media (max-width: 1050px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
  .card h2 { margin: 0; font-size: 16px; padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card h2 .count { font-weight: 500; font-size: 13px; color: var(--muted2); }
  .tools { display: flex; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
  .tools input[type=search], .tools select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .tools input[type=search] { flex: 1; min-width: 180px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 8px 12px; cursor: pointer; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--brand); color: #fff; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted2); padding: 8px 16px; background: #fafbfb; border-bottom: 1px solid var(--line); }
  td { padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr.past td { opacity: .6; }
  tr.late td:first-child { box-shadow: inset 4px 0 var(--red); }
  td.time { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  td.time small { display: block; font-weight: 400; color: var(--muted2); }
  .pt { font-weight: 600; }
  .sub { font-size: 13px; color: var(--muted2); }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 99px; margin: 3px 4px 0 0; }
  .tag.warn { background: var(--amber-l); color: var(--amber); }
  .tag.bad { background: var(--red-l); color: var(--red); }
  .tag.info { background: var(--blue-l); color: var(--blue); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .s-booked { background: var(--grey-l); color: #44524f; }
  .s-waiting { background: var(--amber-l); color: var(--amber); }
  .s-treatment { background: var(--blue-l); color: var(--blue); }
  .s-done { background: var(--brand-l); color: var(--brand-d); }
  .s-noshow { background: var(--red-l); color: var(--red); }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 14px; }
  .btn:hover { background: var(--grey-l); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-d); }
  .btn.ghost { border-color: transparent; color: var(--muted2); font-weight: 500; }
  .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #7bb8ad; outline-offset: 1px; }
  td.act { text-align: right; white-space: nowrap; }
  .wait-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .wait-item:last-child { border-bottom: 0; }
  .wait-item .grow { flex: 1; min-width: 0; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; }
  .timer.long { color: var(--red); }
  .empty { padding: 20px 16px; color: var(--muted2); text-align: center; }
  .prac { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .prac:last-child { border-bottom: 0; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--brand-l); color: var(--brand-d); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
  .prac .grow { flex: 1; min-width: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .dot.free { background: #2e9e6b; } .dot.busy { background: var(--blue); } .dot.off { background: #aab4b2; }
  .notice { padding: 10px 16px; background: var(--amber-l); color: #6b4300; border-bottom: 1px solid var(--line); font-size: 14px; }
  dialog { border: 0; border-radius: 12px; padding: 0; width: min(440px, 92vw); box-shadow: 0 10px 40px #0004; }
  dialog::backdrop { background: #0006; }
  dialog form { padding: 20px; display: grid; gap: 12px; }
  dialog h3 { margin: 0; }
  dialog label { display: grid; gap: 4px; font-size: 13px; color: var(--muted2); font-weight: 600; }
  dialog input, dialog select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-weight: 400; color: var(--ink); }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1c2a28; color: #fff; padding: 10px 18px; border-radius: 8px; transition: transform .25s; z-index: 10; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="15" stroke="#fff" stroke-width="2"/><path d="M6 20c6 0 8-6 14-9l6-2-3 5 3 1-6 2c-3 4-8 5-14 3z" fill="#fff"/></svg>
    <div>Kestrel Physio<small>Front desk</small></div>
  </div>
  <button class="btn" id="newBtn">+ Walk-in / new booking</button>
  <div class="clock"><b id="clock">--:--</b><span id="date"></span></div>
</header>

<main>
  <section class="stats" id="stats" aria-label="Today at a glance"></section>

  <div class="grid">
    <div>
      <section class="card">
        <h2>Today's appointments <span class="count" id="apptCount"></span></h2>
        <div class="tools">
          <input type="search" id="q" placeholder="Search patient, phone or condition…" aria-label="Search appointments">
          <select id="pracFilter" aria-label="Filter by practitioner"></select>
          <div class="seg" id="statusFilter" role="group" aria-label="Filter by status">
            <button data-f="all" class="on">All</button>
            <button data-f="upcoming">Upcoming</button>
            <button data-f="active">In clinic</button>
            <button data-f="done">Finished</button>
          </div>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>Time</th><th>Patient</th><th>Practitioner</th><th>Status</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </div>

    <aside>
      <section class="card">
        <h2>Waiting room <span class="count" id="waitCount"></span></h2>
        <div id="waiting"></div>
      </section>
      <section class="card">
        <h2>Practitioners</h2>
        <div id="pracs"></div>
      </section>
    </aside>
  </div>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3>Add appointment</h3>
    <label>Patient name <input name="name" required autocomplete="off"></label>
    <div class="row">
      <label>Phone <input name="phone" type="tel" autocomplete="off"></label>
      <label>Time <input name="time" type="time" step="900" required></label>
    </div>
    <div class="row">
      <label>Practitioner <select name="prac"></select></label>
      <label>Type <select name="type">
        <option>Initial assessment</option><option>Follow-up</option><option>Dry needling</option><option>Rehab session</option>
      </select></label>
    </div>
    <label><span><input type="checkbox" name="walkin" style="width:auto"> Walk-in – check in immediately</span></label>
    <div class="dlg-actions">
      <button type="button" class="btn" id="cancel">Cancel</button>
      <button class="btn primary" value="ok">Add</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// Simulated clock: the demo day starts at 10:12 and runs in real time.
const DAY_START = new Date(2026, 9, 20, 10, 12, 0);
const BOOT = Date.now();
const now = () => new Date(DAY_START.getTime() + (Date.now() - BOOT));
const mins = d => d.getHours() * 60 + d.getMinutes();
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const t = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };

const PRACS = [
  { id: 'ma', name: 'Dr Maya Anand', role: 'Senior physiotherapist', room: 'Room 1' },
  { id: 'to', name: 'Tom Okafor', role: 'Sports physio', room: 'Room 2' },
  { id: 'li', name: 'Lena Iversen', role: 'Neuro & vestibular', room: 'Room 3' },
  { id: 'ra', name: 'Ravi Patel', role: 'Hydrotherapy & rehab', room: 'Gym / Pool' },
];
const P = Object.fromEntries(PRACS.map(p => [p.id, p]));

// status: booked | waiting | treatment | done | noshow
let appts = [
  { id: 1, time: '08:00', dur: 45, name: 'Harold Bevan', phone: '0412 555 018', prac: 'ma', type: 'Follow-up', cond: 'Total knee replacement rehab', status: 'done', flags: [] },
  { id: 2, time: '08:30', dur: 30, name: 'Priya Natarajan', phone: '0433 555 190', prac: 'to', type: 'Follow-up', cond: 'Hamstring strain', status: 'done', flags: [] },
  { id: 3, time: '08:45', dur: 45, name: 'Callum Reid', phone: '0421 555 764', prac: 'li', type: 'Rehab session', cond: 'Post-concussion balance', status: 'done', flags: [] },
  { id: 4, time: '09:15', dur: 30, name: 'Grace Whitfield', phone: '0407 555 332', prac: 'ra', type: 'Rehab session', cond: 'Lumbar disc – hydrotherapy', status: 'done', flags: [] },
  { id: 5, time: '09:30', dur: 45, name: 'Jorge Mendes', phone: '0416 555 871', prac: 'ma', type: 'Follow-up', cond: 'Rotator cuff tendinopathy', status: 'done', flags: [] },
  { id: 6, time: '09:30', dur: 30, name: 'Aisha Rahman', phone: '0438 555 226', prac: 'to', type: 'Dry needling', cond: 'Upper trapezius trigger points', status: 'noshow', flags: [] },
  { id: 7, time: '10:00', dur: 45, name: 'Walter Kowalski', phone: '0402 555 640', prac: 'li', type: 'Follow-up', cond: 'Parkinson\'s gait training', status: 'treatment', flags: [] },
  { id: 8, time: '10:00', dur: 60, name: 'Ellie Thompson', phone: '0429 555 915', prac: 'ra', type: 'Rehab session', cond: 'ACL reconstruction week 8', status: 'treatment', flags: [] },
  { id: 9, time: '10:15', dur: 45, name: 'Marcus Chen', phone: '0411 555 073', prac: 'ma', type: 'Initial assessment', cond: 'Chronic neck pain', status: 'waiting', arrived: '10:04', flags: ['Intake form incomplete'] },
  { id: 10, time: '10:15', dur: 30, name: 'Sofia Alvarez', phone: '0447 555 508', prac: 'to', type: 'Follow-up', cond: 'Ankle sprain grade 2', status: 'waiting', arrived: '10:09', flags: ['Payment due $85'] },
  { id: 11, time: '10:30', dur: 30, name: 'Dennis Murphy', phone: '0405 555 129', prac: 'to', type: 'Dry needling', cond: 'Plantar fasciitis', status: 'booked', flags: [] },
  { id: 12, time: '10:45', dur: 45, name: 'Hannah Lindqvist', phone: '0419 555 647', prac: 'ma', type: 'Follow-up', cond: 'Pregnancy-related pelvic pain', status: 'booked', flags: ['Referral expires 31 Oct'] },
  { id: 13, time: '11:00', dur: 45, name: 'Oscar Banerjee', phone: '0426 555 382', prac: 'li', type: 'Initial assessment', cond: 'Vertigo (BPPV suspected)', status: 'booked', flags: ['New patient', 'Intake form incomplete'] },
  { id: 14, time: '11:15', dur: 30, name: 'Beth Cartwright', phone: '0434 555 701', prac: 'ra', type: 'Rehab session', cond: 'Hip osteoarthritis', status: 'booked', flags: [] },
  { id: 15, time: '11:30', dur: 45, name: 'Yusuf Demir', phone: '0408 555 456', prac: 'ma', type: 'Follow-up', cond: 'Lower back strain', status: 'booked', flags: ['Payment due $120'] },
  { id: 16, time: '12:00', dur: 30, name: 'Nina Kowalczyk', phone: '0415 555 839', prac: 'to', type: 'Follow-up', cond: 'Patellofemoral pain', status: 'booked', flags: [] },
  { id: 17, time: '13:30', dur: 45, name: 'Frank Osei', phone: '0423 555 214', prac: 'ma', type: 'Initial assessment', cond: 'Shoulder impingement', status: 'booked', flags: ['New patient'] },
  { id: 18, time: '14:00', dur: 45, name: 'Rosa Delgado', phone: '0431 555 667', prac: 'li', type: 'Rehab session', cond: 'Stroke recovery – upper limb', status: 'booked', flags: [] },
  { id: 19, time: '14:30', dur: 30, name: 'Liam O\'Sullivan', phone: '0402 555 995', prac: 'to', type: 'Follow-up', cond: 'Tennis elbow', status: 'booked', flags: [] },
  { id: 20, time: '15:30', dur: 60, name: 'Mei-Ling Tan', phone: '0449 555 123', prac: 'ra', type: 'Rehab session', cond: 'Scoliosis exercise program', status: 'booked', flags: [] },
];
let nextId = 100, filter = 'all';

const STATUS = {
  booked: ['Booked', 's-booked'], waiting: ['Waiting', 's-waiting'], treatment: ['In treatment', 's-treatment'],
  done: ['Completed', 's-done'], noshow: ['No-show', 's-noshow'],
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);

function actions(a) {
  const b = (act, label, cls = '') => `<button class="btn ${cls}" data-act="${act}" data-id="${a.id}">${label}</button>`;
  switch (a.status) {
    case 'booked': return b('checkin', 'Check in', 'primary') + ' ' + b('noshow', 'No-show', 'ghost');
    case 'waiting': return b('start', 'Send through', 'primary') + ' ' + b('undo', 'Undo', 'ghost');
    case 'treatment': return b('finish', 'Finish', 'primary');
    default: return b('undo', 'Reopen', 'ghost');
  }
}

function matches(a) {
  const q = $('q').value.trim().toLowerCase();
  if (q && !(a.name + a.phone + a.cond + a.type).toLowerCase().includes(q)) return false;
  const pf = $('pracFilter').value;
  if (pf !== 'all' && a.prac !== pf) return false;
  if (filter === 'upcoming') return a.status === 'booked';
  if (filter === 'active') return a.status === 'waiting' || a.status === 'treatment';
  if (filter === 'done') return a.status === 'done' || a.status === 'noshow';
  return true;
}

function render() {
  const n = now(), nm = mins(n);
  $('clock').textContent = hhmm(nm);
  $('date').textContent = n.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  const sorted = [...appts].sort((x, y) => t(x.time) - t(y.time) || x.id - y.id);
  const shown = sorted.filter(matches);
  $('apptCount').textContent = `${shown.length} of ${appts.length}`;
  $('rows').innerHTML = shown.length ? shown.map(a => {
    const late = a.status === 'booked' && nm > t(a.time) + 5;
    const past = a.status === 'done' || a.status === 'noshow';
    const [label, cls] = STATUS[a.status];
    const flags = a.flags.map(f => `<span class="tag ${/Payment|expires/.test(f) ? 'bad' : /New/.test(f) ? 'info' : 'warn'}">${esc(f)}</span>`).join('');
    return `<tr class="${past ? 'past' : ''} ${late ? 'late' : ''}">
      <td class="time">${a.time}<small>${a.dur} min</small></td>
      <td><div class="pt">${esc(a.name)}</div><div class="sub">${esc(a.type)} · ${esc(a.cond)}</div><div class="sub">${esc(a.phone)}</div>${flags}</td>
      <td>${esc(P[a.prac].name)}<div class="sub">${esc(P[a.prac].room)}</div></td>
      <td><span class="badge ${cls}">${label}</span>${late ? '<div class="sub" style="color:var(--red)">' + (nm - t(a.time)) + ' min overdue</div>' : ''}</td>
      <td class="act">${actions(a)}</td></tr>`;
  }).join('') : '<tr><td colspan="5" class="empty">No appointments match.</td></tr>';

  // waiting room
  const waiting = appts.filter(a => a.status === 'waiting').sort((x, y) => t(x.arrived) - t(y.arrived));
  $('waitCount').textContent = waiting.length ? `${waiting.length} waiting` : '';
  $('waiting').innerHTML = waiting.length ? waiting.map(a => {
    const w = Math.max(0, nm - t(a.arrived));
    const busy = appts.some(x => x.prac === a.prac && x.status === 'treatment');
    return `<div class="wait-item"><div class="grow"><div class="pt">${esc(a.name)}</div>
      <div class="sub">for ${esc(P[a.prac].name)} · booked ${a.time}${busy ? ' · <b>practitioner with patient</b>' : ''}</div>
      ${a.flags.map(f => `<span class="tag warn">${esc(f)}</span>`).join('')}</div>
      <div class="timer ${w >= 15 ? 'long' : ''}" title="Time waiting">${w}<small style="font-size:12px;font-weight:500"> min</small></div></div>`;
  }).join('') : '<div class="empty">Nobody waiting.</div>';

  // practitioners
  $('pracs').innerHTML = PRACS.map(p => {
    const cur = appts.find(a => a.prac === p.id && a.status === 'treatment');
    const next = sorted.find(a => a.prac === p.id && (a.status === 'booked' || a.status === 'waiting'));
    const state = cur ? 'busy' : 'free';
    const initials = p.name.replace('Dr ', '').split(' ').map(w => w[0]).join('');
    const left = cur ? Math.max(0, t(cur.time) + cur.dur - nm) : 0;
    return `<div class="prac"><div class="avatar">${initials}</div><div class="grow">
      <div class="pt">${esc(p.name)}</div><div class="sub">${esc(p.role)} · ${esc(p.room)}</div>
      <div class="sub"><span class="dot ${state}"></span>${cur ? `With ${esc(cur.name)} · ~${left} min left` : 'Free'}${next ? ` · next ${next.time}` : ' · no more today'}</div>
      </div></div>`;
  }).join('');

  // stats
  const c = s => appts.filter(a => a.status === s).length;
  const overdue = appts.filter(a => a.status === 'booked' && nm > t(a.time) + 5).length;
  const owing = appts.filter(a => a.flags.some(f => /Payment/.test(f)) && a.status !== 'noshow').length;
  const stat = (v, l, cls = '') => `<div class="stat ${cls}"><b>${v}</b><span>${l}</span></div>`;
  $('stats').innerHTML = stat(appts.length, 'Appointments today') + stat(c('waiting'), 'In waiting room') + stat(c('treatment'), 'In treatment') +
    stat(c('done'), 'Completed') + stat(overdue, 'Late to arrive', overdue ? 'alert' : '') + stat(c('noshow'), 'No-shows', c('noshow') ? 'alert' : '') + stat(owing, 'Payments to collect');
}

function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2400); }

$('rows').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const a = appts.find(x => x.id == btn.dataset.id), act = btn.dataset.act;
  if (act === 'checkin') {
    a.status = 'waiting'; a.arrived = hhmm(mins(now()));
    toast(`${a.name} checked in` + (a.flags.length ? ` – note: ${a.flags[0]}` : ''));
  } else if (act === 'start') {
    if (appts.some(x => x.prac === a.prac && x.status === 'treatment') && !confirm(`${P[a.prac].name} is still with another patient. Send through anyway?`)) return;
    a.status = 'treatment'; toast(`${a.name} sent to ${P[a.prac].room}`);
  } else if (act === 'finish') {
    a.status = 'done'; toast(`${a.name} completed – remember to book a follow-up`);
  } else if (act === 'noshow') {
    if (!confirm(`Mark ${a.name} as a no-show?`)) return;
    a.status = 'noshow'; toast(`${a.name} marked no-show`);
  } else if (act === 'undo') {
    a.status = 'booked'; delete a.arrived;
  }
  render();
});

$('q').addEventListener('input', render);
$('pracFilter').addEventListener('change', render);
$('statusFilter').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  [...$('statusFilter').children].forEach(x => x.classList.toggle('on', x === b));
  render();
});

// New booking dialog
const opts = PRACS.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
$('pracFilter').innerHTML = '<option value="all">All practitioners</option>' + opts;
$('form').prac.innerHTML = opts;
$('newBtn').onclick = () => { $('form').reset(); $('form').time.value = hhmm(Math.ceil(mins(now()) / 15) * 15); $('dlg').showModal(); };
$('cancel').onclick = () => $('dlg').close();
$('form').addEventListener('submit', e => {
  const f = e.target;
  if (e.submitter && e.submitter.value !== 'ok') return;
  const walkin = f.walkin.checked;
  const a = { id: nextId++, time: f.time.value, dur: 30, name: f.name.value.trim(), phone: f.phone.value.trim() || '—', prac: f.prac.value,
    type: f.type.value, cond: walkin ? 'Walk-in' : 'To be confirmed', status: walkin ? 'waiting' : 'booked', flags: ['New patient'] };
  if (walkin) a.arrived = hhmm(mins(now()));
  appts.push(a); toast(`${a.name} added`); render();
});

render();
setInterval(render, 5000);
</script>
</body>
</html>
