<!doctype html>
<html lang="en-GB" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>MV Gannet · Vehicle loading · Skerra Ferry Company</title>
<script>
  // Set the theme before first paint: saved choice, otherwise the device setting.
  (function () {
    var t = null;
    try { t = localStorage.getItem('gannet-theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;
    --r-sm: 4px; --r-md: 6px; --r-lg: 10px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --cell: 24px;
    --gut: 28px;
    --mid: 14px;
    --dock-h: 0px;
  }

  /* Day: high-contrast for glare on an open deck */
  [data-theme="day"] {
    --bg: #e6ebf0;
    --surface: #ffffff;
    --surface-2: #f1f4f7;
    --ink: #0b1f33;
    --ink-2: #2d4156;
    --ink-3: #4a5d72;
    --line: #c3cdd8;
    --line-strong: #7f93a7;
    --accent: #b7410e;
    --accent-ink: #ffffff;
    --accent-soft: #fbe3d6;
    --ok: #14753d;
    --ok-bg: #cfe9d9;
    --warn: #7a4e00;
    --warn-bg: #fbe3a1;
    --bad: #9f1d12;
    --bad-bg: #f6c9c4;
    --lane: #f4f7fa;
    --cell-line: #dde4eb;
    --hull: #5a7189;
    --v-norm: #d3dde8;
    --v-norm-line: #7f93a7;
    --v-heavy: #aabbcc;
    --v-dg-a: #f8d9d5;
    --v-dg-b: #f1bbb4;
    --v-dg-line: #b42318;
    --v-acc: #cde2f7;
    --v-acc-line: #1d5fa8;
    --shadow: 0 8px 24px rgb(11 31 51 / 0.18);
  }
  /* Night: low-glare for early and late sailings */
  [data-theme="night"] {
    --bg: #0a131c;
    --surface: #131f2c;
    --surface-2: #1a2938;
    --ink: #eaf1f8;
    --ink-2: #c3d0dd;
    --ink-3: #9db0c3;
    --line: #2b3d4f;
    --line-strong: #5f7890;
    --accent: #ff8a4c;
    --accent-ink: #1c0a01;
    --accent-soft: #3b2214;
    --ok: #5fdc8f;
    --ok-bg: #153d27;
    --warn: #fbbf24;
    --warn-bg: #44330a;
    --bad: #ff9088;
    --bad-bg: #4d1f1c;
    --lane: #101b27;
    --cell-line: #1a2a3a;
    --hull: #6f8aa3;
    --v-norm: #2a4157;
    --v-norm-line: #6f8aa3;
    --v-heavy: #3a5874;
    --v-dg-a: #5a2220;
    --v-dg-b: #6f2c29;
    --v-dg-line: #ff9088;
    --v-acc: #1e4468;
    --v-acc-line: #7db7f0;
    --shadow: 0 8px 24px rgb(0 0 0 / 0.5);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 17px/1.45 var(--font);
    -webkit-tap-highlight-color: transparent;
    overflow-x: clip;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  h1, h2, p, ul, dl, dd { margin: 0; padding: 0; }
  h1, h2 { text-wrap: balance; letter-spacing: -0.01em; }
  p { text-wrap: pretty; }
  ul { list-style: none; }
  button, input { font: inherit; color: inherit; }
  button { touch-action: manipulation; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }
  .sr {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- Buttons ---------- */
  .btn {
    min-height: 48px;
    padding: 0 var(--sp-4);
    border: 1.5px solid var(--line-strong);
    border-radius: var(--r-md);
    background: var(--surface);
    font-weight: 600;
    font-size: 16px;
    transition: transform 120ms var(--ease-out), background-color 120ms, border-color 120ms;
  }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-danger { border-color: var(--bad); color: var(--bad); }
  .btn-quiet { border-color: transparent; background: transparent; text-decoration: underline; text-underline-offset: 3px; }
  @media (hover: hover) {
    .btn:hover:not(:disabled) { background: var(--surface-2); }
    .btn-primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
  }

  /* ---------- Header ---------- */
  .top {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: var(--sp-2) var(--sp-4);
    align-items: center;
    padding: var(--sp-4) var(--sp-4) var(--sp-3);
    max-width: 1680px;
    margin: 0 auto;
  }
  .brand h1 { font-size: 26px; line-height: 1.1; font-weight: 800; }
  .route { color: var(--ink-2); font-size: 17px; margin-top: 2px; }
  .route b { color: var(--ink); }
  .top-actions { display: flex; gap: var(--sp-2); align-items: center; }
  .clock {
    grid-column: 1 / -1;
    display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); align-items: center;
    font-weight: 600;
  }
  .clock .cut {
    display: inline-flex; align-items: center; gap: var(--sp-2);
    padding: 4px 12px; border-radius: 999px;
    background: var(--surface); border: 1.5px solid var(--line-strong);
  }
  .clock .cut[data-tone="warn"] { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
  .clock .cut[data-tone="bad"] { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .clock .sample { color: var(--ink-3); font-weight: 500; font-size: 15px; }
  @media (max-width: 899px) { .top { grid-template-columns: 1fr; } .top-actions .btn { flex: 1; } }
  @media (min-width: 900px) {
    .top { grid-template-columns: auto 1fr auto; padding-top: var(--sp-5); }
    .clock { grid-column: auto; justify-content: flex-end; }
  }

  /* ---------- Stats ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--sp-2);
    padding: 0 var(--sp-4);
    max-width: 1680px;
    margin: 0 auto var(--sp-3);
  }
  .tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: var(--sp-2) var(--sp-3);
    min-width: 0;
  }
  .t-label { display: block; font-size: 13px; color: var(--ink-3); font-weight: 600; line-height: 1.3; }
  .t-val { display: block; font-size: 20px; font-weight: 800; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .t-val small { font-size: 13px; font-weight: 600; color: var(--ink-3); }
  .gauge { grid-column: span 2; }
  .g-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-2); }
  .g-state { font-size: 13px; font-weight: 700; white-space: nowrap; }
  .g-state[data-tone="ok"] { color: var(--ok); }
  .g-state[data-tone="warn"] { color: var(--warn); }
  .g-state[data-tone="bad"] { color: var(--bad); }
  .g-track { position: relative; height: 10px; border-radius: 999px; margin: 6px 0 2px; background: var(--zones); overflow: hidden; }
  .g-track::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--ink-3); opacity: 0.5; }
  .g-mark { position: absolute; inset: 0; transform: translateX(var(--shift)); transition: transform 240ms var(--ease-out); }
  .g-mark::before {
    content: ""; position: absolute; left: 50%; top: -1px; width: 6px; height: 12px; margin-left: -3px;
    background: var(--ink); border: 1.5px solid var(--surface); border-radius: 3px; z-index: 1;
  }
  .g-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); font-weight: 600; }
  @media (min-width: 900px) {
    .stats { grid-template-columns: repeat(4, minmax(0, 1fr)) repeat(2, minmax(0, 1.6fr)); }
    .gauge { grid-column: auto; }
    .t-val { font-size: 22px; }
  }

  /* ---------- Layout ---------- */
  .tabs {
    display: flex; gap: var(--sp-2);
    padding: 0 var(--sp-4) var(--sp-3);
    max-width: 1680px; margin: 0 auto;
  }
  .tab {
    flex: 1; min-height: 48px; border-radius: var(--r-md);
    border: 1.5px solid var(--line-strong); background: var(--surface); font-weight: 700;
  }
  .tab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .tab .count { font-variant-numeric: tabular-nums; opacity: 0.85; font-weight: 600; margin-left: 4px; }
  .app {
    display: grid; gap: var(--sp-4);
    padding: 0 var(--sp-4) calc(var(--dock-h) + var(--sp-6));
    max-width: 1680px; margin: 0 auto;
    grid-template-columns: minmax(0, 1fr);
  }
  .app[data-view="queue"] .deck { display: none; }
  .app[data-view="deck"] .queue { display: none; }
  .pane { min-width: 0; }
  .pane-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-2); }
  .pane-head h2 { font-size: 20px; font-weight: 800; }
  .pane-head .hint { color: var(--ink-3); font-size: 14px; }

  @media (min-width: 768px) {
    .tabs { display: none; }
    .app[data-view] .deck, .app[data-view] .queue { display: block; }
    .app { grid-template-columns: 340px minmax(0, 1fr); align-items: start; }
    .queue {
      position: sticky; top: var(--sp-4);
      display: flex !important; flex-direction: column;
      max-height: calc(100dvh - var(--dock-h) - 32px);
    }
    .queue #qlist { overflow-y: auto; }
  }
  @media (min-width: 1280px) {
    :root { --dock-h: 0px; }
    .app { grid-template-columns: 360px minmax(0, 1fr) 360px; }
    .queue { max-height: calc(100dvh - 32px); }
  }

  /* ---------- Queue ---------- */
  .toolbar { display: grid; gap: var(--sp-2); margin-bottom: var(--sp-2); }
  .field label { display: block; font-size: 14px; font-weight: 600; color: var(--ink-2); margin-bottom: 2px; }
  .field input {
    width: 100%; min-height: 48px; padding: 0 var(--sp-3);
    border: 1.5px solid var(--line-strong); border-radius: var(--r-md);
    background: var(--surface); font-size: 17px;
  }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border: 1.5px solid var(--line-strong); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
  .seg button { min-height: 48px; border: 0; background: transparent; font-weight: 700; font-size: 15px; border-right: 1px solid var(--line); padding: 0 4px; }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .seg .count { font-variant-numeric: tabular-nums; font-weight: 600; margin-left: 2px; }
  .chip {
    min-height: 44px; padding: 0 var(--sp-3); border-radius: 999px;
    border: 1.5px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 15px;
    justify-self: start;
  }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
  #qlist { display: grid; gap: var(--sp-1); align-content: start; padding: 2px; }
  .qrow {
    width: 100%; min-height: 64px; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto;
    gap: var(--sp-3); align-items: center; text-align: left;
    padding: var(--sp-2) var(--sp-3);
    border: 1px solid var(--line); border-left: 5px solid var(--line-strong);
    border-radius: var(--r-md); background: var(--surface);
    transition: transform 120ms var(--ease-out), background-color 120ms;
  }
  .qrow:active { transform: scale(0.985); }
  .qrow[aria-pressed="true"] { border-color: var(--accent); border-left-color: var(--accent); outline: 2px solid var(--accent); outline-offset: -1px; background: var(--accent-soft); }
  .qrow:focus-visible, .qrow[aria-pressed="true"]:focus-visible { outline: 4px solid var(--ink); outline-offset: -4px; }
  @media (hover: hover) { .qrow:hover { background: var(--surface-2); } .qrow[aria-pressed="true"]:hover { background: var(--accent-soft); } }
  .qnum { font-weight: 700; color: var(--ink-3); font-size: 15px; font-variant-numeric: tabular-nums; }
  .qmain { display: grid; min-width: 0; }
  .reg { font-weight: 800; font-size: 19px; letter-spacing: 0.02em; line-height: 1.2; }
  .qsub { color: var(--ink-2); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qtags { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 13px; font-weight: 800; border: 1.5px solid currentColor; line-height: 1.35; }
  .tag-dg { color: var(--bad); background: var(--bad-bg); }
  .tag-acc { color: var(--v-acc-line); background: var(--v-acc); }
  .tag-heavy { color: var(--ink); background: var(--v-heavy); border-color: var(--v-norm-line); }
  .empty { padding: var(--sp-6) var(--sp-4); text-align: center; background: var(--surface); border: 1.5px dashed var(--line-strong); border-radius: var(--r-lg); display: grid; gap: var(--sp-3); justify-items: center; }
  .empty p { color: var(--ink-2); max-width: 32ch; }
  .empty strong { font-size: 18px; }

  /* ---------- Deck ---------- */
  .lanehead, .hull .grid {
    display: grid;
    grid-template-columns: var(--gut) repeat(2, minmax(0, 1fr)) var(--mid) repeat(2, minmax(0, 1fr));
    column-gap: 4px;
  }
  .lanehead, .hull { padding-inline: 10px; }
  .lanehead { margin-bottom: var(--sp-2); }
  .lh { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 6px 8px; min-width: 0; }
  .lh b { font-size: 20px; font-weight: 800; line-height: 1.1; }
  .lh .ln { display: block; font-size: 12px; color: var(--ink-3); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lh .lf { display: block; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .lh .bar { display: block; height: 4px; border-radius: 2px; background: var(--cell-line); margin-top: 4px; overflow: hidden; }
  .lh .bar i { display: block; height: 100%; width: 100%; background: var(--ink-2); transform-origin: left; transition: transform 240ms var(--ease-out); }
  .lh .bar i[data-tone="warn"] { background: var(--warn); }
  .lh .bar i[data-tone="bad"] { background: var(--bad); }
  .side { grid-column: 2 / 4; font-size: 12px; font-weight: 700; color: var(--ink-3); }

  .hull { position: relative; padding-top: 68px; padding-bottom: 44px; }
  .hull::before, .hull::after { content: ""; position: absolute; }
  .hull::before { inset: 0; background: var(--hull); clip-path: polygon(50% 0, 100% 60px, 100% 100%, 0 100%, 0 60px); }
  .hull::after { inset: 0; background: var(--surface-2); clip-path: polygon(50% 4px, calc(100% - 3px) 62px, calc(100% - 3px) calc(100% - 3px), 3px calc(100% - 3px), 3px 62px); }
  .hull > * { position: relative; z-index: 1; }
  .bow, .stern { position: absolute !important; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: var(--ink-3); }
  .bow { top: 28px; }
  .stern { bottom: 12px; }
  .stern::before { content: ""; position: absolute; left: 10px; right: 10px; top: -8px; border-top: 3px dashed var(--line-strong); }
  .ruler, .lane, .mid { display: grid; grid-template-rows: repeat(22, var(--cell)); min-width: 0; }
  .ruler span { font-size: 12px; font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; line-height: var(--cell); }
  .mid { border-left: 2px dashed var(--line-strong); margin-left: calc(var(--mid) / 2 - 1px); width: 0; justify-self: start; }
  .lane {
    position: relative;
    background-color: var(--lane);
    background-image: linear-gradient(var(--cell-line) 1px, transparent 1px);
    background-size: 100% var(--cell);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
  }
  .veh {
    position: relative;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
    min-width: 0; margin: 1px 1px; padding: 1px 6px;
    border: 1.5px solid var(--v-norm-line); border-radius: var(--r-sm);
    background: var(--v-norm); color: var(--ink);
    text-align: left; overflow: hidden;
    transition: transform 120ms var(--ease-out);
    animation: land 220ms var(--ease-out);
  }
  .veh:active { transform: scale(0.97); }
  .veh b { font-size: 13px; font-weight: 800; line-height: 1.15; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .veh span { font-size: 12px; font-weight: 600; line-height: 1.15; white-space: nowrap; }
  .veh.heavy { background: var(--v-heavy); }
  .veh.dg { background: repeating-linear-gradient(135deg, var(--v-dg-a) 0 8px, var(--v-dg-b) 8px 16px); border-color: var(--v-dg-line); }
  .veh.acc { background: var(--v-acc); border-color: var(--v-acc-line); }
  .veh.sel { outline: 3px solid var(--accent); outline-offset: 1px; z-index: 2; }
  .veh.one { margin-block: 0; }
  .veh.one::after { content: ""; position: absolute; inset: -10px 0; }
  .ghost {
    margin: 1px 1px; border: 2px dashed var(--line-strong); border-radius: var(--r-sm);
    display: grid; place-items: center; color: var(--ink-3); font-size: 12px; font-weight: 800;
    pointer-events: none; opacity: 0.8;
  }
  .ghost.hot { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); opacity: 1; border-style: solid; }
  @keyframes land { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: none; } }

  .legend { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); margin-top: var(--sp-3); font-size: 14px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 18px; height: 14px; border-radius: 3px; border: 1.5px solid var(--v-norm-line); background: var(--v-norm); display: inline-block; }
  .legend i.l-heavy { background: var(--v-heavy); }
  .legend i.l-dg { background: repeating-linear-gradient(135deg, var(--v-dg-a) 0 5px, var(--v-dg-b) 5px 10px); border-color: var(--v-dg-line); }
  .legend i.l-acc { background: var(--v-acc); border-color: var(--v-acc-line); }
  .legend i.l-ghost { background: transparent; border: 2px dashed var(--line-strong); }
  .closed-banner { background: var(--ink); color: var(--bg); padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); margin-bottom: var(--sp-3); display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); align-items: center; justify-content: space-between; font-weight: 600; }
  .closed-banner .btn { background: var(--bg); color: var(--ink); border-color: var(--bg); }

  /* ---------- Selected-vehicle panel (dock on tablets and phones) ---------- */
  .panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface);
    border-top: 2px solid var(--ink);
    padding: var(--sp-3) var(--sp-4) calc(var(--sp-3) + env(safe-area-inset-bottom));
    box-shadow: var(--shadow);
    max-height: 70dvh; overflow-y: auto;
  }
  .p-inner { max-width: 1680px; margin: 0 auto; display: grid; gap: var(--sp-2); }
  .p-head { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); }
  .p-id { min-width: 0; }
  .reg-lg { display: block; font-size: 24px; font-weight: 800; letter-spacing: 0.02em; line-height: 1.15; }
  .p-type { color: var(--ink-2); font-size: 15px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-rule { font-size: 15px; font-weight: 600; padding: 6px 10px; border-radius: var(--r-sm); border-left: 4px solid var(--warn); background: var(--warn-bg); color: var(--ink); }
  .p-rule[data-tone="bad"] { border-color: var(--bad); background: var(--bad-bg); }
  .lbtns { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-2); }
  .lbtn {
    min-height: 68px; padding: 4px 4px; border-radius: var(--r-md);
    border: 2px solid var(--line-strong); background: var(--surface);
    display: grid; align-content: center; justify-items: center; gap: 0; line-height: 1.2;
    transition: transform 120ms var(--ease-out), background-color 120ms;
  }
  .lbtn:active:not(:disabled) { transform: scale(0.97); }
  .lbtn b { font-size: 18px; font-weight: 800; }
  .lbtn .l2 { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .lbtn .l3 { font-size: 12px; font-weight: 700; color: var(--ink-2); min-height: 15px; }
  .lbtn.best { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .lbtn.best .l3 { color: var(--accent-ink); }
  .lbtn.soft { border-color: var(--warn); }
  .lbtn.soft .l3 { color: var(--warn); }
  .lbtn:disabled { background: var(--surface-2); border-style: dashed; color: var(--ink-3); cursor: not-allowed; }
  .lbtn:disabled .l3 { color: var(--bad); }
  @media (hover: hover) { .lbtn:hover:not(:disabled):not(.best) { background: var(--surface-2); } }
  .p-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .p-actions .btn { flex: 1 1 140px; }
  .p-state { font-size: 16px; font-weight: 700; }
  .p-help { font-size: 15px; color: var(--ink-2); }
  .detail { display: none; }
  .panel.open .detail { display: grid; gap: var(--sp-3); }
  .more { min-height: 44px; padding: 0 var(--sp-3); }
  dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px var(--sp-4); font-size: 16px; }
  dl.facts dt { color: var(--ink-3); font-weight: 600; }
  dl.facts dd { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .note { font-size: 15px; color: var(--ink-2); border-left: 3px solid var(--line-strong); padding-left: var(--sp-3); }
  .p-empty { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap; }

  @media (min-width: 768px) and (max-width: 1279px) {
    .p-inner.has-lanes { grid-template-columns: minmax(0, 1fr) minmax(320px, 520px); align-items: center; column-gap: var(--sp-6); }
    .p-inner.has-lanes .p-rule, .p-inner.has-lanes .detail { grid-column: 1 / -1; }
  }
  @media (min-width: 1280px) {
    .panel {
      position: sticky; top: var(--sp-4); left: auto; right: auto; bottom: auto;
      border: 1px solid var(--line); border-radius: var(--r-lg);
      box-shadow: none; padding: var(--sp-4); max-height: none;
    }
    .p-inner { gap: var(--sp-3); }
    .lbtns { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lbtn { min-height: 84px; }
    .lbtn b { font-size: 22px; }
    .lbtn .l2 { font-size: 15px; }
    .lbtn .l3 { font-size: 13px; }
    .detail { display: grid; gap: var(--sp-3); }
    .more { display: none; }
    .reg-lg { font-size: 28px; }
  }

  /* ---------- Toast, dialog, footer ---------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--dock-h) + var(--sp-4)); z-index: 40;
    transform: translateX(-50%);
    width: min(560px, calc(100% - 32px));
    display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
    background: var(--ink); color: var(--bg); border-radius: var(--r-md);
    padding: var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-4);
    box-shadow: var(--shadow); font-weight: 600; font-size: 16px;
    animation: toast-in 200ms var(--ease-out);
  }
  .toast[hidden] { display: none; }
  .toast .btn { background: transparent; color: var(--bg); border-color: var(--bg); min-height: 44px; }
  @keyframes toast-in { from { opacity: 0; translate: 0 8px; } to { opacity: 1; translate: 0 0; } }
  dialog {
    width: min(520px, calc(100% - 32px)); border: 0; border-radius: var(--r-lg); padding: var(--sp-5);
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgb(5 12 20 / 0.6); }
  dialog h2 { font-size: 22px; margin-bottom: var(--sp-3); }
  dialog .body { display: grid; gap: var(--sp-3); color: var(--ink-2); margin-bottom: var(--sp-5); }
  dialog .body ul { display: flex; flex-wrap: wrap; gap: 6px; }
  dialog .body li { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 8px; font-weight: 700; color: var(--ink); font-size: 15px; }
  dialog .warnbox { padding: 8px 12px; border-left: 4px solid var(--bad); background: var(--bad-bg); color: var(--ink); font-weight: 600; border-radius: 4px; }
  dialog .actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; justify-content: flex-end; }
  dialog .actions .btn { flex: 1 1 140px; }
  .foot { max-width: 1680px; margin: 0 auto; padding: 0 var(--sp-4) var(--sp-6); color: var(--ink-3); font-size: 14px; display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); align-items: center; }
  .foot .btn { min-height: 44px; font-size: 15px; }

  @media (prefers-reduced-motion: reduce) {
    .veh, .toast { animation: none; }
    .g-mark, .lh .bar i { transition: none; }
    .btn:active, .lbtn:active, .qrow:active, .veh:active { transform: none; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>MV Gannet</h1>
    <p class="route"><b class="num" id="sailTime">--:--</b> Skerra to Port Calder</p>
  </div>
  <div class="top-actions">
    <button class="btn" id="themeBtn" type="button" data-act="theme" aria-pressed="false">Night view</button>
    <button class="btn" id="closeBtn" type="button" data-act="close">Close loading</button>
  </div>
  <div class="clock" id="clock"></div>
</header>

<section class="stats" id="stats" aria-label="Deck totals"></section>

<nav class="tabs" aria-label="Switch view">
  <button class="tab" type="button" data-act="view" data-v="queue" aria-pressed="true">Quay queue <span class="count" id="tabCount"></span></button>
  <button class="tab" type="button" data-act="view" data-v="deck" aria-pressed="false">Deck plan</button>
</nav>

<main class="app" id="app" data-view="queue">
  <section class="pane queue" aria-labelledby="qh">
    <div class="pane-head"><h2 id="qh">Quay queue</h2></div>
    <div class="toolbar">
      <div class="field">
        <label for="search">Find by registration or driver</label>
        <input id="search" type="search" autocomplete="off" autocapitalize="characters" spellcheck="false">
      </div>
      <div class="seg" role="group" aria-label="Show vehicles">
        <button type="button" data-act="filter" data-f="waiting" aria-pressed="true">Waiting <span class="count" id="cWaiting"></span></button>
        <button type="button" data-act="filter" data-f="loaded" aria-pressed="false">Loaded <span class="count" id="cLoaded"></span></button>
        <button type="button" data-act="filter" data-f="noshow" aria-pressed="false">No-show <span class="count" id="cNoshow"></span></button>
      </div>
      <button class="chip" type="button" data-act="special" aria-pressed="false">Special loads only</button>
    </div>
    <ul id="qlist" aria-label="Vehicles"></ul>
  </section>

  <section class="pane deck" aria-labelledby="dh">
    <div class="pane-head">
      <h2 id="dh">Vehicle deck</h2>
      <span class="hint">Plan view, bow at top</span>
    </div>
    <div id="closedBanner"></div>
    <div id="deck"></div>
    <div class="legend" aria-label="Key">
      <span><i></i>Vehicle</span>
      <span><i class="l-heavy"></i>Heavy, 10 t or more</span>
      <span><i class="l-dg"></i>Dangerous goods</span>
      <span><i class="l-acc"></i>Needs door-open room</span>
      <span><i class="l-ghost"></i>Where it would sit</span>
    </div>
  </section>

  <aside class="panel" id="panel" aria-label="Selected vehicle"></aside>
</main>

<footer class="foot">
  <span>Sample data for demonstration. Registrations, names and weights are invented.</span>
  <button class="btn btn-quiet" type="button" data-act="reset">Reset sample sailing</button>
</footer>

<div class="toast" id="toast" role="status" hidden></div>
<dialog id="dlg"></dialog>

<script>
(() => {
  'use strict';

  /* ---------- Fixed facts about the ship ---------- */
  const LANES = [
    { id: 'A', name: 'Port outer', side: 'port' },
    { id: 'B', name: 'Port inner', side: 'port' },
    { id: 'C', name: 'Stbd inner', side: 'stbd' },
    { id: 'D', name: 'Stbd outer', side: 'stbd' }
  ];
  const CAP = 22;            // positions per lane (2.5 m each)
  const CELL_M = 2.5;
  const LANE_MAX = 28000;    // kg per lane
  const PAX_MAX = 190;
  const CUTOFF_MIN = 10;     // loading closes this long before sailing
  const HEAVY = 10000;       // kg
  const TYPES = {
    hatch:   ['Hatchback', 2], estate: ['Estate', 2], suv: ['SUV', 2], pickup: ['Pickup', 2],
    van:     ['Van', 3], mini: ['Minibus', 3], camper: ['Motorhome', 3], trailer: ['Car and trailer', 3],
    bike:    ['Motorbike', 1], rigid: ['Rigid lorry', 5], stock: ['Livestock lorry', 5], tanker: ['Tanker', 6]
  };

  /* ---------- Sample sailing: id, reg, type, driver, people, kg, flag, note, lane if already loaded ---------- */
  const RAW = [
    [1, 'SN21 KHD', 'estate', 'M. Rennie', 3, 1850, '', '', 'A'],
    [2, 'YA68 FPT', 'hatch', 'C. Ogilvie', 2, 1240, '', '', 'A'],
    [3, 'SG70 BXU', 'van', 'T. MacAskill, Skerra Co-op', 1, 2650, '', 'Shop delivery, 14 crates', 'B'],
    [4, 'WX19 JRD', 'stock', 'G. Buchanan, Buchanan Haulage', 1, 14200, '', '20 ewes, hosed down at the quay', 'B'],
    [5, 'SK22 TGN', 'hatch', 'A. Fraser', 4, 1310, '', '', 'C'],
    [6, 'BD17 PLC', 'mini', 'Calder Community Transport', 9, 3400, 'acc', 'Wheelchair lift, 2 chairs secured', 'D'],
    [7, 'LK64 DZV', 'rigid', 'H. Morrison, Hebridean Gas', 1, 9800, 'dg', 'Propane cylinders, UN1978. No ignition sources near.', 'D'],
    [8, 'SK20 MJE', 'hatch', 'R. Sinclair', 2, 1180, '', '', 'A'],
    [9, 'GN21 OTR', 'bike', 'P. Delaney', 1, 235, '', '', 'D'],
    [10, 'SF18 VTK', 'camper', 'J. Ashworth', 2, 3450, '', '', 'C'],
    [11, 'SK73 GAA', 'van', 'Gannet Fish Ltd', 1, 3100, '', 'Chilled fish, engine off once parked', 'D'],
    [12, 'DS21 HWP', 'suv', 'L. Henderson', 4, 1650, '', '', null],
    [13, 'SK16 RYU', 'hatch', 'E. Gunn', 1, 1090, '', '', null],
    [14, 'PO69 CNA', 'van', 'D. Pirie, Pirie Plumbing', 1, 2900, '', '', null],
    [15, 'SK72 LDF', 'hatch', 'N. Okafor', 2, 1300, '', '', null],
    [16, 'MA20 TZB', 'estate', 'S. Whitelaw', 5, 1720, '', 'Roof box fitted', null],
    [17, 'FX15 GHR', 'tanker', 'Skerra Fuels', 1, 17500, 'dg', 'Red diesel and kerosene, UN1202. Outer lane only.', null],
    [18, 'SK19 UPR', 'hatch', 'H. Dunbar', 2, 1150, '', '', null],
    [19, 'YJ66 OLA', 'trailer', 'K. Maclean', 2, 2300, '', 'Boat trailer, 4.2 m', null],
    [20, 'SK21 BNW', 'estate', 'D. Fairbairn', 2, 1980, 'acc', 'Blue badge. Wheelchair user with rear ramp. Needs door-open room.', null],
    [21, 'EO18 VSD', 'hatch', 'F. Lindqvist', 2, 1210, '', '', null],
    [22, 'KT22 ZRM', 'bike', 'O. Brandt', 1, 220, '', '', null],
    [23, 'SK70 PKK', 'van', 'Calder Bakery', 2, 2400, '', 'Morning bread order', null],
    [24, 'LC71 EFN', 'bike', 'Y. Tanaka', 1, 245, '', '', null],
    [25, 'WN14 KCR', 'rigid', 'Island Feeds', 1, 11800, '', 'Animal feed, 22 pallets', null],
    [26, 'SK23 AAZ', 'hatch', 'B. Mowat', 3, 1280, '', '', null],
    [27, 'DK67 XHE', 'mini', 'Skerra Primary school trip', 16, 3900, '', '14 pupils and 2 staff', null],
    [28, 'SK18 HNT', 'camper', 'R. Gilchrist', 2, 3500, '', '', null],
    [29, 'SK69 RDB', 'estate', 'P. Thorne', 2, 1760, '', '', null],
    [30, 'SK21 WWC', 'hatch', 'J. Abara', 1, 1330, '', '', null],
    [31, 'SK22 ZXY', 'pickup', 'A. Cameron', 2, 2250, '', '', null],
    [32, 'HV70 MNL', 'suv', 'I. Vaughan', 3, 2050, '', '', null]
  ];
  const VEH = RAW.map(([id, reg, t, driver, pax, kg, flag, note, lane0]) => ({
    id, reg, driver, pax, kg, flag, note, lane0,
    type: TYPES[t][0], len: TYPES[t][1], heavy: kg >= HEAVY
  }));
  const BY = Object.fromEntries(VEH.map(v => [v.id, v]));

  /* ---------- State ---------- */
  const KEY = 'gannet-load-v1';
  const ui = { view: 'queue', filter: 'waiting', q: '', special: false, more: false };
  let undo = null;
  let toastTimer = null;

  function fresh() {
    const lanes = { A: [], B: [], C: [], D: [] };
    VEH.forEach(v => { if (v.lane0) lanes[v.lane0].push(v.id); });
    const d = new Date(Date.now() + 47 * 60000);
    d.setSeconds(0, 0);
    d.setMinutes(Math.ceil(d.getMinutes() / 5) * 5);
    const s = { dep: d.getTime(), lanes, noshow: [], sel: null, closed: false, closedAt: null };
    s.sel = VEH.find(v => !v.lane0).id;
    return s;
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && s.lanes && s.lanes.A && Date.now() - s.dep < 3 * 3600000) return s;
    } catch (e) {}
    return fresh();
  }
  let S = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  /* ---------- Derived data ---------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const tons = kg => (kg / 1000).toFixed(1) + ' t';
  const metres = len => (len * CELL_M).toFixed(1) + ' m';
  const hhmm = ms => new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });

  function placement(id) {
    for (const L of LANES) {
      let pos = 1;
      for (const x of S.lanes[L.id]) {
        if (x === id) return { lane: L.id, start: pos, end: pos + BY[id].len - 1, last: S.lanes[L.id][S.lanes[L.id].length - 1] === id };
        pos += BY[x].len;
      }
    }
    return null;
  }
  const statusOf = id => placement(id) ? 'loaded' : S.noshow.includes(id) ? 'noshow' : 'waiting';
  const waitingList = () => VEH.filter(v => statusOf(v.id) === 'waiting');
  function nextWaiting(afterId) {
    const w = waitingList();
    const n = w.find(v => v.id > afterId) || w[0];
    return n ? n.id : null;
  }
  function laneStats(l, lanes = S.lanes) {
    let used = 0, kg = 0;
    lanes[l].forEach(id => { used += BY[id].len; kg += BY[id].kg; });
    return { used, kg, free: CAP - used };
  }
  function balance(lanes = S.lanes) {
    let port = 0, stbd = 0, moment = 0, total = 0;
    LANES.forEach(L => {
      let pos = 0;
      lanes[L.id].forEach(id => {
        const v = BY[id];
        L.side === 'port' ? (port += v.kg) : (stbd += v.kg);
        moment += v.kg * (pos + v.len / 2 - CAP / 2);
        total += v.kg; pos += v.len;
      });
    });
    return { total, list: total ? (port - stbd) / total * 100 : 0, trim: total ? moment / (total * CAP / 2) * 100 : 0 };
  }
  function totals() {
    let cells = 0, kg = 0, pax = 0, n = 0;
    LANES.forEach(L => S.lanes[L.id].forEach(id => { const v = BY[id]; cells += v.len; kg += v.kg; pax += v.pax; n++; }));
    return { cells, kg, pax, n, bookings: VEH.length - S.noshow.length };
  }
  const tone = (val, amber, red) => Math.abs(val) >= red ? 'bad' : Math.abs(val) >= amber ? 'warn' : 'ok';
  const toneWord = { ok: '● OK', warn: '▲ Watch', bad: '■ Over limit' };

  /* ---------- Placement rules ---------- */
  function rulesFor(v) {
    const per = {};
    LANES.forEach(L => {
      const ls = laneStats(L.id);
      const outer = L.id === 'A' || L.id === 'D';
      let block = null, soft = null;
      if (S.closed) block = 'Closed';
      else if (ls.free < v.len) block = 'No room';
      else if (ls.kg + v.kg > LANE_MAX) block = 'Too heavy';
      else if (v.flag === 'dg' && !outer) block = 'Not allowed';
      else if (v.flag === 'acc' && !outer) soft = 'Boxed in';
      else if (v.heavy && v.flag !== 'dg' && outer) soft = 'Not ideal';
      per[L.id] = { block, soft, free: ls.free };
    });
    // Best lane: allowed, no warning, and leaves the deck most level.
    let best = null, bestScore = Infinity;
    [false, true].forEach(allowSoft => {
      if (best) return;
      LANES.forEach(L => {
        const r = per[L.id];
        if (r.block || (r.soft && !allowSoft)) return;
        const after = balance({ ...S.lanes, [L.id]: [...S.lanes[L.id], v.id] });
        const score = Math.abs(after.list);
        if (score < bestScore) { bestScore = score; best = L.id; }
      });
    });
    let rule = null, ruleTone = 'warn';
    if (v.flag === 'dg') { rule = 'Dangerous goods: outer lanes A or D only.'; ruleTone = 'bad'; }
    else if (v.flag === 'acc') rule = 'Needs door-open room: use an outer lane, A or D.';
    else if (v.heavy && v.flag !== 'dg') rule = 'Heavy load: centre lanes B or C are best.';
    return { per, best, rule, ruleTone };
  }

  /* ---------- Rendering ---------- */
  const $ = id => document.getElementById(id);

  function renderHeader() {
    $('sailTime').textContent = hhmm(S.dep);
    $('closeBtn').textContent = S.closed ? 'Reopen loading' : 'Close loading';
    $('closeBtn').dataset.act = S.closed ? 'reopen' : 'close';
    renderClock();
  }
  function renderClock() {
    const mins = Math.ceil((S.dep - CUTOFF_MIN * 60000 - Date.now()) / 60000);
    let text, t = 'ok';
    if (S.closed) text = 'Loading closed at ' + hhmm(S.closedAt);
    else if (mins > 0) { text = `Loading closes in ${mins} min`; t = mins <= 5 ? 'bad' : mins <= 15 ? 'warn' : 'ok'; }
    else { text = `Past cut-off by ${-mins} min`; t = 'bad'; }
    const icon = S.closed ? '■' : t === 'bad' ? '■' : t === 'warn' ? '▲' : '●';
    $('clock').innerHTML = `<span class="cut num" data-tone="${S.closed ? 'ok' : t}"><span aria-hidden="true">${icon}</span>${text}</span><span class="sample">Sails ${hhmm(S.dep)} from Skerra</span>`;
  }

  function gauge(label, val, range, amber, red, left, right, display, quiet) {
    const t = quiet ? 'ok' : tone(val, amber, red);
    const a = 50 - amber / range * 50, r = 50 - red / range * 50;
    const zones = `linear-gradient(90deg, var(--bad-bg) 0 ${r}%, var(--warn-bg) ${r}% ${a}%, var(--ok-bg) ${a}% ${100 - a}%, var(--warn-bg) ${100 - a}% ${100 - r}%, var(--bad-bg) ${100 - r}% 100%)`;
    const shift = Math.max(-1, Math.min(1, val / range)) * 50;
    return `<div class="tile gauge"><div class="g-head"><span class="t-label">${label}</span><span class="g-state" data-tone="${t}">${quiet ? 'Still filling' : toneWord[t]}</span></div>
      <span class="t-val">${display}</span>
      <div class="g-track" style="--zones:${zones}"><i class="g-mark" style="--shift:${shift}%"></i></div>
      <div class="g-ends"><span>${left}</span><span>${right}</span></div></div>`;
  }
  function renderStats() {
    const T = totals(), B = balance();
    const listTxt = Math.abs(B.list) < 0.05 ? 'Level' : `${Math.abs(B.list).toFixed(1)}% ${B.list > 0 ? 'port' : 'stbd'}`;
    const trimTxt = Math.abs(B.trim) < 0.5 ? 'Level' : `${Math.abs(B.trim).toFixed(0)}% ${B.trim > 0 ? 'stern' : 'bow'}`;
    $('stats').innerHTML =
      `<div class="tile"><span class="t-label">Loaded</span><span class="t-val">${T.n}<small> / ${T.bookings}</small></span></div>
       <div class="tile"><span class="t-label">Deck</span><span class="t-val">${T.cells}<small> / ${CAP * 4}</small></span></div>
       <div class="tile"><span class="t-label">Weight</span><span class="t-val">${tons(T.kg)}</span></div>
       <div class="tile"><span class="t-label">People</span><span class="t-val">${T.pax}<small> / ${PAX_MAX}</small></span></div>` +
      gauge('Side balance', B.list, 8, 3, 5, 'Port', 'Stbd', listTxt) +
      gauge('Fore and aft', B.trim, 60, 30, 50, 'Bow', 'Stern', trimTxt, T.cells < CAP * 4 * 0.7);
  }

  function tagsFor(v) {
    return (v.flag === 'dg' ? '<span class="tag tag-dg">DG</span>' : '') +
           (v.flag === 'acc' ? '<span class="tag tag-acc">Access</span>' : '') +
           (v.heavy ? '<span class="tag tag-heavy">Heavy</span>' : '');
  }
  function renderQueue() {
    const counts = { waiting: 0, loaded: 0, noshow: 0 };
    VEH.forEach(v => counts[statusOf(v.id)]++);
    $('cWaiting').textContent = counts.waiting; $('cLoaded').textContent = counts.loaded; $('cNoshow').textContent = counts.noshow;
    $('tabCount').textContent = `(${counts.waiting})`;
    document.querySelectorAll('[data-act="filter"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === ui.filter));
    document.querySelector('[data-act="special"]').setAttribute('aria-pressed', ui.special);

    const q = ui.q.trim().toLowerCase().replace(/\s+/g, '');
    const rows = VEH.filter(v => statusOf(v.id) === ui.filter)
      .filter(v => !ui.special || v.flag || v.heavy)
      .filter(v => !q || (v.reg + v.driver).toLowerCase().replace(/\s+/g, '').includes(q));

    if (!rows.length) {
      let msg;
      if (q) msg = `<strong>No match for “${esc(ui.q.trim())}”</strong><p>Check the registration, or look under another tab.</p><button class="btn" type="button" data-act="clearsearch">Clear search</button>`;
      else if (ui.special) msg = `<strong>No special loads here</strong><p>Dangerous goods, access and heavy vehicles show up here.</p><button class="btn" type="button" data-act="special">Show all</button>`;
      else if (ui.filter === 'waiting') msg = `<strong>The quay is clear</strong><p>Every booked vehicle is aboard or marked as a no-show.</p><button class="btn btn-primary" type="button" data-act="close">Review and close loading</button>`;
      else if (ui.filter === 'loaded') msg = `<strong>Nothing loaded yet</strong><p>Pick a waiting vehicle and place it in a lane.</p>`;
      else msg = `<strong>No no-shows</strong><p>Vehicles you mark as not turned up appear here.</p>`;
      $('qlist').innerHTML = `<li class="empty">${msg}</li>`;
      return;
    }
    $('qlist').innerHTML = rows.map(v => {
      const p = placement(v.id);
      const place = p ? `<span class="num">Lane ${p.lane}, ${p.start}${p.end > p.start ? '–' + p.end : ''}</span>` : '';
      return `<li><button class="qrow" type="button" data-act="select" data-id="${v.id}" data-fk="q${v.id}" aria-pressed="${S.sel === v.id}">
        <span class="qnum">#${v.id}</span>
        <span class="qmain"><span class="reg">${esc(v.reg)}</span><span class="qsub" title="${esc(v.driver)}">${esc(v.type)} · ${tons(v.kg)} · ${esc(v.driver)}</span></span>
        <span class="qtags">${tagsFor(v)}${place}</span></button></li>`;
    }).join('');
  }

  function renderDeck() {
    const sel = S.sel && BY[S.sel];
    const selWait = sel && statusOf(sel.id) === 'waiting';
    const rules = selWait ? rulesFor(sel) : null;

    const heads = LANES.map(L => {
      const ls = laneStats(L.id);
      const t = ls.kg > LANE_MAX * 0.95 ? 'bad' : ls.kg > LANE_MAX * 0.8 ? 'warn' : 'ok';
      return `<div class="lh"><b>${L.id}</b> <span class="ln">${L.name}</span><span class="lf">${ls.free} free · ${tons(ls.kg)}</span>
        <span class="bar" aria-hidden="true"><i data-tone="${t}" style="transform:scaleX(${Math.min(1, ls.kg / LANE_MAX).toFixed(3)})"></i></span></div>`;
    });
    const headHtml = `<div class="lanehead" aria-hidden="false"><span></span>${heads[0]}${heads[1]}<span></span>${heads[2]}${heads[3]}</div>`;

    const laneHtml = L => {
      let pos = 1, out = '';
      S.lanes[L.id].forEach(id => {
        const v = BY[id];
        const cls = ['veh', v.flag, v.heavy ? 'heavy' : '', v.len === 1 ? 'one' : '', S.sel === id ? 'sel' : ''].join(' ');
        const label = `${v.reg}, ${v.type}, ${tons(v.kg)}, lane ${L.id} position ${pos} to ${pos + v.len - 1}`;
        const sub = v.len > 1 ? `<span>${tons(v.kg)}${v.flag === 'dg' ? ' DG' : v.flag === 'acc' ? ' ACC' : ''}</span>` : '';
        out += `<button class="${cls}" type="button" style="grid-row:${pos} / span ${v.len}" data-act="select" data-id="${id}" data-fk="v${id}" aria-label="${esc(label)}" aria-pressed="${S.sel === id}"><b>${esc(v.reg)}</b>${sub}</button>`;
        pos += v.len;
      });
      if (rules && !rules.per[L.id].block) {
        out += `<div class="ghost" data-ghost="${L.id}" aria-hidden="true" style="grid-row:${pos} / span ${sel.len}">${L.id}</div>`;
      }
      return `<div class="lane" role="group" aria-label="Lane ${L.id}, ${L.name}">${out}</div>`;
    };
    const ruler = `<div class="ruler" aria-hidden="true">${[1, 5, 10, 15, 20].map(n => `<span style="grid-row:${n}">${n}</span>`).join('')}</div>`;

    $('deck').innerHTML = `<div class="deckwrap">${headHtml}
      <div class="hull"><div class="bow" aria-hidden="true">BOW</div>
        <div class="grid">${ruler}${laneHtml(LANES[0])}${laneHtml(LANES[1])}<div class="mid" aria-hidden="true"></div>${laneHtml(LANES[2])}${laneHtml(LANES[3])}</div>
        <div class="stern" aria-hidden="true">STERN RAMP</div></div></div>`;

    $('closedBanner').innerHTML = S.closed
      ? `<div class="closed-banner"><span>Loading closed at ${hhmm(S.closedAt)}. The plan is locked.</span><button class="btn" type="button" data-act="reopen">Reopen loading</button></div>` : '';
  }

  function renderPanel() {
    const p = $('panel');
    p.classList.toggle('open', ui.more);
    const v = S.sel && BY[S.sel];
    if (!v) {
      const w = waitingList().length;
      p.innerHTML = `<div class="p-inner"><div class="p-empty"><div><strong class="reg-lg" style="font-size:20px">${w ? 'Select a vehicle' : 'Nothing waiting'}</strong>
        <span class="p-help">${w ? 'Choose one from the quay queue to see where it can go.' : 'Pick a loaded vehicle on the deck to inspect it.'}</span></div>
        ${w ? '<button class="btn btn-primary" type="button" data-act="next">Take next in queue</button>' : ''}</div></div>`;
      return;
    }
    const st = statusOf(v.id), pl = placement(v.id);
    const head = `<div class="p-head"><div class="p-id"><span class="reg-lg">${esc(v.reg)}</span>
      <span class="p-type">${esc(v.type)} · ${tons(v.kg)} · ${metres(v.len)}</span></div>
      <button class="btn more" type="button" data-act="more" aria-expanded="${ui.more}">${ui.more ? 'Less' : 'Details'}</button></div>`;
    const detail = `<div class="detail"><dl class="facts">
        <dt>Booking</dt><dd class="num">#${v.id}</dd><dt>Driver</dt><dd>${esc(v.driver)}</dd>
        <dt>People</dt><dd class="num">${v.pax}</dd><dt>Weight</dt><dd class="num">${tons(v.kg)}</dd>
        <dt>Length</dt><dd class="num">${metres(v.len)} (${v.len} ${v.len === 1 ? 'position' : 'positions'})</dd></dl>
        ${v.note ? `<p class="note">${esc(v.note)}</p>` : ''}
        ${st === 'waiting' ? `<button class="btn" type="button" data-act="noshow">Mark ${esc(v.reg)} as no-show</button>` : ''}</div>`;

    if (st === 'waiting') {
      const R = rulesFor(v);
      const btns = LANES.map(L => {
        const r = R.per[L.id];
        const l2 = r.block ? r.block : `${r.free} free`;
        const l3 = r.block ? '' : (L.id === R.best ? 'Best fit' : r.soft || '');
        const cls = ['lbtn', L.id === R.best ? 'best' : '', r.soft && !r.block ? 'soft' : ''].join(' ');
        const aria = `Lane ${L.id}, ${L.name}. ${r.block ? 'Not available: ' + r.block : r.free + ' positions free'}${r.soft ? '. Warning: ' + r.soft : ''}${L.id === R.best ? '. Best fit for balance' : ''}`;
        return `<button class="${cls}" type="button" data-act="place" data-lane="${L.id}" data-fk="p${L.id}" ${r.block ? 'disabled' : ''} aria-label="${aria}">
          <b>Lane ${L.id}</b><span class="l2">${l2}</span><span class="l3">${l3}</span></button>`;
      }).join('');
      p.innerHTML = `<div class="p-inner has-lanes">${head}
        ${R.rule ? `<p class="p-rule" data-tone="${R.ruleTone}">${R.rule}</p>` : ''}
        <div class="lbtns" role="group" aria-label="Place ${esc(v.reg)} in a lane">${btns}</div>${detail}</div>`;
    } else if (st === 'loaded') {
      const where = `Lane ${pl.lane}, positions ${pl.start}${pl.end > pl.start ? ' to ' + pl.end : ''}`;
      const action = pl.last
        ? `<button class="btn btn-danger" type="button" data-act="takeoff" ${S.closed ? 'disabled' : ''}>Take ${esc(v.reg)} off the deck</button>`
        : `<p class="p-help">Only the last vehicle in a lane can come off. Take off the vehicles behind it first.</p>`;
      p.innerHTML = `<div class="p-inner">${head}<p class="p-state">Loaded · ${where}</p><div class="p-actions">${action}</div>${detail}</div>`;
    } else {
      p.innerHTML = `<div class="p-inner">${head}<p class="p-state">Marked as no-show</p>
        <div class="p-actions"><button class="btn" type="button" data-act="restore">Put back in the queue</button></div>${detail}</div>`;
    }
  }

  let lastFocus = null;
  function render() {
    const a = document.activeElement;
    lastFocus = a && a.dataset ? a.dataset.fk : null;
    $('app').dataset.view = ui.view;
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === ui.view));
    $('themeBtn').textContent = document.documentElement.dataset.theme === 'night' ? 'Day view' : 'Night view';
    $('themeBtn').setAttribute('aria-pressed', document.documentElement.dataset.theme === 'night');
    renderHeader(); renderStats(); renderQueue(); renderDeck(); renderPanel();
    if (lastFocus) {
      const el = document.querySelector(`[data-fk="${lastFocus}"]`);
      if (el && !el.disabled && el !== document.activeElement) el.focus({ preventScroll: true });
    }
    save();
  }

  /* ---------- Actions ---------- */
  function snapshot() { return JSON.stringify({ lanes: S.lanes, noshow: S.noshow, sel: S.sel }); }
  function toast(msg, withUndo) {
    const t = $('toast');
    t.innerHTML = `<span>${esc(msg)}</span>${withUndo ? '<button class="btn" type="button" data-act="undo">Undo</button>' : ''}`;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; undo = null; }, 9000);
  }
  function commit(msg, before) {
    undo = before;
    toast(msg, true);
    render();
  }
  function dlg(title, bodyHtml, confirmLabel, onConfirm, danger) {
    const d = $('dlg');
    d.innerHTML = `<h2>${title}</h2><div class="body">${bodyHtml}</div>
      <div class="actions"><button class="btn" type="button" data-d="cancel">Keep as it is</button>
      <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" type="button" data-d="ok">${confirmLabel}</button></div>`;
    d.onclick = e => {
      const b = e.target.closest('[data-d]');
      if (!b) return;
      d.close();
      if (b.dataset.d === 'ok') onConfirm();
    };
    d.showModal();
  }

  const actions = {
    theme() {
      const t = document.documentElement.dataset.theme === 'night' ? 'day' : 'night';
      document.documentElement.dataset.theme = t;
      try { localStorage.setItem('gannet-theme', t); } catch (e) {}
      render();
    },
    view(el) { ui.view = el.dataset.v; render(); },
    filter(el) { ui.filter = el.dataset.f; render(); },
    special() { ui.special = !ui.special; render(); },
    clearsearch() { ui.q = ''; $('search').value = ''; render(); },
    more() { ui.more = !ui.more; render(); },
    select(el) { S.sel = +el.dataset.id; render(); },
    next() { S.sel = nextWaiting(0); render(); },
    place(el) {
      const v = BY[S.sel], lane = el.dataset.lane;
      if (!v || statusOf(v.id) !== 'waiting') return;
      const r = rulesFor(v).per[lane];
      if (r.block) return;
      const before = snapshot();
      S.lanes[lane].push(v.id);
      const p = placement(v.id);
      S.sel = nextWaiting(v.id);
      const warn = r.soft ? ` (${r.soft.toLowerCase()})` : '';
      commit(`${v.reg} placed in lane ${lane}, positions ${p.start}${p.end > p.start ? '–' + p.end : ''}${warn}`, before);
    },
    takeoff() {
      const v = BY[S.sel], p = v && placement(v.id);
      if (!p || !p.last || S.closed) return;
      const before = snapshot();
      S.lanes[p.lane].pop();
      commit(`${v.reg} taken off lane ${p.lane}`, before);
    },
    noshow() {
      const v = BY[S.sel];
      if (!v || statusOf(v.id) !== 'waiting') return;
      const before = snapshot();
      S.noshow.push(v.id);
      S.sel = nextWaiting(v.id);
      commit(`${v.reg} marked as no-show`, before);
    },
    restore() {
      const v = BY[S.sel];
      const before = snapshot();
      S.noshow = S.noshow.filter(x => x !== v.id);
      commit(`${v.reg} is back in the queue`, before);
    },
    undo() {
      if (!undo) return;
      const o = JSON.parse(undo);
      S.lanes = o.lanes; S.noshow = o.noshow; S.sel = o.sel;
      undo = null; $('toast').hidden = true;
      render();
    },
    close() {
      const w = waitingList(), B = balance(), T = totals();
      const lt = tone(B.list, 3, 5);
      const body = `<p>${T.n} vehicles aboard, ${tons(T.kg)}, ${T.cells} of ${CAP * 4} positions used.</p>` +
        (w.length ? `<p>Still on the quay (${w.length}):</p><ul>${w.map(v => `<li>${esc(v.reg)}</li>`).join('')}</ul>` : '<p>No vehicles left on the quay.</p>') +
        (lt === 'bad' ? `<p class="warnbox">Side balance is ${Math.abs(B.list).toFixed(1)}% ${B.list > 0 ? 'port' : 'starboard'} heavy, over the 5% limit. Tell the master before sailing.</p>` : '');
      dlg('Close loading for the ' + hhmm(S.dep) + '?', body,
        w.length ? `Close loading, leave ${w.length} on the quay` : 'Close loading',
        () => { S.closed = true; S.closedAt = Date.now(); toast('Loading closed. The plan is locked.', false); render(); });
    },
    reopen() { S.closed = false; S.closedAt = null; toast('Loading reopened', false); render(); },
    reset() {
      dlg('Reset the sample sailing?', '<p>This puts the loading plan back to how it was at the start. Any vehicles you placed will be cleared.</p>',
        'Reset sample sailing', () => { S = fresh(); undo = null; ui.filter = 'waiting'; ui.q = ''; $('search').value = ''; $('toast').hidden = true; render(); }, true);
    }
  };

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el && actions[el.dataset.act]) actions[el.dataset.act](el);
  });
  $('search').addEventListener('input', e => { ui.q = e.target.value; renderQueue(); });

  // Preview where the selected vehicle would sit when a lane button is hovered or focused.
  function hot(lane) {
    document.querySelectorAll('.ghost').forEach(g => g.classList.toggle('hot', g.dataset.ghost === lane));
  }
  const panel = $('panel');
  panel.addEventListener('mouseover', e => { const b = e.target.closest('[data-lane]'); hot(b ? b.dataset.lane : null); });
  panel.addEventListener('mouseleave', () => hot(null));
  panel.addEventListener('focusin', e => { const b = e.target.closest('[data-lane]'); hot(b ? b.dataset.lane : null); });
  panel.addEventListener('focusout', () => hot(null));

  // Keep the page clear of the dock when it is fixed to the bottom.
  const root = document.documentElement;
  function fitDock() {
    root.style.setProperty('--dock-h', getComputedStyle(panel).position === 'fixed' ? panel.offsetHeight + 'px' : '0px');
  }
  new ResizeObserver(fitDock).observe(panel);
  addEventListener('resize', fitDock);

  setInterval(renderClock, 15000);
  render();
  fitDock();
})();
</script>
</body>
</html>
